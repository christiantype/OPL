<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O.P/A.L — Original Practice / Applied Learning</title>
  <meta name="description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <link rel="canonical" href="https://more-than.design/">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="O.P/A.L">
  <meta property="og:title"       content="O.P/A.L — Original Practice / Applied Learning">
  <meta property="og:description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <meta property="og:image"       content="https://more-than.design/images/opal-open-graph.webp">
  <meta property="og:url"         content="https://more-than.design/">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="O.P/A.L — Original Practice / Applied Learning">
  <meta name="twitter:description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <meta name="twitter:image"       content="https://more-than.design/images/opal-open-graph.webp">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Christian Solorzano",
    "url": "https://more-than.design",
    "jobTitle": "Designer",
    "worksFor": { "@type": "Organization", "name": "O.P/A.L" },
    "address": { "@type": "PostalAddress", "addressLocality": "Chicago" },
    "sameAs": ["https://github.com/christiantype"]
  }
  </script>

  <link rel="stylesheet" href="shared/styles.css">
  <style>
    #hero-canvas {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }
    #hero-canvas iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* Fallback still — covers the iframe until the scene reports it rendered;
       stays put if the scene never loads (e.g. no WebGL). */
    #hero-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.7s ease;
    }
    #hero-fallback.hide { opacity: 0; }
    /* On touch devices an iframe traps scroll (pointer-events:none on iframes is
       unreliable on iOS). Put a transparent same-document catcher over it so the
       page scrolls; hide it on desktop so the mouse can drag-rotate the scene. */
    #hero-touch { display: none; }
    @media (pointer: coarse) {
      #hero-canvas iframe { pointer-events: none; }
      #hero-canvas { touch-action: pan-y; }
      #hero-touch {
        display: block;
        position: absolute;
        inset: 0;
        z-index: 1;
        touch-action: pan-y;   /* catch touches as a normal element → page scrolls */
      }
    }
    /* The O.P/A.L slash — a tapered diagonal anchored directly behind the subtitle "/"
       (JS sets left/top to that glyph's centre, so it tracks on every screen). */
    #hero-slash {
      position: absolute;
      left: 50%; top: 50%;
      width: 13px;
      height: 150%;
      background: #fff;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);   /* tapered: points at ends, wide mid */
      transform: translate(-50%, -50%) rotate(32deg) scaleY(0);   /* collapsed until the burst */
      transform-origin: center;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
      transition: transform 8s cubic-bezier(0.16, 0.84, 0.3, 1), opacity 1.4s ease;
    }
    #hero-slash.go {   /* grows from the center outward when the burst begins */
      transform: translate(-50%, -50%) rotate(32deg) scaleY(1);
      opacity: 1;
    }
    @media (prefers-reduced-motion: reduce) { #hero-slash { transition: none; } }
    /* Keep the nav icons legible over both the dark hero and the light content
       below: difference blend paints them as the inverse of whatever's behind. */
    nav { mix-blend-mode: difference; }
    nav svg { fill: #fff; }
    /* Dead-center rotating tagline — "A {word} studio": black uppercase text on a
       white pill, centered over the hero. */
    #hero-tagline {
      position: absolute;
      inset: 0;
      z-index: 2;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85em;
      pointer-events: none;
      text-align: center;
      white-space: nowrap;
    }
    .tagline-pill {
      /* Identical frosted style to the subtitle below: dark translucent + white text. */
      color: #fff;
      background: rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      border-radius: 999px;
      padding: 0.4em 0.95em;
      font-size: clamp(0.72rem, 1vw, 0.95rem);
      line-height: 1.4;
      letter-spacing: 1.5px;
      text-indent: 1.5px;
      text-transform: uppercase;
    }
    .tagline-sub {
      color: #fff;
      font-size: clamp(0.72rem, 1vw, 0.95rem);
      line-height: 1.4;
      letter-spacing: 1.5px;
      text-indent: 1.5px;
      padding: 0.4em 0.95em;
      border-radius: 999px;
      /* Frosted plate so the line reads over the busy scene while it still shows
         through. backdrop-filter blurs the canvas behind; the translucent fill is
         the fallback (and carries the contrast) if blur isn't supported. */
      background: rgba(0, 0, 0, 0.4);
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
    }
    #hero-word {
      display: inline-block;
      margin: 0 0.3em;
      transition: opacity 0.4s ease;
    }
    #hero-tagline.is-swapping #hero-word,
    #hero-tagline.is-swapping #hero-article { opacity: 0; }
    #hero-article { transition: opacity 0.4s ease; }
  </style>
</head>
<body>
  <script src="shared/nav.js"></script>

  <section id="hero-canvas">
    <iframe src="/scene/" title="O.P/A.L" loading="eager" scrolling="no"></iframe>
    <img id="hero-fallback" src="images/hero-fallback.webp" alt="" aria-hidden="true">
    <div id="hero-touch" aria-hidden="true"></div>
    <div id="hero-slash" aria-hidden="true"></div>
    <p id="hero-tagline" aria-live="polite">
      <span class="tagline-pill"><span id="hero-article">A</span> <span id="hero-word">mindful</span> studio</span>
      <span class="tagline-sub">original practice <span id="slash-slot">/</span> applied learning</span>
    </p>
  </section>

  <section id="projects">
    <div class="container">
      <div class="grid project-header">
        <span class="col-10 label">Project</span>
        <span class="col-2 label">Year</span>
      </div>
      <div id="project-rows"></div>
    </div>
  </section>

  <script>
    const tbody = document.getElementById('project-rows');

    fetch('projects.json')
      .then(r => r.json())
      .then(data => {
        tbody.innerHTML = data.projects.map((p, i) => `
          <div class="grid project-row${p.url ? ' has-link' : ''}" ${p.url ? `data-url="${p.url}"` : ''} style="${p.url ? 'cursor:pointer;' : ''}animation-delay:${i * 0.07}s">
            <div class="col-10"><span class="project-category label">${p.category}</span>${p.url ? `<a href="${p.url}">${p.title}</a>` : p.title}</div>
            <div class="col-2">${p.year}</div>
          </div>`).join('');
        document.querySelectorAll('.project-row[data-url]').forEach(row => {
          row.addEventListener('click', () => window.location = row.dataset.url);
        });
      });

    /* Rotating hero tagline — words migrated from opal.design */
    (function rotateTagline() {
      const words = ['mindful', 'boundless', 'open', 'aware', 'heartfelt',
        'practical', 'honest', 'aspirational', 'direct', 'precise', 'vast',
        'connected', 'opalescent'];
      const tag  = document.getElementById('hero-tagline');
      const word = document.getElementById('hero-word');
      const art  = document.getElementById('hero-article');
      if (!tag || !word || !art) return;
      const article = w => /^[aeiou]/i.test(w) ? 'An' : 'A';
      let i = 0;
      art.textContent = article(words[0]);
      word.textContent = words[0];
      setInterval(() => {
        tag.classList.add('is-swapping');           // fade out
        setTimeout(() => {
          i = (i + 1) % words.length;
          word.textContent = words[i];
          art.textContent  = article(words[i]);
          tag.classList.remove('is-swapping');       // fade in
        }, 400);
      }, 2600);
    })();

    /* Anchor the tapered slash precisely onto the subtitle "/" (desktop + mobile),
       then grow it from the centre when the scene's burst fires. */
    (function heroSlash() {
      const slash = document.getElementById('hero-slash');
      const slot  = document.getElementById('slash-slot');
      const hero  = document.getElementById('hero-canvas');
      if (!slash || !slot || !hero) return;
      function place() {
        const hr = hero.getBoundingClientRect(), sr = slot.getBoundingClientRect();
        slash.style.left = (sr.left + sr.width / 2 - hr.left) + 'px';
        slash.style.top  = (sr.top + sr.height / 2 - hr.top) + 'px';
      }
      place();
      window.addEventListener('resize', place);
      window.addEventListener('orientationchange', () => setTimeout(place, 200));
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
      [120, 400, 1000].forEach(t => setTimeout(place, t));   // re-anchor as layout settles
      // Grow from the centre on load; the scene's burst follows.
      setTimeout(() => { place(); slash.classList.add('go'); }, 400);
    })();

    /* Drop the fallback still once the scene reports it has rendered. */
    (function heroFallback() {
      const fb = document.getElementById('hero-fallback');
      if (!fb) return;
      window.addEventListener('message', (e) => {
        if (e && e.data === 'opal:ready') fb.classList.add('hide');
      });
    })();
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="shared/footer.js"></script>
  <script src="shared/grid.js"></script>
  <script src="shared/cursor.js"></script>
  <script src="shared/animate.js"></script>
</body>
</html>
