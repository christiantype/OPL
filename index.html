<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O.P/A.L — Original Practice / Applied Learning</title>
  <meta name="description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <link rel="canonical" href="https://more-than.design/">

  <!-- Open Graph -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="O.P/A.L">
  <meta property="og:title"       content="O.P/A.L — Original Practice / Applied Learning">
  <meta property="og:description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <meta property="og:image"       content="https://more-than.design/images/opal-open-graph.webp">
  <meta property="og:url"         content="https://more-than.design/">

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="O.P/A.L — Original Practice / Applied Learning">
  <meta name="twitter:description" content="O.P/A.L is a Chicago design practice founded by Christian Solorzano. Work spans editorial, identity, and cultural production.">
  <meta name="twitter:image"       content="https://more-than.design/images/opal-open-graph.webp">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Christian Solorzano",
    "url": "https://more-than.design",
    "jobTitle": "Designer",
    "worksFor": { "@type": "Organization", "name": "O.P/A.L" },
    "address": { "@type": "PostalAddress", "addressLocality": "Chicago" },
    "sameAs": ["https://github.com/christiantype"]
  }
  </script>

  <link rel="stylesheet" href="shared/styles.css">
</head>
<body>
  <script src="shared/nav.js"></script>
  <div id="thumb"><img src="" alt="" /></div>

  <section id="projects">
    <div class="container">
      <div class="grid project-header">
        <span class="col-10 label">Project</span>
        <span class="col-2 label">Year</span>
      </div>
      <div id="project-rows"></div>
    </div>
  </section>

  <script>
    const thumb    = document.getElementById('thumb');
    const thumbImg = thumb.querySelector('img');
    const tbody    = document.getElementById('project-rows');

    function bindHover() {
      document.querySelectorAll('.project-row[data-thumb]').forEach(row => {
        row.addEventListener('mouseenter', () => {
          if (!row.dataset.thumb) return;
          thumbImg.src = row.dataset.thumb;
          thumb.style.opacity = '1';
        });
        row.addEventListener('mouseleave', () => { thumb.style.opacity = '0'; });
      });
    }

    fetch('projects.json')
      .then(r => r.json())
      .then(data => {
        tbody.innerHTML = data.projects.map((p, i) => `
          <div class="grid project-row${p.url ? ' has-link' : ''}" data-thumb="${p.thumb || ''}" ${p.url ? `data-url="${p.url}"` : ''} style="${p.url ? 'cursor:pointer;' : ''}animation-delay:${i * 0.07}s">
            <div class="col-10"><span class="project-category label">${p.category}</span>${p.url ? `<a href="${p.url}">${p.title}</a>` : p.title}</div>
            <div class="col-2">${p.year}</div>
          </div>`).join('');
        bindHover();
        document.querySelectorAll('.project-row[data-url]').forEach(row => {
          row.addEventListener('click', () => window.location = row.dataset.url);
        });
      });
  </script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="shared/footer.js"></script>
  <script src="shared/grid.js"></script>
  <script src="shared/cursor.js"></script>
  <script src="shared/animate.js"></script>
</body>
</html>
