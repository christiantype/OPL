<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#0a0a0a;}
  .wrap{width:1120px;height:680px;margin:20px auto;position:relative;overflow:hidden;
    border-radius:22px;border:1px solid rgba(10,32,20,.10);
    background:radial-gradient(ellipse 92% 78% at 50% 44%,#15a05c 0%,#6fd3a0 24%,#d9f2e4 54%,#fff 84%);}
  .project-mockup{width:1120px;height:680px;}
</style></head>
<body>
  <div class="wrap"><div class="project-mockup" id="host"></div></div>
  <script>
  fetch('lumen-mocks/chat-focused.html').then(r=>r.text()).then(html=>{
    const host=document.getElementById('host');
    host.innerHTML=html;
    host.querySelectorAll('script').forEach(old=>{
      const s=document.createElement('script');
      if(old.src)s.src=old.src; else s.textContent=old.textContent;
      old.replaceWith(s);
    });
  });
  </script>
</body></html>
