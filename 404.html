<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — O.P/A.L</title>
  <meta name="robots" content="noindex">
  <!-- Absolute paths: GitHub Pages serves this from arbitrary URLs without redirecting. -->
  <link rel="stylesheet" href="/shared/styles.css">
  <style>
    #notfound {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.6em;
      padding: 2rem;
    }
    #notfound .mark {
      font-size: clamp(5rem, 18vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.02em;
    }
    #notfound .mark span { color: var(--color-accent); }
    #notfound p { color: var(--color-mid); max-width: 32ch; }
    #notfound a.home {
      display: inline-block;
      margin-top: 0.4em;
      border-bottom: 1px solid currentColor;
      padding-bottom: 1px;
      transition: color 0.2s ease;
    }
    #notfound a.home:hover { color: var(--color-accent); }
  </style>
</head>
<body>
  <section id="notfound">
    <div class="mark">4<span>/</span>4</div>
    <h2>This page wandered off.</h2>
    <p>The page you're looking for doesn't exist — or has moved.</p>
    <a class="home" href="/">Return home →</a>
  </section>

  <script src="/shared/nav.js"></script>
  <script src="/shared/cursor.js"></script>
</body>
</html>
