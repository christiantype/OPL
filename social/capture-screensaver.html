<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OP/AL — screensaver capture</title>
<style>
  @font-face { font-family: "Sidepiece-HoneyPie"; src: url("../shared/fonts/Sidepiece-HoneyPie.woff2") format("woff2"); font-weight: 400; font-style: normal; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .inner { display: flex; flex-direction: column; align-items: center; gap: clamp(24px, 5vh, 60px); }
  .logo { line-height: 0; }
  .logo svg { display: block; width: clamp(150px, 34vw, 460px); height: auto; }
  .word { font-family: "Sidepiece-HoneyPie", sans-serif; font-size: clamp(1.3rem, 3.8vw, 2.4rem); letter-spacing: .005em; line-height: 1.3; text-align: center; width: min(84vw, 22em); height: 2.6em; display: flex; align-items: center; justify-content: center; text-wrap: balance; }
</style>
</head>
<body>
  <div id="stage">
    <div class="inner">
      <div class="logo" id="logo"></div>
      <div class="word" id="word"></div>
    </div>
  </div>
<script>
(function () {
  const P = new URLSearchParams(location.search);
  const CAPTURE = P.get('capture') === '1';
  const SEED = parseFloat(P.get('seed') || '') || 7;
  const FLASH_MS = 4200, FADE_MS = 250;

  const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="154.5 212.9 1274.6 186.2" fill="currentColor"><path d="M1356.2,353.2h72.1v-13h-59.1v-100.6h-13v113.5ZM1077.3,313.7l13.5-61.1h10.6l13.3,61.1h-37.5ZM1055.3,353.2h13.3l5.8-26.5h43.3l5.8,26.5h13.3l-25.2-113.5h-30.6l-25.6,113.5ZM723.6,398.3h37.2l111.9-184.5h-37.2l-111.9,184.5ZM478.1,296.2v-43.6h28.1c5.9,0,8.3.9,13,4.7,5.2,4.3,5.9,6.1,5.9,10.6v13c0,4.5-.7,6.3-5.9,10.6-4.7,3.8-7,4.7-13,4.7h-28.1ZM465.1,353.2h13v-44h28.1c9.4,0,14.2-2,22.5-9,8.3-7,9.4-10.3,9.4-18.6v-14.4c0-8.3-1.1-11.5-9.4-18.6-8.3-7-13.2-9-22.5-9h-41.1v113.5ZM199.1,340.2h-11.9c-5.9,0-8.3-.9-13-4.7-5.2-4.3-5.9-6.1-5.9-10.6v-57c0-4.5.7-6.3,5.9-10.6,4.7-3.8,7-4.7,13-4.7h11.9c5.9,0,8.5.9,13.2,4.7,5,4.1,5.8,6.1,5.8,10.6v57c0,4.5-.7,6.5-5.8,10.6-4.7,3.8-7.2,4.7-13.2,4.7M187.2,353.2h11.9c9.4,0,14.2-2,22.5-9,8.3-7,9.4-10.3,9.4-18.6v-58.4c0-8.3-1.1-11.5-9.4-18.6-8.3-7-13.2-9-22.5-9h-11.9c-9.4,0-14.2,2-22.5,9-8.3,7-9.4,10.3-9.4,18.6v58.4c0,8.3,1.1,11.5,9.4,18.6,8.3,7,13.2,9,22.5,9"/></svg>`;
  document.getElementById('logo').innerHTML = LOGO;

  const WORDS = ['What would you make if no one would see it?','Subtract.','The mistake is the material.','Slow down until it gets interesting.','Trust the first draft.','Ask what the material wants.','Leave one thing unresolved.','Name it wrong on purpose.','Whose voice is this, really?','Let it stay ugly a little longer.','Start from the ending.','Keep the hand visible.','Do the opposite.','Make room for the accident.','What are you not saying?','Let the edges breathe.','Return to the first question.','Begin before you are ready.'];
  const PALETTES = [['#1e3a34','#e8846b'],['#14315b','#e6b422'],['#0e5c5b','#d96e3f'],['#5c1a1b','#a9c7d9'],['#e6b422','#14315b'],['#4a2c4d','#9cb48f'],['#c05b25','#16514e'],['#1f3a2e','#f0b49e'],['#46618e','#d9a441'],['#6e1e2a','#a8d8c0'],['#2b2c6b','#f2a81d'],['#5e6033','#c9a7d4'],['#a8442a','#9fc9cc'],['#2e2e2e','#ebe45b'],['#3e2140','#b7c74a'],['#14395e','#e8917b'],['#8c3a2b','#f0e5d0'],['#234b3f','#e8a268'],['#24409a','#e3b23c'],['#5b1f33','#afc9b0'],['#0f4c5c','#f4a261'],['#d9773f','#2a3d45'],['#e5ddc8','#7a3b2e'],['#3d405b','#e07a5f']];

  // deterministic shuffle by seed
  let _rs = ((SEED * 2654435761) >>> 0) || 1;
  const srnd = () => (_rs = (_rs * 1664525 + 1013904223) >>> 0) / 4294967296;
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = (srnd() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const words = ['More than Design'].concat(shuffle(WORDS.slice(0, -1))).concat(WORDS[WORDS.length - 1]), pals = shuffle(PALETTES);   // open on the studio name, close on the last prompt

  const hex = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const bgOf = pals.map(p => hex(p[0])), fgOf = pals.map(p => hex(p[1]));
  const mix = (a, b, t) => `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;

  const stage = document.getElementById('stage'), logo = document.getElementById('logo'), word = document.getElementById('word');

  window.__render = function (t) {
    const idx = Math.floor(t / FLASH_MS);
    const localT = t - idx * FLASH_MS;
    const fadeIn = Math.min(1, localT / FADE_MS);
    const L = pals.length;
    const cur = idx % L, prev = (idx - 1 + L) % L;
    // bg + logo crossfade from previous pair into the current over the first FADE_MS
    stage.style.background = mix(idx > 0 ? bgOf[prev] : bgOf[cur], bgOf[cur], fadeIn);
    logo.style.color = mix(idx > 0 ? fgOf[prev] : fgOf[cur], fgOf[cur], fadeIn);
    // word: swap text/colour at the boundary, fade opacity in then out
    word.textContent = words[idx % words.length];
    word.style.color = mix(fgOf[cur], fgOf[cur], 1);
    const op = localT < FADE_MS ? localT / FADE_MS : (localT > FLASH_MS - FADE_MS ? (FLASH_MS - localT) / FADE_MS : 1);
    word.style.opacity = op.toFixed(3);
  };

  window.__ready = true;
  if (!CAPTURE) { const loop = (now) => { window.__render(now); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
