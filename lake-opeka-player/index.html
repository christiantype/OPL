<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sean Lake Opeka — Fermoyle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --text: #0e0c0a;
  --text-dim: #7a6a5a;
  --gold: #9a7020;
  --border: rgba(0,0,0,0.1);
  --header-h: 48px;
  --player-h: 60px;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}

/* ── HEADER ── */
header {
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(10px);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
}

.artist-name {
  font-size: 11px; letter-spacing: .18em; color: var(--text-dim);
  text-transform: uppercase; white-space: nowrap;
}
.artist-name strong { color: var(--text); font-weight: 600; }

.header-controls { display: flex; gap: 10px; align-items: center; }
.ctrl-group { display: flex; align-items: center; gap: 3px; }
.ctrl-label { font-size: 8px; color: var(--text-dim); letter-spacing: .14em; text-transform: uppercase; margin-right: 3px; }

.sel-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 3px 9px; border-radius: 3px; cursor: pointer;
  font-size: 10px; letter-spacing: .04em; transition: all .15s; font-family: inherit;
}
.sel-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.25); }
.sel-btn.active { border-color: var(--gold); color: var(--gold); }

/* ── CONTENT: strict 50/50 split ── */
.content {
  position: fixed;
  top: 0;
  bottom: var(--player-h);
  left: 0; right: 0;
  display: flex;
  overflow: hidden;
}

/* ══ LEFT HALF: sleeve + vinyl ══ */
.left-panel {
  flex: 0 0 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  border-right: 1px solid var(--border);
  gap: 16px;
  background: #fff;
  overflow: hidden;
}

/* HERO SCENE — sized to fit comfortably in 50% panel */
.hero-scene {
  position: relative;
  width: 420px;
  height: 320px;
  flex-shrink: 0;
}

/* ── VINYL ── */
.vinyl-wrap {
  position: absolute;
  right: 0; top: 30px;
  width: 240px; height: 240px;
  cursor: pointer;
  z-index: 1;
}

.vinyl-shadow {
  position: absolute;
  width: 180px; height: 28px;
  bottom: -18px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.5) 0%, transparent 70%);
  filter: blur(10px);
  z-index: 0; pointer-events: none;
}

.vinyl-disc {
  width: 240px; height: 240px;
  border-radius: 50%;
  position: relative;
  animation: spin 3.2s linear infinite;
  will-change: transform;
}
.vinyl-disc.paused { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Vinyl base: very dark, conic shimmer for groove suggestion */
.vinyl-body {
  position: absolute; inset: 0; border-radius: 50%;
  background:
    conic-gradient(from 0deg,
      #0b0b0b 0deg, #0e0d0b 18deg, #0a0a0a 36deg, #0d0c0a 54deg,
      #0b0b0b 72deg, #0e0c0a 90deg, #0a0a0a 108deg, #0d0b09 126deg,
      #0b0b0b 144deg, #0e0d0b 162deg, #0a0a0a 180deg, #0c0b09 198deg,
      #0b0b0b 216deg, #0e0c0a 234deg, #0a0a0a 252deg, #0d0c0a 270deg,
      #0b0b0b 288deg, #0e0d0b 306deg, #0a0a0a 324deg, #0d0b09 342deg, #0b0b0b 360deg);
  box-shadow:
    0 6px 32px rgba(0,0,0,0.65),
    0 2px 8px rgba(0,0,0,0.45),
    inset 0 0 18px rgba(0,0,0,0.6),
    0 0 0 1px rgba(0,0,0,0.95);
}

/* Subtle groove rings — barely perceptible, like real vinyl */
.groove {
  position: absolute; border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  box-shadow: 0 0 0 0.5px rgba(255,255,255,0.028);
}

/* Very soft directional sheen — one sweep of reflected light */
.vinyl-sheen {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 30deg,
    transparent 0%, rgba(255,255,255,0.0) 8%,
    rgba(255,255,255,0.045) 14%, rgba(255,255,255,0.012) 20%,
    transparent 28%, transparent 100%);
  pointer-events: none; z-index: 3;
}

/* Outer edge: a single thin highlight — no thick rings */
.vinyl-rim {
  position: absolute; inset: 0; border-radius: 50%;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.06),
    inset 0 0 8px rgba(0,0,0,0.5);
  pointer-events: none; z-index: 5;
}

.vinyl-label-ring {
  position: absolute;
  width: 80px; height: 80px;
  border-radius: 50%;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  overflow: hidden; z-index: 4;
  background: #1a1612;
  box-shadow: 0 0 0 1.5px rgba(0,0,0,0.95), 0 0 0 3px rgba(255,255,255,0.04);
}
.vinyl-label-ring img { width: 100%; height: 100%; object-fit: cover; }

.spinhole {
  position: absolute; width: 8px; height: 8px; border-radius: 50%;
  background: radial-gradient(circle, #050505 60%, #141210 100%);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 6;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.95);
}

/* ── SLEEVE ── */
.sleeve-wrap {
  position: absolute; left: 0; top: 0; z-index: 2;
  width: 248px; height: 263px;
}

.sleeve-shadow {
  position: absolute;
  bottom: -18px; left: 10px; right: -4px; height: 26px;
  background: radial-gradient(ellipse at 38% 0%, rgba(0,0,0,0.4) 0%, transparent 75%);
  filter: blur(10px); z-index: 0;
}

.sleeve-card {
  width: 248px; height: 263px;
  position: relative; transform-style: preserve-3d;
  transform: perspective(700px) rotateY(-2deg) rotateX(1deg);
  transition: transform .8s cubic-bezier(.4,0,.2,1);
  cursor: pointer; z-index: 1;
}
.sleeve-card.flipped { transform: perspective(700px) rotateY(178deg) rotateX(1deg); }

.sleeve-face {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  border-radius: 2px; overflow: hidden;
  box-shadow:
    14px 22px 52px rgba(0,0,0,0.38),
    5px 7px 16px rgba(0,0,0,0.2),
    1px 1px 4px rgba(0,0,0,0.12);
}
.sleeve-face img { width: 100%; height: 100%; object-fit: fill; display: block; }

.sleeve-sheen {
  position: absolute; inset: 0;
  background: linear-gradient(45deg,
    transparent 0%, transparent 28%,
    rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 58%,
    transparent 72%, transparent 100%);
  pointer-events: none; z-index: 2;
}
.sleeve-spine {
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(90deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.08) 60%, transparent 100%);
  z-index: 3; pointer-events: none;
}
.sleeve-back-face { transform: rotateY(180deg); }

.artwork-controls {
  display: flex;
  justify-content: space-between;
  width: 420px;
  gap: 12px;
}
.artwork-ctrl-group { display: flex; align-items: center; gap: 3px; }
.scene-controls { display: flex; align-items: center; gap: 14px; }
.flat-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 6px 16px; border-radius: 3px; cursor: pointer;
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  transition: all .15s; font-family: inherit;
}
.flat-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.25); }
.flat-btn.active { color: var(--gold); border-color: var(--gold); }
.scene-hint { font-size: 10px; color: rgba(0,0,0,0.22); letter-spacing: .04em; }

/* ══ RIGHT HALF: booklet spread ══ */
.right-panel {
  flex: 0 0 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 56px;
  gap: 14px;
  overflow: hidden;
  background: #fff;
}

/* BOOKLET — fills the right panel */
.book-wrap { position: relative; display: inline-flex; }

.book-body {
  display: flex;
  border-radius: 2px; overflow: hidden; position: relative;
  box-shadow: 0 12px 40px rgba(0,0,0,0.15), 0 3px 10px rgba(0,0,0,0.08);
}

.book-page {
  flex-shrink: 0; overflow: hidden;
  position: relative; background: #f0ece6;
}
.book-page img { width: 100%; height: 100%; object-fit: fill; display: block; }
.book-page.left  { box-shadow: inset -1.5px 0 3px rgba(0,0,0,0.03); }
.book-page.right { box-shadow: inset  1.5px 0 3px rgba(0,0,0,0.02); }

.book-spine {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 0; bottom: 0; width: 10px; z-index: 5;
  background: linear-gradient(90deg,
    rgba(0,0,0,0.07) 0%, rgba(30,20,10,0.09) 30%,
    rgba(60,45,25,0.04) 50%, rgba(30,20,10,0.09) 70%, rgba(0,0,0,0.07) 100%);
  pointer-events: none;
}

.book-shadow {
  position: absolute; bottom: -18px; left: 20px; right: 20px; height: 22px;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,0.18) 0%, transparent 80%);
  filter: blur(6px);
}

.spread-label {
  position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
  font-size: 8px; color: rgba(0,0,0,0.12); letter-spacing: .14em; text-transform: uppercase;
  z-index: 6; pointer-events: none; white-space: nowrap;
}

.spread-track-btn {
  position: absolute; top: 10px; right: 12px; z-index: 6;
  background: rgba(255,255,255,0.88); border: 1px solid rgba(154,112,32,0.3); color: var(--gold);
  font-size: 9px; letter-spacing: .06em; padding: 5px 12px; border-radius: 20px;
  cursor: pointer; font-family: inherit; transition: all .2s;
  display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px);
}
.spread-track-btn:hover { background: rgba(255,255,255,0.98); border-color: var(--gold); }
.spread-track-btn svg { width: 8px; height: 8px; fill: currentColor; }

.page-anim { animation: pf .2s ease; }
@keyframes pf { from { opacity:0; transform:scale(0.99); } to { opacity:1; transform:scale(1); } }

@media (max-width: 768px) {
  body { overflow: hidden; }
  .content {
    position: relative;
    top: auto; bottom: auto;
    flex-direction: column;
    overflow: hidden;
    height: auto;
  }
  .left-panel {
    flex: 0 0 420px;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 24px 16px;
  }
  .right-panel {
    flex: 0 0 480px;
    padding: 32px 16px;
  }
  .artwork-controls { width: 100%; }
  .hero-scene { width: 320px; height: 280px; }
  .player-bar { position: relative; }
}

/* Page nav + tracklist row */
.booklet-footer {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 16px;
}

.page-nav { display: flex; align-items: center; gap: 10px; }
.nav-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; line-height: 1; font-family: inherit;
}
.nav-btn:hover:not(:disabled) { color: var(--text); border-color: rgba(0,0,0,0.28); }
.nav-btn:disabled { opacity: .18; cursor: default; }
.page-counter { font-size: 10px; color: var(--text-dim); letter-spacing: .08em; min-width: 44px; text-align: center; }

/* Compact inline tracklist */
.tracklist-inline {
  display: flex; flex-wrap: wrap; gap: 3px 6px; justify-content: flex-end;
}
.tl-item {
  display: flex; align-items: center; gap: 5px;
  cursor: pointer; padding: 3px 8px; border-radius: 2px;
  border: 1px solid transparent; transition: all .14s;
}
.tl-item:hover { border-color: var(--border); }
.tl-item.playing { border-color: var(--gold); }
.tl-item.playing .tl-n, .tl-item.playing .tl-name { color: var(--gold); }
.tl-n { font-size: 9px; color: rgba(0,0,0,0.18); }
.tl-name { font-size: 10px; color: var(--text-dim); white-space: nowrap; letter-spacing: .01em; }

/* ── PLAYER BAR ── */
.player-bar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  height: var(--player-h);
  background: rgba(255,255,255,0.97); border-top: 1px solid var(--border);
  padding: 0 36px;
  display: flex; align-items: center; gap: 18px;
  backdrop-filter: blur(12px);
}

.player-unit { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.player-controls { display: flex; align-items: center; gap: 5px; }

.ply-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  width: 30px; height: 30px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.ply-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.28); }
.ply-btn.sm { width: 24px; height: 24px; }
.ply-btn svg { width: 11px; height: 11px; fill: currentColor; }
.ply-btn.sm svg { width: 9px; height: 9px; }

.player-info { min-width: 0; flex: 0 0 180px; }
.player-track { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 1px; }
.player-artist { font-size: 9px; color: var(--text-dim); letter-spacing: .1em; text-transform: uppercase; }

.player-progress { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.progress-rail { flex: 1; height: 2px; background: rgba(0,0,0,0.08); border-radius: 1px; cursor: pointer; overflow: hidden; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 1px; width: 0%; transition: width .3s linear; }
.time-label { font-size: 9px; color: var(--text-dim); white-space: nowrap; letter-spacing: .04em; }

.mini-tracks { display: flex; gap: 3px; }
.mini-btn {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  font-size: 10px; padding: 3px 8px; border-radius: 2px;
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.mini-btn:hover { color: var(--text); border-color: rgba(0,0,0,0.25); }
.mini-btn.active { color: var(--gold); border-color: var(--gold); }
</style>
</head>
<body>


<div class="content">

  <!-- LEFT 50%: vinyl + sleeve -->
  <div class="left-panel">
    <div class="hero-scene">

      <div class="vinyl-wrap" onclick="toggleSpin()" title="Click to pause/resume">
        <div class="vinyl-shadow"></div>
        <div class="vinyl-disc" id="disc">
          <div class="vinyl-body"></div>
          <div class="vinyl-sheen"></div>
          <div class="groove" style="width:234px;height:234px"></div>
          <div class="groove" style="width:224px;height:224px"></div>
          <div class="groove" style="width:214px;height:214px"></div>
          <div class="groove" style="width:204px;height:204px"></div>
          <div class="groove" style="width:194px;height:194px"></div>
          <div class="groove" style="width:184px;height:184px"></div>
          <div class="groove" style="width:174px;height:174px"></div>
          <div class="groove" style="width:164px;height:164px"></div>
          <div class="groove" style="width:154px;height:154px"></div>
          <div class="groove" style="width:144px;height:144px"></div>
          <div class="groove" style="width:134px;height:134px"></div>
          <div class="groove" style="width:124px;height:124px"></div>
          <div class="vinyl-label-ring">
            <img src="assets/labels/label-1.png" alt="label" id="labelImg">
          </div>
          <div class="vinyl-rim"></div>
          <div class="spinhole"></div>
        </div>
      </div>

      <div class="sleeve-wrap">
        <div class="sleeve-shadow"></div>
        <div class="sleeve-card" id="sleeveCard" onclick="flipSleeve()" title="Click to flip">
          <div class="sleeve-face">
            <img src="assets/covers/cover-1.png" alt="front cover" id="frontImg">
            <div class="sleeve-sheen"></div>
            <div class="sleeve-spine"></div>
          </div>
          <div class="sleeve-face sleeve-back-face">
            <img src="assets/covers/back-a.png" alt="back cover" id="backImg">
            <div class="sleeve-sheen"></div>
            <div class="sleeve-spine"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- Controls under artwork -->
    <div class="artwork-controls">
      <div class="artwork-ctrl-group">
        <span class="ctrl-label">Cover</span>
        <button class="sel-btn active" onclick="setCover(1,this)">1</button>
        <button class="sel-btn" onclick="setCover(2,this)">2</button>
        <button class="sel-btn" onclick="setCover(3,this)">3</button>
        <span class="ctrl-label" style="margin-left:10px">Back</span>
        <button class="sel-btn active" onclick="setBack('a',this)">A</button>
        <button class="sel-btn" onclick="setBack('b',this)">B</button>
        <button class="sel-btn" style="margin-left:6px" onclick="flipSleeve()">Flip</button>
      </div>
      <div class="artwork-ctrl-group">
        <span class="ctrl-label">Label</span>
        <button class="sel-btn active" onclick="setLabel(1,this)">1</button>
        <button class="sel-btn" onclick="setLabel(2,this)">2</button>
        <button class="sel-btn" onclick="setLabel(3,this)">3</button>
      </div>
    </div>
  </div>

  <!-- RIGHT 50%: booklet spread -->
  <div class="right-panel">

    <div class="book-wrap">
      <div class="book-body" id="bookBody">
        <div class="book-page left" id="leftPage">
          <img src="assets/booklet/booklet-pg-01.png" alt="page" id="leftImg">
        </div>
        <div class="book-spine" id="bookSpine"></div>
        <div class="book-page right" id="rightPage">
          <img src="assets/booklet/booklet-pg-02.png" alt="page" id="rightImg">
        </div>
        <!-- no overlay button -->
      </div>
      <div class="book-shadow"></div>
    </div>

    <div class="booklet-footer">
      <div class="page-nav">
        <button class="nav-btn" id="prevBtn" onclick="changeSpread(-1)" disabled>&#8249;</button>
        <span class="page-counter" id="counter">1 / 7</span>
        <button class="nav-btn" id="nextBtn" onclick="changeSpread(1)">&#8250;</button>
      </div>
      <div id="inside-cover-toggle" style="display:none;align-items:center;gap:3px;">
        <span class="ctrl-label">Inside Cover</span>
        <button class="sel-btn inside-cover-btn active" onclick="setInsideCover('a',this)">A</button>
        <button class="sel-btn inside-cover-btn" onclick="setInsideCover('b',this)">B</button>
        <button class="sel-btn inside-cover-btn" onclick="setInsideCover('c',this)">C</button>
      </div>
      <div class="tracklist-inline" id="tracklistInline"></div>
    </div>

  </div>
</div>

<!-- PLAYER BAR -->
<div class="player-bar">
  <div class="player-unit">
    <div class="player-controls">
      <button class="ply-btn sm" onclick="prevTrack()">
        <svg viewBox="0 0 12 12"><polygon points="12,0 4,6 12,12"/><rect x="0" y="0" width="3" height="12"/></svg>
      </button>
      <button class="ply-btn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 12 14"><polygon points="0,0 12,7 0,14"/></svg>
        <svg id="pauseIcon" viewBox="0 0 12 14" style="display:none"><rect x="0" y="0" width="4" height="14"/><rect x="8" y="0" width="4" height="14"/></svg>
      </button>
      <button class="ply-btn sm" onclick="nextTrack()">
        <svg viewBox="0 0 12 12"><polygon points="0,0 8,6 0,12"/><rect x="9" y="0" width="3" height="12"/></svg>
      </button>
    </div>
    <div class="player-info">
      <div class="player-track" id="playerTrackName">— select a track —</div>
      <div class="player-artist">Sean Lake Opeka · Fermoyle</div>
    </div>
    <div class="player-progress">
      <span class="time-label" id="timeCurrent">0:00</span>
      <div class="progress-rail" onclick="seekTo(event)"><div class="progress-fill" id="progressFill"></div></div>
      <span class="time-label" id="timeDuration">0:00</span>
    </div>
  </div>
  <div class="mini-tracks">
    <button class="mini-btn" onclick="playTrack(0)" id="mini0">1</button>
    <button class="mini-btn" onclick="playTrack(1)" id="mini1">2</button>
    <button class="mini-btn" onclick="playTrack(2)" id="mini2">3</button>
    <button class="mini-btn" onclick="playTrack(3)" id="mini3">4</button>
    <button class="mini-btn" onclick="playTrack(4)" id="mini4">5</button>
    <button class="mini-btn" onclick="playTrack(5)" id="mini5">6</button>
    <button class="mini-btn" onclick="playTrack(6)" id="mini6">7</button>
    <button class="mini-btn" onclick="playTrack(7)" id="mini7">8</button>
  </div>
</div>

<script>
var tracks = [
  { n:'Opitus Season',            file:'tracks/01-opitus-season.mp3' },
  { n:'Ships in the Night',       file:'tracks/02-ships-in-the-night.mp3' },
  { n:'Jazz Relapse',             file:'tracks/03-jazz-relapse.mp3' },
  { n:'Walk of the Bird',         file:'tracks/04-walk-of-the-bird.mp3' },
  { n:'Good Evening',             file:'tracks/05-good-evening.mp3' },
  { n:'Cherry Blossom Interlude', file:'tracks/06-cherry-blossom-interlude.mp3' },
  { n:'Off in the Distance',      file:'tracks/07-off-in-the-distance.mp3' },
  { n:'A Little Nervous',         file:'tracks/08-a-little-nervous.mp3' }
];

var insideCoverSuffix = 'a'; /* active inside cover variant */

var views = [
  { type:'single', src:'assets/booklet/booklet-cover.png',  tL:null, tR:null, label:'Front Cover' },
  { type:'spread', left:'assets/booklet/booklet-pg-01a.png', right:'assets/booklet/booklet-pg-02.png', tL:0, tR:1, label:'Spread 1 of 5', insideCover:true },
  { type:'spread', left:'assets/booklet/booklet-pg-03.png', right:'assets/booklet/booklet-pg-04.png', tL:2, tR:3, label:'Spread 2 of 5' },
  { type:'spread', left:'assets/booklet/booklet-pg-05.png', right:'assets/booklet/booklet-pg-06.png', tL:4, tR:5, label:'Spread 3 of 5' },
  { type:'spread', left:'assets/booklet/booklet-pg-07.png', right:'assets/booklet/booklet-pg-08.png', tL:6, tR:7, label:'Spread 4 of 5' },
  { type:'spread', left:'assets/booklet/booklet-pg-09.png', right:'assets/booklet/booklet-pg-10.png', tL:null, tR:null, label:'Spread 5 of 5' },
  { type:'single', src:'assets/booklet/booklet-back.png',   tL:null, tR:null, label:'Back Cover' }
];

var spread = 1; /* default to first inner spread */
var audio = new Audio(), currentTrack = -1, isPlaying = false;

/* ── Booklet page dimensions ──
   Image files are 2820 × 2996 px → ratio w/h = 0.9413
   We size pages to fill the right panel height minus footer.
   Using JS to compute from panel size. */
var PAGE_H, PAGE_W;

function computePageSize() {
  var rp = document.querySelector('.right-panel');
  var footer = document.querySelector('.booklet-footer');
  var wrap = document.querySelector('.book-wrap');
  if (!rp) return;
  var pad = 56;
  var availH = rp.clientHeight - footer.offsetHeight - pad * 2 - 14;
  var availW = (rp.clientWidth - pad * 2 - 10) / 2; /* per-page max width */
  var byH = Math.min(availH, 420);
  var byW = availW > 0 ? Math.round(availW * (2996 / 2820)) : byH;
  PAGE_H = Math.max(180, Math.min(byH, byW));
  PAGE_W = Math.round(PAGE_H * (2820 / 2996));
  var totalW = PAGE_W * 2 + 10;
  document.getElementById('bookBody').style.height = PAGE_H + 'px';
  if (wrap) { wrap.style.width = totalW + 'px'; }
  footer.style.width = totalW + 'px';
  renderSpread();
}

/* ── Header: cover / back / label ── */
function setCover(n, btn) {
  document.querySelectorAll('.ctrl-group:nth-child(1) .sel-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  var img = document.getElementById('frontImg');
  img.classList.remove('page-anim'); void img.offsetWidth; img.classList.add('page-anim');
  img.src = 'assets/covers/cover-' + n + '.png';
  document.getElementById('labelImg').src = 'assets/labels/label-' + n + '.png';
  document.querySelectorAll('.ctrl-group:nth-child(3) .sel-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.ctrl-group:nth-child(3) .sel-btn')[n - 1].classList.add('active');
}

function setBack(n, btn) {
  document.querySelectorAll('.ctrl-group:nth-child(2) .sel-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('backImg').src = 'assets/covers/back-' + n + '.png';
  document.getElementById('sleeveCard').classList.add('flipped');
}

function setLabel(n, btn) {
  document.querySelectorAll('.ctrl-group:nth-child(3) .sel-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  document.getElementById('labelImg').src = 'assets/labels/label-' + n + '.png';
}

function flipSleeve() { document.getElementById('sleeveCard').classList.toggle('flipped'); }
function toggleSpin() { document.getElementById('disc').classList.toggle('paused'); }

function setInsideCover(suffix, btn) {
  insideCoverSuffix = suffix;
  document.querySelectorAll('.inside-cover-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  views[1].left = 'assets/booklet/booklet-pg-01' + suffix + '.png';
  if (spread === 1) {
    var li = document.getElementById('leftImg');
    li.classList.remove('page-anim'); void li.offsetWidth; li.classList.add('page-anim');
    li.src = views[1].left;
  }
}

/* ── Booklet rendering ── */
function renderSpread() {
  if (!PAGE_H) return;
  var v = views[spread];
  var lp  = document.getElementById('leftPage');
  var rp  = document.getElementById('rightPage');
  var sp  = document.getElementById('bookSpine');
  var bb  = document.getElementById('bookBody');
  var li  = document.getElementById('leftImg');
  var ri  = document.getElementById('rightImg');
  li.classList.remove('page-anim'); void li.offsetWidth; li.classList.add('page-anim');

  var wrap = document.querySelector('.book-wrap');
  if (v.type === 'single') {
    lp.style.width = PAGE_W + 'px';
    bb.style.width = PAGE_W + 'px';
    if (wrap) wrap.style.width = PAGE_W + 'px';
    rp.style.display = 'none';
    sp.style.display = 'none';
    li.src = v.src;
  } else {
    var totalW = PAGE_W * 2 + 10;
    lp.style.width = PAGE_W + 'px';
    rp.style.width = PAGE_W + 'px';
    bb.style.width = totalW + 'px';
    if (wrap) wrap.style.width = totalW + 'px';
    rp.style.display = 'block';
    sp.style.display = 'block';
    li.src = v.left;
    ri.classList.remove('page-anim'); void ri.offsetWidth; ri.classList.add('page-anim');
    ri.src = v.right;
  }

  /* inside cover toggle — show only on spread 1 */
  var ict = document.getElementById('inside-cover-toggle');
  if (ict) ict.style.display = v.insideCover ? 'flex' : 'none';

  var sl = document.getElementById('spreadLabel'); if (sl) sl.textContent = v.label;
  document.getElementById('counter').textContent = (spread + 1) + ' / ' + views.length;
  document.getElementById('prevBtn').disabled = spread === 0;
  document.getElementById('nextBtn').disabled = spread === views.length - 1;
  renderSpreadTracklist();
  updateTracklistHighlight();
}

function changeSpread(dir) {
  spread = Math.max(0, Math.min(views.length - 1, spread + dir));
  renderSpread();
}

function playSpreadTrack() {
  var ti = views[spread].track;
  if (ti !== null) playTrack(ti);
}

/* ── Tracklist: show left + right track for current spread ── */
function renderSpreadTracklist() {
  var el = document.getElementById('tracklistInline');
  el.innerHTML = '';
  var v = views[spread];
  [v.tL, v.tR].forEach(function(i) {
    if (i === null || i === undefined) return;
    var div = document.createElement('div');
    div.className = 'tl-item' + (i === currentTrack ? ' playing' : '');
    div.id = 'tli' + i;
    div.onclick = function() { playTrack(i); };
    div.innerHTML = '<span class="tl-n">' + (i+1) + '</span><span class="tl-name">' + tracks[i].n + '</span>';
    el.appendChild(div);
  });
}

function updateTracklistHighlight() {
  document.querySelectorAll('.tl-item').forEach(function(el) {
    var i = parseInt(el.id.replace('tli',''));
    el.classList.toggle('playing', i === currentTrack);
  });
  document.querySelectorAll('.mini-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === currentTrack);
  });
}

/* ── Audio ── */
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  return Math.floor(s/60) + ':' + (Math.floor(s%60) < 10 ? '0' : '') + Math.floor(s%60);
}

audio.addEventListener('timeupdate', function() {
  if (!audio.duration) return;
  document.getElementById('progressFill').style.width = ((audio.currentTime / audio.duration) * 100) + '%';
  document.getElementById('timeCurrent').textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', function() {
  document.getElementById('timeDuration').textContent = fmt(audio.duration);
});
audio.addEventListener('ended', nextTrack);
audio.addEventListener('play', function() {
  isPlaying = true; updatePlayUI();
  document.getElementById('disc').classList.remove('paused');
});
audio.addEventListener('pause', function() { isPlaying = false; updatePlayUI(); });

function playTrack(idx) {
  if (idx < 0 || idx >= tracks.length) return;
  currentTrack = idx;
  audio.src = tracks[idx].file;
  audio.play().catch(function(){});
  document.getElementById('playerTrackName').textContent = tracks[idx].n;
  updateTracklistHighlight();
  var stb = document.getElementById('spreadTrackBtn');
  if (stb) stb.classList.toggle('playing', views[spread].track === idx && isPlaying);
}
function togglePlay() { if (currentTrack < 0) { playTrack(0); return; } audio.paused ? audio.play() : audio.pause(); }
function prevTrack()  { playTrack(currentTrack <= 0 ? 0 : currentTrack - 1); }
function nextTrack()  { playTrack(currentTrack < tracks.length - 1 ? currentTrack + 1 : 0); }
function seekTo(e)    { if (audio.duration) audio.currentTime = (e.offsetX / e.currentTarget.offsetWidth) * audio.duration; }

function updatePlayUI() {
  document.getElementById('playIcon').style.display  = isPlaying ? 'none'  : 'block';
  document.getElementById('pauseIcon').style.display = isPlaying ? 'block' : 'none';
  updateTracklistHighlight();
}

/* ── Init ── */
renderSpreadTracklist();
window.addEventListener('resize', computePageSize);
/* wait for layout to settle, then size booklet */
requestAnimationFrame(function() { setTimeout(computePageSize, 50); });
</script>
</body>
</html>
