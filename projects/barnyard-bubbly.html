  <style>
    /* The mark draws itself: each path's outline is traced, then the fill rises behind it. */
    /* The mark gets a full screen to itself — nothing else in frame while it draws.
       min-height rather than height so a short viewport can still grow if it needs to. */
    .bb-stage {
      min-height: 100vh;
      min-height: 100svh;          /* mobile: discount the collapsing browser chrome */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-8) 0;
    }
    #bb-mark { width: 100%; max-width: 560px; height: auto; overflow: visible; }
    #bb-mark .bb-p {
      stroke: currentColor;
      stroke-width: .75;
      stroke-miterlimit: 10;
      fill: currentColor;
      fill-opacity: 0;
    }
    /* Only once the JS has measured the paths do we hand the animation over to CSS —
       without the measurement a dasharray of 0 would hide the mark entirely. */
    #bb-mark.is-ready .bb-p {
      stroke-dashoffset: var(--len);
      animation: bb-draw 3.4s cubic-bezier(.45,0,.25,1) forwards,
                 bb-fill 1.4s ease-out forwards;
      animation-delay: calc(var(--i) * .22s), calc(var(--i) * .22s + 2.7s);
    }
    @keyframes bb-draw { to { stroke-dashoffset: 0; } }
    @keyframes bb-fill { to { fill-opacity: 1; } }
    /* Reduced motion: show the finished mark, no drawing. */
    @media (prefers-reduced-motion: reduce) {
      #bb-mark.is-ready .bb-p { animation: none; stroke-dashoffset: 0; fill-opacity: 1; }
    }
  </style>

  <script>
    /* Measure each path so the dash animation is even across very different lengths. */
    addEventListener('load', () => {
      const svg = document.getElementById('bb-mark');
      if (!svg) return;
      const paths = [...svg.querySelectorAll('.bb-p')];
      paths.forEach((p, i) => {
        const len = p.getTotalLength();
        p.style.setProperty('--len', len);
        p.style.setProperty('--i', i);
        p.style.strokeDasharray = len;
      });
      // draw when it comes into view, not on load, so it isn't missed above the fold
      const go = () => svg.classList.add('is-ready');
      if (!('IntersectionObserver' in window)) return go();
      new IntersectionObserver((es, o) => {
        es.forEach(e => { if (e.isIntersecting) { go(); o.disconnect(); } });
      }, { threshold: .25 }).observe(svg);
    });
  </script>
