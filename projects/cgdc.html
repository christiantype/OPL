<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chicago Graphic Design Club — OP/AL</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <script>
    const PROJECT = {
      title:       "Chicago Graphic Design Club",
      description: "Founded in 2020, CGDC has grown into one of Chicago's most active creative communities. The CGDC produces content and programming that challenges, inspires, and connects designers across disciplines.",
      body: "Through partnerships with thought leaders across the city and beyond, the CGDC has positioned itself as a leading voice in the industry — hosting events, publishing work, and creating space for honest dialogue about what design is, what it does, and where it's going.",
      client:      "The Chicago Graphic Design Club",
      medium:      "Programming",
      year:        "2020 – Ongoing",
      credits: [
        { name: "Christian Solorzano", title: "President / Director" },
        { name: "Cheryl Bever",        title: "Vice President" },
        { name: "Sean Fermoyle",       title: "Treasurer" },
        { name: "Carlos Segura",       title: "Mentor" },
        { name: "Barry Deck",          title: "Spark" },
        { name: "Alexis Gonzalez<br>Jeffrey Hitchens<br>Tori Webb", title: "Team Members" }
      ],
      role:        "Designer/Producer",
      images: [
        { src: "../images/CGDC-01.webp",  alt: "CGDC 01", cols: 12 },
        { src: "../images/CGDC-02.webp",  alt: "CGDC 02",  },
        { src: "../images/CGDC-03.webp",  alt: "CGDC 03",  },
        { src: "../images/CGDC-04.webp",  alt: "CGDC 04",  },
        { src: "../images/CGDC-05.webp",  alt: "CGDC 05",  },
        { src: "../images/CGDC-06.webp",  alt: "CGDC 06", cols: 12 },
        { src: "../images/CGDC-07.webp",  alt: "CGDC 07", cols: 12 }
      ],
      next: { title: "Underscore", url: "underscore.html" }
    };
  </script>
  <script src="../shared/project.js"></script>
  <script>
  (function () {

    var IMGS = [
      'https://chicagographicdesign.club/wp-content/uploads/2021/11/DSCF1600.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/L1002109.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2021/11/DSCF1413.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2024/06/DSCF6822.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2025/03/DSC_0490-mod-022525-1400w.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2021/11/DSCF8749.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2021/11/DSCF4096.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2023/07/DSC_0652-071323-1600w.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2021/11/DSCF4247-2.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/DSCF1814.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/L1000815.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/DSCF2026.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2023/07/DSC_0637-071323-1600w.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2024/06/DSCF6845.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2024/10/DSCF8791.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2025/03/DSC_0712-mod-022525-1400w.webp',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/DSCF1592.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/DSCF1602.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/DSCF5643.jpg',
      'https://chicagographicdesign.club/wp-content/uploads/2025/08/L1000490.jpg',
    ];

    // dx/dy in vw/vh — particles explode outward from center
    // dx/dy in vw/vh; t = duration(s); d values replaced at build time with negative delays
    var PARTICLES = [
      {dx:-28,dy:-55,sc:1.00,t:32},
      {dx: 20,dy:-48,sc:0.85,t:36},
      {dx: 45,dy:-30,sc:0.95,t:30},
      {dx: 52,dy: 14,sc:0.80,t:34},
      {dx: 38,dy: 44,sc:1.00,t:28},
      {dx: 10,dy: 55,sc:0.90,t:33},
      {dx:-22,dy: 50,sc:0.75,t:37},
      {dx:-44,dy: 34,sc:0.95,t:31},
      {dx:-52,dy:  8,sc:0.85,t:35},
      {dx:-42,dy:-32,sc:1.00,t:29},
      {dx: 30,dy:-46,sc:0.70,t:36},
      {dx:-34,dy:-42,sc:0.90,t:30},
      {dx:-14,dy: 55,sc:0.65,t:34},
      {dx: 48,dy:-18,sc:0.80,t:28},
      {dx:-28,dy: 48,sc:0.85,t:38},
      {dx: 22,dy: 52,sc:0.70,t:32},
      {dx:-55,dy:-12,sc:1.00,t:30},
      {dx: 34,dy:-44,sc:0.80,t:35},
      {dx:-16,dy:-54,sc:0.90,t:33},
      {dx: 46,dy: 28,sc:0.65,t:37},
      {dx:-36,dy: 40,sc:1.00,t:29},
      {dx: 14,dy:-52,sc:0.75,t:34},
      {dx: 55,dy: -6,sc:0.85,t:31},
      {dx:-22,dy: 54,sc:0.90,t:36},
      {dx: 36,dy:-38,sc:0.70,t:28},
      {dx:-48,dy: 22,sc:0.80,t:33},
      {dx: 26,dy: 48,sc:0.90,t:35},
      {dx:-30,dy:-48,sc:0.75,t:30},
    ];

    function buildStyles() {
      var s = document.createElement('style');
      s.textContent = [
        '.cgdc-anim{',
          'width:100%;',
          'height:100vh;',
          'position:relative;',
          'overflow:hidden;',
          'background:#fff;',
          'perspective:1400px;',
          'transform-style:preserve-3d;',
          'margin-bottom:var(--space-12);',
        '}',
        '.cgdc-particles{',
          'position:absolute;',
          'inset:0;',
          'transform-style:preserve-3d;',
        '}',
        '.cgdc-particle{',
          'position:absolute;',
          'left:50%;top:50%;',
          'width:clamp(120px,13vw,260px);',
          'margin:0;padding:0;',
          'animation:cgdc-explode ease-in-out infinite;',
          'will-change:transform,opacity;',
        '}',
        '.cgdc-particle img{',
          'width:100%;display:block;',
          'aspect-ratio:3/4;',
          'object-fit:cover;',
        '}',
        '@keyframes cgdc-explode{',
          '0%{transform:translate(-50%,-50%) translate(0,0) translateZ(-800px) scale(calc(var(--sc,1)*0.75));opacity:0}',
          '18%{opacity:1}',
          '80%{opacity:1}',
          '100%{transform:translate(-50%,-50%) translate(calc(var(--dx,0)*1vw),calc(var(--dy,0)*1vh)) translateZ(0) scale(calc(var(--sc,1)*1.1));opacity:0}',
        '}',
        '.cgdc-inner{',
          'position:absolute;',
          'top:50%;left:50%;',
          'transform:translate(-50%,-50%);',
          'z-index:10;',
          'pointer-events:none;',
          'white-space:nowrap;',
        '}',
        '.cgdc-headline{',
          'font-family:"Sidepiece",sans-serif;',
          'font-weight:400;',
          'font-size:clamp(12px,1.4vw,22px);',
          'letter-spacing:0.03em;',
          'text-transform:none;',
          'color:#fff;',
          'background:#111;',
          'margin:0;',
          'padding:6px 16px 8px;',
          'line-height:1;',
          'display:block;',
        '}',
      ].join('');
      document.head.appendChild(s);
    }

    function buildHTML() {
      var wrap = document.createElement('div');
      wrap.className = 'cgdc-anim';

      // Particles
      var field = document.createElement('div');
      field.className = 'cgdc-particles';
      field.setAttribute('aria-hidden', 'true');

      PARTICLES.forEach(function (p, i) {
        var fig = document.createElement('figure');
        fig.className = 'cgdc-particle';
        // Spread particles from 10%→85% of their cycle so ~75% are always visible
        var startFrac = 0.10 + (i / (PARTICLES.length - 1)) * 0.75;
        var negDelay  = -(startFrac * p.t).toFixed(2);
        fig.style.cssText =
          '--dx:' + p.dx + ';' +
          '--dy:' + p.dy + ';' +
          '--sc:'  + p.sc + ';' +
          'animation-delay:' + negDelay + 's;' +
          'animation-duration:' + p.t + 's;';
        var img = document.createElement('img');
        img.src = IMGS[i % IMGS.length];
        img.alt = '';
        img.loading = 'eager';
        img.decoding = 'async';
        fig.appendChild(img);
        field.appendChild(fig);
      });

      wrap.appendChild(field);

      // Inner text
      var inner = document.createElement('div');
      inner.className = 'cgdc-inner';
      inner.innerHTML =
        '<h1 class="cgdc-headline">Chicago’s Design Community</h1>';
      wrap.appendChild(inner);

      return wrap;
    }

    // Insert before #images
    var images = document.getElementById('images');
    buildStyles();
    var anim = buildHTML();
    if (images) {
      images.parentNode.insertBefore(anim, images);
    } else {
      document.body.appendChild(anim);
    }

  })();
  </script>
</body>
</html>
