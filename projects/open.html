  <script>
    (function(){
      var KEY = 'open_pw_ok';
      var gate = document.getElementById('pw-gate');
      if(sessionStorage.getItem(KEY) === '1') { gate.classList.add('hidden'); return; }
      var input = document.getElementById('pw-input');
      var err   = document.getElementById('pw-error');
      input.addEventListener('keydown', function(e){
        if(e.key !== 'Enter') return;
        if(input.value === 'userwithin'){
          sessionStorage.setItem(KEY, '1');
          gate.classList.add('hidden');
        } else {
          err.textContent = 'Incorrect';
          input.value = '';
        }
      });
    })();
  </script>

    document.head.appendChild(styleEl);

    var SESSIONS = [

      if (s.conversation) html += '<p class="open-block__text">' + s.conversation + '</p>';
      html += '</div>';
      html += '</div>';
    });

    // Session 4
    html += '<div class="open-session" style="background:#ede8f0">';
    html += '<div class="open-session__image"></div>';
    html += '<div class="open-session__content">';
    html += '<span class="open-session__eyebrow label">Session 4</span>';
    html += '<h2 class="open-session__title">Consider &amp; Engage</h2>';
    html += '<p class="open-block__text">What the work is for, not what it pays. We ask what it looks like to design for people rather than outcomes — and what remains when the title goes away. We\'ll ask — who were we before? Who are we now? And who can we become?</p>';
    html += '<p class="open-block__text" style="margin-top:var(--space-6)">This only works in a group. Through shared conversation, we hold each other accountable to what we find.</p>';
    html += '</div>';
    html += '</div>';

    // Facilitators
    html += '<div class="open-facilitators">';
    html += '<div class="open-facilitator">';
    html += '<h3 class="open-facilitator__name">Christian Solorzano</h3>';
    html += '<span class="open-facilitator__title">Co-Facilitator</span>';
    html += '<div class="open-facilitator__bio">';
    html += '<p>Christian Solorzano is a designer, educator, and community builder based in Chicago. He is the founder of OP/AL, an independent design studio built on the belief that attention is the practice, and of the Chicago Graphic Design Club — a community spanning thousands of designers across the city.</p>';
    html += '<p>He teaches communication design at DePaul University, is the chief editor of Faculty magazine, and hosts Underscore, a podcast with over 100 conversations about design in Chicago.</p>';
    html += '<p>Outside the studio, Christian is a trained meditation instructor, a Zen practitioner, and holds a black belt in Brazilian Jiu-Jitsu. His work sits at the intersection of identity, culture, and communication.</p>';
    html += '</div>';
    html += '</div>';
    html += '<div class="open-facilitator">';
    html += '<h3 class="open-facilitator__name">Brian Morris</h3>';
    html += '<span class="open-facilitator__title">Co-Facilitator</span>';
    html += '<div class="open-facilitator__bio">';
    html += '<p>For more than 25 years, Brian Morris helped organizations navigate ambiguity through visual design, creative leadership, and digital experience strategy. His work centered on uncovering patterns, translating complexity, and making meaningful decisions before all the answers were known.</p>';
    html += '<p>After leaving an Executive Creative Director role in 2021, Brian turned the same skills inward. Drawing from a lifetime of creative practice, he began exploring intuition not as a mystical gift, but as a capacity that can be cultivated through attention, trust, reflection, and daily practice.</p>';
    html += '<p>Today, Brian helps people reconnect with their own intuitive intelligence and develop practical ways to access it in everyday life.</p>';
    html += '</div>';
    html += '</div>';
    html += '</div>';

    // Apply CTA
    html += '<div class="open-apply-cta">';
    html += '<span class="open-session__eyebrow label">OP/EN — 2026</span>';
    html += '<h2 class="open-session__title">Apply</h2>';

    // Application overlay
    var overlay = document.createElement('div');

    overlay.innerHTML = '<div class="open-apply-inner">' +
      '<span class="open-apply-prompt">One Question</span>' +
      '<p class="open-apply-q">Given unconstrained resources, what would you bring into life for the people around you.</p>' +

        '<button class="open-apply-submit" onclick="var t=document.getElementById(\'open-apply-textarea\').value;window.location.href=\'mailto:hi@opal.design?subject=OP%2FEN%20Application&body=\'+encodeURIComponent(t);">Submit</button>' +

    // ── Session illustrations ─────────────────────────────────────────────
    // Each image panel gets a canvas animation using the orb as motif
    (function(){
      var t0 = performance.now();
      var fns = [];

      function init(){
        var els = document.querySelectorAll('#open-sessions .open-session__image');
        for(var i=0;i<els.length;i++){
          (function(el,idx){
            var cv = document.createElement('canvas');
            cv.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:block;';
            el.style.position = 'relative';
            el.appendChild(cv);
            var ctx = cv.getContext('2d');
            function sz(){
              var dpr = window.devicePixelRatio||1;
              cv.width  = (el.offsetWidth  || window.innerWidth/2) * dpr;
              cv.height = (el.offsetHeight || window.innerHeight)  * dpr;
            }
            sz();
            window.addEventListener('resize', sz);
            if(idx===0) fns.push(mkGather(cv,ctx));
            else if(idx===1) fns.push(mkContainer(cv,ctx));
            else if(idx===2) fns.push(mkMissing(cv,ctx));
            else             fns.push(mkEngage(cv,ctx));
          })(els[i], i);
        }
        (function loop(){
          var t = (performance.now()-t0)/1000;
          for(var f=0;f<fns.length;f++) fns[f](t);
          requestAnimationFrame(loop);
        })();
      }

      // Two frames so DOM layout settles before reading offsetWidth/Height
      requestAnimationFrame(function(){ requestAnimationFrame(init); });

      // Session 1 — Gather
      // Almost monochrome: dark particles with the faintest cool-blue tint as they land
      function mkGather(cv,ctx){
        var N=38, pts=[];
        for(var i=0;i<N;i++){
          var a=(i/N)*Math.PI*2;
          var sr=0.45+Math.random()*0.9, sa=Math.random()*Math.PI*2;
          pts.push({ a:a, sx:Math.cos(sa)*sr, sy:Math.sin(sa)*sr });
        }
        return function(t){
          var W=cv.width, H=cv.height, dpr=window.devicePixelRatio||1;
          ctx.clearRect(0,0,W,H);
          var cx=W/2, cy=H/2, r=Math.min(W,H)*0.28;
          var ph=(t%9)/9, g;
          if(ph<0.42)      g = ph/0.42;
          else if(ph<0.65) g = 1;
          else             g = 1-(ph-0.65)/0.35;
          g = g<0.5 ? 4*g*g*g : 1-Math.pow(-2*g+2,3)/2;
          for(var i=0;i<N;i++){
            var p=pts[i];
            var x=cx+(p.sx*(1-g)+Math.cos(p.a)*g)*r;
            var y=cy+(p.sy*(1-g)+Math.sin(p.a)*g)*r;
            // Faint blue tint only at the moment of landing
            var blu = Math.round(g*18);
            ctx.beginPath();
            ctx.arc(x,y,(1.4+g*1.3)*dpr,0,Math.PI*2);
            ctx.fillStyle='rgba('+blu+','+blu+','+Math.round(20+g*60)+','+(0.18+g*0.62)+')';
            ctx.fill();
          }
        };
      }

      // Session 2 — The Container and the Lines
      // Each wall is a geometric half-plane constraint. Dots clip to the nearest wall —
      // they literally sit at the wall surface. Lines stay thin throughout.
      function mkContainer(cv,ctx){
        var N=54;
        var baseAngles=[0,Math.PI,Math.PI/2,-Math.PI/2,Math.PI/4,-Math.PI*3/4,-Math.PI/4,Math.PI*3/4];
        var walls=baseAngles.map(function(dir,k){
          return { dir:dir, ph:k*0.83, spd:0.55+k*0.07 };
        });

        return function(t){
          var W=cv.width,H=cv.height,dpr=window.devicePixelRatio||1;
          ctx.clearRect(0,0,W,H);
          var r=Math.min(W,H)*0.30;
          var diag=Math.sqrt(W*W+H*H)*0.75;

          // Center drifts organically
          var driftX=Math.sin(t*0.23)*r*0.13+Math.sin(t*0.11)*r*0.06;
          var driftY=Math.cos(t*0.19)*r*0.11+Math.cos(t*0.13)*r*0.07;
          var cx=W/2+driftX, cy=H/2+driftY;

          // Whole cage spins with a subtle wobble
          var spin=t*0.16+Math.sin(t*0.09)*0.35;

          // Pressure cycle — squeeze and release
          var cycle=(t%9)/9;
          var pressure;
          if(cycle<0.35)      pressure=cycle/0.35;
          else if(cycle<0.68) pressure=1.0;
          else                pressure=1-(cycle-0.68)/0.32;
          pressure=pressure<0.5?2*pressure*pressure:1-Math.pow(-2*pressure+2,2)/2;

          // Each wall breathes slightly out of phase with the others
          var wDist=[], wAp=[];
          for(var j=0;j<walls.length;j++){
            wAp[j]=Math.min(Math.max((t-j*0.38)/0.50,0),1);
            var wobble=Math.sin(t*walls[j].spd+walls[j].ph)*0.09;
            wDist[j]=r*(1.45-(pressure+wobble)*0.87*wAp[j]);
          }

          ctx.save();
          // Rotate the whole cage around the drifting center
          ctx.translate(cx,cy);
          ctx.rotate(spin);
          ctx.translate(-cx,-cy);

          var dotSz=1.8*dpr;
          for(var i=0;i<N;i++){
            var a=(i/N)*Math.PI*2;
            var dotR=r;
            for(var j=0;j<walls.length;j++){
              if(wAp[j]<=0) continue;
              var cosA=Math.cos(a-walls[j].dir);
              if(cosA>0.005){
                var reach=wDist[j]/cosA;
                if(reach<dotR) dotR=reach;
              }
            }
            dotR=Math.max(dotR,r*0.07);

            // Indigo → crimson, with a faint hue pulse
            var hPulse=Math.sin(spin*1.4+i/N*Math.PI)*0.12;
            var dr=Math.round(14+pressure*58+hPulse*30);
            var dg=Math.round(18-pressure*10);
            var db=Math.round(82-pressure*70);
            ctx.beginPath();
            ctx.arc(cx+Math.cos(a)*dotR,cy+Math.sin(a)*dotR,dotSz,0,Math.PI*2);
            ctx.fillStyle='rgba('+dr+','+dg+','+db+',0.85)';
            ctx.fill();
          }

          // Walls — thin lines, fade at ends
          ctx.lineWidth=1*dpr;
          for(var j=0;j<walls.length;j++){
            if(wAp[j]<=0) continue;
            var d=wDist[j];
            var wx=cx+Math.cos(walls[j].dir)*d;
            var wy=cy+Math.sin(walls[j].dir)*d;
            var px=Math.cos(walls[j].dir+Math.PI/2);
            var py=Math.sin(walls[j].dir+Math.PI/2);
            var lx0=wx-px*diag, ly0=wy-py*diag;
            var lx1=wx+px*diag, ly1=wy+py*diag;
            var op=wAp[j]*(0.20+pressure*0.30);
            var lg=ctx.createLinearGradient(lx0,ly0,lx1,ly1);
            lg.addColorStop(0,   'rgba(60,80,190,0)');
            lg.addColorStop(0.16,'rgba(60,80,190,'+op+')');
            lg.addColorStop(0.84,'rgba(60,80,190,'+op+')');
            lg.addColorStop(1,   'rgba(60,80,190,0)');
            ctx.beginPath();
            ctx.moveTo(lx0,ly0);
            ctx.lineTo(lx1,ly1);
            ctx.strokeStyle=lg;
            ctx.stroke();
          }
          ctx.restore();
        };
      }

      // Session 3 — Don't Go Missing
      // Dense phyllotaxis field — each dot drifts on its own frequency,
      // the whole cluster breathes and rotates, several amber dots glow and switch.
      function mkMissing(cv,ctx){
        var N=96, pts=[];
        for(var i=0;i<N;i++){
          var angle=i*2.39996;
          var rad=Math.sqrt(i/N)*0.42;
          pts.push({
            x:  Math.cos(angle)*rad,
            y:  Math.sin(angle)*rad,
            sz: 0.5+Math.sqrt(i/N)*2.0,
            ph: Math.random()*Math.PI*2,
            spd:0.30+Math.random()*0.55
          });
        }
        var specials=new Set(), nextSwitch=1.8;
        function pickSpecials(){
          specials.clear();
          var count=2+Math.floor(Math.random()*3);
          while(specials.size<count) specials.add(Math.floor(Math.random()*N));
        }
        pickSpecials();
        return function(t){
          var W=cv.width,H=cv.height,dpr=window.devicePixelRatio||1;
          ctx.clearRect(0,0,W,H);
          var cx=W/2,cy=H/2,scale=Math.min(W,H)*0.33;
          if(t>nextSwitch){ pickSpecials(); nextSwitch=t+1.6+Math.random()*2.0; }
          // Two-harmonic breath — feels alive, not mechanical
          var breath=1+Math.sin(t*0.55)*0.06+Math.sin(t*1.4)*0.022;
          // Slow drift rotation
          var rot=t*0.055;
          var cr=Math.cos(rot), sr=Math.sin(rot);
          for(var i=0;i<N;i++){
            var p=pts[i];
            // Each dot wanders around its spiral position
            var wx=Math.sin(t*p.spd+p.ph)*0.032;
            var wy=Math.cos(t*p.spd*0.79+p.ph+1.1)*0.032;
            var bx=(p.x+wx)*scale*breath;
            var by=(p.y+wy)*scale*breath;
            // Rotate the whole field
            var x=cx+bx*cr-by*sr;
            var y=cy+bx*sr+by*cr;
            if(specials.has(i)){
              var lp=0.5+0.5*Math.sin(t*2.6+i*0.9);
              var glowR=(p.sz*1.1+lp*3.2)*dpr;
              var grd=ctx.createRadialGradient(x,y,0,x,y,glowR*3.8);
              grd.addColorStop(0,'rgba(220,135,10,'+(0.7+lp*0.3)+')');
              grd.addColorStop(0.35,'rgba(200,100,0,'+(0.25*lp)+')');
              grd.addColorStop(1,'rgba(190,70,0,0)');
              ctx.beginPath();
              ctx.arc(x,y,glowR*3.8,0,Math.PI*2);
              ctx.fillStyle=grd;
              ctx.fill();
              ctx.beginPath();
              ctx.arc(x,y,glowR,0,Math.PI*2);
              ctx.fillStyle='rgba(228,148,12,'+(0.82+lp*0.18)+')';
              ctx.fill();
            } else {
              var flicker=0.28+0.22*Math.sin(t*p.spd*0.6+p.ph);
              ctx.beginPath();
              ctx.arc(x,y,p.sz*dpr,0,Math.PI*2);
              ctx.fillStyle='rgba(18,20,50,'+flicker+')';
              ctx.fill();
            }
          }
        };
      }

      // Session 4 — Consider & Engage
      // Organic sunburst — each ray has its own life: speed, length, width, phase
      function mkEngage(cv,ctx){
        var NR=56, rays=[];
        for(var i=0;i<NR;i++){
          rays.push({
            ang: (i/NR)*Math.PI*2+(Math.random()-0.5)*0.08,
            spd: 0.14+Math.random()*0.32,
            ph:  Math.random()*Math.PI*2,
            ph2: Math.random()*Math.PI*2,
            base:0.30+Math.random()*0.58,
            w:   0.5+Math.random()*1.4
          });
        }
        return function(t){
          var W=cv.width,H=cv.height,dpr=window.devicePixelRatio||1;
          ctx.clearRect(0,0,W,H);
          var cx=W/2,cy=H/2,maxR=Math.min(W,H)*0.46;
          ctx.save();
          for(var i=0;i<NR;i++){
            var ray=rays[i];
            // Two harmonics — makes motion feel alive, not mechanical
            var p1=0.5+0.5*Math.sin(t*ray.spd*Math.PI*2+ray.ph);
            var p2=0.5+0.5*Math.sin(t*ray.spd*6.1+ray.ph2);
            var pulse=Math.max(0,Math.min(1,p1*0.75+p2*0.25));
            var rayLen=maxR*ray.base*(0.35+pulse*0.65);
            var hueT=((ray.ang/(Math.PI*2))+(t*0.022))%1;
            var rr,gg,bb,s;
            if(hueT<0.33){
              s=hueT/0.33;
              rr=Math.round(5+s*210);gg=Math.round(90+s*50);bb=220;
            } else if(hueT<0.66){
              s=(hueT-0.33)/0.33;
              rr=215;gg=Math.round(140-s*120);bb=Math.round(220-s*210);
            } else {
              s=(hueT-0.66)/0.34;
              rr=Math.round(215-s*210);gg=Math.round(20+s*70);bb=Math.round(10+s*210);
            }
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            ctx.lineTo(cx+Math.cos(ray.ang)*rayLen,cy+Math.sin(ray.ang)*rayLen);
            ctx.strokeStyle='rgba('+rr+','+gg+','+bb+','+(0.08+pulse*0.80)+')';
            ctx.lineWidth=ray.w*(0.4+pulse*0.9)*dpr;
            ctx.stroke();
          }
          // Warm center glow
          var g=ctx.createRadialGradient(cx,cy,0,cx,cy,maxR*0.14);
          g.addColorStop(0,'rgba(255,255,255,0.98)');
          g.addColorStop(0.35,'rgba(255,245,210,0.60)');
          g.addColorStop(1,'rgba(255,220,150,0)');
          ctx.fillStyle=g;
          ctx.beginPath();
          ctx.arc(cx,cy,maxR*0.14,0,Math.PI*2);
          ctx.fill();
          ctx.restore();
        };
      }

    })();

  })();
  </script>

<script>
(function(){
  function initOrb(){
    var panel=document.getElementById('open-orb-panel');
    var bgCv=document.getElementById('appBgCv');
    var glCv=document.getElementById('appGlCv');
    if(!panel||!bgCv||!glCv){ return; } // panel removed, bail silently
    var bgCtx=bgCv.getContext('2d');
    var PW=0, PH=0;
    function resizeAll(){
      var r=panel.getBoundingClientRect();
      PW=r.width; PH=r.height;
      bgCv.width=PW; bgCv.height=PH;
      renderer.setSize(PW,PH);
      camera.aspect=PW/PH;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize',resizeAll);
    var mouseRaw={x:0,y:-0.2};
    var mouseSmooth={x:0,y:-0.2};
    var idleTime=0;
    panel.addEventListener('mousemove',function(e){
      var r=panel.getBoundingClientRect();
      mouseRaw.x=((e.clientX-r.left)/PW)*2-1;
      mouseRaw.y=-(((e.clientY-r.top)/PH)*2-1);
      idleTime=0;
    });
    panel.addEventListener('touchmove',function(e){
      e.preventDefault();
      var r=panel.getBoundingClientRect();
      var t=e.touches[0];
      mouseRaw.x=((t.clientX-r.left)/PW)*2-1;
      mouseRaw.y=-(((t.clientY-r.top)/PH)*2-1);
      idleTime=0;
    },{passive:false});
    var renderer=new THREE.WebGLRenderer({canvas:glCv,alpha:true,antialias:true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
    var scene_3d=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(40,1,0.1,100);
    camera.position.set(0,0,3.5);
    var bgTex=new THREE.CanvasTexture(bgCv);

var VS=`
varying vec3 vNormal,vViewDir,vWorldPos;
varying vec4 vScreenPos;
varying vec3 vLocalPos;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);
  vWorldPos=wp.xyz; vLocalPos=position;
  vNormal=normalize(normalMatrix*normal);
  vViewDir=normalize(cameraPosition-wp.xyz);
  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
  vScreenPos=gl_Position;
}`;

var FS=`
precision highp float;
uniform sampler2D uBgTex;
uniform vec3 uLightPos;
uniform float uTime;
varying vec3 vNormal,vViewDir,vWorldPos;
varying vec4 vScreenPos;
varying vec3 vLocalPos;

float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){
  vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){return noise(p)*0.5+noise(p*2.1+1.3)*0.25+noise(p*4.3+2.7)*0.125;}

void main(){
  vec3 N=normalize(vNormal);
  vec3 V=normalize(vViewDir);
  vec3 L=normalize(uLightPos-vWorldPos);
  vec3 H=normalize(L+V);

  float NdotV=max(dot(N,V),0.0);
  float NdotL=max(dot(N,L),0.0);
  float NdotH=max(dot(N,H),0.0);
  float thickness=NdotV; // 1 at front pole, 0 at silhouette

  // Schlick fresnel — very strong at edges for glass
  float fresnel=0.04+0.96*pow(1.0-NdotV,5.0);

  // Screen UV for background sampling
  vec2 screenUV=(vScreenPos.xy/vScreenPos.w)*0.5+0.5;

  // Crystal IOR — 2.1 bends light dramatically (vs 1.55 = water)
  float ior=2.1;
  vec3 refrDir=refract(-V,N,1.0/ior);
  vec2 refrOff=refrDir.xy*(ior-1.0)*0.13;

  // Strong chromatic aberration — crystal splits white light into spectrum
  float chromMag=1.1*fresnel+0.3*(1.0-thickness);
  vec2 chromR=N.xy*chromMag*0.09;
  vec2 chromB=N.xy*chromMag*0.065;

  float bgR=texture2D(uBgTex,clamp(screenUV+refrOff+chromR,0.0,1.0)).r;
  float bgG=texture2D(uBgTex,clamp(screenUV+refrOff,0.0,1.0)).g;
  float bgB=texture2D(uBgTex,clamp(screenUV+refrOff-chromB,0.0,1.0)).b;
  vec3 bgColor=vec3(bgR,bgG,bgB);

  // Back-surface transmission — inverted background visible through the glass
  // This is the classic "upside-down world inside a glass ball" effect
  vec2 backUV=vec2(1.0-(screenUV.x+refrOff.x*2.2), screenUV.y+refrOff.y*2.2);
  backUV=clamp(backUV,0.0,1.0);
  vec3 backColor=texture2D(uBgTex,backUV).rgb;
  float transmitMask=thickness*(1.0-fresnel);
  vec3 color=mix(bgColor, backColor, transmitMask*0.55);

  // Slight crystal tint — not pure clear, has a faint blue-gray hue internally
  color=mix(color, vec3(0.90,0.93,1.0), 0.06*(1.0-thickness*0.6));

  // Dark silhouette edges — critical for 3D depth illusion
  float edgeDark=pow(1.0-thickness,2.5);
  color=mix(color,vec3(0.02,0.03,0.06),edgeDark*0.82);

  // Body zone for internal color contributions
  float body=smoothstep(0.0,0.32,thickness)*smoothstep(1.0,0.18,thickness);

  // Internal colored light sources — vivid, move with cursor
  // BLUE — upper, fixed anchor
  vec3 Lblue=normalize(vec3(-uLightPos.x*0.35+0.15, uLightPos.y*0.45+1.3, 1.0));
  float blueBlob=pow(max(dot(N,Lblue),0.0),1.6)*body;
  color+=vec3(0.02,0.12,0.98)*blueBlob*0.90;

  // YELLOW/GOLD — cursor-driven, warmest
  float yBlob=pow(NdotL,1.4)*body;
  color+=vec3(1.0,0.80,0.0)*yBlob*0.95;

  // RED — lower counter-light
  vec3 Lred=normalize(vec3(-uLightPos.x*0.45,-uLightPos.y*0.35-0.65,0.85));
  float redBlob=pow(max(dot(N,Lred),0.0),2.0)*body;
  color+=vec3(0.95,0.03,0.02)*redBlob*0.75;

  // Animated internal caustic shimmer — light interference patterns
  vec2 causticUV=vLocalPos.xy*3.5+uLightPos.xy*0.8;
  float caustic=fbm(causticUV+uTime*0.25)*fbm(causticUV*1.4-uTime*0.18);
  color+=vec3(0.9,0.95,1.0)*caustic*body*0.18;

  // Shadow — unlit side goes very dark for strong 3D form
  float shadow=smoothstep(-0.4,0.6,NdotL);
  color*=mix(0.04,1.0,shadow);

  // PRIMARY specular — hard bright core (the main catchlight)
  float shineCore=pow(NdotH,400.0)*1.8;
  float shineMid =pow(NdotH,80.0)*0.65;
  float shineSoft=pow(NdotH,22.0)*0.28;
  color+=vec3(1.0)*shineCore;
  color+=vec3(1.0,0.99,0.97)*shineMid;
  color+=vec3(1.0,0.98,0.95)*shineSoft;

  // SECONDARY specular — offset catchlight (real glass has two highlights)
  vec3 L2=normalize(uLightPos*vec3(0.52,0.58,1.12)-vWorldPos);
  float spec2=pow(max(dot(N,normalize(L2+V)),0.0),200.0)*0.7;
  color+=vec3(0.96,0.98,1.0)*spec2;

  // Back-lit specular — glow from opposite side of light (internal bounce)
  vec3 Lback=normalize(-uLightPos*vec3(0.6,0.6,1.0));
  float specBack=pow(max(dot(N,normalize(Lback+V)),0.0),120.0)*0.35;
  color+=vec3(0.7,0.8,1.0)*specBack;

  // Prismatic rim — colored spectrum at the silhouette edge
  float rimMask=pow(1.0-NdotV,4.0);
  float prismAngle=atan(vLocalPos.y,vLocalPos.x)+uTime*0.04;
  vec3 prismCol=vec3(
    0.5+0.5*sin(prismAngle*3.0+uLightPos.x*1.5),
    0.5+0.5*sin(prismAngle*3.0+2.094+uLightPos.y*1.5),
    0.5+0.5*sin(prismAngle*3.0+4.189)
  );
  color+=prismCol*rimMask*0.50;
  color+=vec3(0.85,0.90,1.0)*rimMask*smoothstep(0.5,0.0,NdotL)*0.12;

  gl_FragColor=vec4(clamp(color,0.0,4.0),1.0);
}`;

var mat=new THREE.ShaderMaterial({
  uniforms:{
    uBgTex:{value:bgTex},
    uLightPos:{value:new THREE.Vector3(0,0.25,2.5)},
    uTime:{value:0.0},
  },
  vertexShader:VS,fragmentShader:FS,
  transparent:true,side:THREE.FrontSide,
});
var geo=new THREE.SphereGeometry(1,128,96);
var mesh=new THREE.Mesh(geo,mat);
mesh.scale.set(0.46,0.64,0.62);
scene_3d.add(mesh);

    function drawBackground(lx,ly,orbX,orbY){
      bgCtx.clearRect(0,0,PW,PH);
      var grad=bgCtx.createRadialGradient(PW/2,PH/2,0,PW/2,PH/2,PH*0.65);
      grad.addColorStop(0,'#e2e2e2');
      grad.addColorStop(0.45,'#f0f0f0');
      grad.addColorStop(1,'#ffffff');
      bgCtx.fillStyle=grad;
      bgCtx.fillRect(0,0,PW,PH);
      var fovScale=PH/(2*Math.tan(20*Math.PI/180)*3.5);
      var rx=0.46*fovScale, ry=0.64*fovScale;
      var osx=PW/2+orbX*fovScale;
      var osy=PH/2-orbY*fovScale;
      var shadowX=osx-lx*rx*0.28;
      var shadowY=osy+ry;
      bgCtx.save();
      bgCtx.filter='blur(24px)';
      bgCtx.save(); bgCtx.translate(shadowX,shadowY); bgCtx.scale(1,0.11);
      bgCtx.beginPath(); bgCtx.arc(0,0,rx,0,Math.PI*2);
      bgCtx.fillStyle='rgba(0,0,0,0.30)'; bgCtx.fill(); bgCtx.restore();
      bgCtx.filter='blur(44px)';
      bgCtx.save(); bgCtx.translate(shadowX,shadowY); bgCtx.scale(1,0.19);
      bgCtx.beginPath(); bgCtx.arc(0,0,rx*1.25,0,Math.PI*2);
      bgCtx.fillStyle='rgba(0,0,0,0.12)'; bgCtx.fill(); bgCtx.restore();
      bgCtx.filter='none';
      bgCtx.restore();
    }

    var clock=new THREE.Clock();
    var time=0;
    function idleDrift(t){
      return {
        x:Math.sin(t*0.16)*0.22+Math.sin(t*0.09)*0.10,
        y:Math.cos(t*0.12)*0.18+Math.cos(t*0.07)*0.08
      };
    }
    function lerp(a,b,t){return a+(b-a)*t;}
    function animate(){
      requestAnimationFrame(animate);
      var dt=Math.min(clock.getDelta(),0.05);
      time+=dt;
      idleTime+=dt;
      var idleFac=Math.min(Math.max(idleTime-4,0)/2.5,1);
      var idle=idleDrift(time);
      var tx=lerp(mouseRaw.x,idle.x,idleFac);
      var ty=lerp(mouseRaw.y,idle.y,idleFac);
      mouseSmooth.x=lerp(mouseSmooth.x,tx,0.06);
      mouseSmooth.y=lerp(mouseSmooth.y,ty,0.06);
      var lx=mouseSmooth.x,ly=mouseSmooth.y;
      mat.uniforms.uLightPos.value.set(lx*4.5,ly*4.5,2.5);
      mat.uniforms.uTime.value=time;
      mesh.rotation.x=lerp(mesh.rotation.x,-ly*0.45,0.04);
      mesh.rotation.y=lerp(mesh.rotation.y,lx*0.45,0.04);
      mesh.rotation.z=0;
      mesh.position.x=lerp(mesh.position.x,lx*0.45,0.06);
      mesh.position.y=lerp(mesh.position.y,ly*0.35,0.06);
      drawBackground(lx,ly,mesh.position.x,mesh.position.y);
      bgTex.needsUpdate=true;
      renderer.render(scene_3d,camera);
    }
    resizeAll();
    animate();
  }
  initOrb();
})();
</script>
