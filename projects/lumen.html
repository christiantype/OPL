  <script>
    // Trending micro-animation: counts tick up and the list re-sorts itself,
    // sliding rows past each other (FLIP) so the ranking feels live.
    (function () {
      function fmt(n) { return (n / 1000).toFixed(1) + 'k'; }
      function initTrend(t) {
        if (t.dataset.init) return; t.dataset.init = '1';
        var rows = function () { return Array.from(t.querySelectorAll('.pf-trend__row')); };
        function tick() {
          var before = rows();
          var oldTops = before.map(function (r) { return r.getBoundingClientRect().top; });
          before.forEach(function (r, i) {
            r.dataset.count = +r.dataset.count + Math.floor(Math.random() * 60);
            if (i === Math.floor(Math.random() * before.length))
              r.dataset.count = +r.dataset.count + 140 + Math.floor(Math.random() * 320);
          });
          var sorted = rows().sort(function (a, b) { return b.dataset.count - a.dataset.count; });
          sorted.forEach(function (r, i) {
            r.querySelector('.pf-trend__v').textContent = fmt(+r.dataset.count);
            r.querySelector('.pf-trend__n').textContent = String(i + 1).padStart(2, '0');
            t.appendChild(r);
          });
          rows().forEach(function (r) {
            var dy = oldTops[before.indexOf(r)] - r.getBoundingClientRect().top;
            if (dy) {
              r.style.transition = 'none';
              r.style.transform = 'translateY(' + dy + 'px)';
              requestAnimationFrame(function () { r.style.transition = ''; r.style.transform = ''; });
            }
          });
          var top = sorted[0].querySelector('.pf-trend__m');
          if (top) { top.classList.add('is-bump'); setTimeout(function () { top.classList.remove('is-bump'); }, 600); }
        }
        setInterval(tick, 2600);
      }
      // Animated note: types the note, saves it, then shares it — on a loop.
      function initNote(el) {
        if (el.dataset.init) return; el.dataset.init = '1';
        var titleEl = el.querySelector('[data-note-title]');
        var bodyEl = el.querySelector('[data-note-body]');
        var statusEl = el.querySelector('[data-note-status]');
        var chipsEl = el.querySelector('[data-note-chips]');
        var TITLE = 'Marion Levine follow-up';
        var BODY = "Economic-benefit regime held — the premiums aren't gifts. Pull the valuation discount into the napkin.";
        var timers = [], iv = null;
        function clearAll() { timers.forEach(clearTimeout); timers = []; if (iv) { clearInterval(iv); iv = null; } }
        function type(elm, text, speed, done) {
          elm.classList.add('is-typing'); var i = 0;
          iv = setInterval(function () {
            i++; elm.textContent = text.slice(0, i);
            if (i >= text.length) { clearInterval(iv); iv = null; elm.classList.remove('is-typing'); done && done(); }
          }, speed);
        }
        function after(ms, fn) { timers.push(setTimeout(fn, ms)); }
        function run() {
          clearAll();
          titleEl.textContent = ''; bodyEl.textContent = '';
          statusEl.textContent = ''; statusEl.className = 'pf-no__status';
          chipsEl.classList.remove('is-shown');
          after(600, function () {
            type(titleEl, TITLE, 58, function () {
              after(450, function () {
                type(bodyEl, BODY, 27, function () {
                  after(700, function () {
                    statusEl.className = 'pf-no__status is-saving'; statusEl.textContent = 'Saving…';
                    after(1500, function () {
                      statusEl.className = 'pf-no__status is-saved'; statusEl.textContent = 'Saved to Apple Notes';
                      after(1600, function () {
                        statusEl.className = 'pf-no__status is-shared'; statusEl.textContent = 'Shared with your team';
                        chipsEl.classList.add('is-shown');
                        after(4200, run);
                      });
                    });
                  });
                });
              });
            });
          });
        }
        run();
      }
      // Active-producers chart: the day popover moves on its own (no hover).
      function initAuPop(el) {
        if (el.dataset.init) return; el.dataset.init = '1';
        var pts = Array.prototype.slice.call(el.querySelectorAll('.pf-au__pt'));
        if (!pts.length) return;
        var i = pts.findIndex(function (p) { return p.classList.contains('is-open'); });
        if (i < 0) i = 0;
        setInterval(function () {
          pts.forEach(function (p) { p.classList.remove('is-open'); });
          i = (i + 1) % pts.length;
          pts[i].classList.add('is-open');
        }, 3200);
      }
      function boot() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        document.querySelectorAll('[data-pftrend]').forEach(initTrend);
        document.querySelectorAll('[data-pfnote]').forEach(initNote);
        document.querySelectorAll('.pf-au').forEach(initAuPop);
      }
      setTimeout(boot, 1000);
    })();

    // Rotating chat-bar prompts — every chat input cycles through example
    // questions (typed out) instead of one static placeholder.
    (function () {
      var prompts = [
        'How can I help you today?',
        'Help me brainstorm a strategy for a client',
        'Which structure holds up under the new ruling?',
        'Who is a Gen-Skip Split-Dollar right for?',
        'Walk me through the back-of-the-napkin',
        'Draft a client summary letter'
      ];
      function wire(input) {
        if (input.dataset.rot) return; input.dataset.rot = '1';
        var i = 0;
        function next() {
          i = (i + 1) % prompts.length;
          var text = prompts[i], n = 0;
          input.setAttribute('placeholder', '');
          var t = setInterval(function () {
            n++; input.setAttribute('placeholder', text.slice(0, n));
            if (n >= text.length) { clearInterval(t); setTimeout(next, 2800); }
          }, 30);
        }
        setTimeout(next, 2800);
      }
      var runs = 0;
      var iv = setInterval(function () {
        document.querySelectorAll('.lumen__chat-input:not([data-rot])').forEach(wire);
        if (++runs > 8) clearInterval(iv);
      }, 1500);
    })();
  </script>
