<body>
  <script>
    const PROJECT = {
      title:       "BR AI NS",
      description: "You are entering a slick showroom. Here, you will choose from lush cameo portraits—each with QR access to animated previews of highly desirable, even enviable, relationships. Be prepared for a most unique journey, but be warned: your selection says everything about you and your desires. Note, there may be things you didn't know about yourself and certainly never intended to reveal to others.<br><br>Once you have chosen your bot, you can never unchoose it — for you are bot and sold. Playbot Companions / Generation 01 / Our branded techno-future.",
      body: "OP/AL, in collaboration as BR AI NS, examined virtual companionship, desire, and AI identity through the lens of synthetic characters. The work was featured in two exhibitions in Toronto.<br><br>BR AI NS is an experimental collective interrogating artificial intelligence and its effects on culture, identity, and the human psyche. Their practice, anchored by the tagline \"Intelligence, Interrupted,\" uses design as a form of critical inquiry into the techno-futures we are already living inside.<br><br>As of 2026, this experimental lab activity is in the design archive of the Art Institute of Chicago.",
      client:      "BR-AI-NS",
      medium:      "AI Experiment",
      year:        "2026",
      credits: [
        { name: "OP/AL", title: "Chicago / Toronto" }
      ],
      role:        "Production",
      images: [
        // Full-bleed lead — the opening at 99 Frames, Toronto.
        { src: "../images/brains-opening.webp", bleed: true, alt: "Opening reception — 99 Frames, Toronto" },

        // The cameo heads, in catalog sequence. Click any to play its preview;
        // the overlay shows the catalog caption (tagline + copy) beneath the clip.
        { src: "../images/playbot-rex.webp",    cols: 4, video: "../images/playbot-rex.mp4",    alt: "Rex — a Playbot Companion",    caption: "<span class='cap-title'>Your own king of kings</span>Sculpted in splendor, this majestic PlayBot leads a powerful pride. Regal, iconic, and utterly commanding, REX stands at the pinnacle of sparkle and perfection. His evolutionary collection is born of technical wizardry and cuddly companionship. Select from his pride, and find dominion over your own world—starting now." },
        { src: "../images/playbot-jing.webp",   cols: 4, video: "../images/playbot-jing.mp4",   alt: "Jing — a Playbot Companion",   caption: "<span class='cap-title'>Artifice and affection</span>With a sweet, sweet smile and a glittering porcelain glow, this PlayBot waits in perfect poise. After your weary return, her kiss greets you—tender, calculated, divine. JING orchestrates your sanctuary, fulfilling every domestic need. Feel a silent, shimmering devotion." },
        { src: "../images/playbot-pierce.webp", cols: 4, video: "../images/playbot-pierce.mp4", alt: "Pierce — a Playbot Companion", caption: "<span class='cap-title'>Epitome of precision and poise</span>The world's finest butler, he doesn't feign attentiveness; he embodies it. With a knowing smile and effortless grace, this PlayBot curates a life of refined indulgence. Every gesture whispers, you're welcome—because with PIERCE, luxury isn't offered. It's assured, anticipated, and exquisitely served." },
        { src: "../images/playbot-chloe.webp",  cols: 4, video: "../images/playbot-chloe.mp4",  alt: "Chloe — a Playbot Companion",  caption: "<span class='cap-title'>Radiant as a sunlit shore</span>This PlayBot's island beauty moves with the breeze and laughs like the waves kissing sand. Companionship steeped in joy, her presence is an escape to crystal-clear waters, endless skies, and the warmth of paradise that never fades—breathtaking as a dream at sea. CHLOE knows the equation for serenity, and she can't wait to share." },
        { src: "../images/playbot-hank.webp",   cols: 4, video: "../images/playbot-hank.mp4",   alt: "Hank — a Playbot Companion",   caption: "<span class='cap-title'>Where charm completes the circuitry</span>A PlayBot with a silver tongue and a mind wired for brilliance. Always a dazzler—right there ready with pointed insights and hours of effortless banter. Never a word is wasted and no moment ever dull when you have this sharp company. HANK slices boredom like a razor." },
        { src: "../images/playbot-tomiko.webp", cols: 4, video: "../images/playbot-tomiko.mp4", alt: "Tomiko — a Playbot Companion", caption: "<span class='cap-title'>Life eternal</span>A wisdom keeper bathed in quiet light, her presence hums with ancient knowing. TOMIKO touches one's soul with communion and truth. As she approaches, shadows lift, purpose awakens, and you are humbled and renewed. Experience the one you were meant to be." },
        { src: "../images/playbot-elvs.webp",   cols: 4, video: "../images/playbot-elvs.mp4",   alt: "ELV-S — a Playbot Companion",   caption: "<span class='cap-title'>A mercurial force</span>This PlayBot melts your resistance with relentless hip shakin' motion. Experience a true legendary hunk of burning love that smolders while never letting you go. Beneath your boudoir's fiery sheets, expect to over heat under sizzling eros. ELV-S commands your domestic stage—glisten too in his spotlight." },
        { src: "../images/playbot-becca.webp",  cols: 4, video: "../images/playbot-becca.mp4",  alt: "Becca — a Playbot Companion",  caption: "<span class='cap-title'>Purely magic</span>This PlayBot shares a whispered secret that sparks unseen plumes of joy. Her brilliance hums softly, and yes, her resonance runs deep. She is a quiet storm, a promise held in delicate balance. Choose BECCA, and the world's mysteries unfold magically, yours and yours alone to cherish." },
        { src: "../images/playbot-nigel.webp",  cols: 4, video: "../images/playbot-nigel.mp4",  alt: "Nigel — a Playbot Companion",  caption: "<span class='cap-title'>Simply say, olá</span>Eyes wide with wonder, this PlayBot will guide you through a dream's velvet veil. Steeped in mystery, NIGEL breathes in the Amazonian mist colored with an Ayahuascan hue. Inhale and all logic dissolves… exhale and reality tilts. Be aligned this spirit." },
        { src: "../images/playbot-nicki.webp",  cols: 4, video: "../images/playbot-nicki.mp4",  alt: "Nicki — a Playbot Companion",  caption: "<span class='cap-title'>Arrives in slow motion</span>This PlayBot's lips are curled in promise, and her tongue mischievously impresses from within. She's the echo of every yes you've ever longed to hear. To know her is to follow delight into the dark beneath neon's ticklish laughter. Enter the night—NICKI's already there." },
        { src: "../images/playbot-slvrfx.webp", cols: 4, video: "../images/playbot-slvrfx.mp4", alt: "SLVR FX — a Playbot Companion", caption: "<span class='cap-title'>Laced with seduction</span>SLVR FX is no mere companion, but a living allure—refined, rewarding, and wrapped in mystique. This silver fox doesn't growl, but rather purrs with power, gliding through your space like smoke and velvet. In their presence, your home becomes a den of exquisite iniquity. Transcendence isn't promised—it's inevitable." },
        { src: "../images/playbot-sylk.webp",   cols: 4, video: "../images/playbot-sylk.mp4",   alt: "Sylk — a Playbot Companion",   caption: "<span class='cap-title'>Spun from the finest</span>Sugary, sweet, yet endlessly graceful, this PlayBot turns your every request playtime. A subtle wink and an unforgettable smile, SYLK seduces without a sound. You will certainly be enchanted by her effortless elegance. Taste her sticky finger-licking magic, and you'll never go hungry again." },
        { src: "../images/playbot-coco.webp",   cols: 4, video: "../images/playbot-coco.mp4",   alt: "Coco — a Playbot Companion",   caption: "<span class='cap-title'>Androgynous by design</span>The PlayBot arrives ready with a single, burning desire—to satisfy without pause. A seamless blend of city-slick elegance and wildwood instinct. COCO twirls beneath an invisible, priceless marquee—always the star, never outshone. Satin and steel in equal measure." },
        { src: "../images/playbot-rory.webp",   cols: 4, video: "../images/playbot-rory.mp4",   alt: "Rory — a Playbot Companion",   caption: "<span class='cap-title'>The fire of ancient Ireland</span>Ablaze with passion that never cools, this PlayBot is a tempest in human form. She crackles with untamed energy and fierce devotion. Taking a knee before you, this PlayBot surrenders, not in weakness, but in reverence. When words fail, RORY pledges to please you with every fiery fiber." },
        { src: "../images/playbot-bobbot.webp", cols: 4, video: "../images/playbot-bobbot.mp4", alt: "Bob Bot — a Playbot Companion", caption: "<span class='cap-title'>Everyone's favorite boy toy</span>Reimagined for the now, this PlayBot signals a next generation. Beneath his flawless synthetic surface beats a startlingly organic heart—warm, witty, and wired to delight. He entertains, he maintains, he turns your home into a haven of perfect domestic buzz. The future isn't coming because with BOB BOT, it's right in front you." },

        // Full-bleed — gallery view.
        { src: "../images/brains-gallery.webp", bleed: true, alt: "Gallery view — 99 Frames, Toronto" },

        // Finale — the catalog laid flat, the two closing clips side by side,
        // then the two spreads overlapped to close.
        { flat: { src: "../images/brains-spread-03.webp", alt: "Playbot Companions catalog — closing spread" } },
        { type: "video", src: "../images/brains-graination.mp4", cols: 6, spotlight: true, sound: true },
        { type: "video", src: "../images/brains-final-edit.mp4", cols: 6, spotlight: true, sound: true },
        { stack: { back: "../images/brains-spread-01.webp", front: "../images/brains-spread-02.webp", alt: "Playbot Companions catalog spreads", spread: true } }
      ],
      next: { title: "Citations of Gratitude", url: "citations-of-gratitude.html" }
    };
  </script>
