        { name: "Christian Solorzano", title: "UX Experience Lead" },

                body: "<p>The first screen meets the agent where they are. Latest pulls in what's just been published, Trending shows what other agents are working through right now, and Recommended learns from past behavior. The chat sits one tap away — the entire platform addressable from the first surface.</p>" },
              { num: "02", title: "Bookmarks", x: 0.760, y: 0.045, zoom: 3.2,

        { section: { num: "02", title: "Personal Advanced Markets Expert",
          body: "<p>The AI is built like a senior strategist, not a chatbot. Hand it a client case and it brainstorms the structure, surfaces the strategies by name, walks through the math, and holds onto the human stakes that financial advice always touches. <strong>One rare expert turned into a tool every agent can use.</strong></p>" } },

          ] },

        { section: { num: "03", title: "Strategy Library",
          body: "<p>Every advanced-markets strategy in one place — the Prospect Curator that surfaces who it's right for, the back-of-the-napkin diagram, and the financial breakdown that lets an agent walk into a meeting and own the room. The math is shown, not hidden.</p>" } },

            { x: 0.100, y: 0.560, title: "Related Materials",   body: "Content that supports or complements the main content the user is viewing." },

        { section: { num: "04", title: "Notes Mapped to Strategies",

        { mockup: "1759-mocks/admin-dashboard.html", alt: "Admin dashboard", cols: 12, windowTitle: "Enterprise · Admin",
