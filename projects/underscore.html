      body: "Episodes move across studio ownership, creative identity, race and design, typography, pedagogy, cultural production, AI, and what it means to practice with intention — drawing out the stories and perspectives that rarely make it into the formal record.",

  <script>

      'cgdc-podcast-ep-94.png','cgdc-podcast-ep-95.png','cgdc-podcast-ep-96.png',
      'cgdc-podcast-ep-97.png','cgdc-podcast-ep-98.png','cgdc-podcast-ep-99.png',
      'cgdc-podcast-ep-100.png','cgdc-podcast-ep-101.png',
      'underscore-episode_102.png','underscore-episode_103.png',
      'underscore-episode_104.png','underscore-episode_105.png',
      'underscore-episode_106.png','underscore-episode_107.png',
      'underscore-episode_108.png'
    ];

    var COLS = 4, ROWS = 3, CELLS = COLS * ROWS;
    var BASE = '../images/underscore/';

    function shuffle(arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }

    function build() {
      var style = document.createElement('style');
      style.textContent = [
        '.brady-wrap{width:100%;margin-bottom:var(--space-12);}',
        '.brady-grid{display:grid;grid-template-columns:repeat(' + COLS + ',1fr);gap:0.5em;}',
        '.brady-cell{position:relative;aspect-ratio:1/1;overflow:hidden;background:#111;}',
        '.brady-cell__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}',
        '.brady-cell__img--back{opacity:0;transition:opacity 0.45s ease-in-out;z-index:1;}',
        '.brady-cell__img--front{opacity:1;z-index:0;}'
      ].join('');
      document.head.appendChild(style);

      var wrap = document.createElement('div');
      wrap.className = 'brady-wrap';
      var container = document.createElement('div');
      container.className = 'container';
      var grid = document.createElement('div');
      grid.className = 'brady-grid';
      container.appendChild(grid);
      wrap.appendChild(container);

      var shuffled = shuffle(COVERS);
      var active   = shuffled.slice(0, CELLS);
      var pool     = shuffled.slice(CELLS);

      var cells = [];

      for (var i = 0; i < CELLS; i++) {
        var cell  = document.createElement('div');
        cell.className = 'brady-cell';

        var back  = document.createElement('img');
        back.className  = 'brady-cell__img brady-cell__img--back';
        back.alt        = '';

        var front = document.createElement('img');
        front.className = 'brady-cell__img brady-cell__img--front';
        front.src       = BASE + active[i];
        front.alt       = '';

        cell.appendChild(back);
        cell.appendChild(front);
        grid.appendChild(cell);

        cells.push({ el: cell, front: front, back: back, current: active[i] });
      }

      return { wrap: wrap, cells: cells, pool: pool };
    }

    function animate(cells, pool) {
      var busy = [];
      for (var k = 0; k < cells.length; k++) busy.push(false);

      function swap(idx) {
        if (busy[idx] || pool.length === 0) { schedule(idx); return; }
        busy[idx] = true;

        var cell    = cells[idx];
        var pi      = Math.floor(Math.random() * pool.length);
        var next    = pool[pi];

        pool[pi]    = cell.current;   // return old cover to pool

        cell.back.src = BASE + next;

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            cell.back.style.opacity = '1';

            setTimeout(function () {
              cell.front.src          = BASE + next;
              cell.back.style.opacity = '0';
              cell.current             = next;
              busy[idx]                = false;
              schedule(idx);
            }, 500);
          });
        });
      }

      function schedule(idx) {
        var delay = 1500 + Math.random() * 1500;
        setTimeout(function () { swap(idx); }, delay);
      }

      for (var i = 0; i < cells.length; i++) {
        (function (i) {
          setTimeout(function () { schedule(i); }, Math.random() * 1500);
        })(i);
      }
    }

    var result = build();
    var images = document.getElementById('images');
    if (images) {
      images.insertBefore(result.wrap, images.children[1] || null);
    } else {
      document.body.appendChild(result.wrap);
    }
    animate(result.cells, result.pool);
  })();
  </script>
