<!doctype html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fractal — raymarched DE</title>
<style>
  :root{ --panel:rgba(18,20,26,.82); --hair:rgba(255,255,255,.12); --ink:#eef0f4; --mute:rgba(255,255,255,.55); --accent:#6f9bff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#05060a; color:var(--ink);
    font:12px/1.4 ui-sans-serif,"Helvetica Neue",Arial,sans-serif; overflow:hidden; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #readout{ position:fixed; left:12px; bottom:10px; z-index:5; color:var(--mute); pointer-events:none;
    font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:.03em; }
  #readout b{ color:var(--ink); }
  #err{ position:fixed; left:12px; top:12px; right:12px; z-index:9; display:none; white-space:pre-wrap;
    background:rgba(60,12,16,.94); border:1px solid #d4545a; color:#ffd9db; padding:10px 12px; border-radius:8px;
    font-family:ui-monospace,Menlo,monospace; font-size:11px; max-height:60vh; overflow:auto; }
  /* control panel (built in a later step) */
  #panel{ position:fixed; top:12px; right:12px; width:250px; z-index:6; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="panel"></div>
  <div id="readout"></div>
  <div id="err"></div>
  <script src="./main.js" type="module"></script>
</body>
</html>
