<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Fractal — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<!-- OPALAB.css (and the tokens it imports) load BEFORE the inline style so the dark-token
     overrides below win for this page -->
<link rel="stylesheet" href="/lab/shared/OPALAB.css" />
<style>
  /* Fractal — raymarched distance-estimated fractals (WebGL2). The engine (main.js) fetches
     fractal.frag, builds its own control panel into #rail, and renders fullscreen into #stage.
     This page provides the OP/AL shell (topbar · Sessions) + the ibm rail chrome the panel needs.
     Dark-glass rail, to suit the glossy HDR render behind it. */
  :root{ --top:120px; --rail:290px;
    --paper:#0b0c14; --ink:#f2f3f7; --cell:rgba(255,255,255,.055); --hair:rgba(255,255,255,.17);
    --line:rgba(255,255,255,.12); --mute:rgba(255,255,255,.56); --track:rgba(255,255,255,.16);
    /* dark-neumorphic shadow pair for the dark rail */
    --nm-lo:rgba(255,255,255,.06); --nm-hi:rgba(0,0,0,.6); }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#05060a; color:var(--ink); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }

  /* dark topbar (the shell defaults to light) */
  .opal-topbar, .opal-subhead{ background:#0b0c14 !important; border-bottom-color:rgba(255,255,255,.1) !important; }
  .opal-brand, .opal-subhead__name{ color:var(--ink) !important; }
  .opal-brand .opal-product, .opal-subhead__desc, .opal-subhead__ver{ color:rgba(255,255,255,.55) !important; }
  .opal-brand .opal-divider{ background:rgba(255,255,255,.2) !important; }

  /* the render surface — fullscreen behind everything */
  #stage{ position:fixed; inset:0; z-index:1; display:block; width:100%; height:100%; background:#05060a; }

  /* ── control rail (main.js builds the sections into #rail) ── */
  .rail{ position:fixed; top:var(--top); bottom:0; left:0; width:var(--rail); z-index:6;
    padding:6px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(12,13,20,.72); -webkit-backdrop-filter:blur(30px) saturate(160%); backdrop-filter:blur(30px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
    transition:transform .28s ease; transform:translateX(-100%); }
  .rail.open{ transform:none; }
  .row{ display:flex; flex-direction:column; align-items:stretch; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .row:last-of-type{ border-bottom:0; }
  .rowhead{ text-transform:uppercase; letter-spacing:.16em; font-size:9px; color:var(--ink); font-weight:600; opacity:.9;
    padding-bottom:2px; display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    width:100%; background:none; border:0; font-family:inherit; text-align:left; }
  .rowhead:hover{ opacity:1; }
  .rowhead::before{ content:''; width:0; height:0; flex:none; opacity:.65;
    border-left:4px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .18s ease; }
  .row.folded .rowhead::before{ transform:rotate(0deg); }
  .row.folded > *:not(.rowhead){ display:none; }
  .rowhint{ margin:0 0 2px; font-size:9.5px; line-height:1.5; color:var(--mute); letter-spacing:.01em; opacity:.8; }
  .grp{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .grp > label{ text-transform:uppercase; letter-spacing:.13em; font-size:9px; line-height:1.3; color:var(--mute); }
  .grp > label b{ font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rail input[type=range]{ width:100%; }

  /* segmented + select + text + color */
  .seg{ display:flex; border:1px solid var(--hair); border-radius:6px; overflow:hidden; width:100%; }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--ink); flex:1;
    font:inherit; font-size:11px; padding:7px 6px; cursor:pointer; border-right:1px solid var(--hair); white-space:nowrap; }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ color:#0b0c14; background:var(--ink); }
  select, select.sel{ width:100%; appearance:none; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 24px 7px 10px; border-radius:6px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input[type=text], textarea{ width:100%; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 9px; border-radius:6px; }
  input[type=text]::placeholder, textarea::placeholder{ color:var(--mute); }
  .cin{ display:flex; align-items:center; gap:8px; }
  .cin input[type=color]{ width:30px; height:26px; border:1px solid var(--hair); background:none; border-radius:4px; padding:0; cursor:pointer; }
  .cin label{ font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--mute); }
  #looks{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }

  .btn{ appearance:none; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 12px; cursor:pointer; border-radius:6px; }
  .btn[aria-pressed="true"]{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  .btn:hover{ border-color:rgba(255,255,255,.4); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* dial knobs (main.js renders the SVG into .knob) */
  .knob{ position:relative; width:46px; height:46px; flex:none; touch-action:none; cursor:ns-resize; }
  .knob input[type=range]{ position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; pointer-events:none; }
  .knob svg{ display:block; width:46px; height:46px; overflow:visible; }
  .knob .k-tr{ fill:none; stroke:var(--track); stroke-width:3; stroke-linecap:round; }
  .knob .k-vl{ fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round; transition:stroke-dasharray .04s linear; }
  .knob .k-hub{ fill:var(--cell); stroke:var(--hair); stroke-width:1; }
  .knob .k-pt{ stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
  .knob.drag .k-vl{ stroke-width:3.6; }
  .knobrow{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .kcell{ display:flex; flex-direction:column; align-items:center; gap:5px; width:46px; }
  .kcell .klab{ text-transform:uppercase; letter-spacing:.1em; font-size:9px; line-height:1.15; color:var(--mute); text-align:center; white-space:nowrap; }
  .kcell .kval{ font-size:9px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

  /* ── chrome ── */
  .icon{ appearance:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--hair);
    background:rgba(12,13,20,.55); color:var(--ink); cursor:pointer; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    display:flex; align-items:center; justify-content:center; font-size:12px; padding:0; }
  .icon svg{ display:block; }
  .icon[aria-pressed="true"]{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  #toggle{ position:fixed; top:calc(var(--top) + 12px); left:16px; z-index:11; }
  body.panels #toggle{ left:calc(var(--rail) + 16px); }
  .barbtns{ position:fixed; top:calc(var(--top) + 12px); right:16px; z-index:11; display:flex; gap:8px; }
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; }
  body.fs #exitFs{ display:flex; }
  body.fs .rail, body.fs .opal-topbar, body.fs .opal-subhead, body.fs .barbtns, body.fs #toggle{ display:none !important; }

  #hint{ position:fixed; left:16px; bottom:14px; z-index:5; pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.05em; color:var(--mute); }
  #hint b{ color:var(--ink); font-weight:600; }
  body.panels #hint{ left:calc(var(--rail) + 16px); }
  #err{ position:fixed; left:16px; right:16px; bottom:40px; z-index:40; display:none; white-space:pre-wrap;
    background:rgba(176,22,34,.94); color:#fff; padding:12px 14px; border-radius:8px;
    font-family:ui-monospace,Menlo,monospace; font-size:11px; line-height:1.5; max-height:44vh; overflow:auto; }
  #err:not(:empty){ display:block; }
  /* the rail sections main.js builds become dark-glass islands (OPALAB.css cards + dark tokens) */
  #rail.rail-l{ background:transparent !important; }
  #rail.rail-l .row{ background:rgba(255,255,255,.05) !important; border-color:var(--line) !important;
    box-shadow:0 8px 30px -18px rgba(0,0,0,.6) !important; }
  /* Output island — dark glass to match the rail, pinned bottom-right by the shell */
  #output.out{ background:rgba(22,24,30,.9) !important; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid var(--line) !important; box-shadow:0 12px 40px -16px rgba(0,0,0,.7) !important; }
  #output.out .group__t{ color:var(--mute); }
</style>
</head>
<body class="dark panels">

<canvas id="stage"></canvas>

<button class="icon" id="toggle" aria-pressed="true" title="Controls" aria-label="Controls">
  <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M6.5 2.5v11"/></svg></button>

<div class="barbtns">
  <button class="icon" id="playBtn" title="Play / pause (space)" aria-label="Play / pause"></button>
  <button class="icon" id="themeBtn" title="Toggle chrome theme" aria-label="Theme">
    <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5"/><path d="M8 3v10" stroke-width="1.2"/><path d="M8 3a5 5 0 0 1 0 10z" fill="currentColor" stroke="none"/></svg></button>
  <button class="icon" id="fsBtn" title="Full screen (F)" aria-label="Full screen">
    <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
</div>
<button class="icon" id="exitFs" aria-label="Exit full screen" title="Exit (Esc)">&#10005;</button>

<div id="rail" class="rail rail-l open"></div>
<div id="hint"></div>
<div id="err"></div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Fractal', desc:'Raymarched distance-estimated fractals',
  about:'A real-time raymarched fractal renderer (WebGL2). Sphere-traces a distance estimator — Mandelbulb, Mandelbox, Menger / KIFS, Extruded &amp; Quaternion Julia, Sierpinski, Apollonian — shaded with reflections, a cosine palette and thin-film iridescence, then a bloom · ACES · vignette · dither post chain. Shape it in the rail; Save a 3× PNG or record a clip.',
  version:'v1' });</script>
<script src="main.js"></script>
</body>
</html>
