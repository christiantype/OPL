<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fractal — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  /* Pattern shares the family chrome with the other Lab tools. */

  /* Tape shares Angel's chrome so the two read as one family: same tokens, same rail,
     same knobs. What differs is everything below the chrome. */
  :root{ --ink:#141414; --hair:rgba(0,0,0,.26); --mute:rgba(0,0,0,.66); --paper:#ffffff;
    --panel:rgba(252,252,253,.72); --edge:rgba(0,0,0,.14); --cell:rgba(255,255,255,.75);
    --track:rgba(0,0,0,.3); --liton:#6f9bff; --top:100px; --rail:290px; }
  body.dark{ --ink:#f2f4f8; --hair:rgba(255,255,255,.26); --mute:rgba(255,255,255,.72); --paper:#07080f;
    --panel:rgba(14,15,22,.72); --edge:rgba(255,255,255,.16); --cell:rgba(255,255,255,.07);
    --track:rgba(255,255,255,.3); --liton:#8ab0ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif,"Helvetica Neue",Inter,Arial,sans-serif; overflow:hidden; }
  /* A canvas is a replaced element and won't stretch to an inset box, so it lives inside a
     wrapper that does — the wrapper's rect is the single source of truth for canvas size. */
  #stagewrap{ position:fixed; top:var(--top); left:0; right:0; bottom:0; }
  #stage{ display:block; width:100%; height:100%; touch-action:none; }

  /* opal.css hard-codes a white topbar and leaves .opal-subhead__name to inherit its colour.
     In dark mode that inherits near-white ink onto a white bar and the tool name disappears —
     so the shared chrome gets carried into the theme too. The brand link sets its colour
     inline via mountTopbar, hence !important. */
  body.dark .opal-topbar, body.dark .opal-subhead{ background:#0b0c14; border-bottom-color:rgba(255,255,255,.1); }
  body.dark .opal-brand{ color:var(--ink) !important; }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-brand .opal-product,
  body.dark .opal-subhead__desc,
  body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }
  body.dark .opal-brand .opal-divider{ background:rgba(255,255,255,.2); }

  /* Full-screen: canvas only. Everything chrome-like steps out of the way. */
  body.fs .rail, body.fs #bar, body.fs .opal-topbar, body.fs .opal-subhead{ display:none !important; }
  body.fs #stagewrap{ top:0; left:0; }
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; opacity:0; transition:opacity .25s ease; }
  body.fs #exitFs{ display:flex; }
  body.fs.hint #exitFs{ opacity:1; }

  @media (max-width:560px){ :root{ --top:92px; } }

  #status{ position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    font-size:10px; letter-spacing:.08em; color:var(--mute); display:none; }

  /* one hairline control strip — everything else is off until asked for */
  #bar{ position:fixed; top:calc(var(--top) + 12px); right:14px; z-index:10; display:flex; gap:8px; }
  .icon{ appearance:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--hair);
    background:var(--panel); color:var(--ink); cursor:pointer; backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:.04em; padding:0; }
  .icon svg{ display:block; }
  .icon[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  /* Sits BELOW the icon row, not beside it — the row grows as controls are added and a
     fixed right offset kept colliding with it. Stays put in full screen so a recording
     always shows its own timer. */
  #recDot{ position:fixed; top:calc(var(--top) + 58px); right:14px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    font-size:10px; letter-spacing:.12em; color:#ff4d5e;
    background:var(--panel); border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); }
  #recDot.on{ display:flex; }
  /* Count-in. Big enough that you are in no doubt what is about to happen. */

  #recDot i{ width:7px;height:7px;border-radius:50%;background:#ff4d5e; animation:blink 1s infinite; flex:none; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  body.fs #recDot{ top:14px; }
  @keyframes blink{ 50%{opacity:.2;} }

  /* Two rails: the lane you're editing on the left, everything global on the right, canvas
     between them. Frosted — the fill stays translucent or backdrop-filter has nothing to
     work with. */

  .rail{ position:fixed; top:var(--top); bottom:0; width:var(--rail); z-index:6;
    padding:4px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:var(--panel);
    -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
    display:flex; flex-direction:column; transition:transform .28s ease; }
  .rail-l{ left:0; border-right:1px solid var(--edge); }
  .rail-r{ right:0; border-left:1px solid var(--edge); }
  .row{ display:flex; flex-direction:column; align-items:stretch; gap:13px;
    padding:14px 0; border-bottom:1px solid var(--edge); }
  .row:last-of-type{ border-bottom:0; }
  /* Section heads fold their section away. Nine sections in two rails is a lot to scroll
     past when you only want two of them. */
  .rowhead{ text-transform:uppercase; letter-spacing:.16em; font-size:9px; color:var(--ink);
    font-weight:600; opacity:.9; padding-bottom:2px;
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    width:100%; background:none; border:0; font-family:inherit; text-align:left; }
  .rowhead:hover{ opacity:1; }
  .rowhint{ margin:0 0 2px; font-size:9.5px; line-height:1.5; color:var(--mute); letter-spacing:.01em; }
  .rowhead::before{ content:''; width:0; height:0; flex:none;
    border-left:4px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .18s ease; opacity:.65; }
  .row.folded .rowhead::before{ transform:rotate(0deg); }
  .row.folded > *:not(.rowhead){ display:none; }
  .row.folded{ padding-bottom:10px; }
  .grp{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .rail input[type=range]{ width:100%; }
  .rail select{ width:100%; }
  .rail .seg{ width:100%; }
  .rail .seg button{ flex:1; text-align:center; padding:7px 4px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .quad .grp > label{ font-size:8px; letter-spacing:.08em; }
  /* The canvas is the instrument. Rails stay out of the way until summoned, at every width —
     nothing between you and the piece unless you ask for it. */
  .rail{ width:290px; box-shadow:0 0 60px -20px rgba(0,0,0,.45); }
  .rail-l{ transform:translateX(-100%); }
  .rail-r{ transform:translateX(100%); }
  .rail.open{ transform:none; }

  /* Chrome fades out while you listen and comes back on movement. */
  #bar{ transition:opacity .5s ease; }
  body.idle #bar{ opacity:0; pointer-events:none; }
  body.panels #bar{ opacity:1; pointer-events:auto; }

  /* Mood — the one control that stays reachable. */

  .grp > label{ text-transform:uppercase; letter-spacing:.13em; font-size:9px; line-height:1.25;
    color:var(--mute); white-space:nowrap; }
  .rail .grp > label{ white-space:normal; }
  .grp > label b{ font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .seg{ display:flex; border:1px solid var(--hair); border-radius:2px; overflow:hidden; }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--ink);
    font:inherit; font-size:11px; padding:7px 10px; cursor:pointer; border-right:1px solid var(--hair); white-space:nowrap; }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ color:var(--paper); background:var(--ink); }
  .seg.lanes button[aria-pressed="true"]{ color:var(--ink); background:transparent; box-shadow:inset 0 -2px 0 currentColor; }
  .seg.lanes button{ font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  /* Tooltips. A native title= arrives late and lands wherever the OS puts it; these follow
     the control they describe and get out of the way on click. */
  .tip{ position:fixed; z-index:60; display:none; max-width:246px; padding:8px 10px; border-radius:7px;
    background:var(--panel); border:1px solid var(--hair); color:var(--ink);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.5);
    font-size:10.5px; line-height:1.55; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }
  /* The LFO's lane pills are on/off switches, not a "which one am I editing" tab. An
     underline is what the lane tabs use for that other meaning, so these fill instead. */

  select{ appearance:none; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 24px 7px 10px; border-radius:2px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  /* Knobs. The real <input type=range> stays in the DOM driving all the existing wiring —
     it's just visually replaced, so listeners and readouts are untouched. */
  .knob{ position:relative; width:46px; height:46px; flex:none; touch-action:none; cursor:ns-resize; }
  .knob input[type=range]{ position:absolute; inset:0; width:100%; height:100%;
    opacity:0; margin:0; pointer-events:none; }
  .knob svg{ display:block; width:46px; height:46px; overflow:visible; }
  .knob .k-tr{ fill:none; stroke:var(--track); stroke-width:3; stroke-linecap:round; }
  .knob .k-vl{ fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round;
    transition:stroke-dasharray .04s linear; }
  .knob .k-hub{ fill:var(--cell); stroke:var(--hair); stroke-width:1; }
  .knob .k-pt{ stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
  .knob:focus-visible{ outline:none; }
  .knob:focus-visible .k-hub{ stroke:var(--ink); }
  .knob.drag .k-vl{ stroke-width:3.6; }
  .knobrow{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .kcell{ display:flex; flex-direction:column; align-items:center; gap:5px; width:46px; }
  .kcell .klab{ text-transform:uppercase; letter-spacing:.1em; font-size:9px; line-height:1.15;
    color:var(--mute); text-align:center; white-space:nowrap; }
  .kcell .kval{ font-size:9px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; }
  .btn{ appearance:none; background:var(--cell); border:1px solid var(--hair);
    color:var(--ink); font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 12px; cursor:pointer; border-radius:2px; }
  .btn[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  input[type=text]{ width:100%; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 9px; border-radius:2px; }
  input[type=text]::placeholder{ color:var(--mute); }

  /* step editor — a row of cells for the active lane; click one to set its note */

  #veil{ position:fixed; inset:0; z-index:30; background:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer; text-align:center; padding:24px; }
  #veil h1{ font-weight:300; font-size:15px; letter-spacing:.4em; text-transform:uppercase; margin:0; }
  #veil p{ max-width:38ch; font-size:12px; line-height:1.8; color:var(--mute); margin:0; }
  #veil .orb{ width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(90,140,255,.85), rgba(150,60,255,.5) 45%, transparent 72%);
    filter:blur(3px); animation:pulse 5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(.9); opacity:.7; } 50%{ transform:scale(1.08); opacity:1; } }

  /* Fractal's own */
  #hint{ position:fixed; left:16px; bottom:14px; z-index:5; pointer-events:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; letter-spacing:.04em; color:var(--mute); }
  #hint b{ color:var(--ink); font-weight:600; }
  body.fs #hint{ display:none; }
  #stagewrap{ top:0 !important; }
  #stage{ display:block; width:100%; height:100%; }
  .opal-topbar, .opal-subhead{ -webkit-backdrop-filter:blur(22px) saturate(150%);
    backdrop-filter:blur(22px) saturate(150%); background:rgba(9,10,16,.5) !important;
    border-bottom-color:rgba(255,255,255,.08) !important; }
  .opal-brand{ color:#f2f4f8 !important; } .opal-subhead__name{ color:#f2f4f8; }
  .opal-brand .opal-product, .opal-subhead__desc, .opal-subhead__ver{ color:rgba(255,255,255,.5); }
  .opal-brand .opal-divider{ background:rgba(255,255,255,.2); }
  .rail{ top:0 !important; padding-top:calc(var(--top) + 8px); }
  .rowhint{ opacity:.72; }
  .cin{ display:flex; align-items:center; gap:8px; }
  .cin input[type=color]{ width:30px; height:26px; border:1px solid var(--hair); background:none; border-radius:4px; padding:0; cursor:pointer; }
  .cin label{ font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--mute); }
  .swatches{ display:flex; gap:6px; } .swatches .cin{ flex:1; justify-content:center; }
  select.sel{ width:100%; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 9px; border-radius:2px; }
  #looks{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #err{ position:fixed; left:16px; top:calc(var(--top) + 12px); right:16px; z-index:9; display:none; white-space:pre-wrap;
    background:rgba(60,12,16,.94); border:1px solid #d4545a; color:#ffd9db; padding:10px 12px; border-radius:8px;
    font-family:ui-monospace,Menlo,monospace; font-size:11px; max-height:56vh; overflow:auto; }
</style>
</head>
<body>

<div id="stagewrap"><canvas id="stage"></canvas></div>
<div id="err"></div>
<div id="hint"></div>
<div id="bar">
  <button class="icon" id="themeBtn" aria-label="light or dark" title="Light / dark">&#9681;</button>
  <button class="icon" id="playBtn" aria-label="play or pause" title="Play / pause &#183; space" aria-pressed="true"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><rect x="2.6" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/><rect x="6.9" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/></svg></button>
  <button class="icon" id="fsBtn" aria-label="full screen" title="Full screen &#8212; canvas only">&#9974;</button>
  <button class="icon" id="toggle" aria-label="controls" aria-pressed="false" title="Controls">&#183;&#183;&#183;</button>
</div>
<button class="icon" id="exitFs" aria-label="exit full screen" title="Exit (Esc)">&#10005;</button>

<div id="rail" class="rail rail-l"></div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name: 'Fractal', desc: 'Reflective raymarched fractals', version: 'v1', about: 'A raymarched, distance-estimated fractal — Mandelbulb, Mandelbox, Menger or an extruded Julia slab — lit like a polished object in a procedural studio. Bevel it, make it shiny, colour it from the orbit trap, set it turning, and export a still or a loop.' });</script>
<script src="./main.js" type="module"></script>
