<style>
  /* Layout only. Every token and control — buttons, sliders, fields, islands, the size
     dock — is owned by shared/OPALAB.css, which loads last. */
  :root{ --top:120px; --rail:290px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:var(--font, 'IBM Plex Sans', system-ui, -apple-system, sans-serif); overflow:hidden; }
  /* the canvas area: the grey mat right of the rail, with the artboard centred on it */
  #stagewrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; padding:28px; }
  #stage{ display:block; max-width:100%; max-height:100%; touch-action:none; }

  /* Full-screen: canvas only. Everything chrome-like steps out of the way. */
  body.fs .rail, body.fs .opal-topbar, body.fs .opal-subhead{ display:none !important; }
  body.fs #stagewrap{ top:0; left:0; padding:0; }
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; opacity:0; transition:opacity .25s ease; }
  body.fs #exitFs{ display:flex; }
  body.fs.hint #exitFs{ opacity:1; }

  @media (max-width:560px){ :root{ --top:112px; } }

  #status{ position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    color:var(--mute); display:none; }

  /* the floating control strip is retired — its buttons now live in the rail's View section */
  .icon{ appearance:none; width:34px; height:34px; border:1px solid var(--hair);
    background:var(--cell); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; }
  .icon svg{ display:block; }
  /* Sits below the size dock, clear of the artwork. Stays put in full screen so a
     recording always shows its own timer. */
  #recDot{ position:fixed; top:calc(var(--top) + 64px); left:calc(var(--rail) + 16px); z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; border:1px solid var(--hair); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px;height:7px;border-radius:50%;background:var(--rec); animation:blink 1s infinite; flex:none; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; }
  body.fs #recDot{ top:14px; }
  @keyframes blink{ 50%{opacity:.2;} }

  /* The left rail. Position + layout only — OPALAB.css paints it and its islands. */
  .rail{ position:fixed; top:var(--top); bottom:0; width:var(--rail); z-index:6;
    overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
  .rail-l{ left:0; }
  .rail-r{ right:0; }
  .row{ display:flex; flex-direction:column; align-items:stretch; gap:13px; }
  /* Section heads fold their section away — nine sections is a lot to scroll past
     when you only want two of them. */
  .rowhead{ color:var(--ink); padding-bottom:2px;
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    width:100%; background:none; border:0; font-family:inherit; text-align:left; }
  .rowhint{ margin:0 0 2px; line-height:1.5; color:var(--mute); }
  .rowhead::before{ content:''; width:0; height:0; flex:none;
    border-left:4px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .18s ease; opacity:.65; }
  .row.folded .rowhead::before{ transform:rotate(0deg); }
  .row.folded > *:not(.rowhead){ display:none; }
  .grp{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .rail input[type=range]{ width:100%; }
  .rail select{ width:100%; }
  .rail .seg{ width:100%; }
  .rail .seg button{ flex:1; text-align:center; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .rail.open{ transform:none; }

  .grp > label{ line-height:1.25; color:var(--mute); white-space:normal; }
  .grp > label b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  /* seg / select / .btn / fields are owned by OPALAB.css */

  #hint{ position:fixed; left:calc(var(--rail) + 16px); bottom:14px; z-index:5; pointer-events:none;
    font-family:var(--mono); font-size:12px; color:var(--mute); }
  #hint b{ color:var(--ink); font-weight:500; } body.fs #hint{ display:none; }
  select.sel{ width:100%; }
  .cin{ display:flex; align-items:center; gap:8px; }
  .cin label{ color:var(--mute); }
  .swatches{ display:flex; gap:8px; } .swatches .cin{ flex:1; }

<script>Opal.mountTopbar({ name:'Letter Strings', desc:'Strings of characters, blown by a wind you control', version:'v1', about:'Lines of text become little ropes of characters. Blow them with a wind that swings back and forth, wrap them onto a cylinder, sphere or 3D box, or switch to Clock mode where hands fling the letters. Colour individual words, upload your own font, drag to push. Export a still or the motion.' });</script>
<script>
'use strict';
(function(){
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const stage=document.getElementById('stage'), sctx=stage.getContext('2d');
const comp=document.createElement('canvas'), cctx=comp.getContext('2d');

const FONTS={ mono:'ui-monospace,"SFMono-Regular",Menlo,monospace', sans:'ui-sans-serif,Inter,Arial,sans-serif', serif:'"Bodoni Moda",Georgia,"Times New Roman",serif', custom:'"LS-Custom",ui-monospace,monospace' };
const P={
  aspect:'9:16', longEdge:1400,
  text:'function main(){ const strings = wind.blow(letters); return strings.map(s => s.sway()); }  the quick brown fox jumps over the lazy dog  ',
  mode:'wind', orient:'vertical', shape:'curtain', font:'mono',
  density:46, spacing:15, size:13,
  pin:'start', gravity:0.05, damping:0.94, stiffness:2,
  wind:0.55, windDir:0, sway:0.6, swayRate:0.5, turb:0.8, turbScale:24, gust:0.5,
  hands:3, handSpeed:1.0, handLen:0.9, throwForce:7, spring:0.03, showFace:1,
  colors:[],
  ink:'#15151c', bg:'#f4f3ee', follow:1, transparent:0,
  play:true,
};
let strands=[], nodes=[], clock=0, t0=performance.now();
let drag=null;   // {x,y,px,py}

// ---------------- geometry ----------------
function aspectWH(){ const [a,b]=P.aspect.split(':').map(Number), L=P.longEdge; return a>=b?[L,Math.round(L*b/a)]:[Math.round(L*a/b),L]; }
function CW(){ return aspectWH()[0]; } function CH(){ return aspectWH()[1]; }
// The artboard letterboxes inside #stagewrap (the grey mat right of the rail): the canvas
// ELEMENT carries the artwork's aspect, so it reads as a board on the mat like every tool.
function resize(){ const wrap=document.getElementById('stagewrap'); if(!wrap) return;
  const box=wrap.getBoundingClientRect(), PAD=56;                       // #stagewrap padding, both sides
  const W=comp.width||CW(), H=comp.height||CH();
  const s=Math.min(Math.max(40,box.width-PAD)/W, Math.max(40,box.height-PAD)/H);
  stage.style.width=(W*s)+'px'; stage.style.height=(H*s)+'px';
  const d=Math.min(devicePixelRatio||1,2);
  stage.width=Math.max(1,Math.round(W*s*d)); stage.height=Math.max(1,Math.round(H*s*d)); }
addEventListener('resize',resize);

// ---------------- noise ----------------
function hash(x,y,z){ const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y,z){ const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const x00=lerp(hash(xi,yi,zi),hash(xi+1,yi,zi),u), x10=lerp(hash(xi,yi+1,zi),hash(xi+1,yi+1,zi),u);
  const x01=lerp(hash(xi,yi,zi+1),hash(xi+1,yi,zi+1),u), x11=lerp(hash(xi,yi+1,zi+1),hash(xi+1,yi+1,zi+1),u);
  return lerp(lerp(x00,x10,v),lerp(x01,x11,v),w); }

// tokenize into word / non-word segments (newlines → spaces)
function tokenize(text){ const t=(text||' ').replace(/\n/g,' '); const isW=c=>/[A-Za-z0-9]/.test(c); const segs=[]; let i=0;
  while(i<t.length){ const w=isW(t[i]); let j=i; while(j<t.length && isW(t[j])===w) j++; segs.push({w,s:t.slice(i,j)}); i=j; }
  if(!segs.length) segs.push({w:false,s:' '}); return segs; }
// a stream of {ch,color} cycling the text; a coloured word only stays coloured for its first `count` occurrences
function buildStream(need){ const segs=tokenize(P.text), rules=(P.colors||[]).filter(r=>r.word&&r.word.trim());
  const used=rules.map(()=>0), out=[]; let ti=0, guard=0;
  while(out.length<need && guard++<need*4+1000){ const seg=segs[ti%segs.length];
    let col=null; if(seg.w){ for(let ri=0;ri<rules.length;ri++){ if(rules[ri].word.trim().toUpperCase()===seg.s.toUpperCase()){ if(used[ri]<rules[ri].count){ col=rules[ri].color; used[ri]++; } break; } } }
    for(const ch of [...seg.s]){ if(out.length<need) out.push({ch,color:col}); }
    ti++; }
  while(out.length<need) out.push({ch:' ',color:null}); return out; }

// ---------------- build ----------------
function build(){
  const W=CW(), H=CH(); comp.width=W; comp.height=H; resize();
  strands=[]; nodes=[];
  const m=Math.max(24,P.size*1.6);
  if(is3D()){ build3D(P.shape); return; }
  if(P.mode==='wind'){
    const vert=P.orient==='vertical';
    const crossSpan=(vert?W:H)-2*m, mainSpan=(vert?H:W)-2*m;
    const count=Math.max(1,P.density|0), nPer=Math.max(2,Math.floor(mainSpan/P.spacing)+1);
    for(let s=0;s<count;s++){ const cpos=m+crossSpan*(count===1?0.5:s/(count-1)); const strand=[];
      for(let j=0;j<nPer;j++){ const mp=m+j*P.spacing; const x=vert?cpos:mp, y=vert?mp:cpos;
        const nd={x,y,ox:x,oy:y,ch:' ',col:null,pin:false,hx:x,hy:y}; strand.push(nd); nodes.push(nd); }
      if(P.pin==='start'||P.pin==='both') strand[0].pin=true;
      if(P.pin==='both') strand[strand.length-1].pin=true;
      strand.aA={x:strand[0].x,y:strand[0].y}; strand.aB={x:strand[strand.length-1].x,y:strand[strand.length-1].y};
      strands.push(strand); }
  } else {
    const gx=P.spacing, gy=P.spacing*1.35; const cols=Math.max(1,Math.floor((W-2*m)/gx)), rows=Math.max(1,Math.floor((H-2*m)/gy));
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const x=m+c*gx+gx*0.5, y=m+r*gy+gy*0.5;
      nodes.push({x,y,ox:x,oy:y,ch:' ',col:null,pin:false,hx:x,hy:y}); }
  }
  const stream=buildStream(nodes.length);
  for(let i=0;i<nodes.length;i++){ nodes[i].ch=stream[i].ch; nodes[i].col=stream[i].color; }
}

// ---------------- wind ----------------
function windAt(x,y,t){ const a=P.windDir*Math.PI/180;
  let mag=P.wind; if(P.sway>0) mag=P.wind*((1-P.sway)+P.sway*Math.sin(t*P.swayRate*0.03)); // back-and-forth swing
  let wx=Math.cos(a)*mag, wy=Math.sin(a)*mag;
  if(P.turb>0){ const s=P.turbScale/1000, n=vnoise(x*s,y*s,t*0.01*P.gust)*2-1, ang=n*Math.PI*2.5;
    wx+=Math.cos(ang)*P.turb; wy+=Math.sin(ang)*P.turb; }
  return [wx,wy]; }

// ---------------- 3D shapes (curtain wraps onto a rotating solid) ----------------
let angY=0, angX=0;
function is3D(){ return P.mode==='wind' && P.shape!=='curtain'; }
function build3D(shape){ const W=comp.width,H=comp.height, R=Math.min(W,H)*0.32; nodes=[]; strands=[];
  const mk=(x,y,z)=>({x3:x,y3:y,z3:z,ch:' ',col:null,sx:0,sy:0,sc:1,alpha:1});
  const N=Math.max(6,Math.min(80,P.density|0));
  if(shape==='cylinder'){ const around=N, tall=Math.max(4,Math.floor(N*H/W*1.1));
    for(let v=0;v<tall;v++) for(let u=0;u<around;u++){ const a=u/around*TAU; nodes.push(mk(R*Math.cos(a),(v/(tall-1)-0.5)*R*2.4,R*Math.sin(a))); } }
  else if(shape==='sphere'){ const lat=Math.max(6,Math.floor(N*0.7)), lon=N;
    for(let i=0;i<lat;i++){ const th=(i+0.5)/lat*Math.PI, rr=Math.sin(th), cnt=Math.max(3,Math.round(lon*rr));
      for(let j=0;j<cnt;j++){ const ph=j/cnt*TAU; nodes.push(mk(R*rr*Math.cos(ph),R*Math.cos(th),R*rr*Math.sin(ph))); } } }
  else { const g=Math.max(3,Math.floor(N/2.4)), s=R*1.05, F=[['z',s],['z',-s],['x',s],['x',-s],['y',s],['y',-s]];
    for(const [ax,d] of F) for(let a=0;a<g;a++) for(let b=0;b<g;b++){ const u=(a/(g-1)-0.5)*2*s, w=(b/(g-1)-0.5)*2*s;
      let x,y,z; if(ax==='z'){x=u;y=w;z=d;} else if(ax==='x'){x=d;y=u;z=w;} else {x=u;y=d;z=w;} nodes.push(mk(x,y,z)); } }
  const stream=buildStream(nodes.length); for(let i=0;i<nodes.length;i++){ nodes[i].ch=stream[i].ch; nodes[i].col=stream[i].color; }
}
function step3D(){ const t=clock, W=comp.width,H=comp.height;
  let sp=(0.006+P.wind*0.02); if(P.sway>0) sp = sp*((1-P.sway)+P.sway*Math.sin(t*P.swayRate*0.03));   // wind spins it; sway rocks it
  angY+=sp; angX=Math.sin(t*0.006)*0.22;
  const cy=Math.cos(angY),sy=Math.sin(angY),cx=Math.cos(angX),sx=Math.sin(angX), f=Math.min(W,H)*1.15, cxp=W/2, cyp=H/2, R=Math.min(W,H)*0.5;
  for(const nd of nodes){ let x=nd.x3,y=nd.y3,z=nd.z3;
    if(P.turb>0){ const s=0.006, W1=(vnoise(x*s+t*0.01,y*s,z*s)*2-1)*P.turb*7; x+=W1; y+=(vnoise(y*s,z*s+3.1,t*0.011)*2-1)*P.turb*7; }
    let x1=x*cy-z*sy, z1=x*sy+z*cy, y1=y*cx-z1*sx, z2=y*sx+z1*cx;
    const persp=f/(f+z2+R); nd.sx=cxp+x1*persp; nd.sy=cyp+y1*persp; nd.sc=persp; nd.alpha=clamp(0.28+persp*0.95,0,1); }
  nodes.sort((a,b)=>a.sc-b.sc); }
function draw3D(){ const W=comp.width,H=comp.height; cctx.setTransform(1,0,0,1,0,0);
  if(P.transparent) cctx.clearRect(0,0,W,H); else { cctx.fillStyle=P.bg; cctx.fillRect(0,0,W,H); }
  cctx.textAlign='center'; cctx.textBaseline='middle'; const fam=FONTS[P.font]||FONTS.mono;
  for(const nd of nodes){ const sz=Math.max(1,P.size*nd.sc); cctx.font=`${sz.toFixed(1)}px ${fam}`; cctx.globalAlpha=nd.alpha; cctx.fillStyle=nd.col||P.ink; cctx.fillText(nd.ch,nd.sx,nd.sy); }
  cctx.globalAlpha=1; }

let handAng=[0,0,0,0,0];
function step(){
  const t=clock, W=comp.width, H=comp.height;
  if(is3D()){ step3D(); clock++; return; }
  if(P.mode==='wind'){
    for(const nd of nodes){ if(nd.pin) continue;
      let vx=(nd.x-nd.ox)*P.damping, vy=(nd.y-nd.oy)*P.damping; nd.ox=nd.x; nd.oy=nd.y;
      const [wx,wy]=windAt(nd.x,nd.y,t); nd.x+=vx+wx; nd.y+=vy+wy+P.gravity; }
    applyDrag();
    const it=Math.max(1,P.stiffness|0);
    for(let k=0;k<it;k++) for(const strand of strands){
      for(let i=0;i<strand.length-1;i++){ const a=strand[i],b=strand[i+1];
        let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1e-4,diff=(d-P.spacing)/d;
        const mA=a.pin?0:(b.pin?1:0.5), mB=b.pin?0:(a.pin?1:0.5);
        a.x+=dx*diff*mA; a.y+=dy*diff*mA; b.x-=dx*diff*mB; b.y-=dy*diff*mB; }
      if(strand[0].pin){ strand[0].x=strand.aA.x; strand[0].y=strand.aA.y; }
      if(strand[strand.length-1].pin){ strand[strand.length-1].x=strand.aB.x; strand[strand.length-1].y=strand.aB.y; } }
    softBounds();
  } else {
    // clock hands throw the field
    const cx=W/2, cy=H/2, R=Math.min(W,H)*0.5*P.handLen;
    const speeds=[1, 1/12, 1/60, 1/6, 1/30];   // second-ish, hour-ish, etc — varied
    const nh=Math.max(1,Math.min(5,P.hands|0)); const prev=handAng.slice();
    for(let h=0;h<nh;h++) handAng[h]+=speeds[h]*P.handSpeed*0.06;
    for(const nd of nodes){
      let vx=(nd.x-nd.ox)*P.damping, vy=(nd.y-nd.oy)*P.damping; nd.ox=nd.x; nd.oy=nd.y;
      // spring home
      vx+=(nd.hx-nd.x)*P.spring; vy+=(nd.hy-nd.y)*P.spring;
      // hand sweeps
      const rx=nd.x-cx, ry=nd.y-cy, rr=Math.hypot(rx,ry);
      if(rr<R){ for(let h=0;h<nh;h++){ const ha=handAng[h], hd=Math.atan2(ry,rx);
        let da=((hd-ha+Math.PI)%TAU+TAU)%TAU-Math.PI;           // angular gap to hand
        const band=0.16/(1+rr/80);
        if(Math.abs(da)<band){ const dir=Math.sign(P.handSpeed)||1;
          const tx=-Math.sin(ha)*dir, ty=Math.cos(ha)*dir, f=P.throwForce*(0.4+rr/R);
          vx+=tx*f; vy+=ty*f; } } }
      nd.x+=vx; nd.y+=vy+P.gravity;
    }
    applyDrag(); softBounds();
  }
  clock++;
}
function applyDrag(){ if(!drag) return; const dx=drag.x-drag.px, dy=drag.y-drag.py, rad=Math.max(40,P.spacing*6), r2=rad*rad;
  for(const nd of nodes){ if(nd.pin) continue; const ex=nd.x-drag.x, ey=nd.y-drag.y, d2=ex*ex+ey*ey;
    if(d2<r2){ const f=(1-d2/r2); nd.x+=dx*f*0.6; nd.y+=dy*f*0.6; } }
  drag.px=drag.x; drag.py=drag.y; }
function softBounds(){ const W=comp.width,H=comp.height,m=6;
  for(const nd of nodes){ if(nd.x<m){ nd.x=m; nd.ox=nd.x+(nd.ox-nd.x)*0.5; } if(nd.x>W-m){ nd.x=W-m; nd.ox=nd.x+(nd.ox-nd.x)*0.5; }
    if(nd.y<m){ nd.y=m; nd.oy=nd.y+(nd.oy-nd.y)*0.5; } if(nd.y>H-m){ nd.y=H-m; nd.oy=nd.y+(nd.oy-nd.y)*0.5; } } }

// ---------------- draw ----------------
function draw(){
  if(is3D()){ draw3D(); return; }
  const W=comp.width,H=comp.height; cctx.setTransform(1,0,0,1,0,0);
  if(P.transparent) cctx.clearRect(0,0,W,H); else { cctx.fillStyle=P.bg; cctx.fillRect(0,0,W,H); }
  cctx.fillStyle=P.ink; cctx.strokeStyle=P.ink;
  cctx.font=`${P.size}px ${FONTS[P.font]||FONTS.mono}`; cctx.textAlign='center'; cctx.textBaseline='middle';
  if(P.mode==='clock' && P.showFace){ drawClock(W,H); }
  if(P.mode==='wind' && P.follow){
    for(const strand of strands) for(let i=0;i<strand.length;i++){ const nd=strand[i];
      const p=strand[Math.max(0,i-1)], q=strand[Math.min(strand.length-1,i+1)];
      let ang=Math.atan2(q.y-p.y,q.x-p.x)-(P.orient==='vertical'?Math.PI/2:0);
      cctx.fillStyle=nd.col||P.ink; cctx.save(); cctx.translate(nd.x,nd.y); cctx.rotate(ang); cctx.fillText(nd.ch,0,0); cctx.restore(); }
  } else { for(const nd of nodes){ cctx.fillStyle=nd.col||P.ink; cctx.fillText(nd.ch,nd.x,nd.y); } }
}
function drawClock(W,H){ const cx=W/2,cy=H/2,R=Math.min(W,H)*0.5*P.handLen;
  cctx.save(); cctx.globalAlpha=0.28; cctx.lineWidth=Math.max(1,P.size*0.09);
  cctx.beginPath(); cctx.arc(cx,cy,R,0,TAU); cctx.stroke();
  for(let i=0;i<12;i++){ const a=i/12*TAU-Math.PI/2; cctx.beginPath(); cctx.moveTo(cx+Math.cos(a)*R*0.94,cy+Math.sin(a)*R*0.94); cctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R); cctx.stroke(); }
  cctx.globalAlpha=0.85; const nh=Math.max(1,Math.min(5,P.hands|0));
  for(let h=0;h<nh;h++){ const ha=handAng[h], len=R*(0.9-h*0.12); cctx.lineWidth=Math.max(1.5,P.size*0.18*(1-h*0.12));
    cctx.beginPath(); cctx.moveTo(cx,cy); cctx.lineTo(cx+Math.cos(ha)*len,cy+Math.sin(ha)*len); cctx.stroke(); }
  cctx.beginPath(); cctx.arc(cx,cy,Math.max(2,P.size*0.25),0,TAU); cctx.fill(); cctx.restore(); }

function blit(){ const sw=stage.width,sh=stage.height; sctx.setTransform(1,0,0,1,0,0);
  const paper=getComputedStyle(document.body).getPropertyValue('--paper').trim()||'#111';
  sctx.fillStyle=paper; sctx.fillRect(0,0,sw,sh); if(!comp.width) return;
  const sc=Math.min(sw/comp.width,sh/comp.height), dw=comp.width*sc, dh=comp.height*sc, ox=(sw-dw)/2, oy=(sh-dh)/2;
  sctx.drawImage(comp,ox,oy,dw,dh);
  compRect={ox,oy,sc}; }
let compRect={ox:0,oy:0,sc:1};

let fps=0,fa=0,fn=0;
function tick(){ const now=performance.now(),dt=Math.min(0.05,(now-t0)/1000); t0=now;
  if(P.play){ step(); } draw(); blit();
  fa+=dt; fn++; if(fa>=0.5){ fps=fn/fa; fa=0; fn=0; const h=document.getElementById('hint'); if(h) h.innerHTML=`<b>${nodes.length}</b> chars &#183; <b>${fps.toFixed(0)}</b> fps &#183; ${comp.width}&#215;${comp.height}`; }
  requestAnimationFrame(tick); }

// ---------------- pointer (drag = local gust) ----------------
function toComp(e){ const r=stage.getBoundingClientRect(), x=(e.clientX-r.left)*stage.width/r.width, y=(e.clientY-r.top)*stage.height/r.height;
  return [ (x-compRect.ox)/compRect.sc, (y-compRect.oy)/compRect.sc ]; }
stage.addEventListener('pointerdown',e=>{ const [x,y]=toComp(e); drag={x,y,px:x,py:y}; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',e=>{ if(!drag)return; const [x,y]=toComp(e); drag.x=x; drag.y=y; });
addEventListener('pointerup',()=>{ drag=null; }); addEventListener('pointercancel',()=>{ drag=null; });

// ---------------- panel ----------------
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
let refs=[];
function buildPanel(){
  const host=document.getElementById('rail'); host.innerHTML=''; refs=[];
  const grp=(title,hint)=>{ const g=el('div','row'); const h=el('button','rowhead',title); h.type='button'; h.setAttribute('aria-expanded','true'); g.appendChild(h); if(hint)g.appendChild(el('p','rowhint',hint)); host.appendChild(g); return g; };
  const duo=g=>{ const d=el('div','duo'); g.appendChild(d); return d; };
  const when=(node,expr)=>{ node.dataset.when=expr; return node; };
  const slider=(g,key,label,min,max,step,fmt,rebuild)=>{ const gr=el('div','grp'); const v=el('b',null,(fmt?fmt(P[key]):P[key])); const lab=el('label',null,label+' '); lab.appendChild(v);
    const r=el('input'); r.type='range'; r.min=min; r.max=max; r.step=step; r.value=P[key];
    r.oninput=()=>{ P[key]=(String(step).indexOf('.')>=0)?parseFloat(r.value):parseInt(r.value); v.textContent=fmt?fmt(P[key]):P[key]; if(rebuild) build(); };
    gr.appendChild(lab); gr.appendChild(r); g.appendChild(gr); refs.push({key,r,v,fmt}); return gr; };
  const seg=(g,key,label,opts,rebuild)=>{ const gr=el('div','grp'); if(label)gr.appendChild(el('label',null,label)); const s=el('div','seg');
    opts.forEach(o=>{ const b=el('button',null,o.t); b.setAttribute('aria-pressed',String(P[key]==o.v)); b.onclick=()=>{ P[key]=o.v; [...s.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b))); if(rebuild)build(); refreshGate(); }; s.appendChild(b); });
    gr.appendChild(s); g.appendChild(gr); refs.push({key,seg:s,opts,kind:'seg'}); return gr; };
  const select=(g,key,label,opts,rebuild)=>{ const gr=el('div','grp'); if(label)gr.appendChild(el('label',null,label)); const s=el('select','sel');
    opts.forEach(o=>{ const op=el('option',null,o.t); op.value=o.v; s.appendChild(op); }); s.value=P[key]; s.onchange=()=>{ P[key]=s.value; if(rebuild)build(); refreshGate(); }; gr.appendChild(s); g.appendChild(gr); refs.push({key,sel:s,kind:'sel'}); return gr; };
  const color=(key,label)=>{ const cin=el('div','cin'); const inp=el('input'); inp.type='color'; inp.value=P[key]; inp.oninput=()=>{ P[key]=inp.value; }; cin.appendChild(inp); cin.appendChild(el('label',null,label)); refs.push({key,inp,kind:'color'}); return cin; };

  const gT=grp('Text','The characters that fill the strings. It cycles through them.');
  const ta=el('textarea'); ta.value=P.text; ta.rows=3; ta.style.cssText='width:100%;box-sizing:border-box;font:13px var(--mono)'; ta.oninput=()=>{ P.text=ta.value; build(); }; gT.appendChild(ta);
  select(gT,'font','Typeface',[{t:'Mono',v:'mono'},{t:'Sans',v:'sans'},{t:'Serif',v:'serif'},{t:'Custom (uploaded)',v:'custom'}]);
  const fb=el('button','btn','Upload font (.ttf/.otf/.woff)'); fb.style.cssText='width:100%;margin-top:6px'; fb.onclick=()=>document.getElementById('fontFile').click(); gT.appendChild(fb);

  const gCo=grp('Colours','Give a word its own colour — and how many times, from the start, it stays coloured. e.g. the month once, the city once.');
  const list=el('div'); list.id='colorList'; gCo.appendChild(list);
  const ab=el('button','btn','+ Add colour'); ab.style.width='100%'; ab.onclick=()=>{ P.colors.push({word:'',color:'#e0342b',count:1}); renderColorRules(); build(); }; gCo.appendChild(ab);
  renderColorRules();

  const gM=grp('Mode','Wind blows the strings; Clock throws them with rotating hands.');
  seg(gM,'mode','Mode',[{t:'Wind',v:'wind'},{t:'Clock',v:'clock'}],true);
  when(select(gM,'shape','Shape',[{t:'Curtain (flat)',v:'curtain'},{t:'Cylinder',v:'cylinder'},{t:'Sphere',v:'sphere'},{t:'3D Box',v:'box'}],true),'mode:wind');
  when(seg(gM,'orient','Reading',[{t:'Vertical',v:'vertical'},{t:'Horizontal',v:'horizontal'}],true),'mode:wind');
  when(seg(gM,'pin','Pinned',[{t:'Start',v:'start'},{t:'Both',v:'both'},{t:'None',v:'none'}],true),'mode:wind');

  const gL=grp('Layout','How dense and how big.');
  const l1=duo(gL); slider(l1,'density','Strings',4,140,1,v=>v|0,true); slider(l1,'spacing','Spacing',6,40,1,v=>(v|0)+'px',true);
  slider(gL,'size','Char size',6,40,1,v=>(v|0)+'px');

  const gW=grp('Wind','A steady breeze that swings back and forth, plus gusts you can crank.'); when(gW,'mode:wind');
  const w1=duo(gW); slider(w1,'wind','Strength',0,3,0.05,v=>(+v).toFixed(2)); slider(w1,'windDir','Direction',0,360,1,v=>(v|0)+'°');
  const w3=duo(gW); slider(w3,'sway','Back & forth',0,1,0.02,v=>(+v).toFixed(2)); slider(w3,'swayRate','Swing rate',0.05,2,0.05,v=>(+v).toFixed(2));
  const w2=duo(gW); slider(w2,'turb','Gust',0,3,0.05,v=>(+v).toFixed(2)); slider(w2,'turbScale','Gust scale',4,80,1,v=>v|0);
  slider(gW,'gust','Gust speed',0,2,0.02,v=>(+v).toFixed(2));

  const gC=grp('Clock','Rotating hands sweep and fling the letters.'); when(gC,'mode:clock');
  const c1=duo(gC); slider(c1,'hands','Hands',1,5,1,v=>v|0); slider(c1,'handSpeed','Hand speed',-3,3,0.05,v=>(+v).toFixed(2));
  const c2=duo(gC); slider(c2,'throwForce','Throw',0,20,0.2,v=>(+v).toFixed(1)); slider(c2,'spring','Return',0,0.12,0.002,v=>(+v).toFixed(3));
  const c3=duo(gC); slider(c3,'handLen','Reach',0.3,1.2,0.02,v=>(+v).toFixed(2)); seg(c3,'showFace','Face',[{t:'On',v:1},{t:'Off',v:0}]);

  const gP=grp('Physics','Weight and stiffness of the strings.');
  const p1=duo(gP); slider(p1,'gravity','Gravity',-0.2,0.4,0.005,v=>(+v).toFixed(3)); slider(p1,'damping','Damping',0.8,0.995,0.005,v=>(+v).toFixed(3));
  slider(gP,'stiffness','Stiffness',1,8,1,v=>v|0);

  const gS=grp('Style','Ink and plate.');
  const sr=el('div','swatches'); sr.appendChild(color('ink','Ink')); sr.appendChild(color('bg','Plate')); gS.appendChild(sr);
  seg(gS,'follow','Follow the curve',[{t:'On',v:1},{t:'Off',v:0}]);
  seg(gS,'transparent','Transparent PNG',[{t:'Off',v:0},{t:'On',v:1}]);

  const gCv=grp('Canvas','Output resolution.');
  slider(gCv,'longEdge','Long edge',720,1600,20,v=>v+' px',true);

  // Output — Record + Save live in the bottom-right #output panel
  document.getElementById('recBtn').onclick=toggleRec;   // Save is wired to the shared export panel via Opal.mountOutput
  const gE=grp('Motion','Re-settle the letters from scratch.');
  const rr=el('div',null,''); rr.style.cssText='display:flex;gap:6px'; const bReset=el('button','btn','Re-settle'); bReset.style.flex='1'; bReset.onclick=build; rr.appendChild(bReset); gE.appendChild(rr);

  // View — playback and full screen, moved off the floating bar into the rail
  const gV=grp('View','Playback and full screen.');
  const vbtn=(id,label)=>{ const b=el('button','btn',label); b.id=id; b.style.width='100%'; gV.appendChild(b); return b; };
  vbtn('playBtn','Pause');
  vbtn('fsBtn','Full screen');

  document.querySelectorAll('.rail input[type=range]').forEach(makeKnob);
  setupFolds(); setupTooltips(); refreshGate();
}
function refreshGate(){ document.querySelectorAll('#rail [data-when]').forEach(node=>{ const [k,vals]=node.dataset.when.split(':'); node.style.display=vals.split(',').includes(String(P[k]))?'':'none'; }); }
function syncPanel(){ refs.forEach(o=>{ if(o.r){ o.r.value=P[o.key]; o.v.textContent=o.fmt?o.fmt(P[o.key]):P[o.key]; if(o.r.repaintKnob)o.r.repaintKnob(); }
  else if(o.kind==='color'){ o.inp.value=P[o.key]; } else if(o.kind==='seg'){ [...o.seg.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(o.opts[i].v==P[o.key]))); } else if(o.kind==='sel'){ o.sel.value=P[o.key]; } }); refreshGate(); setPlayIcon(); }

// ---------------- shared shell scaffolding ----------------
function makeKnob(inp){ /* Flat sliders across the Lab — the rotary dial is retired; slider() already builds the flat control, so there is nothing to wrap. */ }
function paintKnob(k){ const inp=k.inp,mn=+inp.min,mx=+inp.max,v=+inp.value,f=(v-mn)/(mx-mn||1); const path=k.el.querySelector('.k-vl'),len=path.getTotalLength();
  path.style.strokeDasharray=len; path.style.strokeDashoffset=len*(1-f); const a=(-135+270*f)*Math.PI/180,pt=k.el.querySelector('.k-pt'); pt.setAttribute('x2',(22+Math.sin(a)*8).toFixed(2)); pt.setAttribute('y2',(22-Math.cos(a)*8).toFixed(2)); }
function setupFolds(){ const KEY='ls-folded'; const saved=new Set((()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}})());
  document.querySelectorAll('.rail .rowhead').forEach(h=>{ const row=h.closest('.row'); const name=h.textContent.trim();
    if(saved.has(name)){ row.classList.add('folded'); h.setAttribute('aria-expanded','false'); }
    h.addEventListener('click',()=>{ const f=row.classList.toggle('folded'); h.setAttribute('aria-expanded',String(!f));
      const cur=new Set((()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}})()); f?cur.add(name):cur.delete(name); try{localStorage.setItem(KEY,JSON.stringify([...cur]))}catch(e){} }); }); }
let tipEl=null,tipT=null,tipFor=null;
function setupTooltips(){ addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor)return; clearTimeout(tipT); if(!h){hideTip();return;} tipFor=h; tipT=setTimeout(()=>showTip(h),240); }); addEventListener('pointerdown',hideTip); addEventListener('scroll',hideTip,true); }
function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
function showTip(host){ const text=host.getAttribute('data-tip'); if(!text)return; if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
  tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0'; const r=host.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
  let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8,r.bottom+8); tipEl.style.left=Math.max(8,Math.min(r.left,innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
function setPlayIcon(){ const b=document.getElementById('playBtn'); if(!b)return; b.setAttribute('aria-pressed',String(P.play)); b.textContent=P.play?'Pause':'Play'; }
function setFs(on){ document.body.classList.toggle('fs',on); if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{}); else if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{}); }
function wireBar(){ document.getElementById('playBtn').onclick=()=>{ P.play=!P.play; setPlayIcon(); };
  document.getElementById('fsBtn').onclick=()=>setFs(!document.body.classList.contains('fs'));
  document.getElementById('exitFs').onclick=()=>setFs(false);
  // (the rail is always open now — the show/hide toggle was removed with the floating bar)
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&document.body.classList.contains('fs')) setFs(false); });
  setPlayIcon(); }

// ---------------- export ----------------
function savePNG(){ const a=document.createElement('a'); comp.toBlob(b=>{ a.href=URL.createObjectURL(b); a.download='letter-strings_'+comp.width+'x'+comp.height+'.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); },'image/png'); }
let rec=null, recChunks=[], countIv=null;
function pickMime(){ return ['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)); }
function setRecBtn(on){ const b=document.getElementById('recBtn'); if(!b)return; b.textContent=on?'Stop':'Record'; b.style.borderColor=on?'#ff4d5e':''; b.style.color=on?'#ff4d5e':''; }
function toggleRec(){ if(rec){ rec.stop(); return; } if(countIv){ clearInterval(countIv); countIv=null; document.getElementById('recDot').classList.remove('on'); setRecBtn(false); return; }
  const dot=document.getElementById('recDot'), b=dot.querySelector('b'); dot.classList.add('on'); setRecBtn(true); let c=3; b.textContent=c;
  countIv=setInterval(()=>{ c--; if(c>0){ b.textContent=c; } else { clearInterval(countIv); countIv=null; beginRec(); } },1000); }
function beginRec(){ const mime=pickMime(); if(!mime)return; const FPS=60, stream=comp.captureStream(FPS);
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(60000000,Math.max(24000000,Math.round(comp.width*comp.height*FPS*0.25)))}); recChunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
  rec.onstop=()=>{ const blob=new Blob(recChunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='letter-strings_'+comp.width+'x'+comp.height+'.'+(mime.indexOf('mp4')>=0?'mp4':'webm'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); rec=null; document.getElementById('recDot').classList.remove('on'); setRecBtn(false); };
  rec.start(); document.getElementById('recDot').querySelector('b').textContent='REC'; }

// ---------------- colour rules editor ----------------
function renderColorRules(){ const list=document.getElementById('colorList'); if(!list) return; list.innerHTML='';
  if(!P.colors.length){ const hint=el('p','rowhint','No coloured words yet.'); hint.style.margin='0 0 6px'; list.appendChild(hint); }
  P.colors.forEach((r,i)=>{ const row=el('div'); row.style.cssText='display:flex;gap:5px;align-items:center;margin-bottom:5px';
    const w=el('input'); w.type='text'; w.value=r.word; w.placeholder='word'; w.spellcheck=false; w.style.cssText='flex:1;min-width:0';
    w.oninput=()=>{ r.word=w.value; build(); };
    const c=el('input'); c.type='color'; c.value=r.color; c.style.cssText='flex:none'; c.oninput=()=>{ r.color=c.value; build(); };
    const n=el('input'); n.type='number'; n.min='1'; n.value=r.count; n.title='times coloured'; n.style.cssText='width:58px;flex:none'; n.oninput=()=>{ r.count=Math.max(1,parseInt(n.value)||1); build(); };
    const x=el('button'); x.innerHTML='&#10005;'; x.style.cssText='flex:none;width:26px;height:26px;padding:0;line-height:1'; x.onclick=()=>{ P.colors.splice(i,1); renderColorRules(); build(); };
    row.append(w,c,n,x); list.appendChild(row); }); }
function loadFontFile(f){ if(!f) return; const rd=new FileReader(); rd.onload=e=>{ const ff=new FontFace('LS-Custom', e.target.result);
  ff.load().then(face=>{ document.fonts.add(face); P.font='custom'; syncPanel(); const sel=document.querySelector('#rail select.sel'); }).catch(()=>{}); }; rd.readAsArrayBuffer(f); }

// ---------------- boot ----------------
const fontInp=document.createElement('input'); fontInp.type='file'; fontInp.id='fontFile'; fontInp.accept='.ttf,.otf,.woff,.woff2'; fontInp.hidden=true; document.body.appendChild(fontInp);
fontInp.addEventListener('change',e=>{ if(e.target.files[0]) loadFontFile(e.target.files[0]); });
resize(); build(); buildPanel(); wireBar();
try{ Opal.mountOutput(comp,'letter-strings'); }catch(e){}   // shared export panel (PNG/JPG/PDF · size · DPI) on the real artwork
requestAnimationFrame(tick);
document.getElementById('aspect').addEventListener('change', e=>{ P.aspect=e.target.value; build(); });
addEventListener('keydown',e=>{ if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return; if(e.key===' '){ e.preventDefault(); P.play=!P.play; setPlayIcon(); } if(e.key==='s'||e.key==='S'){ savePNG(); } });
})();

</script>
</body>
