<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>What Are People For — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  @font-face{ font-family:'UniversNextMed'; src:url('/shared/fonts/UniversNextPro-Medium.ttf') format('truetype'); font-weight:400; font-style:normal; font-display:swap; }
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100vh; height:100dvh; overflow:hidden; background:var(--paper); font-family:var(--font, 'IBM Plex Sans', system-ui, sans-serif); }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; background:var(--mat);
    display:flex; align-items:center; justify-content:center; padding:22px; }
  #art{ max-width:100%; max-height:100%; display:block; box-shadow:none; }
  #sizeDock{ display:flex; align-items:center; gap:10px; }
  #sizeDock #dimReadout{ font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); right:24px; z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; background:var(--rec); color:#fff; font:600 12px/1 var(--mono); letter-spacing:.06em; }
  #recDot.on{ display:flex; }
  #recDot i{ width:8px; height:8px; border-radius:50%; background:#fff; animation:rp 1s ease-in-out infinite; }
  @keyframes rp{ 50%{ opacity:.25; } }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rowhint{ font-size:12px; line-height:1.5; color:var(--mute); margin:0; }
</style>
  <link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body>
  <script src="/lab/shared/opal.js"></script>
  <script>Opal.mountTopbar({ name:'What Are People For', desc:'A question, drawn as a constellation',
    about:'A single character — a question mark, set in Univers Next Pro Medium — sampled into a field of points and wired into a network: every pair of points closer than the link distance is joined, so the glyph reads as a living constellation. Raise the point density, disperse the field into a drifting cloud, tighten or loosen the links, and it breathes and re-forms. Type any character, recolour ink and paper, re-seed the scatter. Seeded — a still and a recording match. Export a still, or record the drift.' });</script>
  <div id="sizeDock">
    <span id="dimReadout">1280 × 1600</span>
    <select id="aspect" title="Canvas size">
      <option value="1280/1600" selected>Portrait · 4:5</option>
      <option value="1080/1920">Story · 9:16</option>
      <option value="1400/1400">Square · 1:1</option>
      <option value="1600/1200">Landscape · 4:3</option>
      <option value="1600/900">Landscape · 16:9</option>
    </select>
  </div>
  <div id="recDot"><i></i><b>REC</b></div>

  <div id="dock">
    <div class="group">
      <div class="group__t">Engine</div>
      <select class="opal-input" id="engine">
        <option value="network" selected>Network / constellation</option>
      </select>
    </div>

    <div class="group">
      <div class="group__t">Character</div>
      <input class="opal-input" id="charIn" type="text" value="?" maxlength="4" spellcheck="false" autocomplete="off" style="text-align:center; font-size:16px;">
      <div class="rowhint">Univers Next Pro · Medium</div>
      <div class="knob"><label>Size <b id="sizeR">76</b></label><input id="size" type="range" min="20" max="98" value="76"></div>
    </div>

    <div class="group">
      <div class="group__t">Settings</div>
      <div class="knob"><label>Point density <b id="densR">58</b></label><input id="dens" type="range" min="20" max="100" value="58"></div>
      <div class="knob"><label>Dispersion <b id="dispR">90</b></label><input id="disp" type="range" min="0" max="320" value="90"></div>
      <div class="knob"><label>Link distance <b id="linkR">98</b></label><input id="link" type="range" min="10" max="180" value="98"></div>
    </div>

    <div class="group">
      <div class="group__t">Style</div>
      <div class="duo">
        <div class="knob"><label>Node <b id="nodeR">1.8</b></label><input id="node" type="range" min="0" max="80" value="18"></div>
        <div class="knob"><label>Line <b id="lineR">1.2</b></label><input id="line" type="range" min="2" max="40" value="12"></div>
      </div>
      <div class="knob"><label>Link opacity <b id="lopR">52</b></label><input id="lop" type="range" min="8" max="100" value="52"></div>
      <div class="crow"><label>Ink</label><input type="color" class="sw" id="ink" value="#141414"></div>
      <div class="crow"><label>Paper</label><input type="color" class="sw" id="paper" value="#f4f2ea"></div>
    </div>

    <div class="group">
      <div class="group__t">Motion</div>
      <div class="grid2"><button class="btn" id="reroll">Re-seed</button><button class="btn" id="playBtn" aria-pressed="true">Pause</button></div>
      <div class="duo">
        <div class="knob"><label>Pulse <b id="pulseR">45</b></label><input id="pulse" type="range" min="0" max="120" value="45"></div>
        <div class="knob"><label>Speed <b id="spdR">1.0</b></label><input id="spd" type="range" min="0" max="40" value="10"></div>
      </div>
    </div>
  </div>

  <div id="wrap"><canvas id="art" width="1280" height="1600"></canvas></div>

  <div class="group out" id="output" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div>
  </div>

  <script>
  (function(){
    const art=document.getElementById('art'), ctx=art.getContext('2d');
    const $=id=>document.getElementById(id);
    const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

    const P={ aspect:'1280/1600', seed:7, char:'?', size:76,
      dens:58, disp:90, link:98, node:1.8, line:1.2, lop:52,
      ink:'#141414', paper:'#f4f2ea', pulse:45, spd:1.0, play:true };

    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

    // ---- sample the glyph into a field of points ----
    const gc=document.createElement('canvas'), gx=gc.getContext('2d', {willReadFrequently:true});
    let pts=[], fontReady=false;
    function buildPoints(){
      const W=art.width, H=art.height; if(!W) return;
      gc.width=W; gc.height=H; gx.clearRect(0,0,W,H);
      gx.fillStyle='#fff'; gx.textAlign='center'; gx.textBaseline='middle';
      gx.font=(H*(P.size/100))+'px UniversNextMed';
      gx.fillText(P.char||'?', W/2, H*0.5);
      const id=gx.getImageData(0,0,W,H).data;
      const step=Math.max(6, Math.round(lerp(40,13, P.dens/100)));
      const rng=mulberry32((P.seed*2654435761)>>>0);
      const out=[]; const jit=step*0.42;
      for(let y=step*0.5;y<H;y+=step) for(let x=step*0.5;x<W;x+=step){
        if(id[((y|0)*W+(x|0))*4+3] > 128){
          out.push({ bx:x+(rng()*2-1)*jit, by:y+(rng()*2-1)*jit,
            dir:rng()*TAU, ph:rng()*TAU, mag:0.35+rng()*0.65, tw:rng() });
        }
      }
      pts=out;
    }

    // ---- render one frame ----
    function render(g, W, H, tm){
      const ink=P.ink, paper=P.paper;
      g.setTransform(1,0,0,1,0,0); g.fillStyle=paper; g.fillRect(0,0,W,H);
      if(!pts.length) return;
      const disp=P.disp*(W/1280), link=P.link*(W/1280), l2=link*link;
      const pulseAmt=P.pulse/100, spd=P.spd/10;

      // displaced positions (the pulse + drift)
      for(const p of pts){
        const pul = 1 + pulseAmt*Math.sin(tm*spd + p.ph)*0.9;
        const ang = p.dir + Math.sin(tm*0.3 + p.ph)*0.5;
        p.x = p.bx + Math.cos(ang)*p.mag*disp*pul;
        p.y = p.by + Math.sin(ang)*p.mag*disp*pul;
      }

      // spatial grid for fast neighbour links
      const cell=Math.max(8, link), gw=Math.ceil(W/cell)+1, cells=new Map();
      const key=(cx,cy)=>cx*100000+cy;
      for(let i=0;i<pts.length;i++){ const cx=(pts[i].x/cell)|0, cy=(pts[i].y/cell)|0, k=key(cx,cy);
        let a=cells.get(k); if(!a){ a=[]; cells.set(k,a); } a.push(i); }

      // links — one batched path at a set opacity (fast, even on a dense field)
      g.strokeStyle=ink; g.lineWidth=Math.max(0.4, P.line/10*(W/1280)); g.globalAlpha=P.lop/100; g.beginPath();
      for(let i=0;i<pts.length;i++){ const pi=pts[i], cx=(pi.x/cell)|0, cy=(pi.y/cell)|0;
        for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){ const a=cells.get(key(cx+ox,cy+oy)); if(!a) continue;
          for(const j of a){ if(j<=i) continue; const pj=pts[j], dx=pi.x-pj.x, dy=pi.y-pj.y;
            if(dx*dx+dy*dy<l2){ g.moveTo(pi.x,pi.y); g.lineTo(pj.x,pj.y); } } } }
      g.stroke(); g.globalAlpha=1;

      // nodes
      const nr=Math.max(0.4, P.node/10*(W/1280));
      g.fillStyle=ink;
      for(const p of pts){ g.beginPath(); g.arc(p.x,p.y,nr,0,TAU); g.fill(); }
    }

    // ---- sizing + loop ----
    let W=1280, H=1600, clock=0;
    function aspectWH(){ const p=(P.aspect||'1280/1600').split(/[/:x]/).map(Number), a=p[0]||4, b=p[1]||5, long=1600;
      return a>=b ? [long, Math.round(long*b/a)] : [Math.round(long*a/b), long]; }
    function fit(){ [W,H]=aspectWH(); art.width=W; art.height=H;
      const dr=$('dimReadout'); if(dr){ const p=(P.aspect||'').split(/[/:x]/).map(Number); dr.textContent=(p[0]||W)+' × '+(p[1]||H); }
      buildPoints(); drawNow(); }
    function drawNow(){ render(ctx, W, H, clock); }
    let t0=performance.now();
    function frame(now){ const dt=Math.min(0.05,(now-t0)/1000); t0=now; if(P.play){ clock += dt; render(ctx,W,H,clock); } requestAnimationFrame(frame); }
    requestAnimationFrame(frame);
    if(document.fonts && document.fonts.load){ document.fonts.load('80px UniversNextMed').then(()=>{ fontReady=true; buildPoints(); drawNow(); }).catch(()=>{}); }

    // ---- wire the rail ----
    function bind(id, rid, set, fmt, rebuild){ const r=$(id), v=$(rid); if(!r) return;
      r.oninput=()=>{ set(+r.value); if(v) v.textContent=fmt?fmt(+r.value):r.value; if(rebuild) buildPoints(); if(!P.play) drawNow(); }; }
    bind('size','sizeR',v=>P.size=v, null, true);
    bind('dens','densR',v=>P.dens=v, null, true);
    bind('disp','dispR',v=>P.disp=v);
    bind('link','linkR',v=>P.link=v);
    bind('node','nodeR',v=>P.node=v/10, v=>(v/10).toFixed(1));
    bind('line','lineR',v=>P.line=v, v=>(v/10).toFixed(1));
    bind('lop','lopR',v=>P.lop=v);
    bind('pulse','pulseR',v=>P.pulse=v);
    bind('spd','spdR',v=>P.spd=v, v=>(v/10).toFixed(1));
    $('charIn').addEventListener('input',e=>{ P.char=e.target.value||'?'; buildPoints(); if(!P.play) drawNow(); });
    ['ink','paper'].forEach(id=>$(id).addEventListener('input',e=>{ P[id]=e.target.value; if(!P.play) drawNow(); }));
    $('aspect').addEventListener('change',e=>{ P.aspect=e.target.value; fit(); });
    $('reroll').addEventListener('click',()=>{ P.seed=1+Math.floor(Math.random()*99999); buildPoints(); drawNow(); });
    $('playBtn').addEventListener('click',()=>{ P.play=!P.play; $('playBtn').setAttribute('aria-pressed',String(P.play)); $('playBtn').textContent=P.play?'Pause':'Play'; if(!P.play) drawNow(); });

    // ---- output ----
    Opal.mountOutput(art,'what-are-people-for',{ render:(long)=>{ const [aw,ah]=aspectWH(), s=long/Math.max(aw,ah);
      const c=document.createElement('canvas'); c.width=Math.round(aw*s); c.height=Math.round(ah*s);
      const savedW=art.width, savedH=art.height; art.width=c.width; art.height=c.height; buildPoints();
      render(c.getContext('2d'), c.width, c.height, clock); art.width=savedW; art.height=savedH; buildPoints(); return c; } });
    let rec=null, chunks=[];
    $('recBtn').addEventListener('click',()=>{ if(rec){ rec.stop(); return; }
      if(!P.play){ P.play=true; $('playBtn').setAttribute('aria-pressed','true'); $('playBtn').textContent='Pause'; }
      const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime,videoBitsPerSecond:24000000}:undefined); chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ const ext=mime.indexOf('mp4')>=0?'mp4':'webm'; const blob=new Blob(chunks,{type:mime||'video/webm'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='what-are-people-for.'+ext; a.click();
        $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; rec=null; };
      rec.start(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop'; });

    fit();
  })();
  </script>
</body>
</html>
