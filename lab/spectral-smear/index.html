<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>spectral smear · harness</title>
<style>
  :root{ --bg:#0b0c10; --panel:rgba(20,22,28,.72); --hair:rgba(255,255,255,.12);
    --ink:#eef0f4; --mute:rgba(255,255,255,.55); --accent:#6f9bff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:12px/1.4 ui-sans-serif,"Helvetica Neue",Arial,sans-serif; overflow:hidden; }
  #gl{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #panel{ position:fixed; top:14px; right:14px; width:236px; z-index:5;
    background:var(--panel); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
    border:1px solid var(--hair); border-radius:10px; padding:12px 12px 10px; }
  #panel h1{ margin:0 0 10px; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--mute); font-weight:600; }
  .row{ margin:9px 0; }
  .row .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .row .k{ color:var(--ink); } .row .v{ color:var(--mute); font-variant-numeric:tabular-nums; }
  .row input[type=range]{ width:100%; accent-color:var(--accent); height:16px; }
  #save{ width:100%; margin-top:10px; padding:9px 10px; cursor:pointer; background:var(--accent);
    color:#08122e; border:0; border-radius:7px; font:inherit; font-weight:700; letter-spacing:.03em; }
  #save:active{ transform:translateY(1px); }
  #hint{ position:fixed; left:14px; bottom:12px; z-index:5; color:var(--mute); pointer-events:none; letter-spacing:.04em; }
  #hint b{ color:var(--ink); font-weight:600; }
  #err{ position:fixed; left:14px; bottom:40px; right:270px; z-index:6; display:none;
    background:rgba(60,12,16,.92); border:1px solid #d4545a; border-radius:8px; color:#ffd9db;
    padding:10px 12px; white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace; font-size:11px; max-height:44vh; overflow:auto; }
  #drophint{ position:fixed; inset:0; z-index:4; display:none; align-items:center; justify-content:center;
    background:rgba(11,12,16,.6); font-size:15px; letter-spacing:.02em; }
  body.dragging #drophint{ display:flex; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="panel">
    <h1>Spectral smear</h1>
    <div id="controls"></div>
    <button id="save">Save PNG · 3×</button>
  </div>
  <div id="err"></div>
  <div id="drophint">Drop an image to swap the source</div>
  <div id="hint"><b>drag</b> an image to swap · <b>R</b> reloads the shader</div>
  <script src="./main.js"></script>
</body>
</html>
