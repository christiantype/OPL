<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Spectral Smear — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  /* Spectral Smear shares the family shell (Attractor reference): a left #dock rail of
     labelled slider groups, a centred canvas in #wrap, and the top-right #sizeDock. */
  :root{ --ink:#141414; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.14); --panel:rgba(252,252,253,.9);
    --cell:rgba(255,255,255,.75); --hair:rgba(0,0,0,.26); --mute:rgba(0,0,0,.66); --paper:#ffffff;
    --hintbg:rgba(255,255,255,.72); --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overflow:hidden; overscroll-behavior:none; }

  /* header — carried into the dark theme so the tool name stays legible on the bar */
  body.dark .opal-brand{ color:var(--ink) !important; }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-brand .opal-product, body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }
  body.dark .opal-brand .opal-divider{ background:rgba(255,255,255,.2); }

  /* canvas area — the board sits centred on a light-grey mat (#stagewrap), 24px margin, no shadow.
     A canvas is a replaced element, so fit() sizes #stage directly (letterboxed to aspect) and
     its rect is the single source of truth for the working canvas backing size. */
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; }
  #stagewrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  #stage{ display:block; max-width:100%; max-height:100%; touch-action:none; border-radius:2px; }

  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%);
    font-size:13px; color:var(--dim); background:var(--hintbg); padding:6px 14px; border-radius:999px;
    pointer-events:none; transition:opacity .4s; z-index:7; }
  #status{ position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none; font-size:10px; letter-spacing:.08em; color:var(--mute); display:none; }

  /* canvas-size dock — pinned top-right on every tool */
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ appearance:none; -webkit-appearance:none; background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:2px;
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; cursor:pointer;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }

  /* recording indicator — pinned beside the rail while a capture runs */
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em; color:#ff5468;
    background:var(--panel); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:#ff5468; animation:recblink 1s infinite; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  @keyframes recblink{ 50%{ opacity:.25; } }

  /* left rail — all controls live here, top to bottom */
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden; background:var(--panel);
    -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column; gap:0; }

  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; gap:8px; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-moz-range-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--ink); }

  .btn{ appearance:none; border:1px solid var(--line); background:var(--cell); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(127,127,140,.16); }
  .btn[aria-pressed="true"], .btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .btn.full{ width:100%; }

  /* grouped sections — a clean, labelled stack with dividers */
  .group{ display:flex; flex-direction:column; gap:9px; }
  .group + .group{ margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
  .group__t{ font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid2 .btn{ width:100%; }

  /* tooltips — follow the control they describe, get out of the way on click */
  .tip{ position:fixed; z-index:60; display:none; max-width:246px; padding:9px 11px; border-radius:8px;
    background:var(--panel); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }

  /* full screen — canvas only; everything chrome-like steps out of the way */
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; }
  body.fs #exitFs{ display:inline-flex; }
  body.fs #dock, body.fs #sizeDock, body.fs .opal-topbar, body.fs .opal-subhead, body.fs #hint{ display:none !important; }
  body.fs #wrap{ top:0; left:0; }
  body.fs #stagewrap{ padding:0; }

  /* splash */
  #veil{ position:fixed; inset:0; z-index:30; background:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer; text-align:center; padding:24px; }
  #veil h1{ font-weight:300; font-size:15px; letter-spacing:.4em; text-transform:uppercase; margin:0; }
  #veil p{ max-width:38ch; font-size:12px; line-height:1.8; color:var(--mute); margin:0; }
  #veil .orb{ width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(90,140,255,.85), rgba(150,60,255,.5) 45%, transparent 72%);
    filter:blur(3px); animation:pulse 5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(.9); opacity:.7; } 50%{ transform:scale(1.08); opacity:1; } }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">

<div id="wrap"><div id="stagewrap"><canvas id="stage"></canvas></div></div>
<div id="hint"></div>
<div id="status"></div>
<div id="recDot"><i></i><b>0:00</b></div>

<div id="sizeDock">
  <select id="aspect" title="Canvas size">
    <option value="1080/1350">Portrait · 4:5</option>
    <option value="1080/1920">Story · 9:16</option>
    <option value="1/1">Square · 1:1</option>
    <option value="1920/1080" selected>Landscape · 16:9</option>
  </select>
</div>

<button class="btn" id="exitFs" aria-label="exit full screen" title="Exit (Esc)">Exit</button>

<div id="dock">

  <!-- primary -->
  <div class="group">
    <button class="btn primary full" id="playBtn" aria-pressed="true" data-tip="Play or pause the drifting flow field (space).">Pause</button>
    <div class="grid2">
      <button class="btn" id="themeBtn" aria-pressed="true" data-tip="Switch the panel between dark and light.">Theme</button>
      <button class="btn" id="fsBtn" data-tip="Fill the screen with the canvas only (F). Esc to exit.">Full screen</button>
    </div>
  </div>

  <!-- source -->
  <div class="group">
    <div class="group__t">Source</div>
    <div class="grid2">
      <button class="btn" id="loadBtn" data-tip="Load one of your own images to smear. It never leaves this page.">Load image</button>
      <button class="btn" id="sampleBtn" data-tip="Load the built-in sample image.">Sample</button>
    </div>
    <input id="fileInp" type="file" accept="image/*" hidden />
  </div>

  <!-- smear -->
  <div class="group">
    <div class="group__t">Smear</div>
    <div class="knob" data-tip="How far the spectrum splits apart across an edge."><label>Amount <b id="smearR">20</b></label><input id="smear" type="range" min="0" max="100" value="20" /></div>
    <div class="knob" data-tip="How many wavelength steps the smear is integrated over. More is smoother, richer banding."><label>Steps <b id="samplesR">28</b></label><input id="samples" type="range" min="1" max="64" value="28" /></div>
  </div>

  <!-- flow -->
  <div class="group">
    <div class="group__t">Flow</div>
    <div class="knob" data-tip="Frequency of the flow field — small is broad, sweeping warps; high is fine and turbulent."><label>Scale <b id="fscaleR">28</b></label><input id="fscale" type="range" min="0" max="100" value="28" /></div>
    <div class="knob" data-tip="How fast the flow field drifts over time. Zero holds it still."><label>Speed <b id="fspeedR">12</b></label><input id="fspeed" type="range" min="0" max="100" value="12" /></div>
  </div>

  <!-- grade -->
  <div class="group">
    <div class="group__t">Grade</div>
    <div class="knob" data-tip="How hard the tones are pushed toward black and white."><label>Contrast <b id="contrastR">38</b></label><input id="contrast" type="range" min="0" max="100" value="38" /></div>
    <div class="knob" data-tip="The least colour kept everywhere — low reads almost monochrome, high keeps the whole frame saturated."><label>Colour floor <b id="satfloorR">25</b></label><input id="satfloor" type="range" min="0" max="100" value="25" /></div>
    <div class="knob" data-tip="Fine grain over the frame, so it feels shot."><label>Grain <b id="grainR">15</b></label><input id="grain" type="range" min="0" max="100" value="15" /></div>
  </div>

  <!-- output — every export setting (format · pixels · print size · DPI) lives here -->
  <div class="group out" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2">
      <button class="btn" id="recBtn" aria-pressed="false" data-tip="Record the drifting flow field to a video file.">Record</button>
      <button class="btn" id="saveBtn" data-tip="Renders the current frame at the pixel size below and saves a PNG.">Save</button>
    </div>
  </div>

</div>

<div id="veil">
  <div class="orb"></div>
  <h1>Spectral Smear</h1>
  <p>An image liquefied along a flow field, then integrated across a spectrum so each wavelength lands at a different offset &#8212; prismatic banding blooms only on its high-contrast edges. Drop a picture to begin.</p>
</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name: 'Spectral Smear', desc: 'Flow-warped spectral smear', about: "An image liquefied along a flow field, then integrated across a spectrum so each wavelength lands at a different offset — prismatic banding blooms only on its high-contrast edges.", version: 'v1' });</script>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  let THEME='dark';
  const SHADER_URL='../02_spectral_smear.frag';   // edit the shader there; press R to reload
  const state={ res:3200, playing:true };
  // friendly 0..100 knob value -> real uniform value (defaults hit the shader's originals)
  const MAP={
    smear:   {u:'u_smear',     f:v=>v/100*0.15},
    samples: {u:'u_samples',   f:v=>v},
    fscale:  {u:'u_flowScale', f:v=>0.5+v/100*7.5},
    fspeed:  {u:'u_flowSpeed', f:v=>v/100*0.5},
    contrast:{u:'u_contrast',  f:v=>0.5+v/100*2.5},
    satfloor:{u:'u_satFloor',  f:v=>v/100},
    grain:   {u:'u_grain',     f:v=>v/100*0.15},
  };
  const params={ smear:20, samples:28, fscale:28, fspeed:12, contrast:38, satfloor:25, grain:15 };

  const cv=$('stage'), wrap=$('stagewrap');
  const gl=cv.getContext('webgl',{preserveDrawingBuffer:true});
  if(!gl){ setStatus('WebGL is not available in this browser'); }
  const VERT='attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
  const quadBuf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  let prog=null, uni={};
  const BASE=['u_res','u_texRes','u_time','u_tex'];
  function compile(t,s){ const sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)||'compile failed'); return sh; }
  function buildProgram(src){ const p=gl.createProgram(); gl.attachShader(p,compile(gl.VERTEX_SHADER,VERT)); gl.attachShader(p,compile(gl.FRAGMENT_SHADER,src));
    gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)||'link failed');
    if(prog) gl.deleteProgram(prog); prog=p; gl.useProgram(prog);
    const loc=gl.getAttribLocation(prog,'p'); gl.bindBuffer(gl.ARRAY_BUFFER,quadBuf); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    uni={}; BASE.concat(Object.values(MAP).map(m=>m.u)).forEach(n=>uni[n]=gl.getUniformLocation(prog,n)); }

  // ---------- source texture ----------
  const tex=gl.createTexture(); let texRes=[1,1];
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([28,28,34,255]));
  function loadTexture(src,revoke,name){ const img=new Image(); img.onload=()=>{ gl.bindTexture(gl.TEXTURE_2D,tex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      texRes=[img.naturalWidth,img.naturalHeight]; if(revoke) URL.revokeObjectURL(src); if(name){ setStatus(name+' loaded'); setTimeout(()=>setStatus(''),1500);} };
    img.onerror=()=>{ setStatus('could not read that image'); setTimeout(()=>setStatus(''),2400); }; img.src=src; }
  function loadFile(f){ loadTexture(URL.createObjectURL(f),true,f.name); }

  // ---------- draw ----------
  let W=0,H=0,DPR=1;
  let ASPECT=1920/1080;   // set by #sizeDock; reshapes the working canvas
  function resize(){ const r=cv.getBoundingClientRect(); DPR=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
  // size the canvas box to the chosen aspect, centred in the available area (letterboxed in full screen)
  function fit(){ const cs=getComputedStyle(document.documentElement), fsOn=document.body.classList.contains('fs');
    const rail=fsOn?0:(parseInt(cs.getPropertyValue('--rail'))||300), top=fsOn?0:(parseInt(cs.getPropertyValue('--top'))||82), pad=fsOn?0:24;
    const availW=Math.max(40,innerWidth-rail-pad*2), availH=Math.max(40,innerHeight-top-pad*2);
    let w=availW, h=w/ASPECT; if(h>availH){ h=availH; w=h*ASPECT; }
    cv.style.width=Math.round(w)+'px'; cv.style.height=Math.round(h)+'px'; resize(); }
  addEventListener('resize',fit);
  function draw(w,h,time){ if(!prog) return; gl.viewport(0,0,w,h); gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex); gl.uniform1i(uni.u_tex,0);
    gl.uniform2f(uni.u_res,w,h); gl.uniform2f(uni.u_texRes,texRes[0],texRes[1]); gl.uniform1f(uni.u_time,time);
    for(const k in MAP) gl.uniform1f(uni[MAP[k].u], MAP[k].f(params[k]));
    gl.drawArrays(gl.TRIANGLES,0,3); }
  let clock=0,last=null;
  function frame(ts){ if(last==null)last=ts; const dt=(ts-last)/1000; last=ts; if(state.playing) clock+=dt;
    draw(cv.width,cv.height,clock); requestAnimationFrame(frame); }

  // ---------- export (FBO at chosen pixels) ----------
  const dl=(blob,name)=>{ const u=URL.createObjectURL(blob),a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); };
  function exportDims(){ const cw=cv.width||1, ch=cv.height||1, long=Math.max(cw,ch), s=state.res/long, maxS=gl.getParameter(gl.MAX_TEXTURE_SIZE);
    let w=Math.round(cw*s), h=Math.round(ch*s); const k=Math.min(1,maxS/Math.max(w,h)); return [Math.max(2,Math.floor(w*k)),Math.max(2,Math.floor(h*k))]; }
  // Output-panel hook — render the shader to an FBO at the chosen long-edge (true print res)
  function renderExport(px){ if(!prog) return null;
    const cw=cv.width||1, ch=cv.height||1, long=Math.max(cw,ch), maxS=gl.getParameter(gl.MAX_TEXTURE_SIZE);
    let w=Math.round(cw*px/long), h=Math.round(ch*px/long); const k=Math.min(1,maxS/Math.max(w,h));
    w=Math.max(2,Math.floor(w*k)); h=Math.max(2,Math.floor(h*k));
    const rt=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,rt);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,rt,0);
    draw(w,h,clock); const px2=new Uint8Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px2);
    gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteFramebuffer(fb); gl.deleteTexture(rt);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d'), out=cx.createImageData(w,h);
    for(let y=0;y<h;y++) out.data.set(px2.subarray((h-1-y)*w*4,(h-y)*w*4), y*w*4); cx.putImageData(out,0,0);
    return c; }
  function exportPNG(){ if(!prog) return; const [w,h]=exportDims(); setStatus(`rendering ${w}×${h}…`);
    setTimeout(()=>{ const rt=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,rt);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb); gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,rt,0);
      draw(w,h,clock); const px=new Uint8Array(w*h*4); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.deleteFramebuffer(fb); gl.deleteTexture(rt);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const cx=c.getContext('2d'), out=cx.createImageData(w,h);
      for(let y=0;y<h;y++) out.data.set(px.subarray((h-1-y)*w*4,(h-y)*w*4), y*w*4); cx.putImageData(out,0,0);
      c.toBlob(b=>{ dl(b,`spectral-smear-${w}x${h}-${Date.now()}.png`); setStatus(`saved ${w}×${h}`); setTimeout(()=>setStatus(''),2000); },'image/png'); },30); }

  // ---------- record (H.264 MP4 with WebM fallback) ----------
  let rec=null, chunks=[], recRAF=0, recStart=0, recTimer=0;
  const recFmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  function toggleRecord(){ if(rec&&rec.state==='recording'){ rec.stop(); return; }
    // Record from a fixed-size high-res buffer (long edge 2160, even dims) so output is crisp and consistent
    const ar=(cv.width||1)/(cv.height||1), long=2160, ev2=n=>n-(n&1);
    const rw=ev2(ar>=1?long:Math.round(long*ar)), rh=ev2(ar>=1?Math.round(long/ar):long);
    const recCv=document.createElement('canvas'); recCv.width=rw; recCv.height=rh; const recCtx=recCv.getContext('2d');
    recCtx.imageSmoothingEnabled=true; recCtx.imageSmoothingQuality='high';
    const drawFrame=()=>{ recCtx.drawImage(cv,0,0,rw,rh); };
    drawFrame();
    const stream=recCv.captureStream(30);
    const mime=['video/mp4;codecs=avc1.640029','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:40000000}); chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ cancelAnimationFrame(recRAF); clearInterval(recTimer); $('recDot').classList.remove('on');
      const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='spectral-smear.'+ext; a.click();
      $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false'); };
    rec.start();
    (function comp(){ drawFrame(); if(rec&&rec.state==='recording') recRAF=requestAnimationFrame(comp); })();
    recStart=performance.now(); $('recDot').classList.add('on'); $('recDot').querySelector('b').textContent='0:00';
    recTimer=setInterval(()=>{ $('recDot').querySelector('b').textContent=recFmt(performance.now()-recStart); }, 250);
    $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true'); }

  // ---------- UI ----------
  function setStatus(t){ const s=$('status'); if(!s) return; s.textContent=t; s.style.display=t?'block':'none'; }
  const bind=(id)=>{ const e=$(id); e.addEventListener('input',ev=>{ params[id]=+ev.target.value; const r=$(id+'R'); if(r)r.textContent=ev.target.value; }); };
  function wire(){
    ['smear','samples','fscale','fspeed','contrast','satfloor','grain'].forEach(bind);
    $('loadBtn').addEventListener('click',()=>$('fileInp').click());
    $('sampleBtn').addEventListener('click',()=>loadTexture('./source.jpg',false,'sample'));
    $('fileInp').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadFile(f); e.target.value=''; });
    $('saveBtn').addEventListener('click',exportPNG);
    $('recBtn').addEventListener('click',toggleRecord);
    $('playBtn').addEventListener('click',()=>{ state.playing=!state.playing; last=null; const on=state.playing;
      $('playBtn').textContent=on?'Pause':'Play'; $('playBtn').setAttribute('aria-pressed',String(on)); });
    $('themeBtn').addEventListener('click',()=>{ THEME=THEME==='dark'?'light':'dark'; document.body.classList.toggle('dark',THEME==='dark'); $('themeBtn').setAttribute('aria-pressed',String(THEME==='dark')); });
    $('fsBtn').addEventListener('click',()=>setFs(!document.body.classList.contains('fs')));
    $('exitFs').addEventListener('click',()=>setFs(false));
    $('aspect').addEventListener('change',e=>{ const [x,y]=e.target.value.split('/').map(Number); ASPECT=x/y; fit(); syncRes(); syncHint(); });
    ['dragover','drop'].forEach(ev=>addEventListener(ev,e=>e.preventDefault()));
    addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f&&/^image\//.test(f.type)) loadFile(f); });
    addEventListener('keydown',e=>{ if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      if(e.key===' '){ e.preventDefault(); $('playBtn').click(); }
      if(e.key==='r'||e.key==='R') loadShader();
      if(e.key==='Escape'&&document.body.classList.contains('fs')){ setFs(false); return; }
      if(e.key==='f'||e.key==='F') setFs(!document.body.classList.contains('fs')); });
    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });
  }
  function syncRes(){ const [ew,eh]=exportDims(); const el=$('resIn'); if(el) el.textContent=`${(ew/300).toFixed(1)}×${(eh/300).toFixed(1)}in @300`; }
  function syncHint(){ const el=$('hint'); if(el) el.textContent='An image, liquefied and split across a spectrum'; }
  function setFs(on){ document.body.classList.toggle('fs',on);
    if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
    else if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); requestAnimationFrame(fit); }
  function loadShader(){ fetch(SHADER_URL+'?'+ (''+performance.now())).then(r=>r.text()).then(src=>{ buildProgram(src); setStatus('shader loaded'); setTimeout(()=>setStatus(''),1000); })
    .catch(e=>{ setStatus('shader error — see console'); console.error(e); setTimeout(()=>setStatus(''),3000); }); }

  // ---------- tooltips ----------
  let tipEl=null,tipT=null,tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return; if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0'; const r=host.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8,r.bottom+8); tipEl.style.left=Math.max(8,Math.min(r.left,innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return; clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown',hideTip); addEventListener('scroll',hideTip,true);

  document.body.classList.add('dark');
  wire(); fit();
  syncRes(); syncHint(); loadShader();
  { const veil=$('veil'); if(veil) veil.remove(); } fit(); loadTexture('./source.jpg');
  setTimeout(()=>{ const h=$('hint'); if(h) h.style.opacity=0; }, 4200);
  requestAnimationFrame(frame);
  // Output island: one consistent export panel (format · pixels · print size · DPI · quality),
  // with a true-resolution FBO re-render of the shader.
  Opal.mountOutput(cv, 'spectral-smear', { render: renderExport });
  window.spectral={ state, params, exportDims, get ready(){return !!prog;} };
})();
</script>
