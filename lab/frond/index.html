<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Frond — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100vh; height:100dvh; overflow:hidden; background:var(--paper); font-family:var(--font, 'IBM Plex Sans', system-ui, sans-serif); }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; background:var(--mat);
    display:flex; align-items:center; justify-content:center; padding:22px; }
  #art{ max-width:100%; max-height:100%; display:block; box-shadow:none; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); right:24px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rowhint{ font-size:12px; line-height:1.5; color:var(--mute); margin:0; }
</style>
  <link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body>
  <script src="/lab/shared/opal.js"></script>
  <script>Opal.mountTopbar({ name:'Frond', desc:'Overlapping translucent circles, rimmed in gold',
    about:'Soft translucent circles laid over one another like stained glass — each a light-to-indigo gradient that deepens where they cross, a few turned warm, every edge traced by a fine luminous gold accent, on a cream field with a golden halo. Tune the number of circles, their size and spread, how many are warm or left as bare rings, the gold accent and its glow, the four colours (or shift the whole field with Hue), the softness and grain. Re-roll the arrangement. Seeded — a still and a recording match. Export a still, or record the slow drift.' });</script>
  <div id="sizeDock">
    <span id="dimReadout">1280 × 1600</span>
    <select id="aspect" title="Canvas size">
      <option value="1280/1600" selected>Portrait · 4:5</option>
      <option value="1080/1920">Story · 9:16</option>
      <option value="1400/1400">Square · 1:1</option>
      <option value="1600/1200">Landscape · 4:3</option>
      <option value="1600/900">Landscape · 16:9</option>
    </select>
  </div>
  <div id="recDot"><i></i><b>0:00</b></div>

  <div id="dock">
    <div class="group">
      <div class="group__t">Circles</div>
      <p class="rowhint">Translucent circles, overlaid like stained glass. Re-roll for a new arrangement.</p>
      <div class="grid2"><button class="btn" id="reroll">Re-roll</button><button class="btn" id="playBtn" aria-pressed="true">Pause</button></div>
      <div class="knob"><label>Count <b id="countR">9</b></label><input id="count" type="range" min="3" max="14" value="9"></div>
      <div class="duo">
        <div class="knob"><label>Scale <b id="scaleR">1.00</b></label><input id="scale" type="range" min="60" max="150" value="100"></div>
        <div class="knob"><label>Spread <b id="spreadR">58</b></label><input id="spread" type="range" min="0" max="100" value="58"></div>
      </div>
    </div>

    <div class="group">
      <div class="group__t">Form</div>
      <div class="duo">
        <div class="knob"><label>Min size <b id="minR">40</b></label><input id="min" type="range" min="15" max="70" value="40"></div>
        <div class="knob"><label>Squash <b id="squashR">14</b></label><input id="squash" type="range" min="0" max="50" value="14"></div>
      </div>
      <div class="knob"><label>Wobble <b id="wobbleR">10</b></label><input id="wobble" type="range" min="0" max="50" value="10"></div>
    </div>

    <div class="group">
      <div class="group__t">Accent</div>
      <p class="rowhint">The luminous gold line on every circle edge.</p>
      <div class="duo">
        <div class="knob"><label>Gold <b id="goldwR">80</b></label><input id="goldw" type="range" min="0" max="100" value="80"></div>
        <div class="knob"><label>Glow <b id="glowR">50</b></label><input id="glow" type="range" min="0" max="100" value="50"></div>
      </div>
      <div class="duo">
        <div class="knob"><label>Warm <b id="warmR">22</b></label><input id="warm" type="range" min="0" max="100" value="22"></div>
        <div class="knob"><label>Bare rings <b id="ringR">22</b></label><input id="ring" type="range" min="0" max="100" value="22"></div>
      </div>
    </div>

    <div class="group">
      <div class="group__t">Colour</div>
      <div class="crow"><label>Light</label><input type="color" class="sw" id="light" value="#e6ecf5"></div>
      <div class="crow"><label>Deep</label><input type="color" class="sw" id="deep" value="#3a4878"></div>
      <div class="crow"><label>Gold</label><input type="color" class="sw" id="gold" value="#d59a48"></div>
      <div class="crow"><label>Ground</label><input type="color" class="sw" id="ground" value="#e7e3d7"></div>
      <div class="knob"><label>Hue <b id="hueR">0</b></label><input id="hue" type="range" min="-180" max="180" value="0"></div>
    </div>

    <div class="group">
      <div class="group__t">Texture</div>
      <div class="duo">
        <div class="knob"><label>Softness <b id="softR">22</b></label><input id="soft" type="range" min="0" max="100" value="22"></div>
        <div class="knob"><label>Grain <b id="grainR">14</b></label><input id="grain" type="range" min="0" max="80" value="14"></div>
      </div>
      <div class="knob"><label>Halo <b id="haloR">45</b></label><input id="halo" type="range" min="0" max="100" value="45"></div>
    </div>

    <div class="group">
      <div class="group__t">Motion</div>
      <div class="duo">
        <div class="knob"><label>Drift <b id="driftR">40</b></label><input id="drift" type="range" min="0" max="120" value="40"></div>
        <div class="knob"><label>Speed <b id="spdR">1.0</b></label><input id="spd" type="range" min="0" max="40" value="10"></div>
      </div>
    </div>
  </div>

  <div id="wrap"><canvas id="art" width="1280" height="1600"></canvas></div>

  <div class="group out" id="output" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div>
  </div>

  <script>
  (function(){
    const art=document.getElementById('art'), ctx=art.getContext('2d');
    const $=id=>document.getElementById(id);
    const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

    const P={ aspect:'1280/1600', seed:7, count:9, scale:1.0, spread:58,
      min:40, squash:14, wobble:10, goldw:85, glow:55, warm:22, ring:22,
      light:'#e6ecf5', deep:'#3a4878', gold:'#d59a48', ground:'#e7e3d7', hue:0,
      soft:22, grain:14, halo:45, drift:40, spd:1.0, play:true };

    // ---- colour helpers ----
    const HEX=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
    const MIX=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
    const RGBA=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+clamp(a,0,1).toFixed(3)+')';
    function rgb2hsl(c){ let r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;
      if(mx===mn){h=s=0;} else{ const d=mx-mn; s=l>0.5?d/(2-mx-mn):d/(mx+mn);
        h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h/=6;} return [h,s,l]; }
    function hsl2rgb(h,s,l){ const q=l<0.5?l*(1+s):l+s-l*s,p=2*l-q; const f=t=>{ t=(t%1+1)%1;
      return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p; }; return [f(h+1/3)*255,f(h)*255,f(h-1/3)*255]; }
    function rot(c){ if(!P.hue) return c; const hsl=rgb2hsl(c); return hsl2rgb(hsl[0]+P.hue/360, hsl[1], hsl[2]); }
    const COL={};
    function resolve(){ COL.light=rot(HEX(P.light)); COL.deep=rot(HEX(P.deep)); COL.gold=rot(HEX(P.gold)); COL.ground=rot(HEX(P.ground));
      COL.goldHi=MIX(COL.gold,[255,255,255],0.45);
      COL.warmLo=MIX(COL.gold,[255,252,244],0.72); COL.warmHi=MIX(COL.gold,[255,255,255],0.30); }

    function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
      t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

    // ---- circle set ----
    function makeCircles(rng){
      const N=P.count, arr=[], sp=P.spread/100;
      for(let i=0;i<N;i++){
        const cx=0.5 + (rng()*2-1)*0.42*sp;
        const cy=0.5 + (rng()*2-1)*0.46*sp;
        const R = lerp(P.min/100, 0.62, Math.pow(rng(),0.8));
        const ell = 1 + (rng()*2-1)*(P.squash/100);
        const rotA = rng()*TAU;
        const warm = rng() < P.warm/100;
        const bare = !warm && rng() < P.ring/100;
        const w=[rng()*TAU, rng()*TAU, 2+(rng()*2|0), 3+(rng()*2|0)];
        arr.push({ cx, cy, R, ell, rotA, warm, bare, w, brPh:rng()*TAU, driftPh:rng()*TAU, gs:0.6+rng()*0.4, depth:rng() });
      }
      return arr;
    }

    function circlePath(c, W, H, clusterR, tm){
      const breath=1+Math.sin(tm*0.4+c.brPh)*(P.drift/100)*0.02;
      const dx=Math.sin(tm*0.28+c.driftPh)*(P.drift/100)*0.016*W;
      const dy=Math.cos(tm*0.24+c.brPh)*(P.drift/100)*0.014*H;
      const cx=c.cx*W+dx, cy=c.cy*H+dy, R=c.R*clusterR*breath;
      const co=Math.cos(c.rotA), si=Math.sin(c.rotA);
      const path=new Path2D(); const N=180;
      for(let i=0;i<=N;i++){ const th=TAU*i/N;
        const wob=0.5*Math.sin(th*c.w[2]+c.w[0])+0.5*Math.sin(th*c.w[3]+c.w[1]);
        const rr=R*(1+(P.wobble/100)*0.08*wob);
        let ex=Math.cos(th)*rr*c.ell, ey=Math.sin(th)*rr/c.ell;   // ellipse
        const x=cx+ex*co-ey*si, y=cy+ex*si+ey*co; i?path.lineTo(x,y):path.moveTo(x,y); }
      path.closePath();
      return { path, cx, cy, R };
    }

    function drawCircle(g, W, H, clusterR, c, tm){
      const { path, cx, cy, R } = circlePath(c, W, H, clusterR, tm);
      // fill (skip for bare rings) — translucent, multiplying into indigo where circles cross
      if(!c.bare){
        const lx=cx - Math.cos(c.rotA)*R*0.34, ly=cy - Math.sin(c.rotA)*R*0.34;   // light offset
        const rg=g.createRadialGradient(lx,ly,0, cx,cy,R*1.06);
        if(c.warm){ rg.addColorStop(0,RGBA(COL.warmHi,1)); rg.addColorStop(0.6,RGBA(COL.warmLo,1)); rg.addColorStop(1,RGBA(MIX(COL.warmLo,COL.gold,0.5),1)); }
        else{ rg.addColorStop(0,RGBA(COL.light,1)); rg.addColorStop(0.58,RGBA(MIX(COL.light,COL.deep,0.42),1)); rg.addColorStop(1,RGBA(MIX(COL.light,COL.deep,0.72),1)); }
        g.save(); g.globalCompositeOperation='multiply'; g.globalAlpha=c.warm?0.42:0.5; g.fillStyle=rg; g.fill(path); g.restore();
      }
      // gold accent — soft glow, then a crisp luminous line
      if(P.goldw>0){
        const gw=P.goldw/100;
        if(P.glow>0){ g.save(); g.globalCompositeOperation='lighter'; g.filter='blur('+(R*0.022+3).toFixed(1)+'px)';
          g.strokeStyle=RGBA(COL.gold, 0.5*gw*(P.glow/100)*c.gs); g.lineWidth=R*0.03; g.stroke(path); g.stroke(path); g.restore(); }
        g.strokeStyle=RGBA(MIX(COL.gold,COL.deep,0.55), 0.4*gw*c.gs); g.lineWidth=Math.max(1, R*0.010); g.stroke(path);   // soft dark backing
        g.strokeStyle=RGBA(COL.goldHi, gw*c.gs); g.lineWidth=Math.max(1.3, R*0.006); g.stroke(path);                      // the luminous line
        g.strokeStyle=RGBA(MIX(COL.goldHi,[255,255,255],0.5), 0.6*gw*c.gs); g.lineWidth=Math.max(0.6, R*0.0022); g.stroke(path); // hot core
      }
    }

    // ---- grain ----
    let grainCv=null, grW=0, grH=0;
    function ensureGrain(W,H){ if(grainCv&&grW===W&&grH===H) return; grainCv=document.createElement('canvas'); grainCv.width=W; grainCv.height=H;
      const gx=grainCv.getContext('2d'), id=gx.createImageData(W,H), d=id.data;
      for(let i=0;i<d.length;i+=4){ const v=200+Math.random()*55|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } gx.putImageData(id,0,0); grW=W; grH=H; }
    function drawGrain(g, W, H){ if(P.grain<=0) return; ensureGrain(W,H);
      g.save(); g.globalAlpha=(P.grain/100)*0.4; g.globalCompositeOperation='overlay'; g.drawImage(grainCv,0,0); g.restore(); }

    // ---- compose ----
    const buf=document.createElement('canvas'); const bx=buf.getContext('2d');
    function render(g, W, H, tm){
      resolve();
      if(buf.width!==W||buf.height!==H){ buf.width=W; buf.height=H; }
      bx.setTransform(1,0,0,1,0,0); bx.globalAlpha=1; bx.globalCompositeOperation='source-over'; bx.filter='none';
      const bg=bx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0, RGBA(MIX(COL.ground,[255,255,255],0.28),1)); bg.addColorStop(1, RGBA(MIX(COL.ground,COL.gold,0.05),1));
      bx.fillStyle=bg; bx.fillRect(0,0,W,H);

      const C={x:W*0.5,y:H*0.5}, clusterR=Math.min(W,H)*0.5*P.scale;
      if(P.halo>0){ const hg=bx.createRadialGradient(C.x,C.y,clusterR*0.4, C.x,C.y,clusterR*1.25);
        hg.addColorStop(0, RGBA(MIX(COL.gold,[255,255,255],0.4), 0.34*(P.halo/100))); hg.addColorStop(1, RGBA(COL.gold,0));
        bx.fillStyle=hg; bx.fillRect(0,0,W,H); }

      const rng=mulberry32((P.seed*2654435761)>>>0);
      const circles=makeCircles(rng); circles.sort((a,b)=>a.depth-b.depth);
      for(const c of circles) drawCircle(bx, W, H, clusterR, c, tm);

      const blur=(P.soft/100)*Math.min(W,H)*0.006;
      g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.globalCompositeOperation='source-over';
      g.filter = blur>0.3 ? 'blur('+blur.toFixed(1)+'px)' : 'none'; g.drawImage(buf,0,0); g.filter='none';
      drawGrain(g, W, H);
    }

    // ---- sizing + loop ----
    let W=1280, H=1600, clock=0;
    function aspectWH(){ const p=(P.aspect||'1280/1600').split(/[/:x]/).map(Number), a=p[0]||4, b=p[1]||5, long=1600;
      return a>=b ? [long, Math.round(long*b/a)] : [Math.round(long*a/b), long]; }
    function fit(){ [W,H]=aspectWH(); art.width=W; art.height=H;
      const dr=$('dimReadout'); if(dr){ const p=(P.aspect||'').split(/[/:x]/).map(Number); dr.textContent=(p[0]||W)+' × '+(p[1]||H); } drawNow(); }
    function drawNow(){ render(ctx, W, H, clock); }
    let t0=performance.now();
    function frame(now){ const dt=Math.min(0.05,(now-t0)/1000); t0=now; if(P.play){ clock += dt*(P.spd/10); render(ctx,W,H,clock); } requestAnimationFrame(frame); }
    requestAnimationFrame(frame);

    // ---- wire the rail ----
    function bind(id, rid, set, fmt){ const r=$(id), v=$(rid); if(!r) return;
      r.oninput=()=>{ set(+r.value); if(v) v.textContent=fmt?fmt(+r.value):r.value; if(!P.play) drawNow(); }; }
    bind('count','countR',v=>P.count=v|0);
    bind('scale','scaleR',v=>P.scale=v/100, v=>(v/100).toFixed(2));
    bind('spread','spreadR',v=>P.spread=v);
    bind('min','minR',v=>P.min=v);
    bind('squash','squashR',v=>P.squash=v);
    bind('wobble','wobbleR',v=>P.wobble=v);
    bind('goldw','goldwR',v=>P.goldw=v);
    bind('glow','glowR',v=>P.glow=v);
    bind('warm','warmR',v=>P.warm=v);
    bind('ring','ringR',v=>P.ring=v);
    bind('hue','hueR',v=>P.hue=v);
    bind('soft','softR',v=>P.soft=v);
    bind('grain','grainR',v=>P.grain=v);
    bind('halo','haloR',v=>P.halo=v);
    bind('drift','driftR',v=>P.drift=v);
    bind('spd','spdR',v=>P.spd=v, v=>(v/10).toFixed(1));
    ['light','deep','gold','ground'].forEach(id=>$(id).addEventListener('input',e=>{ P[id]=e.target.value; if(!P.play) drawNow(); }));
    $('aspect').addEventListener('change',e=>{ P.aspect=e.target.value; fit(); });
    $('reroll').addEventListener('click',()=>{ P.seed=1+Math.floor(Math.random()*99999); drawNow(); });
    $('playBtn').addEventListener('click',()=>{ P.play=!P.play; $('playBtn').setAttribute('aria-pressed',String(P.play)); $('playBtn').textContent=P.play?'Pause':'Play'; if(!P.play) drawNow(); });

    // ---- output ----
    Opal.mountOutput(art,'frond',{ render:(long)=>{ const [aw,ah]=aspectWH(), s=long/Math.max(aw,ah);
      const c=document.createElement('canvas'); c.width=Math.round(aw*s); c.height=Math.round(ah*s);
      render(c.getContext('2d'), c.width, c.height, clock); return c; } });
    let rec=null, chunks=[], rt=0, tk=0;
    $('recBtn').addEventListener('click',()=>{ if(rec){ rec.stop(); return; }
      if(!P.play){ P.play=true; $('playBtn').setAttribute('aria-pressed','true'); $('playBtn').textContent='Pause'; }
      const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime,videoBitsPerSecond:24000000}:undefined); chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ const ext=mime.indexOf('mp4')>=0?'mp4':'webm'; const blob=new Blob(chunks,{type:mime||'video/webm'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='frond.'+ext; a.click();
        clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; rec=null; };
      rec.start(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop';
      rt=Date.now(); tk=setInterval(()=>{ const el=Math.floor((Date.now()-rt)/1000);
        $('recDot').querySelector('b').textContent=(el/60|0)+':'+String(el%60).padStart(2,'0'); },250); });

    fit();
  })();
  </script>
</body>
</html>
