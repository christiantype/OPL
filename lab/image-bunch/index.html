<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Image Bunch — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100vh; height:100dvh; overflow:hidden; background:var(--paper); font-family:var(--font,'IBM Plex Sans',system-ui,sans-serif); }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; background:var(--mat);
    display:flex; align-items:center; justify-content:center; padding:22px; }
  #art{ max-width:100%; max-height:100%; display:block; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); right:24px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rowhint{ font-size:12px; line-height:1.5; color:var(--mute); margin:0; }
  #thumbs{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
  #thumbs:empty{ display:none; }
  #thumbs img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block;
    border:1px solid var(--hair); border-radius:var(--r-input); }
  body.drag #wrap{ outline:2px dashed var(--accent); outline-offset:-14px; }
  .group[hidden]{ display:none !important; }
</style>
  <link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body>
  <script src="/lab/shared/opal.js"></script>
  <script>Opal.mountTopbar({ name:'Image Bunch', desc:'A wall of pictures that keeps changing its mind',
    about:'A Brady Bunch of your photographs. Every image you add takes a tile in a wall that fills the frame — a regular grid, or a masonry of unequal rectangles cut by splitting the frame down again and again. Then, on a rhythm you set, tiles swap: one picks a picture it is not already showing and fades to it, so the wall is never twice the same and every photograph comes around. Add images or drop a PDF and every page becomes one. Built for a reel — set it to Story, press Record, and let it run.' });</script>
  <div id="sizeDock">
    <span id="dimReadout">1080 × 1920</span>
    <select id="aspect" title="Canvas size">
      <option value="1080/1920" selected>Story · 9:16</option>
      <option value="1280/1600">Portrait · 4:5</option>
      <option value="1400/1400">Square · 1:1</option>
      <option value="1600/900">Landscape · 16:9</option>
    </select>
  </div>
  <div id="recDot"><i></i><b>0:00</b></div>

  <div id="dock">
    <div class="group">
      <div class="group__t">Pictures</div>
      <p class="rowhint">Add your images — or drop a PDF and every page becomes one. Nothing leaves this page.</p>
      <div class="grid2">
        <button class="btn" id="addBtn">Add pictures</button>
        <button class="btn" id="clearBtn">Clear</button>
      </div>
      <input id="fileInp" type="file" accept="image/*,application/pdf,.pdf" multiple hidden />
      <p class="rowhint" id="status">No pictures yet.</p>
      <div id="thumbs"></div>
    </div>

    <div class="group">
      <div class="group__t">Wall</div>
      <div class="knob"><label>Layout</label>
        <div class="seg" id="layoutSeg">
          <button data-x="masonry" aria-pressed="true">Masonry</button>
          <button data-x="grid" aria-pressed="false">Grid</button>
        </div>
      </div>
      <div class="knob lay lay-masonry"><label>Tiles <b id="tilesR">9</b></label><input id="tiles" type="range" min="2" max="60" value="9"></div>
      <div class="knob lay lay-masonry"><label>Unevenness <b id="varyR">55</b></label><input id="vary" type="range" min="0" max="100" value="55"></div>
      <div class="duo lay lay-grid" hidden>
        <div class="knob"><label>Columns <b id="colsR">3</b></label><input id="cols" type="range" min="1" max="12" value="3"></div>
        <div class="knob"><label>Rows <b id="rowsR">5</b></label><input id="rows" type="range" min="1" max="12" value="5"></div>
      </div>
      <div class="duo">
        <div class="knob"><label>Gap <b id="gapR">10</b></label><input id="gap" type="range" min="0" max="60" value="10"></div>
        <div class="knob"><label>Corners <b id="radR">0</b></label><input id="rad" type="range" min="0" max="60" value="0"></div>
      </div>
      <div class="crow"><label>Background</label><input type="color" class="sw" id="bg" value="#ffffff"></div>
      <button class="btn" id="reshuffle">Reshuffle the wall</button>
    </div>

    <div class="group">
      <div class="group__t">Switching</div>
      <p class="rowhint">Every so often a tile picks a picture it is not already showing and fades to it.</p>
      <div class="duo">
        <div class="knob"><label>Rate <b id="rateR">1.4</b></label><input id="rate" type="range" min="1" max="80" value="14"></div>
        <div class="knob"><label>At once <b id="atOnceR">1</b></label><input id="atOnce" type="range" min="1" max="8" value="1"></div>
      </div>
      <div class="knob"><label>Fade <b id="fadeR">0.35</b></label><input id="fade" type="range" min="0" max="150" value="35"></div>
      <button class="btn" id="playBtn" aria-pressed="true">Pause</button>
    </div>
  </div>

  <div id="wrap"><canvas id="art" width="1080" height="1920"></canvas></div>

  <div class="group out" id="output" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div>
  </div>

  <script>
  (function(){
    const art=document.getElementById('art'), ctx=art.getContext('2d');
    const $=id=>document.getElementById(id);
    const clamp=(v,a,b)=>v<a?a:v>b?b:v;

    const P={ aspect:'1080/1920', seed:5, layout:'masonry', tiles:9, vary:0.55,
      cols:3, rows:5, gap:10, rad:0, bg:'#ffffff',
      rate:1.4, atOnce:1, fade:0.35, play:true };

    let imgs=[], W=1080, H=1920, t=0, acc=0;

    function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0;
      let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x;
      return ((x^x>>>14)>>>0)/4294967296; }; }

    // ---- the wall ------------------------------------------------------------
    // Masonry is cut by guillotine: take the biggest rectangle left and split it,
    // again and again, so the tiles are unequal but the frame is always filled
    // edge to edge with no gaps to place.
    let cells=[], cellKey='';
    function layout(){
      const key=[P.layout,P.tiles,P.vary,P.cols,P.rows,P.seed,W,H].join('|');
      if(cellKey===key) return; cellKey=key;
      const r=mulberry((P.seed*2654435761)>>>0);
      let rects=[];
      if(P.layout==='grid'){
        const cw=W/P.cols, ch=H/P.rows;
        for(let y=0;y<P.rows;y++) for(let x=0;x<P.cols;x++)
          rects.push({x:x*cw, y:y*ch, w:cw, h:ch});
      } else {
        rects=[{x:0,y:0,w:W,h:H}];
        while(rects.length<P.tiles){
          rects.sort((a,b)=>b.w*b.h-a.w*a.h);
          const c=rects.shift();
          const horiz=c.w>=c.h;                          // always split the longer side
          const k=clamp(0.5+(r()-0.5)*P.vary, 0.22, 0.78);
          if(horiz){ const w1=c.w*k;
            rects.push({x:c.x,y:c.y,w:w1,h:c.h},{x:c.x+w1,y:c.y,w:c.w-w1,h:c.h}); }
          else { const h1=c.h*k;
            rects.push({x:c.x,y:c.y,w:c.w,h:h1},{x:c.x,y:c.y+h1,w:c.w,h:c.h-h1}); }
        }
      }
      // keep whatever each tile was showing, so changing the gap doesn't reshuffle the wall
      const old=cells;
      cells=rects.map((rc,i)=>({ ...rc,
        cur: old[i] ? old[i].cur : (imgs.length? i%imgs.length : 0),
        prev: -1, mix: 1 }));
    }
    function reseat(){ const r=mulberry((P.seed*40503)>>>0);
      cells.forEach((c,i)=>{ c.cur = imgs.length ? Math.floor(r()*imgs.length) : 0; c.prev=-1; c.mix=1; }); }

    // ---- the switch ----------------------------------------------------------
    function swap(){
      if(imgs.length<2 || !cells.length) return;
      const showing=new Set(cells.map(c=>c.cur));
      for(let k=0;k<P.atOnce;k++){
        const c=cells[(Math.random()*cells.length)|0];
        // prefer a picture the wall isn't already showing, so every one comes around
        let pool=[]; for(let i=0;i<imgs.length;i++) if(!showing.has(i)) pool.push(i);
        if(!pool.length) for(let i=0;i<imgs.length;i++) if(i!==c.cur) pool.push(i);
        if(!pool.length) continue;
        const pick=pool[(Math.random()*pool.length)|0];
        showing.delete(c.cur); showing.add(pick);
        c.prev=c.cur; c.cur=pick; c.mix = P.fade>0.001 ? 0 : 1;
      }
    }

    // ---- render --------------------------------------------------------------
    function path(g,r,rad,inset){
      const x=r.x+inset, y=r.y+inset, w=Math.max(0,r.w-inset*2), h=Math.max(0,r.h-inset*2);
      const k=Math.min(rad, w/2, h/2);
      g.beginPath();
      if(k<=0.5){ g.rect(x,y,w,h); return; }
      g.moveTo(x+k,y); g.lineTo(x+w-k,y); g.quadraticCurveTo(x+w,y,x+w,y+k);
      g.lineTo(x+w,y+h-k); g.quadraticCurveTo(x+w,y+h,x+w-k,y+h);
      g.lineTo(x+k,y+h); g.quadraticCurveTo(x,y+h,x,y+h-k);
      g.lineTo(x,y+k); g.quadraticCurveTo(x,y,x+k,y);
      g.closePath();
    }
    function cover(g,im,r,inset){
      if(!im||!im.naturalWidth) return;
      const x=r.x+inset, y=r.y+inset, w=Math.max(0,r.w-inset*2), h=Math.max(0,r.h-inset*2);
      const s=Math.max(w/im.naturalWidth, h/im.naturalHeight);
      const dw=im.naturalWidth*s, dh=im.naturalHeight*s;
      g.drawImage(im, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
    }
    function draw(g,w,h){
      layout();
      const sx=w/W, sy=h/H;                              // export renders the same wall, larger
      g.setTransform(1,0,0,1,0,0);
      g.fillStyle=P.bg; g.fillRect(0,0,w,h);
      if(!imgs.length){ g.fillStyle='rgba(0,0,0,.45)';
        g.font='500 '+Math.round(Math.min(w,h)*0.028)+'px "IBM Plex Sans",system-ui,sans-serif';
        g.textAlign='center'; g.fillText('Add pictures — each one takes a tile', w/2, h/2); g.textAlign='left'; return; }
      const inset=(P.gap*Math.min(sx,sy))/2, rad=P.rad*Math.min(sx,sy);
      for(const c of cells){
        const r={x:c.x*sx, y:c.y*sy, w:c.w*sx, h:c.h*sy};
        g.save(); path(g,r,rad,inset); g.clip();
        if(c.prev>=0 && c.mix<1){ cover(g, imgs[c.prev], r, inset);
          g.globalAlpha=c.mix; cover(g, imgs[c.cur], r, inset); g.globalAlpha=1; }
        else cover(g, imgs[c.cur], r, inset);
        g.restore();
      }
    }
    function drawNow(){ draw(ctx,W,H); }

    // ---- sizing + loop -------------------------------------------------------
    function aspectWH(){ const p=(P.aspect||'1080/1920').split(/[/:x]/).map(Number), a=p[0]||9, b=p[1]||16, long=1920;
      return a>=b ? [long, Math.round(long*b/a)] : [Math.round(long*a/b), long]; }
    function fit(){ [W,H]=aspectWH(); art.width=W; art.height=H; cellKey=''; drawNow(); }
    let t0=performance.now();
    function frame(now){
      const dt=Math.min(0.05,(now-t0)/1000); t0=now;
      if(P.play){
        t+=dt; acc+=dt;
        const every=1/Math.max(0.05,P.rate);
        while(acc>=every){ acc-=every; swap(); }
        if(P.fade>0.001) for(const c of cells) if(c.mix<1) c.mix=Math.min(1, c.mix+dt/P.fade);
        drawNow();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---- pictures ------------------------------------------------------------
    function setStatus(m){ $('status').textContent=m; }
    function counts(){ const n=imgs.length;
      setStatus(n ? n+(n===1?' picture · ':' pictures · ')+cells.length+(cells.length===1?' tile':' tiles') : 'No pictures yet.'); }
    function thumbs(){ const h=$('thumbs'); h.innerHTML='';
      imgs.forEach(im=>{ const t=document.createElement('img'); t.src=im.src; h.appendChild(t); }); }
    function added(){ cellKey=''; layout(); reseat(); thumbs(); counts(); drawNow(); }
    const isPDF=f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
    function addImage(file){ const im=new Image();
      im.onload=()=>{ imgs.push(im); added(); };
      im.onerror=()=>setStatus('could not read '+file.name);
      im.src=URL.createObjectURL(file); }
    let pdfReady=null;
    function ensurePDF(){ if(pdfReady) return pdfReady;
      pdfReady=new Promise((res,rej)=>{ const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
        s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; res(window.pdfjsLib); }catch(e){ rej(e); } };
        s.onerror=()=>rej(new Error('pdf.js failed to load')); document.head.appendChild(s); });
      return pdfReady; }
    async function loadPDF(file){ setStatus('reading PDF…');
      try{ const lib=await ensurePDF(), buf=await file.arrayBuffer(), pdf=await lib.getDocument({data:buf}).promise;
        const n=pdf.numPages;
        for(let p=1;p<=n;p++){ setStatus('PDF page '+p+' / '+n+'…');
          const page=await pdf.getPage(p), v0=page.getViewport({scale:1});
          const s=Math.min(1600/Math.max(v0.width,v0.height),3), vp=page.getViewport({scale:s});
          const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
          const cx=c.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height);
          await page.render({canvasContext:cx,viewport:vp}).promise;
          const im=new Image(); await new Promise((r,e)=>{ im.onload=r; im.onerror=e; im.src=c.toDataURL('image/jpeg',0.86); });
          imgs.push(im); added(); }
      }catch(e){ console.warn(e); setStatus('could not read that PDF'); } }
    const addFile=f=>isPDF(f)?loadPDF(f):addImage(f);
    $('addBtn').addEventListener('click',()=>$('fileInp').click());
    $('fileInp').addEventListener('change',e=>{ [...e.target.files].forEach(addFile); e.target.value=''; });
    $('clearBtn').addEventListener('click',()=>{ imgs=[]; added(); });
    ['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); document.body.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{ if(ev==='drop'||e.target===document.documentElement) document.body.classList.remove('drag'); }));
    document.addEventListener('drop',e=>{ e.preventDefault(); [...(e.dataTransfer?.files||[])].forEach(addFile); });

    // ---- wire ----------------------------------------------------------------
    function bind(id,rid,set,fmt,relay){ const r=$(id), v=$(rid); if(!r) return;
      r.oninput=()=>{ set(+r.value); if(v) v.textContent=fmt?fmt(+r.value):r.value;
        if(relay){ cellKey=''; layout(); counts(); } if(!P.play) drawNow(); }; }
    bind('tiles','tilesR',v=>P.tiles=v,null,true);
    bind('vary','varyR',v=>P.vary=v/100,null,true);
    bind('cols','colsR',v=>P.cols=v,null,true);
    bind('rows','rowsR',v=>P.rows=v,null,true);
    bind('gap','gapR',v=>P.gap=v);
    bind('rad','radR',v=>P.rad=v);
    bind('rate','rateR',v=>P.rate=v/10, v=>(v/10).toFixed(1));
    bind('atOnce','atOnceR',v=>P.atOnce=v);
    bind('fade','fadeR',v=>P.fade=v/100, v=>(v/100).toFixed(2));
    $('bg').oninput=e=>{ P.bg=e.target.value; if(!P.play) drawNow(); };
    function syncLayout(){ document.querySelectorAll('#dock .lay').forEach(el=>{
        el.hidden = !el.classList.contains('lay-'+P.layout); }); }
    $('layoutSeg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
      [...e.currentTarget.querySelectorAll('button')].forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
      P.layout=b.dataset.x; syncLayout(); cellKey=''; layout(); counts(); drawNow(); });
    $('reshuffle').addEventListener('click',()=>{ P.seed=1+Math.floor(Math.random()*99999);
      cellKey=''; layout(); reseat(); counts(); drawNow(); });
    $('aspect').addEventListener('change',e=>{ P.aspect=e.target.value; fit(); });
    $('playBtn').addEventListener('click',()=>{ P.play=!P.play; $('playBtn').setAttribute('aria-pressed',String(P.play));
      $('playBtn').textContent=P.play?'Pause':'Play'; if(!P.play) drawNow(); });

    function forceStory(){ const sel=$('aspect'); if(!sel) return;
      const opt=[...sel.options].find(o=>/1080\s*[\/x]\s*1920|9\s*[:\/x]\s*16|story/i.test(o.value+' '+o.textContent));
      if(opt && sel.value!==opt.value){ sel.value=opt.value; P.aspect=opt.value; fit();
        sel.dispatchEvent(new Event('change',{bubbles:true})); } }   // opal.js writes the readout
    setTimeout(forceStory,260); setTimeout(forceStory,700);

    // ---- output --------------------------------------------------------------
    Opal.mountOutput(art,'image-bunch',{ render:(long)=>{ const [aw,ah]=aspectWH(), s=long/Math.max(aw,ah);
      const c=document.createElement('canvas'); c.width=Math.round(aw*s); c.height=Math.round(ah*s);
      draw(c.getContext('2d'), c.width, c.height); return c; } });
    let rec=null, chunks=[], rt=0, tk=0;
    $('recBtn').addEventListener('click',()=>{ if(rec){ rec.stop(); return; }
      if(!P.play){ P.play=true; $('playBtn').setAttribute('aria-pressed','true'); $('playBtn').textContent='Pause'; }
      const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      const bits=Math.min(120e6, Math.max(12e6, Math.round(art.width*art.height*30*0.25)));
      rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime,videoBitsPerSecond:bits}:undefined); chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ const ext=mime.indexOf('mp4')>=0?'mp4':'webm', blob=new Blob(chunks,{type:mime||'video/webm'});
        if(blob.size>0){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='image-bunch.'+ext; a.click(); }
        else alert('The recorder produced no frames. Try a smaller canvas size.');
        clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; rec=null; };
      rec.start(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop';
      rt=Date.now(); tk=setInterval(()=>{ const el=Math.floor((Date.now()-rt)/1000);
        $('recDot').querySelector('b').textContent=(el/60|0)+':'+String(el%60).padStart(2,'0'); },250); });

    syncLayout(); fit(); counts();
  })();
  </script>
</body>
</html>
