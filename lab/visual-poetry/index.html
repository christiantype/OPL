<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>VISUAL POETRY — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:var(--font, 'IBM Plex Sans', system-ui, -apple-system, sans-serif); overscroll-behavior:none; }
  body.dark .opal-topbar{ background:transparent; border:none; color:var(--ink); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }

  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ background:#0b0d16; box-shadow:0 10px 44px rgba(0,0,0,.55); max-width:100%; max-height:100%; display:block; border-radius:2px; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%); font-size:13px; color:var(--dim);
    background:rgba(11,12,20,.7); padding:6px 14px; border-radius:999px; pointer-events:none; transition:opacity .3s; z-index:7; }
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ background:rgba(15,16,24,.92); color:var(--ink); border:1px solid var(--line); border-radius:2px;
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; cursor:pointer;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em; color:#ff5468;
    background:rgba(15,16,24,.92); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:#ff5468; animation:recblink 1s infinite; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  @keyframes recblink{ 50%{ opacity:.25; } }

  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(15,16,24,.92); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column; gap:0; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  /* slider is owned by OPALAB.css */
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.11); }
  .btn[aria-pressed="true"], .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  select.btn{ text-transform:uppercase; width:100%; }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .group + .group{ margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
  .group__t{ font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid2 .btn, .btn.full{ width:100%; }
  /* per-line track cards */
  #lines{ display:flex; flex-direction:column; gap:9px; }
  .linec{ border:1px solid rgba(0,0,0,.14); border-radius:5px; padding:8px; display:flex; flex-direction:column; gap:7px; background:rgba(255,255,255,.6); }
  .linec .lh{ display:flex; gap:6px; align-items:center; }
  .linec .lcol{ width:26px; height:24px; flex:none; border:1px solid var(--line); border-radius:3px; background:none; padding:0; cursor:pointer; }
  .linec .lcol::-webkit-color-swatch-wrapper{ padding:2px; } .linec .lcol::-webkit-color-swatch{ border:none; border-radius:1px; }
  .linec select{ flex:1; background:rgba(255,255,255,.05); color:var(--ink); border:1px solid var(--line); border-radius:2px; font:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:5px 6px; }
  .linec .rm{ width:24px; height:24px; padding:0; font-size:14px; line-height:1; }
  .linec .noter{ display:flex; align-items:center; gap:7px; }
  .linec .noter span{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); min-width:34px; }
  .linec .noter b{ font-size:11px; color:var(--ink); font-variant-numeric:tabular-nums; min-width:30px; text-align:right; }
  .steps{ display:grid; gap:3px; }
  .stp{ aspect-ratio:1; border:1px solid rgba(0,0,0,.34); border-radius:2px; background:rgba(0,0,0,.05); cursor:pointer; padding:0; min-width:0; }
  .stp:hover{ background:rgba(0,0,0,.14); }
  .stp.on{ background:var(--ink); border-color:var(--ink); }
  .stp.beat{ border-color:rgba(0,0,0,.55); }
  .stp.pcur{ box-shadow:inset 0 0 0 2px #c01f34; }
  .tip{ position:fixed; z-index:60; display:none; max-width:230px; padding:9px 11px; border-radius:8px;
    background:rgba(18,20,28,.97); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }
</style>
<link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body class="dark">
  <div id="wrap"><canvas id="art"></canvas></div>
  <div id="hint">Press Play — each line is a string with its own steps, instrument and note</div>
  <div id="recDot"><i></i><b>0:00</b></div>
  <div id="sizeDock">
    <select id="aspect" title="Canvas size">
      <option value="1080/1350">Portrait · 4:5</option>
      <option value="1080/1920" selected>Story · 9:16</option>
      <option value="1/1">Square · 1:1</option>
      <option value="1920/1080">Landscape · 16:9</option>
    </select>
  </div>

  <div id="dock">

    <!-- transport -->
    <div class="group">
      <button class="btn primary full" id="startBtn" aria-pressed="false" data-tip="Start the loop — the playhead sweeps across and plays each line's steps.">Play</button>
      <div class="knob" data-tip="Speed of the sweep."><label>Tempo <b id="tempoR">92</b></label><input id="tempo" type="range" min="0" max="100" value="45" /></div>
      <div class="knob" data-tip="How many steps in the loop — the length of the phrase."><label>Steps <b id="stepsR">16</b></label><input id="steps" type="range" min="4" max="16" value="16" /></div>
    </div>

    <!-- tuning -->
    <div class="group">
      <div class="group__t">Tuning</div>
      <select id="scale" class="btn" data-tip="The scale every line is tuned to.">
        <option value="in">In · Miyako-bushi</option>
        <option value="hira">Hirajoshi</option>
        <option value="kumoi">Kumoi</option>
        <option value="iwato">Iwato</option>
        <option value="insen">Insen</option>
        <option value="yo">Yo</option>
        <option value="penta">Pentatonic</option>
      </select>
      <div class="knob" data-tip="Moves every line up or down in pitch."><label>Key <b id="keyR">D</b></label><input id="key" type="range" min="45" max="60" value="50" /></div>
      <div class="knob" data-tip="Hall reverb around everything."><label>Reverb <b id="verbR">50</b></label><input id="verb" type="range" min="0" max="100" value="50" /></div>
      <div class="knob" data-tip="Overall loudness."><label>Volume <b id="volR">78</b></label><input id="vol" type="range" min="0" max="100" value="78" /></div>
    </div>

    <!-- lines -->
    <div class="group">
      <div class="group__t">Lines · steps · instrument · note</div>
      <div id="lines"></div>
      <button class="btn full" id="addBtn" data-tip="Add another string line.">Add line</button>
    </div>

    <!-- look -->
    <div class="group">
      <div class="group__t">Look</div>
      <div class="knob" style="flex-direction:row; align-items:center; justify-content:space-between;" data-tip="The flat colour behind the strings."><label style="text-transform:uppercase;">Background</label><input type="color" id="bgCol" value="#0a0b12" style="width:44px;height:24px;border:1px solid var(--line);border-radius:4px;background:none;padding:0;cursor:pointer;"></div>
    </div>

    <!-- output -->
    <div class="group out" data-export-custom>
      <div class="group__t">Output</div>
      <div class="grid2">
        <button class="btn" id="recBtn" aria-pressed="false">Record</button>
        <button class="btn" id="saveBtn">Save</button>
      </div>
    </div>

  </div>

<script src="/lab/shared/opal.js?v=3"></script>
<script>Opal.mountTopbar({ name:'Visual Poetry', desc:'Strings you sequence', about:"A field of strings you sequence. Each line is a string with its own step pattern, its own instrument — koto, shakuhachi, bell or drum — and its own note. Press Play and a playhead sweeps across; wherever a line's step is lit, the string sounds and shivers up and down. Add or remove lines, set the scale, key and tempo, and build a loop out of nothing but strings. Records video and sound; runs entirely on your device.",
  version:'v1' });</script>

<script>
(() => {
  const cv=document.getElementById('art'); const ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  const TAU=Math.PI*2;
  let ASPECT=1080/1920, W=0,H=0,dpr=1,S=1;
  const P={ tempo:45, steps:16, key:50, verb:50, vol:78 };
  let playing=false, SCALE='in';
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const hexToRgb=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255,n>>8&255,n&255]; };
  const rgbToHex=c=>'#'+[c[0],c[1],c[2]].map(v=>('0'+(v|0).toString(16)).slice(-2)).join('');
  const rgbStr=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';
  let BG=[10,11,18];
  const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const SCALES={ in:[0,1,5,7,8], hira:[0,2,3,7,8], kumoi:[0,2,3,7,9], iwato:[0,1,5,6,10], insen:[0,1,5,7,10], yo:[0,2,5,7,9], penta:[0,2,4,7,9] };
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function scaleMidi(deg){ const sc=SCALES[SCALE], oct=Math.floor(deg/sc.length), semi=sc[((deg%sc.length)+sc.length)%sc.length]+12*oct; return P.key+semi; }

  // instruments: name → {colour, play(freq,amp)}
  const INST={
    koto:   { col:[236,196,120] },
    pluck:  { col:[120,214,236] },
    marimba:{ col:[240,168,96] },
    kalimba:{ col:[130,230,170] },
    shaku:  { col:[96,180,236] },
    bell:   { col:[196,150,255] },
    pad:    { col:[150,170,255] },
    bass:   { col:[130,150,175] },
    drum:   { col:[255,110,120] },
  };
  const INST_ORDER=['koto','pluck','marimba','kalimba','shaku','bell','pad','bass','drum'];
  const INST_LABEL={ koto:'Koto', pluck:'Pluck', marimba:'Marimba', kalimba:'Kalimba', shaku:'Shakuhachi', bell:'Bell', pad:'Pad', bass:'Bass', drum:'Drum' };

  // ---------- audio ----------
  let AC=null, master=null, wet=null, streamDest=null;
  function audio(){ if(AC) return AC; AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=(P.vol/100)*0.8;
    const dry=AC.createGain(); wet=AC.createGain(); wet.gain.value=P.verb/100;
    const verb=AC.createConvolver(); { const len=Math.floor(AC.sampleRate*2.8), b=AC.createBuffer(2,len,AC.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5); } verb.buffer=b; }
    master.connect(dry).connect(AC.destination); master.connect(verb).connect(wet).connect(AC.destination); streamDest=AC.createMediaStreamDestination(); dry.connect(streamDest); wet.connect(streamDest); return AC; }
  function env(g,now,a,peak,dur){ g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(peak,now+a); g.gain.exponentialRampToValueAtTime(0.0001,now+dur); }
  function pluckKoto(freq,amp){ const A=audio(), now=A.currentTime; const out=A.createGain(); out.gain.value=amp*0.5; out.connect(master);
    [[1,1,1.5],[2,0.4,1.0],[3,0.22,0.7],[4.2,0.12,0.5]].forEach(([r,a,dc])=>{ const o=A.createOscillator(); o.type='triangle'; o.frequency.value=freq*r*(1+(Math.random()-0.5)*0.003); const g=A.createGain(); env(g,now,0.005,a,1.3*dc); o.connect(g).connect(out); o.start(now); o.stop(now+1.4*dc+0.05); }); }
  function shaku(freq,amp){ const A=audio(), now=A.currentTime, dur=0.7; const out=A.createGain(); out.gain.value=amp*0.42; out.connect(master);
    const o=A.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq*0.996,now); o.frequency.linearRampToValueAtTime(freq,now+0.1);
    const lfo=A.createOscillator(), lg=A.createGain(); lfo.frequency.value=5.2; lg.gain.value=freq*0.008; lfo.connect(lg).connect(o.frequency); lfo.start(now); lfo.stop(now+dur+0.1);
    const g=A.createGain(); env(g,now,0.12,1,dur); o.connect(g).connect(out); o.start(now); o.stop(now+dur+0.1); }
  function bell(freq,amp){ const A=audio(), now=A.currentTime; const out=A.createGain(); out.gain.value=amp*0.4; out.connect(master);
    [1,2.0,2.76,5.4].forEach((r,k)=>{ const o=A.createOscillator(); o.type='sine'; o.frequency.value=freq*r; const g=A.createGain(); const dur=2.2/(1+k*0.8); env(g,now,0.003,0.6/(k+1),dur); o.connect(g).connect(out); o.start(now); o.stop(now+dur+0.05); }); }
  function drum(freq,amp){ const A=audio(), now=A.currentTime; const o=A.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq*1.6,now); o.frequency.exponentialRampToValueAtTime(freq*0.5,now+0.16);
    const g=A.createGain(); g.gain.setValueAtTime(amp*0.6,now); g.gain.exponentialRampToValueAtTime(0.0001,now+0.2); o.connect(g).connect(master); o.start(now); o.stop(now+0.22); }
  function marimba(freq,amp){ const A=audio(), now=A.currentTime; const out=A.createGain(); out.gain.value=amp*0.5; out.connect(master);
    [[1,1,1.1],[3.9,0.3,0.4],[9.2,0.08,0.2]].forEach(([r,a,dc])=>{ const o=A.createOscillator(); o.type='sine'; o.frequency.value=freq*r; const g=A.createGain(); env(g,now,0.004,a,1.0*dc); o.connect(g).connect(out); o.start(now); o.stop(now+1.0*dc+0.05); }); }
  function kalimba(freq,amp){ const A=audio(), now=A.currentTime; const out=A.createGain(); out.gain.value=amp*0.45; out.connect(master);
    [[1,1,0.9],[2.0,0.3,0.5],[3.01,0.16,0.3]].forEach(([r,a,dc])=>{ const o=A.createOscillator(); o.type='sine'; o.frequency.value=freq*r; const g=A.createGain(); env(g,now,0.002,a,0.9*dc); o.connect(g).connect(out); o.start(now); o.stop(now+0.9*dc+0.05); }); }
  function pad(freq,amp){ const A=audio(), now=A.currentTime, dur=1.6; const out=A.createGain(); out.gain.value=amp*0.3; out.connect(master);
    const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1200; lp.connect(out);
    [0,-1,1].forEach(det=>{ const o=A.createOscillator(); o.type='sawtooth'; o.frequency.value=freq*(1+det*0.006); const g=A.createGain(); env(g,now,0.25,0.5,dur); o.connect(g).connect(lp); o.start(now); o.stop(now+dur+0.1); }); }
  function bass(freq,amp){ const A=audio(), now=A.currentTime; freq*=0.5; const out=A.createGain(); out.gain.value=amp*0.6; out.connect(master);
    const o=A.createOscillator(); o.type='triangle'; o.frequency.value=freq; const o2=A.createOscillator(); o2.type='sine'; o2.frequency.value=freq;
    const g=A.createGain(); env(g,now,0.005,1,0.5); o.connect(g).connect(out); o2.connect(g); o.start(now); o2.start(now); o.stop(now+0.55); o2.stop(now+0.55); }
  function pluck(freq,amp){ const A=audio(), now=A.currentTime; const out=A.createGain(); out.gain.value=amp*0.5; out.connect(master);
    const lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(freq*8,now); lp.frequency.exponentialRampToValueAtTime(freq*2,now+0.4); lp.connect(out);
    const o=A.createOscillator(); o.type='sawtooth'; o.frequency.value=freq; const g=A.createGain(); env(g,now,0.004,0.8,0.6); o.connect(g).connect(lp); o.start(now); o.stop(now+0.65); }
  function playInst(name,freq,amp){ ({koto:pluckKoto,pluck:pluck,marimba:marimba,kalimba:kalimba,shaku:shaku,bell:bell,pad:pad,bass:bass,drum:drum}[name]||pluckKoto)(freq,amp); }

  // ---------- lines ----------
  const lines=[];
  function makeLine(inst,deg,pat){ const n=16; const steps=new Array(n).fill(false); if(pat) pat.forEach(i=>{ if(i<n) steps[i]=true; }); return { inst, deg, steps, level:80, amp:0, phase:Math.random()*TAU, col:INST[inst].col.slice() }; }
  function defaultLines(){ lines.length=0;
    lines.push(makeLine('koto', 7, [0,4,8,12])); }   // start with a single string — add more as you like
  function buildLines(){ const host=$('lines'); host.innerHTML='';
    lines.forEach((L,li)=>{ const card=document.createElement('div'); card.className='linec';
      const midi=scaleMidi(L.deg); const nn=NOTES[((midi%12)+12)%12]+(Math.floor(midi/12)-1);
      card.innerHTML =
        '<div class="lh"><input type="color" class="lcol" value="'+rgbToHex(L.col)+'" title="Line colour">'+
          '<select class="inst">'+INST_ORDER.map(k=>'<option value="'+k+'"'+(k===L.inst?' selected':'')+'>'+INST_LABEL[k]+'</option>').join('')+'</select>'+
          '<button class="btn rm" title="Remove line">×</button></div>'+
        '<div class="noter"><span>Note</span><input class="note" type="range" min="0" max="14" value="'+L.deg+'"><b class="nn">'+nn+'</b></div>'+
        '<div class="noter"><span>Level</span><input class="lvl" type="range" min="0" max="100" value="'+L.level+'"><b class="lv">'+L.level+'</b></div>'+
        '<div class="steps"></div>';
      const grid=card.querySelector('.steps'); grid.style.gridTemplateColumns='repeat('+P.steps+',1fr)';
      L.els=[];
      for(let s=0;s<P.steps;s++){ const b=document.createElement('button'); b.className='stp'+(L.steps[s]?' on':'')+(s%4===0?' beat':''); b.dataset.s=s;
        b.addEventListener('click',()=>{ L.steps[s]=!L.steps[s]; b.classList.toggle('on',L.steps[s]); }); grid.appendChild(b); L.els.push(b); }
      card.querySelector('.lcol').addEventListener('input',e=>{ L.col=hexToRgb(e.target.value); });
      card.querySelector('.inst').addEventListener('change',e=>{ L.inst=e.target.value; });
      card.querySelector('.note').addEventListener('input',e=>{ L.deg=+e.target.value; const m=scaleMidi(L.deg); card.querySelector('.nn').textContent=NOTES[((m%12)+12)%12]+(Math.floor(m/12)-1); });
      card.querySelector('.lvl').addEventListener('input',e=>{ L.level=+e.target.value; card.querySelector('.lv').textContent=L.level; });
      card.querySelector('.rm').addEventListener('click',()=>{ if(lines.length>1){ lines.splice(li,1); buildLines(); } });
      host.appendChild(card); }); }
  function refreshNotes(){ document.querySelectorAll('.linec').forEach((card,li)=>{ const L=lines[li]; if(!L) return; const m=scaleMidi(L.deg); const b=card.querySelector('.nn'); if(b) b.textContent=NOTES[((m%12)+12)%12]+(Math.floor(m/12)-1); }); }

  // ---------- fit ----------
  function fit(){ const availH=innerHeight-168, availW=innerWidth-28;
    let h=Math.min(availH,1650), w=h*ASPECT; if(w>availW){ w=availW; h=w/ASPECT; }
    W=Math.round(w); H=Math.round(h); S=H/1000; dpr=Math.max(Math.min(devicePixelRatio||1,2), 2160/Math.max(W,H));
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }

  // ---------- clock ----------
  let T=0, t0=performance.now(), phase=0, lastStep=-1;
  // highlight the CURRENTLY-PLAYING step column across every line in the rail (cs<0 clears)
  function paintCur(cs){ for(const L of lines){ if(!L.els) continue;
    for(let s=0;s<L.els.length;s++) L.els[s].classList.toggle('pcur', s===cs); } }
  function step(dt){ if(!playing) return; T+=dt;
    const bpm=60+(P.tempo/100)*150; const stepDur=60/bpm/4; phase += dt/stepDur;
    const cur=Math.floor(phase)%P.steps;
    if(cur!==lastStep){ lastStep=cur; paintCur(cur);
      for(const L of lines){ if(L.steps[cur] && L.level>0){ playInst(L.inst, mtof(scaleMidi(L.deg)), 0.9*(L.level/100)); L.amp=Math.min(1.5, L.amp+0.4+0.6*(L.level/100)); } }
    }
    for(const L of lines){ if(L.amp>0) L.amp=Math.max(0, L.amp-dt*2.0); }
  }
  const curStep=()=> ((Math.floor(phase)%P.steps)+P.steps)%P.steps;
  const curFrac=()=> (phase - Math.floor(phase));

  // ---------- render — just the strings ----------
  function render(){
    ctx.save(); ctx.scale(dpr,dpr);
    ctx.fillStyle=rgbStr(BG); ctx.fillRect(0,0,W,H);
    const n=lines.length; const x0=W*0.09, x1=W*0.91; const top=H*0.16, bot=H*0.86; const slot=(bot-top)/Math.max(1,n);
    // step guide + playhead
    const cs=curStep(), cf=curFrac();
    if(playing){ const px=x0+((cs+cf)/P.steps)*(x1-x0); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.5*S; ctx.beginPath(); ctx.moveTo(px,top-14*S); ctx.lineTo(px,bot+14*S); ctx.stroke(); }
    for(let k=0;k<n;k++){ const L=lines[k]; const y=top+slot*(k+0.5); const col=L.col; const cs2='rgb('+col.join(',')+')'; const amp=L.amp*20*S;
      // step dots along the line
      for(let s=0;s<P.steps;s++){ const x=x0+((s+0.5)/P.steps)*(x1-x0); const on=L.steps[s];
        ctx.fillStyle = on ? cs2 : 'rgba(255,255,255,0.12)';
        const rr=(on?2.6:1.6)*S*(s===cs&&playing?1.8:1); ctx.beginPath(); ctx.arc(x,y,rr,0,TAU); ctx.fill(); }
      // the string — a standing wave that shivers when the line just fired (flat colour, no glow)
      ctx.beginPath();
      for(let i=0;i<=48;i++){ const u=i/48; const x=x0+(x1-x0)*u; const e=Math.sin(u*Math.PI); const yy=y+Math.sin(u*Math.PI*3+T*24+L.phase)*amp*e; if(i===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy); }
      const lit=Math.min(1,L.amp);
      ctx.strokeStyle=cs2; ctx.globalAlpha=0.42+0.55*lit; ctx.lineWidth=(1.2+lit*2)*S; ctx.stroke(); ctx.globalAlpha=1;
      // end anchors
      ctx.fillStyle=cs2; ctx.beginPath(); ctx.arc(x0,y,2.4*S,0,TAU); ctx.fill(); ctx.beginPath(); ctx.arc(x1,y,2.4*S,0,TAU); ctx.fill();
    }
    ctx.restore();
  }
  function tick(now){ requestAnimationFrame(tick); const dt=Math.min(0.05,(now-t0)/1000); t0=now; step(dt); render(); }

  // ---------- controls ----------
  function setPlaying(on){ playing=on; const A=audio(); if(A.state==='suspended') A.resume(); if(on){ phase=0; lastStep=-1; } else paintCur(-1);
    $('startBtn').textContent=on?'Stop':'Play'; $('startBtn').setAttribute('aria-pressed',on?'true':'false'); }
  $('startBtn').addEventListener('click',()=>setPlaying(!playing));
  $('addBtn').addEventListener('click',()=>{ if(lines.length<10){ lines.push(makeLine(INST_ORDER[lines.length%4], 5+lines.length, [ (lines.length*3)%P.steps ])); buildLines(); } });
  $('scale').addEventListener('change',e=>{ SCALE=e.target.value; refreshNotes(); });
  [['tempo'],['steps'],['key'],['verb'],['vol']].forEach(([k])=>{ const inp=$(k), out=$(k+'R');
    inp.addEventListener('input',()=>{ P[k]=+inp.value; out.textContent = k==='key'?NOTES[((P.key%12)+12)%12] : (k==='tempo'? Math.round(60+(P.tempo/100)*150) : P[k]);
      if(k==='vol'&&master) master.gain.setTargetAtTime((P.vol/100)*0.8,AC.currentTime,0.02);
      if(k==='verb'&&wet) wet.gain.setTargetAtTime(P.verb/100,AC.currentTime,0.02);
      if(k==='key') refreshNotes();
      if(k==='steps') buildLines();
    }); });
  $('bgCol').addEventListener('input',e=>{ BG=hexToRgb(e.target.value); cv.style.background=e.target.value; });
  $('aspect').addEventListener('change',e=>{ const [x,y]=e.target.value.split('/').map(Number); ASPECT=x/y; fit(); });

  // ---------- record ----------
  let rec=null, chunks=[], recCv=null, recCtx=null, recRAF=0, recStart=0, recTimer=0;
  const recFmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  $('recBtn').addEventListener('click',()=>{ if(rec && rec.state==='recording'){ rec.stop(); return; }
    const A=audio(); if(A.state==='suspended') A.resume();
    const long=1920, ev2=n=>n-(n&1); const rw=ev2(ASPECT>=1?long:Math.round(long*ASPECT)), rh=ev2(ASPECT>=1?Math.round(long/ASPECT):long);
    recCv=document.createElement('canvas'); recCv.width=rw; recCv.height=rh; recCtx=recCv.getContext('2d'); recCtx.imageSmoothingEnabled=true; recCtx.imageSmoothingQuality='high';
    const drawFrame=()=>{ recCtx.drawImage(cv,0,0,rw,rh); }; drawFrame();
    const stream=recCv.captureStream(30); try{ if(streamDest) streamDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr)); }catch(err){}
    const mime=['video/mp4;codecs=avc1.640029,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:20000000, audioBitsPerSecond:192000}); chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ cancelAnimationFrame(recRAF); clearInterval(recTimer); $('recDot').classList.remove('on'); const blob=new Blob(chunks,{type:mime}); const a2=document.createElement('a'); a2.href=URL.createObjectURL(blob); a2.download='visual-poetry.'+ext; a2.click(); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false'); };
    rec.start(); (function comp(){ drawFrame(); if(rec && rec.state==='recording') recRAF=requestAnimationFrame(comp); })();
    recStart=performance.now(); $('recDot').classList.add('on'); $('recDot').querySelector('b').textContent='0:00';
    recTimer=setInterval(()=>{ $('recDot').querySelector('b').textContent=recFmt(performance.now()-recStart); }, 250);
    $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true'); });
  try{ Opal.mountOutput(cv,'visual-poetry'); }catch(e){}   // shared export panel (PNG/JPG/PDF · size · DPI) on the artwork canvas

  addEventListener('resize',()=>{ fit(); });
  setTimeout(()=>{ $('hint').style.opacity=0.9; }, 100);

  // ---------- tooltips ----------
  let tipEl=null, tipT=null, tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return;
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0';
    const r=host.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8, r.bottom+8);
    tipEl.style.left=Math.max(8,Math.min(r.left, innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover', e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return;
    clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown', hideTip); addEventListener('scroll', hideTip, true);

  // ---------- go ----------
  $('tempoR').textContent=Math.round(60+(P.tempo/100)*150);
  defaultLines(); buildLines(); fit(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
