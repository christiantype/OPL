<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Offset — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  :root{ --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; } }
  *{ box-sizing:border-box; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ max-width:100%; max-height:100%; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%);
    font-size:13px; padding:7px 13px; border-radius:0; pointer-events:none; z-index:7; white-space:nowrap; }
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ padding:7px 10px; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .crow{ display:flex; align-items:center; justify-content:space-between; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg{ display:flex; }
  .seg button{ flex:1; appearance:none; background:var(--cell); border:1px solid var(--line);
    color:var(--ink); padding:8px 6px; cursor:pointer; font:inherit; font-size:11px; border-right:0; }
  .seg button:last-child{ border-right:1px solid var(--line); }
  .filebtn{ display:block; text-align:center; }
  .sw{ width:44px; height:24px; border:1px solid var(--line); padding:0; cursor:pointer; background:none; }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">

<div id="wrap"><canvas id="art"></canvas></div>
<div id="hint">An image, reprinted in drifting riso bands</div>
<div id="recDot"><i></i><b>0:00</b></div>
<div id="sizeDock">
  <select id="aspect" title="Canvas size">
    <option value="source" selected>Source · original</option>
    <option value="1080/1350">Portrait · 4:5</option>
    <option value="1080/1920">Story · 9:16</option>
    <option value="1080/1080">Square · 1:1</option>
    <option value="1920/1080">Landscape · 16:9</option>
  </select>
</div>

<div id="dock">
  <div class="group">
    <div class="group__t">Source</div>
    <p class="rowhint" style="margin:0;font-size:12px;color:var(--mute)">Drop a photo, or load one — it becomes a printed field of bands. Nothing leaves this page.</p>
    <div class="grid2">
      <button class="btn filebtn" id="loadBtn">Add image</button>
      <button class="btn" id="sampleBtn">Sample</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="group">
    <div class="group__t">Bands</div>
    <div class="knob"><label>Columns <b id="colR">40</b></label><input id="col" type="range" min="6" max="160" value="40"></div>
    <div class="knob"><label>Merge <b id="mrgR">30</b></label><input id="mrg" type="range" min="0" max="90" value="30"></div>
    <div class="knob"><label>Min height <b id="mhR">10</b></label><input id="mh" type="range" min="2" max="60" value="10"></div>
    <div class="knob"><label>Bleed <b id="ctrR">0</b></label><input id="ctr" type="range" min="0" max="60" value="0"></div>
  </div>

  <div class="group">
    <div class="group__t">Ink</div>
    <div class="seg" role="group" aria-label="Colour mode">
      <button data-mode="Full" aria-pressed="true">Full</button>
      <button data-mode="Monochrome" aria-pressed="false">Mono</button>
      <button data-mode="Riso Duotone" aria-pressed="false">Duotone</button>
    </div>
    <div class="crow" id="duoA"><label>Ink A</label><input type="color" class="sw" id="colA" value="#164a9c"></div>
    <div class="crow" id="duoB"><label>Ink B</label><input type="color" class="sw" id="colB" value="#e0483c"></div>
    <div class="knob"><label>Overlap <b id="ovlR">0</b></label><input id="ovl" type="range" min="0" max="100" value="0"></div>
  </div>

  <div class="group">
    <div class="group__t">Grain</div>
    <div class="knob"><label>Riso grain <b id="grnR">40</b></label><input id="grn" type="range" min="0" max="100" value="40"></div>
    <div class="knob"><label>Density <b id="denR">50</b></label><input id="den" type="range" min="0" max="100" value="50"></div>
    <div class="knob"><label>Misregister <b id="misR">4</b></label><input id="mis" type="range" min="0" max="24" value="4"></div>
  </div>

  <div class="group out">
    <div class="group__t">Output</div>
    <div class="grid2">
      <button class="btn" id="recBtn">Record</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Offset', desc:'A photo, reprinted in riso bands',
  about:'An image, sliced into vertical columns, merged into colour-similar bands and reprinted as dark→light gradients with riso grain, misregistration, ink overlap and duotone palettes — on warm paper. Drop a photo and press. Original: a Brik experimental-print, rebuilt on the OP/AL shell.',
  version:'v1' });</script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const art=$('art'), ctx=art.getContext('2d', { willReadFrequently:true });
  const P={ cols:40, merge:30, minH:10, bleed:0, mode:'Full', overlap:0, grain:0.40, density:50, misreg:4,
    inkA:'#164a9c', inkB:'#e0483c', size:'source' };
  let src=null;                 // {data, w, h} source pixels
  let W=1080, H=1350;           // working / render size

  function hexToRgb(hex){ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:{r:0,g:0,b:0}; }
  function rnd(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
  function lerp(a,b,t){ return a+(b-a)*t; }

  // sample the source image at normalised (x/W, y/H) + optional offset
  function px(x,y,ox=0,oy=0){
    if(!src) return [0,0,0];
    const nx=Math.max(0,Math.min(1,(x+ox)/W)), ny=Math.max(0,Math.min(1,(y+oy)/H));
    const sx=Math.floor(nx*(src.w-1)), sy=Math.floor(ny*(src.h-1));
    const i=(sy*src.w+sx)*4; return [src.data[i],src.data[i+1],src.data[i+2]];
  }

  function draw(){
    if(!src){ ctx.fillStyle='#8a8a90'; ctx.font='13px system-ui'; ctx.textAlign='center';
      ctx.fillText('Loading…', W/2, H/2); return; }
    const cols=Math.floor(P.cols), merge=P.merge, minH=P.minH, misreg=P.misreg,
      overlap=P.overlap/100, mode=P.mode, contrast=P.bleed/100;
    const pal=[hexToRgb(P.inkA), hexToRgb(P.inkB)];
    const colW=W/cols, step=4;

    // warm paper + speckle
    ctx.fillStyle='#fdfaf0'; ctx.fillRect(0,0,W,H);
    for(let i=0;i<5000;i++){ const gx=rnd(123+i)*W, gy=rnd(123+i*2)*H;
      ctx.fillStyle=`rgba(0,0,0,${0.02+rnd(123+i*3)*0.02})`; ctx.fillRect(gx,gy,1,1); }

    for(let i=0;i<cols;i++){
      const x=i*colW; let y0=0, cy=0, last=px(x+colW/2,0), seg=0;
      while(cy<H){
        cy+=step; const cur=px(x+colW/2,cy);
        const d=Math.sqrt((cur[0]-last[0])**2+(cur[1]-last[1])**2+(cur[2]-last[2])**2);
        const bottom=cy+step>=H, h=cy-y0;
        if(d>merge || bottom){
          if(h<minH && !bottom) continue;
          const y=y0, seed=i*1000+seg;
          const o1={x:rnd(seed)*misreg-misreg/2,y:rnd(seed+1)*misreg-misreg/2};
          const o2={x:rnd(seed+2)*misreg-misreg/2,y:rnd(seed+3)*misreg-misreg/2};
          let [r1,g1,b1]=px(x+colW*0.25,y+h/2,o1.x,o1.y);
          let [r2,g2,b2]=px(x+colW*0.75,y+h/2,o2.x,o2.y);
          if(mode==='Monochrome'){ const a1=(r1+g1+b1)/3,a2=(r2+g2+b2)/3; r1=g1=b1=a1; r2=g2=b2=a2; }
          else if(mode==='Riso Duotone'){ const l1=(r1+g1+b1)/765,l2=(r2+g2+b2)/765;
            r1=lerp(pal[0].r,pal[1].r,l1);g1=lerp(pal[0].g,pal[1].g,l1);b1=lerp(pal[0].b,pal[1].b,l1);
            r2=lerp(pal[0].r,pal[1].r,l2);g2=lerp(pal[0].g,pal[1].g,l2);b2=lerp(pal[0].b,pal[1].b,l2); }
          const bv1=(r1+g1+b1)/3, bv2=(r2+g2+b2)/3;
          let L,R; if(bv1<bv2){ L={r:r1,g:g1,b:b1}; R={r:r2,g:g2,b:b2}; } else { L={r:r2,g:g2,b:b2}; R={r:r1,g:g1,b:b1}; }
          ctx.save();
          if(overlap>0){ ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.8+(1-overlap)*0.2; }
          const grad=ctx.createLinearGradient(x,y,x+colW,y);
          const fL={r:Math.max(0,L.r*(1-contrast))|0,g:Math.max(0,L.g*(1-contrast))|0,b:Math.max(0,L.b*(1-contrast))|0};
          const fR={r:Math.min(255,lerp(R.r,255,contrast))|0,g:Math.min(255,lerp(R.g,255,contrast))|0,b:Math.min(255,lerp(R.b,255,contrast))|0};
          grad.addColorStop(0,`rgb(${fL.r},${fL.g},${fL.b})`); grad.addColorStop(1,`rgb(${fR.r},${fR.g},${fR.b})`);
          ctx.fillStyle=grad; ctx.fillRect(x,y,colW+0.5,h+0.5); ctx.restore();
          y0=cy; last=cur; seg++;
        }
      }
    }

    // riso grain pass
    if(P.grain>0){ const id=ctx.getImageData(0,0,W,H), dat=id.data, inten=P.grain*120, dens=P.density/100;
      for(let i=0;i<dat.length;i+=4){ if(rnd(i)<dens){ const n=(rnd(i+1)-0.5)*inten;
        dat[i]=Math.max(0,Math.min(255,dat[i]+n)); dat[i+1]=Math.max(0,Math.min(255,dat[i+1]+n)); dat[i+2]=Math.max(0,Math.min(255,dat[i+2]+n));
        const dk=rnd(i+2)*(inten*0.2); dat[i]=Math.max(0,dat[i]-dk); dat[i+1]=Math.max(0,dat[i+1]-dk); dat[i+2]=Math.max(0,dat[i+2]-dk); } }
      ctx.putImageData(id,0,0); }
  }

  function fit(){
    let ar = P.size==='source' && src ? src.w/src.h : (()=>{ const [a,b]=P.size.split('/').map(Number); return a/b; })();
    const long=1400; if(ar>=1){ W=long; H=Math.round(long/ar); } else { H=long; W=Math.round(long*ar); }
    art.width=W; art.height=H;
    // CSS fit into #wrap
    const wrap=$('wrap').getBoundingClientRect();
    const s=Math.min(wrap.width/W, wrap.height/H);
    art.style.width=(W*s)+'px'; art.style.height=(H*s)+'px';
    draw();
  }

  function loadImage(image){
    const c=document.createElement('canvas'); c.width=image.width; c.height=image.height;
    const cc=c.getContext('2d', { willReadFrequently:true }); cc.drawImage(image,0,0);
    src={ data:cc.getImageData(0,0,image.width,image.height).data, w:image.width, h:image.height };
    fit();
  }
  function loadURL(url){ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>loadImage(im); im.src=url; }

  // procedural sample so the effect shows immediately
  function sample(){
    const c=document.createElement('canvas'); c.width=900; c.height=1120; const g=c.getContext('2d');
    const grd=g.createLinearGradient(0,0,900,1120);
    grd.addColorStop(0,'#12306b'); grd.addColorStop(.45,'#c74d3a'); grd.addColorStop(.7,'#e8b23a'); grd.addColorStop(1,'#0f5138');
    g.fillStyle=grd; g.fillRect(0,0,900,1120);
    for(const [cx,cy,r,col] of [[300,360,260,'#f2e6c8'],[640,720,300,'#1b2b4d'],[520,300,140,'#e0483c'],[240,820,180,'#2f8f6a']]){
      const rg=g.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,col); rg.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,r,0,7); g.fill(); }
    loadImage(c);
  }

  // ---- wire controls ----
  function bind(id,rid,fn,fmt){ const el=$(id), out=$(rid);
    el.addEventListener('input',()=>{ fn(parseFloat(el.value)); if(out) out.textContent=fmt?fmt(el.value):el.value; draw(); }); }
  bind('col','colR',v=>P.cols=v); bind('mrg','mrgR',v=>P.merge=v); bind('mh','mhR',v=>P.minH=v);
  bind('ctr','ctrR',v=>P.bleed=v); bind('ovl','ovlR',v=>P.overlap=v);
  bind('grn','grnR',v=>P.grain=v/100, v=>v); bind('den','denR',v=>P.density=v); bind('mis','misR',v=>P.misreg=v);
  $('colA').addEventListener('input',e=>{P.inkA=e.target.value; draw();});
  $('colB').addEventListener('input',e=>{P.inkB=e.target.value; draw();});
  // colour mode segmented
  const duoRows=[$('duoA'),$('duoB')];
  function setMode(m,btn){ P.mode=m; [...document.querySelectorAll('.seg button')].forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
    duoRows.forEach(r=>r.style.display = m==='Riso Duotone'?'flex':'none'); draw(); }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode,b)));
  duoRows.forEach(r=>r.style.display='none');
  $('aspect').addEventListener('change',e=>{ P.size=e.target.value; fit(); });
  // image load
  $('loadBtn').addEventListener('click',()=>$('file').click());
  $('sampleBtn').addEventListener('click',sample);
  $('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadURL(URL.createObjectURL(f)); });
  // drag-drop
  ['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault();
    if(ev==='drop'&&e.dataTransfer.files[0]) loadURL(URL.createObjectURL(e.dataTransfer.files[0])); }));

  // ---- save + record ----
  $('saveBtn').addEventListener('click',()=>{ const a=document.createElement('a');
    a.download='offset.png'; a.href=art.toDataURL('image/png'); a.click(); });
  let rec=null, t0=0, tick=0;
  $('recBtn').addEventListener('click',()=>{
    if(rec){ rec.stop(); return; }
    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    const st=art.captureStream(30); rec=new MediaRecorder(st, mime?{mimeType:mime}:undefined); const chunks=[];
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{ clearInterval(tick); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false');
      const blob=new Blob(chunks,{type:chunks[0]?.type||'video/webm'}); const a=document.createElement('a');
      a.download='offset.'+((blob.type.indexOf('mp4')>=0)?'mp4':'webm'); a.href=URL.createObjectURL(blob); a.click(); rec=null; };
    rec.start(); t0=Date.now(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true');
    tick=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); $('recDot').querySelector('b').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0'); },250);
  });

  window.addEventListener('resize',()=>{ if(src) fit(); });
  sample();
})();
</script>
</body>
</html>
