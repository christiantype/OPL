<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Offset — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ max-width:100%; max-height:100%; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%);
    font-size:13px; padding:7px 13px; border-radius:0; pointer-events:none; z-index:7; white-space:nowrap; }
  #sizeDock{ position:fixed; bottom:18px; left:calc((100% + var(--rail))/2); transform:translateX(-50%); z-index:8;
    display:flex; align-items:center; gap:10px; background:var(--island); border:1px solid var(--line); padding:6px 8px 6px 13px; }
  #sizeDock #dimReadout{ font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #sizeDock select{ padding:7px 10px; }
  @media (max-width:560px){ #sizeDock{ left:50%; } }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .crow{ display:flex; align-items:center; justify-content:space-between; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .filebtn{ display:block; text-align:center; }
  .sw{ width:44px; height:24px; border:1px solid var(--line); padding:0; cursor:pointer; background:none; }
  select.full{ width:100%; }
</style>
<link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body class="dark">

<div id="wrap"><canvas id="art"></canvas></div>
<div id="hint">A photo, run through a grid of print screens</div>
<div id="recDot"><i></i><b>0:00</b></div>
<div id="sizeDock">
  <span id="dimReadout">1080 × 1080</span>
  <select id="aspect" title="Canvas size">
    <option value="1080/1080" selected>Square · 1:1</option>
    <option value="1080/1350">Portrait · 4:5</option>
    <option value="1080/1920">Story · 9:16</option>
    <option value="1920/1080">Landscape · 16:9</option>
  </select>
</div>

<div id="dock">
  <div class="group">
    <div class="group__t">Source</div>
    <p class="rowhint" style="margin:0;font-size:12px;color:var(--mute)">Drop a photo, or load one. Nothing leaves this page.</p>
    <div class="grid2">
      <button class="btn filebtn" id="loadBtn">Add image</button>
      <button class="btn" id="sampleBtn">Sample</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

  <div class="group">
    <div class="group__t">Grid</div>
    <div class="knob"><label>Columns <b id="colR">6</b></label><input id="col" type="range" min="1" max="24" value="6"></div>
    <div class="knob"><label>Rows <b id="rowR">7</b></label><input id="row" type="range" min="1" max="24" value="7"></div>
  </div>

  <div class="group">
    <div class="group__t">Screen</div>
    <select class="full" id="mode">
      <option value="cycle" selected>Random cycle</option>
      <option value="clean">Clean</option>
      <option value="halftone">Halftone</option>
      <option value="dither">Dither</option>
      <option value="pixelate">Pixelate</option>
      <option value="ascii">ASCII</option>
    </select>
    <div class="knob"><label>Fine <b id="mnR">6</b></label><input id="mn" type="range" min="2" max="30" value="6"></div>
    <div class="knob"><label>Coarse <b id="mxR">34</b></label><input id="mx" type="range" min="8" max="90" value="34"></div>
    <select class="full" id="dir">
      <option value="radial" selected>Scale · radial</option>
      <option value="linear">Scale · linear</option>
      <option value="random">Scale · random</option>
      <option value="flat">Scale · flat</option>
    </select>
    <div class="knob"><label>Mix bias <b id="bxR">0.9</b></label><input id="bx" type="range" min="0" max="100" value="90"></div>
  </div>

  <div class="group">
    <div class="group__t">Colour</div>
    <select class="full" id="colmode">
      <option value="duo" selected>Duotone · ink &amp; paper</option>
      <option value="colour">Colour · keep the photo</option>
    </select>
    <div class="crow"><label>Ink</label><input type="color" class="sw" id="ink" value="#93ff9e"></div>
    <div class="crow"><label>Paper</label><input type="color" class="sw" id="paper" value="#0a140a"></div>
    <div class="knob"><label>Contrast <b id="ctR">0.9</b></label><input id="ct" type="range" min="0" max="200" value="90"></div>
    <div class="knob"><label>Gamma <b id="gmR">1.4</b></label><input id="gm" type="range" min="40" max="260" value="140"></div>
  </div>

  <div class="group">
    <div class="group__t">Animate</div>
    <div class="grid2">
      <button class="btn" id="play" aria-pressed="false">Play</button>
      <button class="btn" id="reroll">Re-roll</button>
    </div>
    <div class="knob"><label>Speed <b id="spR">1.0</b></label><input id="sp" type="range" min="1" max="40" value="10"></div>
  </div>

  <div class="group out">
    <div class="group__t">Output</div>
    <div class="grid2">
      <button class="btn" id="recBtn">Record</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="/lab/shared/opal.js?v=3"></script>
<script>Opal.mountTopbar({ name:'Offset', desc:'A photo, run through a grid of print screens',
  about:'An image diced into a grid, each cell reprinted as a different screen — clean photo, halftone dots, ordered dither, pixel blocks, checkerboard or ASCII — the scale drifting radially from centre to edge, in a two-ink duotone or full colour. Random cycle keeps most cells clean and corrupts a scattered few. A rebuild of Brik’s Experimental Print on the OP/AL shell.',
  version:'v1' });</script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const art=$('art'), ctx=art.getContext('2d',{ willReadFrequently:true });
  const P={ cols:6, rows:7, mode:'cycle', fine:6, coarse:34, dir:'radial', bias:0.9, color:false,
    ink:'#93ff9e', paper:'#0a140a', contrast:0.9, gamma:1.4, playing:false, speed:1.0, size:'1080/1080', seed:1 };
  let src=null, W=1080, H=1080;

  const hex=h=>{ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[0,0,0]; };
  function rnd(s){ const x=Math.sin(s*127.1+311.7)*43758.5453; return x-Math.floor(x); }
  const BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]].map(r=>r.map(v=>(v+0.5)/16));

  // graded luminance 0..1 (dark->0) at canvas px
  // cover-fit: preserve the photo's aspect (centre-crop), never stretch to the canvas
  function srcIdx(x,y){ let u=x/W, v=y/H; const cAR=W/H, sAR=src.w/src.h;
    if(sAR>cAR){ u=(u-0.5)*(cAR/sAR)+0.5; } else { v=(v-0.5)*(sAR/cAR)+0.5; }
    const sx=Math.min(src.w-1, Math.max(0, (u*src.w)|0)), sy=Math.min(src.h-1, Math.max(0,(v*src.h)|0));
    return (sy*src.w+sx)*4; }
  function lum(x,y){
    if(!src) return 1;
    const i=srcIdx(x,y); let L=(src.data[i]*0.299+src.data[i+1]*0.587+src.data[i+2]*0.114)/255;
    L=(L-0.5)*(0.4+P.contrast*1.6)+0.5;
    L=Math.max(0,Math.min(1,L)); L=Math.pow(L, 1/Math.max(0.1,P.gamma));
    return Math.max(0,Math.min(1,L));
  }
  function avgLum(x0,y0,w,h){ let s=0,n=0; const st=Math.max(1,(Math.min(w,h)/4)|0);
    for(let y=y0;y<y0+h;y+=st)for(let x=x0;x<x0+w;x+=st){ s+=lum(x,y); n++; } return n?s/n:1; }
  // full-colour sampling (used by the Colour mode) — same contrast/gamma curve applied per channel
  function tone(v){ v=(v/255-0.5)*(0.4+P.contrast*1.6)+0.5; v=Math.max(0,Math.min(1,v)); v=Math.pow(v,1/Math.max(0.1,P.gamma)); return (v*255)|0; }
  function rgbAt(x,y){ if(!src) return [0,0,0]; const i=srcIdx(x,y); return [tone(src.data[i]),tone(src.data[i+1]),tone(src.data[i+2])]; }
  function avgRGB(x0,y0,w,h){ let r=0,g=0,b=0,n=0; const st=Math.max(1,(Math.min(w,h)/4)|0);
    for(let y=y0;y<y0+h;y+=st)for(let x=x0;x<x0+w;x+=st){ const c=rgbAt(x,y); r+=c[0];g+=c[1];b+=c[2];n++; } return n?[(r/n)|0,(g/n)|0,(b/n)|0]:[0,0,0]; }
  const rgbStr=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

  // Photo-dominant: most cells stay a recognizable fine halftone of the source ('base');
  // a minority (1 - bias) 'corrupt' into a coarse alternate screen.
  function cellEffect(c,r,phase){
    if(P.mode!=='cycle') return P.mode;
    const k=rnd(c*31.7+r*57.3+phase*1.13);
    if(k < P.bias) return 'base';
    const corr=['pixelate','checker','halftone','dither','ascii'];
    const j=rnd(c*13.1+r*29.7+phase*2.7+9.3);
    return corr[Math.min(corr.length-1,(j*corr.length)|0)];
  }
  function cellScale(c,r){
    let d; const nx=(c+0.5)/P.cols-0.5, ny=(r+0.5)/P.rows-0.5;
    if(P.dir==='radial') d=Math.min(1, Math.hypot(nx,ny)/0.55);
    else if(P.dir==='linear') d=(c+0.5)/P.cols;
    else if(P.dir==='random') d=rnd(c*12.3+r*7.7+P.seed);
    else d=0.5;
    return P.fine + (P.coarse-P.fine)*d;
  }

  // ink = printed colour (bright), paper = substrate (dark). Bright source -> more ink.
  function draw(phase){
    if(!src){ ctx.fillStyle='#8a8a90'; ctx.font='13px system-ui'; ctx.textAlign='center'; ctx.fillText('Loading…',W/2,H/2); return; }
    const [ir,ig,ib]=hex(P.ink), [pr,pg,pb]=hex(P.paper);
    const mix=(L)=>`rgb(${(pr+(ir-pr)*L)|0},${(pg+(ig-pg)*L)|0},${(pb+(ib-pb)*L)|0})`;
    const INK=`rgb(${ir},${ig},${ib})`, PAPER=`rgb(${pr},${pg},${pb})`;
    ctx.fillStyle=PAPER; ctx.fillRect(0,0,W,H);
    const cw=W/P.cols, ch=H/P.rows;
    for(let r=0;r<P.rows;r++)for(let c=0;c<P.cols;c++){
      const x0=Math.round(c*cw), y0=Math.round(r*ch), w=Math.round((c+1)*cw)-x0, h=Math.round((r+1)*ch)-y0;
      let eff=cellEffect(c,r,phase), s;
      if(eff==='base'){ eff='halftone'; s=Math.max(2,P.fine); }         // recognizable fine screen
      else s=Math.max(3,cellScale(c,r));                                 // corrupted -> coarse
      ctx.save(); ctx.beginPath(); ctx.rect(x0,y0,w,h); ctx.clip();
      const CLR=P.color;
      if(eff==='photo'||eff==='clean'){
        for(let y=y0;y<y0+h;y+=2)for(let x=x0;x<x0+w;x+=2){ ctx.fillStyle=CLR?rgbStr(rgbAt(x,y)):mix(lum(x,y)); ctx.fillRect(x,y,2,2); }
      } else if(eff==='pixel'||eff==='pixelate'){
        for(let y=y0;y<y0+h;y+=s)for(let x=x0;x<x0+w;x+=s){ ctx.fillStyle=CLR?rgbStr(avgRGB(x,y,s,s)):mix(avgLum(x,y,s,s)); ctx.fillRect(x,y,Math.ceil(s),Math.ceil(s)); }
      } else if(eff==='ascii'){
        const CH=' .:-=+*#%@';                         // sparse -> dense; bright source packs a denser glyph
        const step=Math.max(6,s|0);
        ctx.textAlign='left'; ctx.textBaseline='top'; ctx.font=`bold ${Math.round(step*1.15)}px ui-monospace, "SF Mono", Menlo, monospace`;
        for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){ const L=avgLum(x,y,step,step);
          const g=CH[Math.max(0,Math.min(CH.length-1, Math.round(L*(CH.length-1))))];
          if(g===' ') continue; ctx.fillStyle=CLR?rgbStr(avgRGB(x,y,step,step)):INK; ctx.fillText(g,x,y); }
      } else if(eff==='dither'){
        const step=Math.max(1,(s/3)|0);
        for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){ const L=avgLum(x,y,step,step);
          const on=L>=BAYER[((y/step)|0)%4][((x/step)|0)%4];
          ctx.fillStyle= on?(CLR?rgbStr(avgRGB(x,y,step,step)):INK):PAPER; ctx.fillRect(x,y,step,step); }
      } else if(eff==='checker'){
        const step=Math.max(4,s|0);
        for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){ const L=avgLum(x,y,step,step);
          const chk=(((x/step)|0)+((y/step)|0))&1;
          const on = chk ? (L>=0.5) : (L<0.5);
          ctx.fillStyle= on?(CLR?rgbStr(avgRGB(x,y,step,step)):INK):PAPER; ctx.fillRect(x,y,step,step); }
      } else { // halftone — dots sized by brightness on paper
        if(!CLR) ctx.fillStyle=INK;
        for(let y=y0+s/2;y<y0+h+s;y+=s)for(let x=x0+s/2;x<x0+w+s;x+=s){ const L=avgLum(x-s/2,y-s/2,s,s);
          const rad=(s*0.62)*Math.sqrt(Math.max(0,L)); if(rad>0.3){ if(CLR) ctx.fillStyle=rgbStr(avgRGB(x-s/2,y-s/2,s,s)); ctx.beginPath(); ctx.arc(x,y,rad,0,6.2832); ctx.fill(); } }
      }
      ctx.restore();
    }
  }

  // Canvas size is driven ONLY by the selected aspect — adding an image never resizes it.
  function fit(){
    const [a,b]=P.size.split('/').map(Number); const ar=a/b;
    const long=1400; if(ar>=1){ W=long; H=Math.round(long/ar); } else { H=long; W=Math.round(long*ar); }
    art.width=W; art.height=H;
    const dr=$('dimReadout'); if(dr) dr.textContent=`${a} × ${b}`;
    const box=$('wrap').getBoundingClientRect(); const sc=Math.min(box.width/W, box.height/H);
    art.style.width=(W*sc)+'px'; art.style.height=(H*sc)+'px'; draw(0);
  }
  function loadImage(im){ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
    const cc=c.getContext('2d',{willReadFrequently:true}); cc.drawImage(im,0,0);
    src={ data:cc.getImageData(0,0,im.width,im.height).data, w:im.width, h:im.height }; fit(); }
  function loadURL(u){ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>loadImage(im); im.src=u; }
  function sample(){ const c=document.createElement('canvas'); c.width=900; c.height=1120; const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,700,1120); gr.addColorStop(0,'#e9e4d6'); gr.addColorStop(1,'#3a3a44'); g.fillStyle=gr; g.fillRect(0,0,900,1120);
    for(const a of [[300,340,240,'#fff'],[620,700,300,'#111'],[500,300,150,'#d8d8d8'],[250,860,190,'#eee'],[720,980,150,'#000']]){
      const rg=g.createRadialGradient(a[0],a[1],0,a[0],a[1],a[2]); rg.addColorStop(0,a[3]); rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rg; g.beginPath(); g.arc(a[0],a[1],a[2],0,7); g.fill(); }
    loadImage(c); }

  let raf=0, t0=0;
  function loop(){ raf=requestAnimationFrame(loop); const phase=Math.floor((performance.now()-t0)/1000*P.speed); draw(phase); }
  function setPlay(on){ P.playing=on; $('play').textContent=on?'Pause':'Play'; $('play').setAttribute('aria-pressed',on);
    if(on){ t0=performance.now(); loop(); } else { cancelAnimationFrame(raf); draw(0); } }

  function bind(id,rid,fn,fmt){ const el=$(id),o=$(rid); el.addEventListener('input',()=>{ fn(parseFloat(el.value)); if(o)o.textContent=fmt?fmt(el.value):el.value; if(!P.playing)draw(0); }); }
  bind('col','colR',v=>{P.cols=v;}); bind('row','rowR',v=>{P.rows=v;});
  bind('mn','mnR',v=>P.fine=v); bind('mx','mxR',v=>P.coarse=v);
  bind('bx','bxR',v=>P.bias=v/100,v=>(v/100).toFixed(2));
  bind('ct','ctR',v=>P.contrast=v/100,v=>(v/100).toFixed(2)); bind('gm','gmR',v=>P.gamma=v/100,v=>(v/100).toFixed(1));
  bind('sp','spR',v=>P.speed=v/10,v=>(v/10).toFixed(1));
  $('mode').addEventListener('change',e=>{P.mode=e.target.value; if(!P.playing)draw(0);});
  $('colmode').addEventListener('change',e=>{P.color=e.target.value==='colour'; if(!P.playing)draw(0);});
  $('dir').addEventListener('change',e=>{P.dir=e.target.value; if(!P.playing)draw(0);});
  $('ink').addEventListener('input',e=>{P.ink=e.target.value; if(!P.playing)draw(0);});
  $('paper').addEventListener('input',e=>{P.paper=e.target.value; if(!P.playing)draw(0);});
  $('aspect').addEventListener('change',e=>{P.size=e.target.value; fit();});
  $('loadBtn').addEventListener('click',()=>$('file').click());
  $('sampleBtn').addEventListener('click',sample);
  $('reroll').addEventListener('click',()=>{ P.seed=1+Math.floor(rnd(P.seed+7)*9999); if(!P.playing)draw(0); });
  $('play').addEventListener('click',()=>setPlay(!P.playing));
  $('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadURL(URL.createObjectURL(f)); });
  ['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'&&e.dataTransfer.files[0]) loadURL(URL.createObjectURL(e.dataTransfer.files[0])); }));

  Opal.mountOutput(art,'offset');
  let rec=null,rt=0,tk=0;
  $('recBtn').addEventListener('click',()=>{ if(rec){rec.stop();return;}
    if(!P.playing) setPlay(true);
    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime}:undefined); const ch=[];
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onstop=()=>{ clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false');
      const bl=new Blob(ch,{type:ch[0]?.type||'video/webm'}); const a=document.createElement('a'); a.download='offset.'+(bl.type.indexOf('mp4')>=0?'mp4':'webm'); a.href=URL.createObjectURL(bl); a.click(); rec=null; };
    rec.start(); rt=Date.now(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true');
    tk=setInterval(()=>{ const s=Math.floor((Date.now()-rt)/1000); $('recDot').querySelector('b').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0'); },250); });

  addEventListener('resize',()=>{ if(src) fit(); });
  sample();
})();
</script>
</body>
</html>
