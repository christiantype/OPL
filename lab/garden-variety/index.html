<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Garden Variety — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  /* Shared Lab shell — conformed to the Attractor standard so the whole Lab reads as one product. */
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overscroll-behavior:none; }
  body.dark .opal-topbar{ background:transparent; border:none; color:var(--ink); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }

  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%); font-size:13px; color:var(--dim);
    background:rgba(11,12,20,.7); padding:6px 14px; border-radius:999px; pointer-events:none; transition:opacity .3s; z-index:7; }
  /* canvas-size dock — pinned top-right on every tool */
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ background:rgba(15,16,24,.92); color:var(--ink); border:1px solid var(--line); border-radius:2px;
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; cursor:pointer;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em; color:#ff5468;
    background:rgba(15,16,24,.92); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:#ff5468; animation:recblink 1s infinite; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  @keyframes recblink{ 50%{ opacity:.25; } }

  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(15,16,24,.92); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column; gap:0; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-moz-range-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--ink); }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-start; }
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.11); }
  .btn[aria-pressed="true"], .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  .chip{ font-size:11px; letter-spacing:.04em; padding:7px 10px; }
  select.btn{ text-transform:uppercase; }
  /* grouped sections — a clean, labelled stack with dividers */
  .group{ display:flex; flex-direction:column; gap:9px; }
  .group + .group{ margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
  .group__t{ font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid2 .btn, .btn.full{ width:100%; }
  /* colour rows — label left, swatch right */
  .crow{ display:flex; align-items:center; justify-content:space-between; }
  .crow label{ font-size:12px; color:var(--ink); }
  .crow input[type=color]{ width:44px; height:24px; border:1px solid var(--line); border-radius:4px; background:none; padding:0; cursor:pointer; }
  .crow input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  .crow input[type=color]::-webkit-color-swatch{ border:none; border-radius:2px; }
  .tip{ position:fixed; z-index:60; display:none; max-width:230px; padding:9px 11px; border-radius:8px;
    background:rgba(18,20,28,.97); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }

  /* Garden Variety's own — the canvas is a free-form drawing surface, but it sits as a
     centred artboard on a light-grey mat (like Attractor): the wrapper pads + flex-centres it. */
  #stagewrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  #stage{ display:block; max-width:100%; max-height:100%; touch-action:none; cursor:crosshair; }
  .fld{ display:block; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); margin-bottom:5px; }
  #status{ position:fixed; bottom:14px; left:calc(var(--rail) + 16px); z-index:5; pointer-events:none;
    font-size:11px; letter-spacing:.08em; color:var(--dim); display:none; }
  #cropFrame{ position:fixed; z-index:4; border:1px solid var(--ink); pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.28); opacity:0; transition:opacity .25s ease; }
  #cropFrame.show{ opacity:.9; }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">

<div id="stagewrap"><canvas id="stage"></canvas></div>
<div id="cropFrame"></div>
<div id="status"></div>
<div id="hint">Drag on the canvas to plant blooms — or grow a whole garden</div>
<div id="recDot"><i></i><b>0:00</b></div>
<div id="sizeDock">
  <select id="sizeSel" title="Canvas size">
    <option value="1080x1350">Portrait · 4:5</option>
    <option value="1080x1920">Story · 9:16</option>
    <option value="1080x1080">Square · 1:1</option>
    <option value="1920x1080">Landscape · 16:9</option>
  </select>
</div>

<div id="dock">

  <!-- bloom -->
  <div class="group">
    <div class="group__t">Bloom</div>
    <div class="knob" data-tip="How big each bloom is."><label>Size <b id="sizeR">52</b></label><input id="size" type="range" min="18" max="120" value="52" /></div>
    <div data-tip="Auto varies the colour from a warm palette as you plant. Solid uses your one chosen colour.">
      <label class="fld">Colour</label>
      <div class="grid2" id="modeSeg">
        <button class="btn" data-m="auto" aria-pressed="true">Auto</button>
        <button class="btn" data-m="solid" aria-pressed="false">Solid</button>
      </div>
    </div>
    <div class="crow" data-tip="The bloom colour, used in Solid mode."><label>Bloom</label><input type="color" id="bloomCol" value="#e0a8b0" /></div>
    <div class="crow" data-tip="Colour of the ground / paper."><label>Ground</label><input type="color" id="ground" value="#0a0908" /></div>
  </div>

  <!-- stem -->
  <div class="group">
    <div class="group__t">Stem</div>
    <div data-tip="Line is a painted vine; Dots is a trail of dots; Pixel is blocky; Bead is a string of beads; Node draws points joined by thin links.">
      <label class="fld">Style</label>
      <div class="row" id="stemSeg">
        <button class="btn chip" data-s="line" aria-pressed="true">Line</button>
        <button class="btn chip" data-s="dotted" aria-pressed="false">Dots</button>
        <button class="btn chip" data-s="pixel" aria-pressed="false">Pixel</button>
        <button class="btn chip" data-s="beaded" aria-pressed="false">Bead</button>
        <button class="btn chip" data-s="node" aria-pressed="false">Node</button>
      </div>
    </div>
    <div class="knob" data-tip="How thick the stems are."><label>Weight <b id="stemWR">2</b></label><input id="stemW" type="range" min="1" max="12" value="2" /></div>
    <div class="crow" data-tip="Colour of the stems."><label>Stem</label><input type="color" id="stemCol" value="#5fc4bc" /></div>
  </div>

  <!-- garden -->
  <div class="group">
    <div class="group__t">Garden</div>
    <div class="knob" data-tip="How many stems branch out when you grow a garden."><label>Density <b id="densR">10</b></label><input id="dens" type="range" min="3" max="24" value="10" /></div>
    <div class="grid2">
      <button class="btn primary full" id="growBtn" data-tip="Grows a whole garden from a random point.">Grow</button>
      <button class="btn full" id="clearBtn" data-tip="Clears the canvas.">Clear</button>
    </div>
  </div>

  <!-- export -->
  <div class="group">
    <div class="group__t">Export</div>
    <div class="grid2">
      <button class="btn" id="saveBtn" data-tip="Saves the current crop as a PNG.">Save</button>
      <button class="btn" id="recBtn" aria-pressed="false" data-tip="Records the garden growing as a video (MP4 where supported).">Record</button>
    </div>
  </div>

</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name: 'Garden Variety', desc: 'Generative watercolor garden', version: 'v1', about: 'Plant soft watercolour blooms by dragging, trailed by connecting stems that bleed and wander. Choose the colours and stem style, grow a whole garden at once, and export a still or record it growing as a video.' });</script>

<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const state={ size:52, mode:'auto', bloomCol:'#e0a8b0', ground:'#0a0908',
    stemStyle:'line', stemW:2, stemCol:'#5fc4bc', dens:10, exp:'1080x1350' };

  const PAL={ mustard:"#c9b84a",olive:"#9a8a2a",coral:"#e0a088",salmon:"#d98b6f",pink:"#e0a8b0",rust:"#8a5a3a",bone:"#e8e4d8",teal:"#5fc4bc" };
  const BLOOM_WEIGHTS=[["mustard",5],["olive",2],["coral",2],["salmon",2],["pink",1.4],["rust",1.6],["bone",1.2]];

  const stage=$('stage'), view=stage.getContext('2d');
  const paint=document.createElement('canvas'), pctx=paint.getContext('2d');
  const wrap=$('stagewrap'); let grainPat=null, W=0,H=0,DPR=1;

  const hexToRgb=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
  const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const weighted=list=>{let t=0;for(const [,w] of list)t+=w;let r=Math.random()*t;for(const [k,w] of list){if((r-=w)<=0)return k;}return list[0][0];};
  const jitterCol=(rgb,f)=>rgb.map(v=>Math.max(0,Math.min(255,v*f)));
  const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

  function makeGrain(){ const s=160,c=document.createElement('canvas');c.width=c.height=s;
    const g=c.getContext('2d'),img=g.createImageData(s,s),d=img.data;
    for(let i=0;i<d.length;i+=4){ const n=(Math.random()*22)|0; d[i]=d[i+1]=d[i+2]=n; d[i+3]=Math.random()*26; }
    g.putImageData(img,0,0); return view.createPattern(c,'repeat'); }
  function resetPaint(){ pctx.setTransform(1,0,0,1,0,0); pctx.fillStyle=state.ground; pctx.fillRect(0,0,paint.width,paint.height);
    pctx.save(); pctx.scale(DPR,DPR); if(grainPat){ pctx.globalAlpha=1; pctx.fillStyle=grainPat; pctx.fillRect(0,0,W,H); } pctx.restore();
    pctx.setTransform(DPR,0,0,DPR,0,0); }
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2); const M=24, r=wrap.getBoundingClientRect(); W=Math.max(1,r.width-M*2); H=Math.max(1,r.height-M*2);
    stage.width=paint.width=Math.round(W*DPR); stage.height=paint.height=Math.round(H*DPR);
    stage.style.width=W+'px'; stage.style.height=H+'px'; view.setTransform(DPR,0,0,DPR,0,0); grainPat=makeGrain(); resetPaint(); layoutCrop(); blit(); }
  addEventListener('resize',()=>setTimeout(resize,120));

  function stampBlob(x,y,r,rgb,a){ const g=pctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,rgba(rgb,a)); g.addColorStop(0.55,rgba(rgb,a*0.42)); g.addColorStop(1,rgba(rgb,0));
    pctx.fillStyle=g; pctx.beginPath(); pctx.arc(x,y,r,0,7); pctx.fill(); }
  function buildBloom(x,y,size,rgb){ const blobs=[], rings=4+((size/22)|0);
    for(let ring=0;ring<rings;ring++){ const t=ring/rings, rr=size*(0.16+t*0.9), count=6+Math.round(t*14);
      for(let i=0;i<count;i++){ const ang=Math.random()*Math.PI*2, spread=size*t*rnd(0.35,1.05);
        blobs.push({x:x+Math.cos(ang)*spread+rnd(-4,4),y:y+Math.sin(ang)*spread+rnd(-4,4),r:rr*rnd(0.5,1.1),rgb:jitterCol(rgb,rnd(0.68,1.14)),a:(0.10+(1-t)*0.16)*rnd(0.7,1.1)}); } }
    if(Math.random()<0.4){ const n=6+((Math.random()*10)|0); for(let i=0;i<n;i++){ const ang=Math.random()*Math.PI*2,d=size*rnd(0.3,1.2);
      blobs.push({x:x+Math.cos(ang)*d,y:y+Math.sin(ang)*d,r:rnd(1.2,3.2),rgb:jitterCol(rgb,rnd(0.85,1.15)),a:rnd(0.25,0.55)}); } }
    return blobs; }
  function buildVine(x0,y0,tx,ty,len){ const pts=[{x:x0,y:y0}]; let x=x0,y=y0;
    let ang=(tx!=null)?Math.atan2(ty-y0,tx-x0):Math.random()*Math.PI*2; const step=5.5, n=len||(24+((Math.random()*90)|0));
    const curl=rnd(-0.14,0.14),freq=rnd(0.12,0.28),amp=rnd(0.05,0.13),ph=Math.random()*7;
    for(let i=0;i<n;i++){ if(tx!=null){ const toT=Math.atan2(ty-y,tx-x); ang+=angDiff(toT,ang)*0.045; }
      ang+=curl+Math.sin(i*freq+ph)*amp+rnd(-0.14,0.14); x+=Math.cos(ang)*step; y+=Math.sin(ang)*step; pts.push({x,y}); }
    return pts; }

  let bloomQ=[], vineQ=[], raf=null, running=false;
  function currentBloomRgb(){ return state.mode==='solid' ? hexToRgb(state.bloomCol) : hexToRgb(PAL[weighted(BLOOM_WEIGHTS)]); }
  function plantBloom(x,y,size,rgb){ const blobs=buildBloom(x,y,size,rgb);
    if(reduce){ for(const b of blobs) stampBlob(b.x,b.y,b.r,b.rgb,b.a); return; }
    bloomQ.push({blobs,i:0,perFrame:Math.max(3,(blobs.length/26)|0)}); ensureLoop(); }
  function growVine(x0,y0,tx,ty,opts={}){ const rgb=hexToRgb(state.stemCol), pts=buildVine(x0,y0,tx,ty,opts.len);
    const v={pts,i:1,perFrame:reduce?pts.length:3,rgb,w0:state.stemW,tip:opts.tip!==false,beads:new Set()};
    for(let i=8;i<pts.length;i+=((Math.random()*14+8)|0)){ if(Math.random()<0.5) v.beads.add(i); }
    if(reduce){ drawVineTo(v,pts.length); if(v.tip) plantBloom(pts[pts.length-1].x,pts[pts.length-1].y,rnd(14,30),currentBloomRgb()); return; }
    vineQ.push(v); ensureLoop(); }
  function drawVineSeg(v,i){ const a=v.pts[i-1], b=v.pts[i], t=i/v.pts.length, w=Math.max(0.5,v.w0*(1-t*0.55)), col=v.rgb, st=state.stemStyle;
    pctx.save();
    if(st==='pixel'){ const s=Math.max(2,w*1.7); pctx.fillStyle=rgba(col,0.92); pctx.fillRect(b.x-s/2,b.y-s/2,s,s); }
    else if(st==='beaded'){ pctx.fillStyle=rgba(col,0.92); pctx.beginPath(); pctx.arc(b.x,b.y,Math.max(1.2,w*1.05),0,7); pctx.fill(); }
    else if(st==='dotted'){ if(i%3===0){ pctx.fillStyle=rgba(col,0.9); pctx.beginPath(); pctx.arc(b.x,b.y,Math.max(1,w*0.85),0,7); pctx.fill(); } }
    else if(st==='node'){ pctx.strokeStyle=rgba(col,0.55); pctx.lineWidth=Math.max(0.6,w*0.5); pctx.lineCap='round';
      pctx.beginPath(); pctx.moveTo(a.x,a.y); pctx.lineTo(b.x,b.y); pctx.stroke();
      if(i%6===0){ pctx.fillStyle=rgba(col,0.95); pctx.beginPath(); pctx.arc(b.x,b.y,Math.max(1.6,w*1.4),0,7); pctx.fill(); } }
    else { pctx.strokeStyle=rgba(col,0.85); pctx.lineWidth=w; pctx.lineCap='round'; pctx.shadowColor=rgba(col,0.5); pctx.shadowBlur=5;
      pctx.beginPath(); pctx.moveTo(a.x,a.y); pctx.lineTo(b.x,b.y); pctx.stroke(); }
    pctx.restore();
    if(v.beads.has(i) && st==='line'){ pctx.fillStyle=rgba(jitterCol(col,rnd(0.9,1.15)),0.9); pctx.beginPath(); pctx.arc(b.x,b.y,rnd(1.6,3.2),0,7); pctx.fill(); } }
  function drawVineTo(v,end){ for(let i=v.i;i<end;i++) drawVineSeg(v,i); v.i=end; }
  function tick(){
    for(let k=bloomQ.length-1;k>=0;k--){ const bl=bloomQ[k], end=Math.min(bl.blobs.length,bl.i+bl.perFrame);
      for(;bl.i<end;bl.i++){ const b=bl.blobs[bl.i]; stampBlob(b.x,b.y,b.r,b.rgb,b.a); } if(bl.i>=bl.blobs.length) bloomQ.splice(k,1); }
    for(let k=vineQ.length-1;k>=0;k--){ const v=vineQ[k], end=Math.min(v.pts.length,v.i+v.perFrame); drawVineTo(v,end);
      if(v.i>=v.pts.length){ if(v.tip){ const p=v.pts[v.pts.length-1]; plantBloom(p.x,p.y,rnd(14,32),currentBloomRgb()); } vineQ.splice(k,1); } }
    view.clearRect(0,0,W,H); view.drawImage(paint,0,0,W,H);
    if(bloomQ.length||vineQ.length){ raf=requestAnimationFrame(tick); } else { running=false; raf=null; blit(); } }
  function ensureLoop(){ if(!running){ running=true; raf=requestAnimationFrame(tick); } }
  function blit(){ view.clearRect(0,0,W,H); view.drawImage(paint,0,0,W,H); }

  // ---- input ----
  let painting=false,last=null;
  function toXY(e){ const r=stage.getBoundingClientRect(), p=e.touches?e.touches[0]:e; return {x:p.clientX-r.left,y:p.clientY-r.top}; }
  function down(e){ e.preventDefault(); painting=true; const p=toXY(e); plantBloom(p.x,p.y,state.size,currentBloomRgb()); last=p; }
  function move(e){ if(!painting) return; e.preventDefault(); const p=toXY(e), d=Math.hypot(p.x-last.x,p.y-last.y), gap=state.size*0.9;
    if(d>gap){ growVine(last.x,last.y,p.x,p.y,{tip:false,len:Math.max(10,(d/5.5)|0)}); plantBloom(p.x,p.y,state.size*rnd(0.7,1.05),currentBloomRgb()); last=p; } }
  function up(){ painting=false; last=null; }
  stage.addEventListener('mousedown',down); addEventListener('mousemove',move); addEventListener('mouseup',up);
  stage.addEventListener('touchstart',down,{passive:false}); stage.addEventListener('touchmove',move,{passive:false}); addEventListener('touchend',up);

  function growGarden(){ const cx=W*rnd(0.35,0.65), cy=H*rnd(0.32,0.6); let x=cx,y=cy,delay=0;
    plantBloom(x,y,rnd(60,110),currentBloomRgb()); const nodes=state.dens;
    for(let i=0;i<nodes;i++){ const ang=Math.random()*Math.PI*2, reach=rnd(90,260);
      const nx=Math.max(40,Math.min(W-40,x+Math.cos(ang)*reach)), ny=Math.max(60,Math.min(H-90,y+Math.sin(ang)*reach));
      ((px,py,tx,ty)=>setTimeout(()=>growVine(px,py,tx,ty,{tip:true}),delay))(x,y,nx,ny);
      delay+=reduce?0:rnd(180,420); x=(x+nx)/2; y=(y+ny)/2; } }

  // ---- crop / export ----
  const cropEl=$('cropFrame'); let cropRect={x:0,y:0,w:0,h:0}, cropHideT=null;
  function layoutCrop(){ if(state.exp==='full'){ cropRect={x:0,y:0,w:W,h:H}; return; }
    const [rw,rh]=state.exp.split('x').map(Number), ar=rw/rh, padTop=108,padBottom=20,padX=16;
    const availW=W-padX*2, availH=H-padTop-padBottom; let h=availH,w=h*ar; if(w>availW){ w=availW; h=w/ar; }
    const x=(W-w)/2, y=padTop+(availH-h)/2; cropRect={x,y,w,h};
    const wr=stage.getBoundingClientRect();   // cropRect is canvas-relative; the overlay is viewport-fixed, so offset by the canvas origin (canvas is inset within the mat)
    cropEl.style.left=(wr.left+x)+'px'; cropEl.style.top=(wr.top+y)+'px'; cropEl.style.width=w+'px'; cropEl.style.height=h+'px'; }
  function flashCrop(){ if(state.exp==='full'){ cropEl.classList.remove('show'); return; } layoutCrop(); cropEl.classList.add('show');
    clearTimeout(cropHideT); cropHideT=setTimeout(()=>{ if(!recording) cropEl.classList.remove('show'); },2600); }
  function savePNG(){ const c=document.createElement('canvas');
    if(state.exp==='full'){ c.width=paint.width; c.height=paint.height; c.getContext('2d').drawImage(paint,0,0); }
    else { const [rw,rh]=state.exp.split('x').map(Number); const sc=2; c.width=rw*sc; c.height=rh*sc;
      c.getContext('2d').drawImage(paint, cropRect.x*DPR,cropRect.y*DPR,cropRect.w*DPR,cropRect.h*DPR, 0,0,c.width,c.height); }
    c.toBlob(b=>{ const a=document.createElement('a'); a.download=`garden-variety-${state.exp}-${Date.now()}.png`; a.href=URL.createObjectURL(b); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); },'image/png');
    setStatus('saved PNG'); setTimeout(()=>setStatus(''),1500); }

  function pickMime(){ const l=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm']; for(const m of l) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; return ''; }
  let recording=false, mediaRec=null, recChunks=[], recRAF=null, recCanvas=document.createElement('canvas'), rctx=recCanvas.getContext('2d');
  let recStart=0, recTimer=null;
  const recFmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  function startRec(){ const mime=pickMime(); if(!mime){ setStatus('recording not supported here'); setTimeout(()=>setStatus(''),2600); return; }
    let rw,rh; if(state.exp==='full'){ rw=Math.round(W), rh=Math.round(H); rw-=rw%2; rh-=rh%2; } else { [rw,rh]=state.exp.split('x').map(Number); }
    recCanvas.width=rw; recCanvas.height=rh; layoutCrop(); cropEl.classList.add('show');
    const stream=recCanvas.captureStream(60); recChunks=[];
    try{ mediaRec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(60000000,Math.max(24000000,Math.round(recCanvas.width*recCanvas.height*60*0.25)))}); }catch(e){ mediaRec=new MediaRecorder(stream); }
    mediaRec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
    mediaRec.onstop=()=>{ const type=(mediaRec&&mediaRec.mimeType)||mime, ext=type.includes('mp4')?'mp4':'webm';
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(recChunks,{type})); a.download=`garden-variety-${state.exp}-${Date.now()}.${ext}`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
      setStatus('saved '+ext.toUpperCase()); setTimeout(()=>setStatus(''),2200); };
    mediaRec.start(100); recording=true; $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true'); recLoop(); setStatus('recording…');
    recStart=performance.now(); $('recDot').classList.add('on'); $('recDot').querySelector('b').textContent='0:00';
    recTimer=setInterval(()=>{ $('recDot').querySelector('b').textContent=recFmt(performance.now()-recStart); },250); }
  function recLoop(){ const sx=cropRect.x*DPR, sy=cropRect.y*DPR, sw=cropRect.w*DPR, sh=cropRect.h*DPR;
    rctx.drawImage(paint, sx,sy,sw,sh, 0,0,recCanvas.width,recCanvas.height); if(recording) recRAF=requestAnimationFrame(recLoop); }
  function stopRec(){ if(!recording) return; recording=false; cancelAnimationFrame(recRAF); try{ mediaRec.stop(); }catch(e){}
    $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false');
    clearInterval(recTimer); $('recDot').classList.remove('on');
    setTimeout(()=>{ if(!recording&&state.exp!=='full') cropEl.classList.remove('show'); },1200); }

  // ---- UI ----
  function setStatus(t){ const s=$('status'); if(!s) return; s.textContent=t; s.style.display=t?'block':'none'; }
  function bindSeg(id,key,dk,after){ document.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener('click',()=>{ state[key]=b.dataset[dk]; document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); if(after)after(); })); }
  const bind=(id,key,fn)=>{ const e=$(id); e.addEventListener('input',ev=>{ state[key]=+ev.target.value; const r=$(id+'R'); if(r)r.textContent=ev.target.value; if(fn)fn(); }); };
  function wire(){
    bindSeg('modeSeg','mode','m'); bindSeg('stemSeg','stemStyle','s');
    bind('size','size'); bind('stemW','stemW'); bind('dens','dens');
    $('bloomCol').addEventListener('input',e=>state.bloomCol=e.target.value);
    $('stemCol').addEventListener('input',e=>state.stemCol=e.target.value);
    $('ground').addEventListener('input',e=>{ state.ground=e.target.value; });
    $('sizeSel').addEventListener('change',e=>{ state.exp=e.target.value; flashCrop(); });
    $('growBtn').addEventListener('click',growGarden);
    $('clearBtn').addEventListener('click',()=>{ bloomQ=[]; vineQ=[]; resetPaint(); blit(); });
    $('saveBtn').addEventListener('click',savePNG);
    $('recBtn').addEventListener('click',()=>recording?stopRec():startRec());
    addEventListener('keydown',e=>{ if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      if(e.key==='g'||e.key==='G') growGarden(); });
  }

  // ---- tooltips ----
  let tipEl=null,tipT=null,tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return; if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0'; const r=host.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8,r.bottom+8); tipEl.style.left=Math.max(8,Math.min(r.left,innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return; clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown',hideTip); addEventListener('scroll',hideTip,true);

  wire(); document.body.classList.add('dark'); resize();
  setTimeout(()=>{ const h=$('hint'); if(h) h.style.opacity=0; },4200);
  window.garden={ state, growGarden, get W(){return W;}, get H(){return H;} };
})();
</script>
</body>
</html>
