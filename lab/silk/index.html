<script id="vert" type="x-shader/x-vertex">
attribute vec2 a_pos;
void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }
</script>

<!-- ===== SCENE: flowing iridescent silk ===== -->
<script id="scene" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2  u_res;
uniform float u_time;
uniform float u_flow;
uniform float u_disp;
uniform float u_seed;
uniform vec2  u_ptr;

float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+1.7; a*=0.5; } return v; }
vec3 spectral(float t){ return 0.5+0.5*cos(6.28318*(vec3(0.0,0.33,0.67)+t)); }

// broad flow warp — the big sweeps that bend the filaments
float warpX(vec2 uv, float t){
  float w = 0.40*sin(uv.y*2.0 + t*0.9)
          + 0.22*sin(uv.y*3.7 - t*1.2 + uv.x*1.3)
          + 0.32*fbm(vec2(uv.y*1.7 + t*0.35, uv.x*0.9 + 4.0));
  w += 0.16*sin((uv.y - u_ptr.y)*2.5 + u_ptr.x*4.0);
  return uv.x + u_flow*w;
}

// surface phase carrying both a broad sweep and fine ripple detail
float phase(float x, vec2 uv){
  return x*5.2 + uv.y*0.85 + 0.45*fbm(vec2(x*8.0, uv.y*3.6));
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res)/u_res.y;
  float t = u_time*0.045 + u_seed*7.0;
  float d = 0.015 + u_disp*0.085;                     // chromatic dispersion (x offset)

  float xw = warpX(uv, t);
  float phR = phase(xw + d, uv);
  float phG = phase(xw,     uv);
  float phB = phase(xw - d, uv);

  float F = 21.0;                                     // fine filament frequency

  // hue: broad spectral sweep, drifting so it never repeats mechanically
  float drift = 0.22*fbm(vec2(xw*0.7, uv.y*0.5 + t)) + t*0.03;
  vec3 hue = vec3( spectral(phR*0.13 + drift).r,
                   spectral(phG*0.13 + drift).g,
                   spectral(phB*0.13 + drift).b );

  // fine filaments — thin sharp striations, per channel → clean rainbow edges
  vec3 fila = vec3( pow(0.5+0.5*sin(phR*F), 2.2),
                    pow(0.5+0.5*sin(phG*F), 2.2),
                    pow(0.5+0.5*sin(phB*F), 2.2) );

  float sheen = 0.5 + 0.5*sin(phG*0.42);              // which broad sweeps are lit
  float glint = pow(0.5+0.5*sin(phG*F), 16.0);        // sparse hot white glints

  // saturated body, filaments carve the light, glints blow to white for the bloom
  vec3 col = hue * (0.30 + 0.95*fila) * (0.45 + 1.15*sheen);
  col = mix(col, vec3(1.05), sheen*sheen*0.55);       // lit ridges go airy white — delicate, not wall-to-wall colour
  col += vec3(glint) * 2.8;
  col *= 0.82 + 0.45*fbm(uv*1.3 + t*0.2);             // length-wise luminance drift
  col *= 1.0 - 0.28*dot(uv, uv);                      // focal vignette (composition)

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<!-- ===== POST: bright-pass ===== -->
<script id="bright" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D u_tex; uniform vec2 u_res; uniform float u_thresh;
void main(){
  vec2 uv = gl_FragCoord.xy/u_res;
  vec3 c = texture2D(u_tex, uv).rgb;
  float l = max(c.r, max(c.g, c.b));
  float w = max(l - u_thresh, 0.0) / max(l, 1e-4);
  gl_FragColor = vec4(c * w, 1.0);
}
</script>

<!-- ===== POST: separable gaussian ===== -->
<script id="blur" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D u_tex; uniform vec2 u_res; uniform vec2 u_dir;
void main(){
  vec2 uv = gl_FragCoord.xy/u_res;
  vec2 px = u_dir / u_res;
  vec3 c  = texture2D(u_tex, uv).rgb * 0.2270270270;
  c += texture2D(u_tex, uv + px*1.3846153846).rgb * 0.3162162162;
  c += texture2D(u_tex, uv - px*1.3846153846).rgb * 0.3162162162;
  c += texture2D(u_tex, uv + px*3.2307692308).rgb * 0.0702702703;
  c += texture2D(u_tex, uv - px*3.2307692308).rgb * 0.0702702703;
  gl_FragColor = vec4(c, 1.0);
}
</script>

<!-- ===== POST: composite + ACES tonemap + dither ===== -->
<script id="composite" type="x-shader/x-fragment">
precision highp float;
uniform sampler2D u_scene; uniform sampler2D u_bloom; uniform vec2 u_res;
uniform float u_bloomAmt; uniform float u_exposure;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
float dither(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
void main(){
  vec2 uv = gl_FragCoord.xy/u_res;
  vec3 s = texture2D(u_scene, uv).rgb;
  vec3 b = texture2D(u_bloom, uv).rgb;
  vec3 col = (s + b*u_bloomAmt) * u_exposure;
  col = aces(col);
  col += (dither(gl_FragCoord.xy) - 0.5)/255.0;
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(() => {
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const isMobile = matchMedia("(pointer:coarse)").matches;

  const cv = document.getElementById("gl");
  const gl = cv.getContext("webgl", {preserveDrawingBuffer:true, antialias:false, alpha:false, premultipliedAlpha:false});
  if(!gl){ document.body.innerHTML = "<p style='font-family:monospace;color:#2a2540;padding:40px'>WebGL isn't available in this browser. Try Safari or Chrome.</p>"; return; }

  // ---- HDR target support --------------------------------------------------
  const hf  = gl.getExtension("OES_texture_half_float");
  const hfl = gl.getExtension("OES_texture_half_float_linear");
  let TYPE = hf ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
  let FILTER = (hf && !hfl) ? gl.NEAREST : gl.LINEAR;

  function compile(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const vs = compile(gl.VERTEX_SHADER, document.getElementById("vert").textContent);
  function program(fragId){
    const p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, document.getElementById(fragId).textContent));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p._aPos = gl.getAttribLocation(p, "a_pos");
    return p;
  }
  const pScene = program("scene"), pBright = program("bright"), pBlur = program("blur"), pComp = program("composite");

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  function drawFS(p){
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(p._aPos);
    gl.vertexAttribPointer(p._aPos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  const U = (p,n) => gl.getUniformLocation(p, n);

  // ---- framebuffers --------------------------------------------------------
  function makeTex(w,h){
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, TYPE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, FILTER);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, FILTER);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  function makeFBO(w,h){
    const tex = makeTex(w,h), fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return {fb, tex, w, h};
  }
  let scene=null, bloomA=null, bloomB=null;
  function allocTargets(w,h){
    // fall back to 8-bit if half-float FBO is incomplete
    [scene,bloomA,bloomB].forEach(f=>{ if(f){ gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); } });
    scene = makeFBO(w,h);
    if(gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE && TYPE !== gl.UNSIGNED_BYTE){
      TYPE = gl.UNSIGNED_BYTE; FILTER = gl.LINEAR;
      gl.deleteFramebuffer(scene.fb); gl.deleteTexture(scene.tex);
      scene = makeFBO(w,h);
    }
    const bw = Math.max(2, w>>1), bh = Math.max(2, h>>1);
    bloomA = makeFBO(bw,bh); bloomB = makeFBO(bw,bh);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  // ---- state ---------------------------------------------------------------
  let W=0,H=0,DPR=1, seed=Math.random()*10;
  let ptrX=0, ptrY=0, tptrX=0, tptrY=0;
  const flowEl=document.getElementById("flow"), prismEl=document.getElementById("prism"), glowEl=document.getElementById("glow");

  const wrap = document.getElementById("canvasWrap");
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, isMobile?1.3:1.6);
    const r = wrap.getBoundingClientRect();
    W=Math.max(1,Math.round(r.width)); H=Math.max(1,Math.round(r.height));
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    allocTargets(cv.width, cv.height);
  }

  const clock = ()=>performance.now()/1000;
  const t0 = clock();

  function render(){
    const time = reduce ? (clock()-t0)*0.4 : (clock()-t0);
    ptrX += (tptrX-ptrX)*0.06; ptrY += (tptrY-ptrY)*0.06;

    // 1 — scene into HDR target
    gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fb);
    gl.viewport(0,0,scene.w,scene.h);
    gl.useProgram(pScene);
    gl.uniform2f(U(pScene,"u_res"), scene.w, scene.h);
    gl.uniform1f(U(pScene,"u_time"), time);
    gl.uniform1f(U(pScene,"u_flow"), 0.2 + (flowEl.value/100)*1.35);
    gl.uniform1f(U(pScene,"u_disp"), prismEl.value/100);
    gl.uniform1f(U(pScene,"u_seed"), seed);
    gl.uniform2f(U(pScene,"u_ptr"), ptrX, ptrY);
    drawFS(pScene);

    // 2 — bright pass → bloomA
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
    gl.viewport(0,0,bloomA.w,bloomA.h);
    gl.useProgram(pBright);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);
    gl.uniform1i(U(pBright,"u_tex"), 0);
    gl.uniform2f(U(pBright,"u_res"), bloomA.w, bloomA.h);
    gl.uniform1f(U(pBright,"u_thresh"), 0.85);
    drawFS(pBright);

    // 3 — separable blur, ping-pong
    const spread = 1.0 + (glowEl.value/100)*2.2;
    for(let i=0;i<3;i++){
      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fb);
      gl.viewport(0,0,bloomB.w,bloomB.h);
      gl.useProgram(pBlur);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
      gl.uniform1i(U(pBlur,"u_tex"), 0);
      gl.uniform2f(U(pBlur,"u_res"), bloomB.w, bloomB.h);
      gl.uniform2f(U(pBlur,"u_dir"), spread, 0);
      drawFS(pBlur);

      gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fb);
      gl.viewport(0,0,bloomA.w,bloomA.h);
      gl.useProgram(pBlur);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, bloomB.tex);
      gl.uniform1i(U(pBlur,"u_tex"), 0);
      gl.uniform2f(U(pBlur,"u_res"), bloomA.w, bloomA.h);
      gl.uniform2f(U(pBlur,"u_dir"), 0, spread);
      drawFS(pBlur);
    }

    // 4 — composite to screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0,0,cv.width,cv.height);
    gl.useProgram(pComp);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);
    gl.uniform1i(U(pComp,"u_scene"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform1i(U(pComp,"u_bloom"), 1);
    gl.uniform2f(U(pComp,"u_res"), cv.width, cv.height);
    gl.uniform1f(U(pComp,"u_bloomAmt"), 0.5 + (glowEl.value/100)*1.8);
    gl.uniform1f(U(pComp,"u_exposure"), 1.05);
    drawFS(pComp);

    requestAnimationFrame(render);
  }

  // ---- interaction ---------------------------------------------------------
  function pointer(e){
    const p = e.touches ? e.touches[0] : e;
    const r = cv.getBoundingClientRect();
    tptrX = ((p.clientX-r.left)/r.width)*2-1;
    tptrY = -(((p.clientY-r.top)/r.height)*2-1);
  }
  cv.addEventListener("mousemove", pointer);
  cv.addEventListener("touchstart", pointer, {passive:true});
  cv.addEventListener("touchmove", pointer, {passive:true});
  document.getElementById("shuffle").addEventListener("click",()=>{ seed=Math.random()*10; });

  // ---- boot ----------------------------------------------------------------
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(render);
})();
</script>
<script src="/lab/shared/opal.js"></script>
<script src="/lab/shared/shell.js"></script>
<script>
  Opal.mountTopbar({ name: 'Silk', desc: 'Iridescent flow · dispersion + bloom', version: 'v1' });
  Shell.init({ canvas:'#gl', name:'silk', formats:['9:16','1:1','4:5'] });
</script>
