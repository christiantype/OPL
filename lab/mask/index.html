<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mask — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overscroll-behavior:none; }
  body.dark .opal-topbar, body.dark .opal-subhead{ background:#0b0c14; border-bottom-color:rgba(255,255,255,.1); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }
  #wrap{ position:fixed; inset:0 320px 0 0; display:flex; align-items:center; justify-content:center; padding:14px; }
  @media (max-width:720px){ #wrap{ inset:0 0 220px 0; } }
  #art{ max-width:100%; max-height:100%; display:block; border-radius:2px; box-shadow:0 10px 50px rgba(0,0,0,.6);
    background:
      linear-gradient(45deg,#15161e 25%,transparent 25%),linear-gradient(-45deg,#15161e 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#15161e 75%),linear-gradient(-45deg,transparent 75%,#15161e 75%);
    background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0px; }

  #panel{ position:fixed; top:0; right:0; bottom:0; width:320px; border-left:1px solid var(--line);
    background:#0b0c14; padding:14px; overflow:auto; display:flex; flex-direction:column; gap:12px; padding-top:96px; }
  @media (max-width:720px){ #panel{ top:auto; width:100%; height:220px; padding-top:12px; border-left:0; border-top:1px solid var(--line); } }
  .layer{ border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .layer h4{ margin:0; font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); display:flex; justify-content:space-between; align-items:center; }
  .duo{ display:flex; gap:6px; }
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--ink);
    font:inherit; font-size:12px; padding:7px 10px; border-radius:8px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.1); }
  .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); font-weight:600; }
  .btn.wide{ flex:1; text-align:center; }
  .btn.on{ outline:2px solid rgba(255,255,255,.35); }
  select{ appearance:none; background:rgba(255,255,255,.05); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font:inherit; font-size:12px; }
  .thumb{ width:20px; height:20px; border-radius:4px; object-fit:cover; border:1px solid var(--line); background:#222; }
  .x{ appearance:none; background:none; border:0; color:var(--dim); cursor:pointer; font-size:15px; }
  .foot{ display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; }
</style>
</head>
<body class="dark">
  <div id="wrap"><canvas id="art"></canvas></div>
  <input id="file" type="file" accept="image/*,video/*" hidden />

  <div id="panel">
    <div id="layers"></div>
    <button class="btn primary" id="addBtn">+ Nest a layer inside</button>
    <div class="foot">
      <button class="btn wide" id="recBtn">Record</button>
      <button class="btn wide" id="saveBtn">Save</button>
    </div>
  </div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Mask', desc:'One image masks the next, inside the next',
  about:"Each layer is a shape (from an image's alpha or its light and dark) with something poured inside it — an image or a video. Nest a layer and it is clipped inside everything above it: a tree inside a portrait, a sky inside the tree. Load your own on any layer; record if a video is playing.",
  version:'v1' });</script>

<script>
(() => {
  const cv=document.getElementById('art'), ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  let W=900, H=1120, dpr=1;
  // each layer: { mask:Image|null, mode:'alpha'|'bright'|'dark', fill:Image|Video|null, fit:'cover'|'contain', mThumb, fThumb }
  let layers=[];
  let picking=null, pickKind=null;

  function fit(){ const availW=(innerWidth>720? innerWidth-320 : innerWidth) - 28, availH=(innerWidth>720? innerHeight : innerHeight-220) - 28;
    const ar=W/H; let w=availW, h=w/ar; if(h>availH){ h=availH; w=h*ar; }
    dpr=Math.min(devicePixelRatio||1,2); cv.style.width=w+'px'; cv.style.height=h+'px';
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }

  function coverDraw(x, src, w, h, mode){ const sw=src.videoWidth||src.naturalWidth||src.width, sh=src.videoHeight||src.naturalHeight||src.height;
    if(!sw||!sh) return; const ar=sw/sh, car=w/h; let dw,dh;
    if(mode==='contain'){ if(ar>car){dw=w;dh=w/ar;}else{dh=h;dw=h*ar;} } else { if(ar>car){dh=h;dw=h*ar;}else{dw=w;dh=w/ar;} }
    x.drawImage(src, (w-dw)/2,(h-dh)/2, dw,dh); }

  const tmpMask=document.createElement('canvas'), tmpFill=document.createElement('canvas'), clipC=document.createElement('canvas');
  function maskCanvas(L){ tmpMask.width=W; tmpMask.height=H; const mx=tmpMask.getContext('2d'); mx.clearRect(0,0,W,H);
    if(!L.mask){ mx.fillStyle='#fff'; mx.fillRect(0,0,W,H); return tmpMask; }   // no mask = full
    coverDraw(mx, L.mask, W, H, 'cover');
    if(L.mode!=='alpha'){ const id=mx.getImageData(0,0,W,H), d=id.data;
      for(let i=0;i<d.length;i+=4){ const lum=d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114; const a=(L.mode==='dark'?255-lum:lum)*(d[i+3]/255);
        d[i]=255;d[i+1]=255;d[i+2]=255;d[i+3]=a; } mx.putImageData(id,0,0); }
    return tmpMask; }

  function render(){
    ctx.clearRect(0,0,W,H);
    // running clip = intersection of all masks so far (start = everything)
    clipC.width=W; clipC.height=H; const cx=clipC.getContext('2d'); cx.clearRect(0,0,W,H); cx.fillStyle='#fff'; cx.fillRect(0,0,W,H);
    for(const L of layers){
      const m=maskCanvas(L);
      // clip = running ∩ mask
      cx.globalCompositeOperation='destination-in'; cx.drawImage(m,0,0); cx.globalCompositeOperation='source-over';
      // fill clipped to running clip
      if(L.fill && (L.fill.tagName!=='VIDEO' || L.fill.readyState>=2)){
        tmpFill.width=W; tmpFill.height=H; const fx=tmpFill.getContext('2d'); fx.clearRect(0,0,W,H);
        coverDraw(fx, L.fill, W, H, L.fit);
        fx.globalCompositeOperation='destination-in'; fx.drawImage(clipC,0,0); fx.globalCompositeOperation='source-over';
        ctx.drawImage(tmpFill,0,0);
      }
    }
    window.__maskReady=true;
  }

  function loop(){ requestAnimationFrame(loop); const anyVid=layers.some(L=>L.fill&&L.fill.tagName==='VIDEO'&&!L.fill.paused);
    if(anyVid) render(); }

  /* ---- panel UI ---- */
  function renderPanel(){ const wrap=$('layers'); wrap.innerHTML='';
    layers.forEach((L,i)=>{ const el=document.createElement('div'); el.className='layer';
      el.innerHTML =
        '<h4><span>Layer '+(i+1)+(i>0?' · nested':'')+'</span>'+(i>0?'<button class="x" data-rm="'+i+'">×</button>':'')+'</h4>'+
        '<div class="duo"><button class="btn wide" data-pick="mask" data-i="'+i+'">'+(L.mask?'Mask ✓':'Set mask')+'</button>'+
        '<select data-mode="'+i+'"><option value="alpha"'+(L.mode==='alpha'?' selected':'')+'>Shape</option><option value="bright"'+(L.mode==='bright'?' selected':'')+'>Bright</option><option value="dark"'+(L.mode==='dark'?' selected':'')+'>Dark</option></select></div>'+
        '<div class="duo"><button class="btn wide" data-pick="fill" data-i="'+i+'">'+(L.fill?'Fill ✓':'Set fill (image/video)')+'</button>'+
        '<select data-fit="'+i+'"><option value="cover"'+(L.fit==='cover'?' selected':'')+'>Cover</option><option value="contain"'+(L.fit==='contain'?' selected':'')+'>Contain</option></select></div>';
      wrap.appendChild(el); });
    wrap.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{ picking=+b.dataset.i; pickKind=b.dataset.pick; $('file').click(); }));
    wrap.querySelectorAll('[data-mode]').forEach(s=>s.addEventListener('change',()=>{ layers[+s.dataset.mode].mode=s.value; render(); }));
    wrap.querySelectorAll('[data-fit]').forEach(s=>s.addEventListener('change',()=>{ layers[+s.dataset.fit].fit=s.value; render(); }));
    wrap.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ layers.splice(+b.dataset.rm,1); renderPanel(); render(); }));
  }

  $('file').addEventListener('change', e=>{ const f=e.target.files[0]; if(f==null||picking==null) return; const url=URL.createObjectURL(f);
    if(f.type.startsWith('video')){ const v=document.createElement('video'); v.src=url; v.loop=true; v.muted=true; v.playsInline=true;
      v.onloadeddata=()=>{ v.play(); layers[picking][pickKind]=v; renderPanel(); render(); }; }
    else { const im=new Image(); im.onload=()=>{ layers[picking][pickKind]=im; renderPanel(); render(); }; im.src=url; }
    e.target.value=''; });

  $('addBtn').addEventListener('click', ()=>{ layers.push({ mask:null, mode:'alpha', fill:null, fit:'cover' }); renderPanel(); render(); });

  let rec=null, chunks=[];
  $('recBtn').addEventListener('click', ()=>{ if(rec&&rec.state==='recording'){ rec.stop(); return; }
    const stream=cv.captureStream(30); const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:12000000}); chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:'video/webm'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='mask.webm'; a.click();
      $('recBtn').textContent='Record'; };
    rec.start(); $('recBtn').textContent='Stop'; });
  $('saveBtn').addEventListener('click', ()=>{ const a=document.createElement('a'); a.download='mask.png'; a.href=cv.toDataURL('image/png'); a.click(); });

  /* ---- default demo: colour field in a circle, second field masked inside a diamond ---- */
  function gen(draw){ const c=document.createElement('canvas'); c.width=W; c.height=H; draw(c.getContext('2d')); const im=new Image(); im.src=c.toDataURL(); return im; }
  function blobs(list){ return gen(x=>{ x.fillStyle='#0a0a12'; x.fillRect(0,0,W,H); x.globalCompositeOperation='lighter';
    for(const [col,cx,cy,r] of list){ const g=x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.beginPath(); x.arc(cx,cy,r,0,6.28); x.fill(); } }); }
  const circleMask = gen(x=>{ x.clearRect(0,0,W,H); x.fillStyle='#fff'; x.beginPath(); x.arc(W/2,H/2,Math.min(W,H)*0.42,0,6.28); x.fill(); });
  const diamondMask= gen(x=>{ x.clearRect(0,0,W,H); x.fillStyle='#fff'; x.save(); x.translate(W/2,H*0.5); x.rotate(Math.PI/4); const s=Math.min(W,H)*0.24; x.fillRect(-s,-s,s*2,s*2); x.restore(); });
  const fillA = blobs([['#ff3b6b',300,340,360],['#ffcf3a',560,320,320],['#39d0ff',430,700,420],['#8b5cff',320,880,340],['#31e08a',640,820,320]]);
  const fillB = blobs([['#00e5ff',300,300,420],['#a0ff00',600,600,420],['#ff00c8',450,900,420]]);
  let loaded=0; [circleMask,diamondMask,fillA,fillB].forEach(im=>{ if(im.complete) ready(); else im.onload=ready; });
  function ready(){ if(++loaded<4) return;
    layers=[ { mask:circleMask, mode:'alpha', fill:fillA, fit:'cover' },
             { mask:diamondMask, mode:'alpha', fill:fillB, fit:'cover' } ];
    renderPanel(); render(); }

  fit(); renderPanel(); render();
  addEventListener('resize', ()=>{ fit(); render(); });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
