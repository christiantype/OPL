<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Prism — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  :root{ --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; } }
  *{ box-sizing:border-box; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ max-width:100%; max-height:100%; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%); font-size:13px; padding:7px 13px; border-radius:0; pointer-events:none; z-index:7; white-space:nowrap; }
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; } #sizeDock select{ padding:7px 10px; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; } #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); } #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  .group{ display:flex; flex-direction:column; gap:9px; } .knob{ display:flex; flex-direction:column; gap:2px; }
  .crow{ display:flex; align-items:center; justify-content:space-between; } .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .filebtn{ display:block; text-align:center; } .sw{ width:44px; height:24px; border:1px solid var(--line); padding:0; cursor:pointer; background:none; }
  .seg{ display:flex; } .seg button{ flex:1; appearance:none; background:var(--cell); border:1px solid var(--line); color:var(--ink); padding:8px 6px; cursor:pointer; font:inherit; font-size:11px; border-right:0; } .seg button:last-child{ border-right:1px solid var(--line); }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">

<div id="wrap"><canvas id="art"></canvas></div>
<div id="hint">A photo, pressed in three inks</div>
<div id="recDot"><i></i><b>0:00</b></div>
<div id="sizeDock"><span id="dimReadout">1080 × 1350</span><select id="aspect" title="Canvas size">
  <option value="1080/1350" selected>Portrait · 4:5</option>
  <option value="1080/1080">Square · 1:1</option>
  <option value="1080/1920">Story · 9:16</option>
  <option value="1920/1080">Landscape · 16:9</option>
</select></div>

<div id="dock">
  <div class="group">
    <div class="group__t">Source</div>
    <p class="rowhint" style="margin:0;font-size:12px;color:var(--mute)">Drop a photo, or load one. Nothing leaves this page.</p>
    <div class="grid2"><button class="btn filebtn" id="loadBtn">Add image</button><button class="btn" id="sampleBtn">Sample</button></div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="group">
    <div class="group__t">Press</div>
    <div class="seg" id="dotSeg"><button data-dot="round" aria-pressed="true">Dots</button><button data-dot="square">Pixels</button></div>
    <div class="knob"><label>Screen <b id="dsR">10</b></label><input id="ds" type="range" min="3" max="40" value="10"></div>
    <div class="knob"><label>Angle <b id="agR">15</b></label><input id="ag" type="range" min="0" max="45" value="15"></div>
    <div class="knob"><label>Contrast <b id="ctR">1.0</b></label><input id="ct" type="range" min="20" max="220" value="100"></div>
    <div class="knob"><label>Ink gain <b id="gnR">1.0</b></label><input id="gn" type="range" min="40" max="180" value="100"></div>
  </div>
  <div class="group">
    <div class="group__t">Inks</div>
    <div class="crow"><label>Ink 1 · cyan</label><input type="color" class="sw" id="i1" value="#00a8ff"></div>
    <div class="crow"><label>Ink 2 · magenta</label><input type="color" class="sw" id="i2" value="#ff007f"></div>
    <div class="crow"><label>Ink 3 · yellow</label><input type="color" class="sw" id="i3" value="#ffd700"></div>
    <div class="crow"><label>Paper</label><input type="color" class="sw" id="pp" value="#f4f0e6"></div>
  </div>
  <div class="group out">
    <div class="group__t">Output</div>
    <div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div>
  </div>
</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Prism', desc:'A photo, pressed in three inks',
  about:'A photograph separated into three inks — cyan, magenta, yellow — each laid down as its own halftone screen at its own angle, the dots overlapping into a prismatic rosette on paper. Round dots or square pixels. A rebuild of Brik’s Prismatic Pixel Press on the OP/AL shell.',
  version:'v1' });</script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const art=$('art'), ctx=art.getContext('2d');
  // one offscreen layer per ink — dots are drawn opaque, then the three layers are multiplied once (fast)
  const layers=[0,1,2].map(()=>{ const c=document.createElement('canvas'); return {c, g:c.getContext('2d')}; });
  const P={ dot:'round', screen:10, angle:15, contrast:1.0, gain:1.0, i1:'#00a8ff', i2:'#ff007f', i3:'#ffd700', paper:'#f4f0e6', size:'1080/1350' };
  let src=null, W=1080, H=1350;
  const hex=h=>{ const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(h); return m?[parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)]:[0,0,0]; };
  // cover-fit: preserve the photo's aspect (centre-crop), never stretch to the canvas
  function samp(x,y){ if(!src) return [255,255,255]; let u=x/W,v=y/H; const cAR=W/H,sAR=src.w/src.h;
    if(sAR>cAR){ u=(u-0.5)*(cAR/sAR)+0.5; } else { v=(v-0.5)*(sAR/cAR)+0.5; }
    const sx=Math.min(src.w-1,Math.max(0,(u*src.w)|0)), sy=Math.min(src.h-1,Math.max(0,(v*src.h)|0)); const i=(sy*src.w+sx)*4; return [src.data[i],src.data[i+1],src.data[i+2]]; }

  // channel amount 0..1: chan 0=cyan(1-R) 1=magenta(1-G) 2=yellow(1-B)
  function chan(x,y,k){ const p=samp(x,y); let v=1-p[k]/255; v=(v-0.5)*P.contrast+0.5; v=Math.max(0,Math.min(1,v))*P.gain; return Math.max(0,Math.min(1,v)); }

  // draw one ink's halftone as opaque dots onto its own white layer (no per-dot blending)
  function screen(g, inkHex, k, angDeg){
    g.globalCompositeOperation='source-over'; g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    const [ir,ig,ib]=hex(inkHex); g.fillStyle=`rgb(${ir},${ig},${ib})`;
    const a=angDeg*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a), s=P.screen;
    const N=Math.ceil(Math.hypot(W,H)/s)+2;
    for(let j=-N;j<=N;j++)for(let i=-N;i<=N;i++){
      const rx=i*s, ry=j*s; const x=rx*cs-ry*sn+W/2, y=rx*sn+ry*cs+H/2;
      if(x<-s||x>W+s||y<-s||y>H+s) continue;
      const v=chan(x,y,k); const rad=(s*0.60)*Math.sqrt(v); if(rad<0.3) continue;
      if(P.dot==='square'){ const d=rad*1.6; g.fillRect(x-d/2,y-d/2,d,d); }
      else { g.beginPath(); g.arc(x,y,rad,0,6.2832); g.fill(); }
    }
  }
  function draw(){
    if(!src){ ctx.fillStyle='#8a8a90'; ctx.font='13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('Loading…',W/2,H/2); return; }
    screen(layers[0].g, P.i3, 2, 0);           // yellow at 0°
    screen(layers[1].g, P.i1, 0, P.angle);     // cyan
    screen(layers[2].g, P.i2, 1, P.angle*5);   // magenta at 5x angle (75° when angle=15)
    const [pr,pg,pb]=hex(P.paper); ctx.globalCompositeOperation='source-over'; ctx.fillStyle=`rgb(${pr},${pg},${pb})`; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='multiply'; for(const L of layers) ctx.drawImage(L.c,0,0);
    ctx.globalCompositeOperation='source-over';
  }

  // Canvas size follows ONLY the selected aspect — an added photo never reshapes it.
  function fit(){ const[a,b]=P.size.split('/').map(Number); const ar=a/b;
    const long=1400; if(ar>=1){W=long;H=Math.round(long/ar);}else{H=long;W=Math.round(long*ar);}
    art.width=W; art.height=H; for(const L of layers){ L.c.width=W; L.c.height=H; }
    const dr=$('dimReadout'); if(dr) dr.textContent=`${a} × ${b}`;
    const box=$('wrap').getBoundingClientRect(); const sc=Math.min(box.width/W,box.height/H); art.style.width=(W*sc)+'px'; art.style.height=(H*sc)+'px'; draw(); }
  function loadImage(im){ const c=document.createElement('canvas'); c.width=im.width; c.height=im.height; const cc=c.getContext('2d',{willReadFrequently:true}); cc.drawImage(im,0,0); src={data:cc.getImageData(0,0,im.width,im.height).data,w:im.width,h:im.height}; fit(); }
  function loadURL(u){ const im=new Image(); im.crossOrigin='anonymous'; im.onload=()=>loadImage(im); im.src=u; }
  function sample(){ const c=document.createElement('canvas'); c.width=1000; c.height=1250; const g=c.getContext('2d');
    const gr=g.createLinearGradient(0,0,1000,1250); gr.addColorStop(0,'#f2ead6'); gr.addColorStop(1,'#2a2f45'); g.fillStyle=gr; g.fillRect(0,0,1000,1250);
    for(const a of [[350,420,300,'#e0483c'],[680,780,340,'#2f6fed'],[560,340,180,'#ffd23f'],[280,960,220,'#2f8f6a'],[780,300,150,'#fff']]){ const rg=g.createRadialGradient(a[0],a[1],0,a[0],a[1],a[2]); rg.addColorStop(0,a[3]); rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rg; g.beginPath(); g.arc(a[0],a[1],a[2],0,7); g.fill(); }
    loadImage(c); }

  function bind(id,rid,fn,fmt){ const el=$(id),o=$(rid); el.addEventListener('input',()=>{ fn(parseFloat(el.value)); if(o)o.textContent=fmt?fmt(el.value):el.value; draw(); }); }
  bind('ds','dsR',v=>P.screen=v); bind('ag','agR',v=>P.angle=v);
  bind('ct','ctR',v=>P.contrast=v/100,v=>(v/100).toFixed(1)); bind('gn','gnR',v=>P.gain=v/100,v=>(v/100).toFixed(1));
  ['i1','i2','i3','pp'].forEach((id,k)=>$(id).addEventListener('input',e=>{ P[id==='pp'?'paper':id]=e.target.value; draw(); }));
  document.querySelectorAll('#dotSeg button').forEach(b=>b.addEventListener('click',()=>{ P.dot=b.dataset.dot; document.querySelectorAll('#dotSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); }));
  $('aspect').addEventListener('change',e=>{P.size=e.target.value;fit();});
  $('loadBtn').addEventListener('click',()=>$('file').click()); $('sampleBtn').addEventListener('click',sample);
  $('file').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) loadURL(URL.createObjectURL(f)); });
  ['dragover','drop'].forEach(ev=>document.addEventListener(ev,e=>{ e.preventDefault(); if(ev==='drop'&&e.dataTransfer.files[0]) loadURL(URL.createObjectURL(e.dataTransfer.files[0])); }));

  // Vector export — every ink is a grid of halftone dots (circles/squares), so it's true SVG.
  function prismSvg(){
    let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    svg+=`<rect width="${W}" height="${H}" fill="${P.paper}"/>`;
    const specs=[[P.i3,2,0],[P.i1,0,P.angle],[P.i2,1,P.angle*5]];
    for(const [ink,k,ang] of specs){
      let g=`<g fill="${ink}" style="mix-blend-mode:multiply">`;
      const a=ang*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a), s=P.screen, N=Math.ceil(Math.hypot(W,H)/s)+2;
      for(let j=-N;j<=N;j++)for(let i=-N;i<=N;i++){
        const rx=i*s, ry=j*s, x=rx*cs-ry*sn+W/2, y=rx*sn+ry*cs+H/2;
        if(x<-s||x>W+s||y<-s||y>H+s) continue;
        const v=chan(x,y,k), rad=(s*0.60)*Math.sqrt(v); if(rad<0.3) continue;
        if(P.dot==='square'){ const d=rad*1.6; g+=`<rect x="${(x-d/2).toFixed(1)}" y="${(y-d/2).toFixed(1)}" width="${d.toFixed(1)}" height="${d.toFixed(1)}"/>`; }
        else g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(1)}"/>`;
      }
      svg+=g+`</g>`;
    }
    return svg+`</svg>`;
  }
  $('saveBtn').addEventListener('click',()=>Opal.saveDialog(art,'prism',{svg:prismSvg}));
  let rec=null,rt=0,tk=0;
  $('recBtn').addEventListener('click',()=>{ if(rec){rec.stop();return;}
    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime}:undefined); const ch=[];
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    rec.onstop=()=>{ clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false');
      const bl=new Blob(ch,{type:ch[0]?.type||'video/webm'}); const a=document.createElement('a'); a.download='prism.'+(bl.type.indexOf('mp4')>=0?'mp4':'webm'); a.href=URL.createObjectURL(bl); a.click(); rec=null; };
    rec.start(); rt=Date.now(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true');
    tk=setInterval(()=>{ const s=Math.floor((Date.now()-rt)/1000); $('recDot').querySelector('b').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0'); },250); });

  addEventListener('resize',()=>{ if(src) fit(); });
  sample();
})();
</script>
</body>
</html>
