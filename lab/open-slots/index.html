<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>OPEN Slots — OP/AL</title>
<link rel="stylesheet" href="/shared/styles.css" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --rail:0px; } }
  html,body{ height:100vh; height:100dvh; margin:0; overflow:hidden; background:var(--paper);
    font-family:var(--font, 'IBM Plex Sans', system-ui, sans-serif); }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  #stagewrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; background:var(--mat);
    display:flex; align-items:center; justify-content:center; padding:18px; }
  #frame{ position:relative; height:min(100%, (100vw - var(--rail) - 36px)*16/9); aspect-ratio:9/16; overflow:hidden; }
  #c{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* standard rail layout helpers — same as every other tool (OPALAB skins the controls; the tool lays them out) */
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #output #recTime{ margin-top:8px; font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; font-size:13px; opacity:0; transition:opacity .2s; }
  #output #recTime.on{ opacity:1; }
</style>
  <link rel="stylesheet" href="/lab/shared/OPALAB.css" />
</head>
<body>
  <script src="/lab/shared/opal.js"></script>
  <script>Opal.mountTopbar({ name:'OPEN Slots', desc:'A reel of passing feeling — one word at a time', version:'v1' });</script>
  <div id="sizeDock" title="Fixed reel format"><span id="dimReadout">1080 × 1920 · 9:16</span></div>
  <div id="dock">
    <div class="group">
      <div class="group__t">Word</div>
      <div class="knob"><label>Size <b id="wsV">62</b></label><input type="range" id="ws" min="24" max="200" value="62"></div>
      <div class="knob"><label>Letter spacing <b id="lsV">0</b></label><input type="range" id="ls" min="-12" max="80" value="0"></div>
      <div class="knob"><label>Case</label><div class="seg" id="caseSeg"><button aria-pressed="true" data-v="upper">UPPER</button><button data-v="lower">lower</button><button data-v="asis">As&nbsp;is</button></div></div>
    </div>
    <div class="group">
      <div class="group__t">Placement</div>
      <div class="knob"><label>Vertical <b id="vyV">50</b></label><input type="range" id="vy" min="18" max="82" value="50"></div>
    </div>
    <div class="group">
      <div class="group__t">Invite lines</div>
      <div class="knob"><label>Size <b id="isV">100</b></label><input type="range" id="is" min="40" max="220" value="100"></div>
      <div class="knob"><label>Letter spacing <b id="ilsV">0</b></label><input type="range" id="ils" min="-12" max="80" value="0"></div>
    </div>
    <div class="group">
      <div class="group__t">Background</div>
      <div class="knob"><label>Scene</label><div class="seg" id="bgSeg"><button data-v="sky">Sky</button><button aria-pressed="true" data-v="orb">Orb</button><button data-v="both">Both</button></div></div>
      <div class="knob"><label>Orb size <b id="osV">460</b></label><input type="range" id="os" min="160" max="820" value="460"></div>
      <div class="knob"><label>Breath <b id="obV">8</b></label><input type="range" id="ob" min="0" max="20" value="8"></div>
      <div class="knob"><label>Colour flow <b id="cfV">52</b></label><input type="range" id="cf" min="0" max="120" value="52"></div>
      <div class="knob"><label>Grain <b id="grV">16</b></label><input type="range" id="gr" min="0" max="60" value="16"></div>
    </div>
  </div>
  <div id="stagewrap"><div id="frame"><canvas id="c" width="1080" height="1920"></canvas></div></div>
  <div id="output"><div class="group__t">Output</div><div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div><div id="recTime">0:00</div></div>
  <script>
  (function(){
    const c=document.getElementById('c'), g=c.getContext('2d'); const W=1080,H=1920;
    // feeling-words arranged darkest -> brightest, so the reel climbs to a happy landing.
    // buildReel() shuffles WITHIN each band each cycle, keeping the negative->positive arc but varying the order.
    const TIERS=[
      /* neg */ ['grief','sorrow','anguished','bereft','crestfallen','desolate','despair','despondent','dread','emptiness','forlorn','grieving','heartache','heartbroken','hollow','mournful','sorrowful','tearful','broken','shattered','ashamed','hopeless','helpless','terrified','defeated','abandoned','betrayed','lost','trapped','exhausted','gutted','numb'],
      /* low */ ['restless','doubt','ache','longing','weary','raw','boredom','confusion','fear','melancholy','wistful','unease','yearning','sadness','nervous','heavy','tired','alone','lonely','afraid','tense','aching','wandering','unsettled','adrift','bittersweet','nostalgia','resistance','restlessness','apprehension','craving','disquiet','exposed','fragile','guarded','homesick','irritable','listless','overwhelmed','regretful','rueful','searching','spent','unmoored','untethered','vulnerable','bitter','resentful','anxious','furious','jealous','conflicted','ambivalent','torn','indifferent','jittery','antsy','wired','restive','sharp'],
      /* neutral */ ['tender','curious','softness','tenderness','soft','curiosity','anticipation','dazed','eager','immersed','meditative','mindful','reflective','sensitive','stirred','suspended','sweet','thoughtful','pensive','alert','watchful','attentive','absorbed','rapt','entranced','keen','dreamy','hazy','drowsy','sleepy','languid','mellow','weightless','tingling','buzzing','humming','prickling','breathless','shivery','feverish','tremulous','quivering','electric','floaty','hushed','tingly','simmering','porous','melting'],
      /* warm */ ['calm','hope','ease','content','still','present','open','quiet','patience','clarity','warmth','comfort','stillness','gentle','light','rested','held','seen','loved','easeful','glowing','settled','reverence','humility','spacious','grounded','relief','surrender','acceptance','patient','openness','centered','cherished','compassion','connected','cozy','cradled','devotion','equanimity','expansive','faith','flow','grace','lightness','lulled','nurtured','placid','relaxed','released','restful','rooted','sacred','safe','secure','sheltered','soothed','steady','trust','unburdened','unhurried','vast','willing','yielding','buoyant','aglow'],
      /* joy */ ['grateful','wonder','awe','joy','alive','delight','gratitude','peace','courage','gladness','serenity','elation','hopeful','bright','together','brave','luminous','wonderment','peaceful','bliss','ecstasy','enchanted','fulfilled','giddy','inspired','jubilant','playful','renewed','thankful','tranquil','welcoming','whole','abundant','wholesome','flourishing','thriving','vibrant','exuberant','triumphant','blessed','boundless','overjoyed','ecstatic','generous','free','brimming','radiant','awake'],
    ];
    const EMOTIONS=TIERS.flat();
    const VIB=['#e8846b','#e6b422','#d96e3f','#a9c7d9','#e07a5f','#d9a441','#f2a81d','#c9a7d4','#9fc9cc',
      '#b7c74a','#a8d8c0','#14315b','#5c1a1b','#2b2c6b','#e8917b','#e3b23c','#0e5c5b','#4a2c4d'];
    // OP/AL screensaver palette — [deep ground, luminous accent] pairs; the orb drifts through them
    const PALETTES=[['#1e3a34','#e8846b'],['#14315b','#e6b422'],['#0e5c5b','#d96e3f'],['#5c1a1b','#a9c7d9'],['#e6b422','#14315b'],['#4a2c4d','#9cb48f'],['#c05b25','#16514e'],['#1f3a2e','#f0b49e'],['#46618e','#d9a441'],['#6e1e2a','#a8d8c0'],['#2b2c6b','#f2a81d'],['#5e6033','#c9a7d4'],['#a8442a','#9fc9cc'],['#2e2e2e','#ebe45b'],['#3e2140','#b7c74a'],['#14395e','#e8917b'],['#8c3a2b','#f0e5d0'],['#234b3f','#e8a268'],['#24409a','#e3b23c'],['#5b1f33','#afc9b0'],['#0f4c5c','#f4a261'],['#d9773f','#2a3d45'],['#e5ddc8','#7a3b2e'],['#3d405b','#e07a5f']];
    const FAM='"Sidepiece-HoneyPie", ui-sans-serif, system-ui, sans-serif';
    const logo=new Image(); logo.src='/lab/shared/opal-logo.svg';        // the real OP/AL wordmark
    const LOGO_ASPECT=1584/612, LOGO_MARK_HFRAC=201.5/612;               // mark's height within the SVG viewBox
    const opmark=new Image(); opmark.src='/lab/shared/op-mark.svg';      // the footer wordmark — Original Practice / Applied Learning
    const OPMARK_ASPECT=1137.52/29.84;
    const hexA=(h,a)=>{ const n=parseInt(h.slice(1),16); a=a<0?0:a>1?1:a; return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a.toFixed(3)+')'; };
    const easeOutCubic=x=>1-Math.pow(1-x,3);
    function shuffled(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
    function buildReel(){ return TIERS.reduce((a,t)=>a.concat(shuffled(t)),[]); }
    let REEL=buildReel();
    let endBase=Math.floor(Math.random()*PALETTES.length);   // ending colour-pair start (varies per cycle)
    const clouds=[]; for(let i=0;i<7;i++) clouds.push({x:Math.random(),y:0.06+Math.random()*0.52,s:0.8+Math.random()*1.5,spd:0.2+Math.random()*0.5,seed:Math.random()*10});

    // ── timeline (seconds): each emotion snaps into focus, holds a beat, then the next → invite cards → loop ──
    // emotions flicker fast in place, decelerate to a stop, then the invite lines calm-fade and hold
    const TICKER_END=9.0, ENDING_START=9.3, CARD_DUR=1.85, TICKS=EMOTIONS.length-1;
    const ENDING=['OPEN','FRIDAYS','6AM','MEDITATION & COMMUNITY','OP/AL','MORE THAN DESIGN'];
    const TOTAL=ENDING_START + ENDING.length*CARD_DUR + 1.5;
    let start=null, INVITE_SIZE=110;   // one uniform size for every invite line (longest still fits one line)

    // ── adjustable params (rail controls) ──
    const P={ wordSize:62, wordLS:0, posY:0.5, wordCase:'upper', inviteSize:100, inviteLS:0, bg:'orb', orbSize:460, orbBreath:0.08, colFlow:0.26, grain:16 };
    const CASE=s=> P.wordCase==='upper'?s.toUpperCase() : P.wordCase==='lower'?s.toLowerCase() : s;
    const RGB=h=>{ const n=parseInt(h.slice(1),16); return [n>>16&255, n>>8&255, n&255]; };
    const RGBA=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+(a<0?0:a>1?1:a).toFixed(3)+')';
    const MIX=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
    const SAT=(c,f)=>{ const m=0.3*c[0]+0.59*c[1]+0.11*c[2]; return [m+(c[0]-m)*f, m+(c[1]-m)*f, m+(c[2]-m)*f].map(v=>v<0?0:v>255?255:v); };  // push away from luma = more vibrant

    function drawBackground(now){
      if(P.bg==='both') drawSky(now);
      else if(P.bg==='orb'){
        const gc=palAt(now).ground;
        const grd=g.createRadialGradient(W/2,H*P.posY,0, W/2,H*P.posY,H*0.82);
        grd.addColorStop(0, RGBA(MIX(gc,[0,0,0],0.28),1)); grd.addColorStop(0.62, RGBA(MIX(gc,[0,0,0],0.66),1)); grd.addColorStop(1, RGBA(MIX(gc,[0,0,0],0.86),1));
        g.fillStyle=grd; g.fillRect(0,0,W,H);
      } else { drawSky(now); return; }
      drawOrb(now);
    }

    // colour drifts slowly through the screensaver palette (ground + accent lerp between pairs)
    function palAt(t){ const n=PALETTES.length; let f=((t*P.colFlow)%n+n)%n; const i=Math.floor(f), k=f-i;
      return { ground:MIX(RGB(PALETTES[i][0]),RGB(PALETTES[(i+1)%n][0]),k), accent:MIX(RGB(PALETTES[i][1]),RGB(PALETTES[(i+1)%n][1]),k) }; }

    // ── a soft breathing radiance — a warm luminous orb (a Sacred-Heart glow), pure radial gradient, no hard edge ──
    function drawOrb(now){
      const cx=W/2, cy=H*P.posY, t=now;
      const R=P.orbSize*(1+Math.sin(t*0.7)*P.orbBreath);              // expand / contract — the breath
      const col=SAT(palAt(t).accent,1.45), lit=MIX(col,[255,255,255],0.55);   // punchier hue
      const prev=g.globalCompositeOperation; g.globalCompositeOperation='lighter';
      // core radiance — a bright colour-tinted centre (not pure white) so the hue stays vivid, long soft falloff
      let grd=g.createRadialGradient(cx,cy,0, cx,cy,R*2.3);
      grd.addColorStop(0,RGBA(MIX(col,[255,255,255],0.62),0.62)); grd.addColorStop(0.32,RGBA(col,0.52)); grd.addColorStop(1,RGBA(col,0));
      g.fillStyle=grd; g.fillRect(0,0,W,H);
      // wide soft halo — carries the colour further out
      let halo=g.createRadialGradient(cx,cy,R*0.3, cx,cy,R*3.4);
      halo.addColorStop(0,RGBA(col,0.16)); halo.addColorStop(1,RGBA(col,0));
      g.fillStyle=halo; g.fillRect(0,0,W,H);
      // a soft centred pulse for gentle life — stays perfectly centred (no offset drift)
      const pr=R*(0.5+0.08*Math.sin(t*0.5));
      let pg=g.createRadialGradient(cx,cy,0,cx,cy,pr); pg.addColorStop(0,RGBA(lit,0.08)); pg.addColorStop(1,RGBA(lit,0));
      g.fillStyle=pg; g.fillRect(0,0,W,H);
      g.globalCompositeOperation=prev;
    }

    // ── film grain — painterly texture over the whole frame ──
    const grainC=document.createElement('canvas'); grainC.width=grainC.height=220;
    { const gx=grainC.getContext('2d'), id=gx.createImageData(220,220), d=id.data;
      for(let i=0;i<d.length;i+=4){ const v=(Math.random()*255)|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } gx.putImageData(id,0,0); }
    function drawGrain(){ if(P.grain<=0) return;
      const ox=(Math.random()*220)|0, oy=(Math.random()*220)|0;
      g.save(); g.globalCompositeOperation='overlay'; g.globalAlpha=(P.grain/100)*0.8;   // dithers the smooth radial + adds texture
      for(let y=-oy;y<H;y+=220) for(let x=-ox;x<W;x+=220) g.drawImage(grainC,x,y);
      g.restore(); }

    // ── wire the rail ──
    const $=id=>document.getElementById(id);
    const wire=(id,vId,key,fn)=>{ const r=$(id),v=$(vId); if(!r)return; r.oninput=()=>{ r.dataset.touched='1'; P[key]=fn?fn(+r.value):+r.value; if(v)v.textContent=r.value; }; };
    wire('ws','wsV','wordSize'); wire('ls','lsV','wordLS'); wire('is','isV','inviteSize'); wire('ils','ilsV','inviteLS');
    wire('os','osV','orbSize'); wire('ob','obV','orbBreath',v=>v/100); wire('cf','cfV','colFlow',v=>v/200); wire('gr','grV','grain');
    $('vy').oninput=e=>{ P.posY=e.target.value/100; $('vyV').textContent=e.target.value; };
    const segwire=(id,key)=>{ const s=$(id); if(!s)return; s.querySelectorAll('button').forEach(b=>b.onclick=()=>{ P[key]=b.dataset.v; [...s.children].forEach(x=>x.setAttribute('aria-pressed',String(x===b))); }); };
    segwire('caseSeg','wordCase'); segwire('bgSeg','bg');

    function drawSky(now){
      const grd=g.createLinearGradient(0,0,0,H);
      grd.addColorStop(0,'#5b9ce1'); grd.addColorStop(0.55,'#9cc2e9'); grd.addColorStop(1,'#cbe4fb');
      g.fillStyle=grd; g.fillRect(0,0,W,H);
      for(const p of clouds){ p.x+=p.spd*0.00006; if(p.x>1.25)p.x-=1.5;
        const cx=p.x*W, cy=p.y*H, base=W*0.17*p.s;
        for(let b=0;b<4;b++){ const off=b-1.5, ox=cx+off*base*0.6+Math.sin(now*0.3+p.seed+b)*base*0.12,
          oy=cy+Math.cos(b*1.6+p.seed)*base*0.26, r=base*(1-Math.abs(off)*0.16);
          const rg=g.createRadialGradient(ox,oy,0,ox,oy,r); rg.addColorStop(0,'rgba(255,255,255,0.5)'); rg.addColorStop(1,'rgba(255,255,255,0)');
          g.fillStyle=rg; g.beginPath(); g.arc(ox,oy,r,0,6.2832); g.fill(); } }
    }
    function drawSlot(t){
      // instant swaps in place; easeOutCubic front-loads the changes so it flickers fast then slows to a stop
      const idx=Math.floor(easeOutCubic(Math.min(1,t/TICKER_END))*TICKS);
      const wi=idx%REEL.length, up=CASE(REEL[wi]);
      let a=1; if(t>TICKER_END-0.5) a=Math.max(0,1-(t-(TICKER_END-0.5))/0.5);   // settle + fade out into the invite
      if(a<=0) return;
      g.letterSpacing=P.wordLS+'px';
      let fs=P.wordSize; g.font=fs+'px '+FAM;
      const ww=g.measureText(up).width; if(ww>W*0.9){ fs=Math.floor(fs*W*0.9/ww); g.font=fs+'px '+FAM; }   // shrink to fit
      g.textAlign='center'; g.textBaseline='middle';
      g.fillStyle=hexA(VIB[wi%VIB.length], a);
      g.fillText(up, W/2, H*P.posY);
      g.shadowBlur=0; g.letterSpacing='0px';
    }
    // the invite words appear in the SAME slot style — each snaps into focus, holds, then the next —
    // all on one line at one uniform size (INVITE_SIZE), in solid ink
    function computeInviteSize(){ const BASE=150; g.letterSpacing='0px'; g.font=BASE+'px '+FAM; let widest=0;
      for(const w of ENDING){ const ww=g.measureText(w).width; if(ww>widest) widest=ww; }
      INVITE_SIZE = Math.floor((widest>W*0.9 ? BASE*W*0.9/widest : BASE) * 0.75);   // scaled down 25%
      P.inviteSize=INVITE_SIZE; const s=document.getElementById('is'); if(s && !s.dataset.touched){ s.value=INVITE_SIZE; const v=document.getElementById('isV'); if(v) v.textContent=INVITE_SIZE; } }
    // tint a wordmark SVG to a solid colour (source-in on an offscreen canvas)
    function tintMark(img,iw,ih,color){ const o=document.createElement('canvas'); o.width=Math.max(1,iw|0); o.height=Math.max(1,ih|0);
      const ox=o.getContext('2d'); ox.drawImage(img,0,0,o.width,o.height); ox.globalCompositeOperation='source-in'; ox.fillStyle=color; ox.fillRect(0,0,o.width,o.height); return o; }

    // once the words finish, the invite cards drop the orb and read like the screensaver:
    // a solid ground colour, the text in the paired accent, a new colour pair each card.
    function drawEnding(t){
      const local=t-ENDING_START; let ci=Math.floor(local/CARD_DUR); const last=ENDING.length-1;
      if(ci>last) ci=last;                                     // hold the final card through the tail
      const pair=PALETTES[((endBase+ci*7)%PALETTES.length+PALETTES.length)%PALETTES.length];
      const ground=pair[0], accent=pair[1];
      g.fillStyle=ground; g.fillRect(0,0,W,H);                // solid background — the screensaver look
      const lt=local-ci*CARD_DUR;
      const fin=Math.min(1,lt/0.45), fout=(ci===last)?1:Math.min(1,(CARD_DUR-lt)/0.5), a=Math.max(0,Math.min(fin,fout));
      const word=ENDING[ci];
      g.textAlign='center'; g.textBaseline='middle';
      if(word==='MORE THAN DESIGN' && opmark.complete && opmark.naturalWidth){   // footer wordmark, in the accent colour
        const iw=W*0.86, ih=iw/OPMARK_ASPECT; g.globalAlpha=a; g.drawImage(tintMark(opmark,iw,ih,accent), W/2-iw/2, H*P.posY-ih/2, iw, ih); g.globalAlpha=1; return;
      }
      if(word==='OP/AL' && logo.complete && logo.naturalWidth){                  // OP/AL wordmark, in the accent colour
        const markH=P.inviteSize*0.72, ih=markH/LOGO_MARK_HFRAC, iw=ih*LOGO_ASPECT;
        g.globalAlpha=a; g.drawImage(tintMark(logo,iw,ih,accent), W/2-iw/2, H*P.posY-ih/2, iw, ih); g.globalAlpha=1; return;
      }
      g.letterSpacing=P.inviteLS+'px'; let fs=P.inviteSize; g.font=fs+'px '+FAM;
      const ww=g.measureText(word).width; if(ww>W*0.92){ fs=Math.floor(fs*W*0.92/ww); g.font=fs+'px '+FAM; }
      g.fillStyle=hexA(accent,a); g.fillText(word, W/2, H*P.posY); g.letterSpacing='0px';
    }
    function frame(now){ now/=1000; if(start==null){ start=now; }
      let t=now-start;
      if(t>=TOTAL){ start=now; t=0; REEL=buildReel(); endBase=Math.floor(Math.random()*PALETTES.length); }   // loop
      if(t<ENDING_START){
        drawBackground(now);                 // orb (or sky) while the feeling-words climb neg → pos
        if(t<TICKER_END) drawSlot(t);
        drawGrain();
      } else {
        drawEnding(t);                       // screensaver-style solid colour cards — no orb
      }
      requestAnimationFrame(frame);
    }
    computeInviteSize();
    if(document.fonts && document.fonts.load){ document.fonts.load('40px "Sidepiece-HoneyPie"').then(computeInviteSize).catch(()=>{}); }
    requestAnimationFrame(frame);

    /* record the canvas (native 1080×1920) → H.264 MP4 */
    const btn=document.getElementById('recBtn'), tEl=document.getElementById('recTime'), saveBtn=document.getElementById('saveBtn');
    let rec=null,chunks=[],timer=0,t0=0,autoStop=0;
    const fmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
    function stopRec(){ if(rec&&rec.state==='recording') rec.stop(); }
    btn.addEventListener('click',()=>{ if(rec&&rec.state==='recording'){ stopRec(); return; }   // click again = stop early
      start=null; REEL=buildReel(); endBase=Math.floor(Math.random()*PALETTES.length);   // restart the reel so we capture one clean pass, start → finish
      const stream=c.captureStream(30);
      const mime=['video/mp4;codecs=avc1.640029','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
      const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
      rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:40000000}); chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ clearInterval(timer); clearTimeout(autoStop); const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a');
        a.href=URL.createObjectURL(blob); a.download='open-slots.'+ext; a.click(); btn.classList.remove('on'); btn.textContent='Record'; tEl.classList.remove('on'); };
      rec.start(); t0=performance.now(); tEl.textContent='0:00'; tEl.classList.add('on'); btn.classList.add('on'); btn.textContent='Stop';
      timer=setInterval(()=>{ tEl.textContent=fmt(performance.now()-t0); },250);
      autoStop=setTimeout(stopRec, TOTAL*1000);   // one full reel, then stop + save automatically
    });
    /* Save — grab the current reel frame as a PNG */
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      const a=document.createElement('a'); a.download='open-slots.png'; a.href=c.toDataURL('image/png'); a.click(); });
  })();
  </script>
</body>
</html>
