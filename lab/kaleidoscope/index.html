<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>KALEIDOSCOPE — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:var(--font, 'IBM Plex Sans', system-ui, -apple-system, sans-serif); overscroll-behavior:none; }
  body.dark .opal-topbar{ background:transparent; border:none; color:var(--ink); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }

  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ background:#0b0d16; box-shadow:0 10px 44px rgba(0,0,0,.55); max-width:100%; max-height:100%; display:block; border-radius:2px; cursor:pointer; touch-action:none; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%); font-size:13px; color:var(--dim);
    background:rgba(11,12,20,.7); padding:6px 14px; border-radius:999px; pointer-events:none; transition:opacity .3s; z-index:7; }
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ background:rgba(15,16,24,.92); color:var(--ink); border:1px solid var(--line); border-radius:2px;
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; cursor:pointer;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em; color:#ff5468;
    background:rgba(15,16,24,.92); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:#ff5468; animation:recblink 1s infinite; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  @keyframes recblink{ 50%{ opacity:.25; } }

  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(15,16,24,.92); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column; gap:0; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  /* slider is owned by OPALAB.css */
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.11); }
  .btn[aria-pressed="true"], .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  select.btn{ text-transform:uppercase; width:100%; }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .group + .group{ margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
  .group__t{ font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid2 .btn, .btn.full{ width:100%; }
  .tip{ position:fixed; z-index:60; display:none; max-width:230px; padding:9px 11px; border-radius:8px;
    background:rgba(18,20,28,.97); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }
</style>
<link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body class="dark">
  <div id="wrap"><canvas id="art"></canvas></div>
  <div id="hint">Add an image — it becomes a kaleidoscope the wind plays through the chimes</div>
  <div id="recDot"><i></i><b>0:00</b></div>
  <div id="sizeDock">
    <select id="aspect" title="Canvas size">
      <option value="1080/1350">Portrait · 4:5</option>
      <option value="1080/1920">Story · 9:16</option>
      <option value="1/1" selected>Square · 1:1</option>
      <option value="1920/1080">Landscape · 16:9</option>
    </select>
  </div>

  <div id="dock">

    <!-- primary -->
    <div class="group">
      <button class="btn primary full" id="playBtn" aria-pressed="true">Pause</button>
      <div class="grid2">
        <button class="btn" id="imgBtn" data-tip="Add a photo — it becomes the source the kaleidoscope mirrors. Without one, it uses a soft colour field.">Add image</button>
        <button class="btn" id="clrImgBtn" data-tip="Go back to the generated colour field.">Colour</button>
      </div>
      <input id="imgFile" type="file" accept="image/*" hidden />
    </div>

    <!-- kaleidoscope -->
    <div class="group">
      <div class="group__t">Kaleidoscope</div>
      <div class="knob" data-tip="How many windchimes are hung — and this IS the number of mirrored slices in the kaleidoscope. Fewer is bold and simple; more is an intricate mandala."><label>Chimes <b id="countR">8</b></label><input id="count" type="range" min="2" max="24" value="8" /></div>
      <div class="knob" data-tip="How far into the image the kaleidoscope reaches — tight crop to wide field."><label>Zoom <b id="zoomR">45</b></label><input id="zoom" type="range" min="0" max="100" value="45" /></div>
      <div class="knob" data-tip="A steady turning of the whole pattern."><label>Twist <b id="twistR">30</b></label><input id="twist" type="range" min="0" max="100" value="30" /></div>
    </div>

    <!-- wind -->
    <div class="group">
      <div class="group__t">Wind</div>
      <div class="knob" data-tip="How strong and how often the breeze blows — each gust rings chimes and makes the kaleidoscope pulse and bloom."><label>Breeze <b id="windR">45</b></label><input id="wind" type="range" min="0" max="100" value="45" /></div>
      <div class="knob" data-tip="How much the pattern sways and wobbles in the wind."><label>Sway <b id="swayR">50</b></label><input id="sway" type="range" min="0" max="100" value="50" /></div>
    </div>

    <!-- step -->
    <div class="group">
      <div class="group__t">Step</div>
      <button class="btn full" id="stepBtn" aria-pressed="true" data-tip="Ring the chimes one after another in a loop — a pulse travels the mandala in time, turning it into a repeating rhythm.">Step through · on</button>
      <div class="knob" data-tip="How fast it steps and turns."><label>Tempo <b id="tempoR">45</b></label><input id="tempo" type="range" min="0" max="100" value="45" /></div>
    </div>

    <!-- sound -->
    <div class="group">
      <div class="group__t">Sound</div>
      <select id="scale" class="btn" data-tip="The set of notes every chime is tuned to.">
        <option value="penta">Pentatonic — open, sweet</option>
        <option value="minor">Minor pentatonic — wistful</option>
        <option value="hira">Hirajoshi — Japanese</option>
        <option value="insen">In Sen — shadowy</option>
        <option value="whole">Whole tone — dreamlike</option>
        <option value="major">Major — bright</option>
      </select>
      <select id="material" class="btn" data-tip="What the tubes are made of — the timbre and how long each note rings.">
        <option value="metal">Aluminium — warm metal</option>
        <option value="glass">Glass — pure, short</option>
        <option value="crystal">Crystal — shimmering</option>
        <option value="bamboo">Bamboo — soft, woody</option>
      </select>
      <div class="knob" data-tip="Shifts every chime up or down in pitch."><label>Pitch <b id="pitchR">0</b></label><input id="pitch" type="range" min="-12" max="12" value="0" /></div>
      <div class="knob" data-tip="How long each note rings before it fades."><label>Ring <b id="ringR">55</b></label><input id="ring" type="range" min="0" max="100" value="55" /></div>
      <div class="knob" data-tip="A wash of reverb around the sound."><label>Shimmer <b id="shimmerR">45</b></label><input id="shimmer" type="range" min="0" max="100" value="45" /></div>
      <div class="knob" data-tip="Overall loudness."><label>Volume <b id="volR">70</b></label><input id="vol" type="range" min="0" max="100" value="70" /></div>
    </div>

    <!-- output -->
    <div class="group out">
      <div class="group__t">Output</div>
      <div class="grid2">
        <button class="btn" id="recBtn" aria-pressed="false">Record</button>
        <button class="btn" id="saveBtn">Save</button>
      </div>
    </div>

  </div>

<script src="/lab/shared/opal.js?v=3"></script>
<script>Opal.mountTopbar({ name:'Kaleidoscope', desc:'A kaleidoscope the wind plays',
  about:"Add an image and it becomes a living kaleidoscope. The number of windchimes you hang is the number of mirrored slices — a few for a bold, simple form, many for an intricate mandala. Then the wind plays it: gusts sweep through and ring the chimes (tuned to the scale and material you choose), and every ring makes the kaleidoscope pulse, bloom and turn. Step sends a rhythm travelling around the ring; Zoom and Twist and Sway reshape the pattern; the pitch of each note tints the glow. Click the image to strike a chime by hand. Record the whole performance — sound and all. Runs entirely on your device; no image ever leaves the page.",
  version:'v1' });</script>

<script>
(() => {
  const cv=document.getElementById('art'); const ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  const TAU=Math.PI*2;
  let ASPECT=1, W=0,H=0,dpr=1,S=1;
  const P={ count:8, zoom:45, twist:30, wind:45, sway:50, tempo:45, pitch:0, ring:55, shimmer:45, vol:70 };
  let playing=true, stepping=true, SCALE='penta', MATERIAL='metal';
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const h2r=(h,s,l)=>{ h=(h%1+1)%1; const a=s*Math.min(l,1-l); const f=n=>{ const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,9-k,1)); }; return [f(0)*255,f(8)*255,f(4)*255]; };
  const rgba=(c,a)=>'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';
  const rgbStr=c=>'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';

  // ---------- source image (offscreen) ----------
  const SRC=1024; const srcCv=document.createElement('canvas'); srcCv.width=SRC; srcCv.height=SRC; const sctx=srcCv.getContext('2d');   // power-of-two so the GL texture can REPEAT
  let hasImg=false, userImg=null;

  // ---------- WebGL kaleidoscope (full-frame, tiling — like a real shader kaleidoscope) ----------
  const glcv=document.createElement('canvas'); const gl=glcv.getContext('webgl',{preserveDrawingBuffer:true, antialias:true});
  let glProg=null, glTex=null; const uLoc={};
  function glInit(){ if(!gl) return false;
    const vs='attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
    const fs='precision highp float;\n'+
      'uniform sampler2D uTex; uniform vec2 uRes,uDrift; uniform float uSlices,uTime,uSpin,uZoom,uTumble,uPulse,uHue;\n'+
      'mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }\n'+
      'vec3 hueShift(vec3 col,float h){ const vec3 k=vec3(0.57735); float ca=cos(h*6.2831853); return col*ca+cross(k,col)*sin(h*6.2831853)+k*dot(k,col)*(1.0-ca); }\n'+
      'void main(){\n'+
      '  vec2 uv=(gl_FragCoord.xy-0.5*uRes)/min(uRes.x,uRes.y);\n'+
      '  float r=length(uv);\n'+
      '  float a=atan(uv.y,uv.x)+uSpin;\n'+
      '  float seg=6.2831853/uSlices;\n'+
      '  a=mod(a,seg); a=abs(a-seg*0.5);\n'+                 // fold the wedge into a mirror
      '  vec2 p=vec2(cos(a),sin(a))*r;\n'+
      '  p*=uZoom*(1.0+uPulse*0.14);\n'+
      '  p=rot(uTumble)*p; p+=uDrift;\n'+
      '  vec2 st=fract(p*0.62+0.5);\n'+                      // REPEAT tile the source → motif repeats across the frame
      '  vec3 col=texture2D(uTex,st).rgb;\n'+
      '  col=hueShift(col,uHue); col*=(1.0+uPulse*0.35);\n'+
      '  gl_FragColor=vec4(col,1.0);\n}';
    const sh=(t,src)=>{ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error('SHADER',gl.getShaderInfoLog(s)); return s; };
    glProg=gl.createProgram(); gl.attachShader(glProg,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(glProg,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(glProg);
    if(!gl.getProgramParameter(glProg,gl.LINK_STATUS)) console.error('LINK',gl.getProgramInfoLog(glProg));
    gl.useProgram(glProg);
    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(glProg,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    ['uTex','uRes','uSlices','uTime','uSpin','uZoom','uTumble','uPulse','uHue','uDrift'].forEach(n=>uLoc[n]=gl.getUniformLocation(glProg,n));
    glTex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,glTex);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    return true; }
  function uploadTex(){ if(!gl||!glTex) return; gl.bindTexture(gl.TEXTURE_2D,glTex); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,srcCv); }catch(e){} }
  // the object chamber of a real kaleidoscope — a heap of translucent coloured glass shards on black
  function drawColourField(){ const N=SRC; hasImg=false;
    sctx.globalCompositeOperation='source-over'; sctx.fillStyle='#04050a'; sctx.fillRect(0,0,N,N);
    sctx.globalCompositeOperation='lighter';   // glass adds light where pieces overlap
    for(let i=0;i<200;i++){ const hue=Math.random(); const col=h2r(hue,0.85,0.5);
      const x=Math.random()*N, y=Math.random()*N, r=N*(0.012+Math.random()*Math.random()*0.075);
      sctx.save(); sctx.translate(x,y); sctx.rotate(Math.random()*TAU);
      sctx.globalAlpha=0.30+Math.random()*0.45; sctx.fillStyle=rgbStr(col);
      const sides=3+((Math.random()*4)|0); sctx.beginPath();
      for(let s=0;s<sides;s++){ const a=s/sides*TAU + Math.random()*0.4; const rr=r*(0.55+Math.random()*0.6); const px=Math.cos(a)*rr, py=Math.sin(a)*rr; if(s===0)sctx.moveTo(px,py); else sctx.lineTo(px,py); }
      sctx.closePath(); sctx.fill();
      sctx.globalAlpha=0.5; sctx.strokeStyle=rgbStr(h2r(hue,0.35,0.9)); sctx.lineWidth=N*0.0035; sctx.stroke();   // bright refracted edge
      sctx.restore(); }
    // a few soft jewel glows for depth
    for(let i=0;i<14;i++){ const col=h2r(Math.random(),0.7,0.6); const x=Math.random()*N,y=Math.random()*N,r=N*(0.06+Math.random()*0.12);
      const gd=sctx.createRadialGradient(x,y,0,x,y,r); gd.addColorStop(0,rgba(col,0.5)); gd.addColorStop(1,rgba(col,0)); sctx.fillStyle=gd; sctx.beginPath(); sctx.arc(x,y,r,0,TAU); sctx.fill(); }
    sctx.globalCompositeOperation='source-over'; sctx.globalAlpha=1; uploadTex(); }
  function drawImageSource(img){ const N=SRC; sctx.clearRect(0,0,N,N); sctx.fillStyle='#000'; sctx.fillRect(0,0,N,N);
    const s=Math.max(N/img.width,N/img.height), w=img.width*s, h=img.height*s; sctx.drawImage(img,(N-w)/2,(N-h)/2,w,h); hasImg=true; uploadTex(); }

  // ---------- audio ----------
  let AC=null, master=null, wet=null, streamDest=null;
  const MAT={
    metal:  { parts:[[1,1,2.4],[2.76,0.45,1.5],[5.40,0.22,0.9],[8.93,0.10,0.6]], atk:0.004 },
    glass:  { parts:[[1,1,1.2],[2.40,0.42,0.7],[4.20,0.20,0.45]],                atk:0.002 },
    crystal:{ parts:[[1,1,2.2],[2.00,0.6,1.9],[3.01,0.4,1.4],[4.98,0.24,1.0],[7.0,0.13,0.8]], atk:0.002 },
    bamboo: { parts:[[1,1,0.55],[2.0,0.28,0.35],[3.02,0.10,0.25]],               atk:0.006 },
  };
  function audio(){ if(AC) return AC; AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=(P.vol/100)*0.85;
    const dry=AC.createGain(); wet=AC.createGain(); wet.gain.value=P.shimmer/100;
    const verb=AC.createConvolver(); { const len=Math.floor(AC.sampleRate*3.0), b=AC.createBuffer(2,len,AC.sampleRate);
      for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4); } verb.buffer=b; }
    master.connect(dry).connect(AC.destination); master.connect(verb).connect(wet).connect(AC.destination);
    streamDest=AC.createMediaStreamDestination(); dry.connect(streamDest); wet.connect(streamDest); return AC; }
  let voices=0;
  function strike(freq, amp, pan, when){ if(!AC||voices>44) return; const now=AC.currentTime+(when||0); const m=MAT[MATERIAL]; const ring=0.5+(P.ring/100)*5.5;
    const out=AC.createGain(); out.gain.value=clamp(amp,0,1)*0.5;
    const pn=AC.createStereoPanner?AC.createStereoPanner():null; if(pn){ pn.pan.value=clamp(pan||0,-1,1); out.connect(pn).connect(master); } else out.connect(master);
    m.parts.forEach(([r,pa,ds])=>{ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=freq*r*(1+(Math.random()-0.5)*0.004);
      const g=AC.createGain(); const dur=ring*ds; g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(pa,now+m.atk); g.gain.exponentialRampToValueAtTime(0.0001,now+m.atk+dur);
      o.connect(g).connect(out); o.start(now); o.stop(now+m.atk+dur+0.05); voices++; o.onended=()=>{voices--;}; }); }

  // ---------- chimes = ring of tuned sound-sources; count also = kaleidoscope slices ----------
  const SCALES={ penta:[0,2,4,7,9], minor:[0,3,5,7,10], major:[0,2,4,5,7,9,11], whole:[0,2,4,6,8,10], hira:[0,2,3,7,8], insen:[0,1,5,6,10] };
  let chimes=[];
  function retune(c){ const sc=SCALES[SCALE], base=196*Math.pow(2,P.pitch/12);
    c.tubes.forEach((t,i)=>{ const deg=c.root+i, oct=Math.floor(deg/sc.length), semi=sc[((deg%sc.length)+sc.length)%sc.length]+oct*12; t.freq=base*Math.pow(2,semi/12); t.rel=i/(c.tubes.length-1||1); }); }
  function rebuildChimes(){ const n=P.count; chimes=[]; for(let i=0;i<n;i++){ const ang=(i/n)*TAU; const c={ ang, root:(i*2)%5, lit:0, tubes:Array.from({length:5},()=>({freq:220,rel:0})) }; retune(c); chimes.push(c); } }
  function retuneAll(){ chimes.forEach(retune); }

  let energy=0, pulse=0, hueKick=0;
  function voice(c, i, amp, when){ const t=c.tubes[i]; strike(t.freq, amp, Math.sin(c.ang)*0.55, when||0);
    energy=Math.min(1.4, energy+amp*0.45); hueKick=Math.min(1, hueKick+amp*0.28); c.lit=1; }
  function ringChime(c, amp){ const n=c.tubes.length, k=1+((Math.random()*Math.min(3,n))|0), st=(Math.random()*n)|0;
    for(let j=0;j<k;j++) voice(c,(st+j)%n, amp*(0.5+Math.random()*0.4), j*0.04*Math.random()); }

  // ---------- fit ----------
  function fit(){ const availH=innerHeight-168, availW=innerWidth-28;
    let h=Math.min(availH,1650), w=h*ASPECT; if(w>availW){ w=availW; h=w/ASPECT; }
    W=Math.round(w); H=Math.round(h); S=H/1000;
    dpr=Math.min(devicePixelRatio||1, 2);   // WebGL shader is cheap per pixel — full resolution
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }

  // ---------- sim ----------
  let T=0, t0=performance.now(), stepIdx=0, stepAcc=0, gustTimer=1.2, spin=0;
  function step(dt){ if(!playing) return; T+=dt; const wv=P.wind/100;
    // ambient gusts ring a cluster of chimes
    gustTimer-=dt; if(gustTimer<=0){ if(wv>0.01){ const n=1+Math.floor(Math.random()*Math.max(1,chimes.length*0.4));
        for(let i=0;i<n;i++){ const c=chimes[(Math.random()*chimes.length)|0]; if(c) ringChime(c, 0.4+wv*0.5); } }
      gustTimer=(2.4-wv*1.9)*(0.6+Math.random()*0.9)+0.35; }
    // step sequence — ring around the ring in time
    if(stepping && chimes.length){ stepAcc+=dt; const iv=0.7-(P.tempo/100)*0.58; if(stepAcc>=iv){ stepAcc-=iv; const c=chimes[stepIdx%chimes.length]; if(c) ringChime(c,0.6); stepIdx++; } }
    // decays
    energy=Math.max(0, energy-dt*1.3); hueKick=Math.max(0,hueKick-dt*0.8);
    pulse += (energy - pulse) * Math.min(1, dt*5);   // eased — no sudden jumps
    for(const c of chimes){ if(c.lit>0) c.lit=Math.max(0,c.lit-dt*1.8); }
    spin += dt*(0.04 + (P.tempo/100)*0.22 + wv*0.14 + (P.twist/100)*0.35 + pulse*0.22);  // steady, smooth
  }

  // ---------- kaleidoscope render — full-frame WebGL, blitted to the 2D canvas so record/save keep working ----------
  function render(){
    const bw=cv.width, bh=cv.height;
    if(gl && glProg){
      if(glcv.width!==bw||glcv.height!==bh){ glcv.width=bw; glcv.height=bh; }
      gl.viewport(0,0,bw,bh); gl.useProgram(glProg);
      const slices=Math.max(2, Math.min(24, chimes.length||P.count));
      const wob=Math.sin(T*1.3)*(P.sway/100)*0.12;
      gl.uniform2f(uLoc.uRes,bw,bh);
      gl.uniform1f(uLoc.uSlices,slices);
      gl.uniform1f(uLoc.uTime,T);
      gl.uniform1f(uLoc.uSpin,spin);
      gl.uniform1f(uLoc.uZoom,0.7+(P.zoom/100)*1.9);
      gl.uniform1f(uLoc.uTumble,T*(0.05+(P.wind/100)*0.13)+pulse*0.14);
      gl.uniform1f(uLoc.uPulse,pulse);
      gl.uniform1f(uLoc.uHue,0.0);   // hue is never shifted — the source colours stay true
      gl.uniform2f(uLoc.uDrift,0.2+Math.sin(T*0.13)*0.15+wob, 0.14+Math.cos(T*0.10)*0.15);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,glTex); gl.uniform1i(uLoc.uTex,0);
      gl.drawArrays(gl.TRIANGLES,0,3);
      ctx.setTransform(1,0,0,1,0,0); ctx.drawImage(glcv,0,0);
    } else { ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#0b0d16'; ctx.fillRect(0,0,bw,bh); }
  }

  // ---------- loop ----------
  function tick(now){ requestAnimationFrame(tick); const dt=Math.min(0.05,(now-t0)/1000); t0=now; step(dt); render(); }

  // ---------- interaction ----------
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); const A=audio(); if(A.state==='suspended') A.resume();
    if(chimes.length) ringChime(chimes[(Math.random()*chimes.length)|0], 0.85); $('hint').style.opacity=0; });

  // ---------- controls ----------
  $('playBtn').addEventListener('click', ()=>{ playing=!playing; if(playing && AC && AC.state==='suspended') AC.resume();
    $('playBtn').textContent=playing?'Pause':'Play'; $('playBtn').setAttribute('aria-pressed',playing?'true':'false'); });
  $('stepBtn').addEventListener('click', ()=>{ stepping=!stepping; $('stepBtn').textContent=stepping?'Step through · on':'Step through · off'; $('stepBtn').setAttribute('aria-pressed',stepping?'true':'false'); });
  $('imgBtn').addEventListener('click', ()=> $('imgFile').click());
  $('imgFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const img=new Image();
    img.onload=()=>{ userImg=img; drawImageSource(img); $('hint').style.opacity=0; }; img.src=URL.createObjectURL(f); });
  $('clrImgBtn').addEventListener('click', ()=>{ userImg=null; drawColourField(); });
  const fmt={ pitch:v=>(v>0?'+':'')+v };
  [['count'],['zoom'],['twist'],['wind'],['sway'],['tempo'],['pitch'],['ring'],['shimmer'],['vol']].forEach(([k])=>{
    const inp=$(k), out=$(k+'R'); inp.addEventListener('input', ()=>{ P[k]=+inp.value; out.textContent=(fmt[k]?fmt[k](P[k]):P[k]);
      if(k==='count') rebuildChimes();
      if(k==='pitch') retuneAll();
      if(k==='vol' && master) master.gain.setTargetAtTime((P.vol/100)*0.85, AC.currentTime, 0.02);
      if(k==='shimmer' && wet) wet.gain.setTargetAtTime(P.shimmer/100, AC.currentTime, 0.02);
    }); });
  $('scale').addEventListener('change', e=>{ SCALE=e.target.value; retuneAll(); });
  $('material').addEventListener('change', e=>{ MATERIAL=e.target.value; });
  $('aspect').addEventListener('change', e=>{ const [x,y]=e.target.value.split('/').map(Number); ASPECT=x/y; fit(); });

  // ---------- record (video + audio) ----------
  let rec=null, chunks=[], recCv=null, recCtx=null, recRAF=0, recStart=0, recTimer=0;
  const recFmt=ms=>{ const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  $('recBtn').addEventListener('click', ()=>{ if(rec && rec.state==='recording'){ rec.stop(); return; }
    const A=audio(); if(A.state==='suspended') A.resume();
    const long=1920, ev2=n=>n-(n&1);
    const rw=ev2(ASPECT>=1?long:Math.round(long*ASPECT)), rh=ev2(ASPECT>=1?Math.round(long/ASPECT):long);
    recCv=document.createElement('canvas'); recCv.width=rw; recCv.height=rh; recCtx=recCv.getContext('2d');
    recCtx.imageSmoothingEnabled=true; recCtx.imageSmoothingQuality='high';
    const drawFrame=()=>{ recCtx.drawImage(cv,0,0,rw,rh); }; drawFrame();
    const stream=recCv.captureStream(30);
    try{ if(streamDest) streamDest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr)); }catch(err){}
    const mime=['video/mp4;codecs=avc1.640029,mp4a.40.2','video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:24000000, audioBitsPerSecond:192000}); chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ cancelAnimationFrame(recRAF); clearInterval(recTimer); $('recDot').classList.remove('on');
      const blob=new Blob(chunks,{type:mime}); const a2=document.createElement('a'); a2.href=URL.createObjectURL(blob); a2.download='kaleidoscope.'+ext; a2.click();
      $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false'); };
    rec.start();
    (function comp(){ drawFrame(); if(rec && rec.state==='recording') recRAF=requestAnimationFrame(comp); })();
    recStart=performance.now(); $('recDot').classList.add('on'); $('recDot').querySelector('b').textContent='0:00';
    recTimer=setInterval(()=>{ $('recDot').querySelector('b').textContent=recFmt(performance.now()-recStart); }, 250);
    $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true'); });
  $('saveBtn').addEventListener('click', ()=>{ const a2=document.createElement('a'); a2.download='kaleidoscope.png'; a2.href=cv.toDataURL('image/png'); a2.click(); });

  addEventListener('resize', ()=>{ fit(); });
  setTimeout(()=>{ $('hint').style.opacity=0; }, 6000);

  // ---------- tooltips ----------
  let tipEl=null, tipT=null, tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return;
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0';
    const r=host.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8, r.bottom+8);
    tipEl.style.left=Math.max(8,Math.min(r.left, innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover', e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return;
    clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown', hideTip); addEventListener('scroll', hideTip, true);

  // ---------- go ----------
  glInit(); drawColourField(); rebuildChimes(); fit(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
