<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mitsuo — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0;
    display:flex; align-items:center; justify-content:center; padding:28px; }
  #art{ max-width:100%; max-height:100%; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); right:24px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; }
  #sizeDock{ display:flex; align-items:center; gap:10px; }
  #sizeDock #dimReadout{ font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; }
  .crow{ display:flex; align-items:center; justify-content:space-between; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  #letterIn{ width:100%; font-size:15px; letter-spacing:.02em; }
  .rowhint{ margin:0; font-size:12px; color:var(--mute); line-height:1.45; }
  /* glow-layer rows (built by JS) */
  #glowList{ display:flex; flex-direction:column; gap:10px; }
  .glow-row{ display:flex; flex-direction:column; gap:7px; padding:11px; border-radius:var(--r-input);
    background:var(--cell); box-shadow:var(--shadow-inset); }
  .glow-row .top{ display:flex; align-items:center; gap:8px; }
  .glow-row .top input[type=color]{ width:34px; height:24px; }
  .glow-row .top .lbl{ font-size:12px; color:var(--mute); flex:1; }
  .glow-row .x{ width:24px; height:24px; padding:0; font-size:14px; line-height:1; }
</style>
<link rel="stylesheet" href="/lab/shared/OPALAB.css" />
</head>
<body class="dark">

<div id="wrap"><canvas id="art"></canvas></div>
<div id="recDot"><i></i><b>0:00</b></div>
<div id="sizeDock">
  <span id="dimReadout">1080 × 1080</span>
  <select id="aspect" title="Canvas size">
    <option value="1080/1080" selected>Square · 1:1</option>
    <option value="1080/1350">Portrait · 4:5</option>
    <option value="1080/1920">Story · 9:16</option>
    <option value="1920/1080">Landscape · 16:9</option>
  </select>
</div>

<div id="dock">
  <div class="group">
    <div class="group__t">Letter</div>
    <input class="opal-input" id="letterIn" type="text" value="C" maxlength="4" spellcheck="false" autocomplete="off">
    <div class="knob"><label>Size <b id="lszR">0.72</b></label><input id="lsz" type="range" min="20" max="98" value="72"></div>
  </div>

  <div class="group">
    <div class="group__t">Dots</div>
    <p class="rowhint">A few large circles trace the letter and fuse into liquid metaballs where they meet.</p>
    <div class="duo">
      <div class="knob"><label>Count <b id="countR">6</b></label><input id="count" type="range" min="2" max="14" value="6"></div>
      <div class="knob"><label>Size <b id="sizeR">52</b></label><input id="size" type="range" min="0" max="100" value="52"></div>
    </div>
    <div class="duo">
      <div class="knob"><label>Size jitter <b id="jitterR">28</b></label><input id="jitter" type="range" min="0" max="100" value="28"></div>
      <div class="knob"><label>Connection <b id="conR">0.55</b></label><input id="con" type="range" min="0" max="100" value="55"></div>
    </div>
    <div class="knob"><label>Blur dots <b id="blurR">12</b></label><input id="blur" type="range" min="0" max="100" value="12"></div>
    <div class="crow"><label>Dot colour</label><input type="color" class="sw" id="dotCol" value="#f4f0ff"></div>
  </div>

  <div class="group">
    <div class="group__t">Glow layers</div>
    <p class="rowhint">Soft Gaussian clouds beneath the dots — stack as many as you like, colour each.</p>
    <div id="glowList"></div>
    <button class="btn" id="addGlow">+ Add glow</button>
  </div>

  <div class="group">
    <div class="group__t">Motion</div>
    <div class="grid2">
      <button class="btn" id="playBtn" aria-pressed="true">Pause</button>
      <button class="btn" id="reseedBtn">Reseed</button>
    </div>
    <div class="duo">
      <div class="knob"><label>Wave <b id="waveR">15</b></label><input id="wave" type="range" min="0" max="100" value="15"></div>
      <div class="knob"><label>Glow drift <b id="mvR">0.5</b></label><input id="mv" type="range" min="0" max="100" value="50"></div>
    </div>
    <div class="knob"><label>Speed <b id="spdR">1.0</b></label><input id="spd" type="range" min="1" max="40" value="10"></div>
    <div class="crow"><label>Background</label><input type="color" class="sw" id="bg" value="#b11a10"></div>
  </div>

  <div class="group out" id="output" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2">
      <button class="btn" id="recBtn">Record</button>
      <button class="btn" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Mitsuo', desc:'A letter, poured into liquid dots',
  about:'After Mitsuo Katsui. Type a letter and a few large circles trace its shape — set how many (a handful, no more), how big, and how much they vary — then fuse into smooth liquid metaballs where they meet. Throw some out of focus for depth. Beneath them, stack soft Gaussian glow clouds and colour each one for a thermal, molten ground. Then set it all in motion — the circles breathe so they connect and part, the glows drift. Export a still, or record the flow.',
  version:'v1' });</script>
<script>
'use strict';
(function(){
  const $=id=>document.getElementById(id);
  const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const art=$('art'); let ctx=art.getContext('2d');
  const P={ letter:'C', lsz:0.72, count:6, size:52, jitter:28, con:0.55, blur:12, wave:15,
    dotCol:'#f4f0ff', bg:'#b11a10', mv:0.5, spd:1.0, play:true, aspect:'1080/1080', seed:1,
    glows:[ {color:'#160a12', blur:34, opacity:0.95}, {color:'#7a2bd6', blur:48, opacity:0.6} ] };
  let W=1400,H=1400, RS=1, LDATA=null, t0=performance.now(), clock=0;
  const letterCv=document.createElement('canvas'), lctx=letterCv.getContext('2d',{willReadFrequently:true});
  const dotCv=document.createElement('canvas'), dctx=dotCv.getContext('2d');
  const d2=document.createElement('canvas'), d2ctx=d2.getContext('2d',{willReadFrequently:true});
  const tintCache={};

  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  function rngFrom(s){ let a=s>>>0; return ()=>{ a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

  // ---- letter → white glyph on transparent, sized to fill ----
  function buildLetter(){
    letterCv.width=W; letterCv.height=H; lctx.clearRect(0,0,W,H);
    const word=(P.letter||'C'); lctx.fillStyle='#fff'; lctx.textAlign='center'; lctx.textBaseline='middle';
    // grow the font until it fills P.lsz of the canvas
    let fp=Math.round(H*0.9); lctx.font='900 '+fp+'px "Arial Black","Helvetica Neue",system-ui,sans-serif';
    let m=lctx.measureText(word); const targetW=W*P.lsz, targetH=H*P.lsz;
    const sw=targetW/(m.width||1), sh=targetH/((m.actualBoundingBoxAscent+m.actualBoundingBoxDescent)||fp*0.7);
    fp=Math.max(20, Math.round(fp*Math.min(sw,sh)));
    lctx.font='900 '+fp+'px "Arial Black","Helvetica Neue",system-ui,sans-serif';
    lctx.fillText(word, W/2, H/2);
    LDATA=lctx.getImageData(0,0,W,H).data;
    for(const k in tintCache) delete tintCache[k];
  }
  const hash=(i,j,s)=>{ const x=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453; return x-Math.floor(x); };
  const covA=(x,y,w)=>{ x|=0; y|=0; if(x<0||y<0||x>=w||!LDATA) return 0; const idx=((y*w+x)<<2)+3; return idx<LDATA.length?LDATA[idx]/255:0; };
  function tinted(color){ if(tintCache[color]) return tintCache[color];
    const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
    g.drawImage(letterCv,0,0); g.globalCompositeOperation='source-in'; g.fillStyle=color; g.fillRect(0,0,W,H);
    tintCache[color]=c; return c; }
  // an oil-slick spectrum fill of the letter — the travelling rainbow aura (Katsui). Not cached (animates).
  const _rb=document.createElement('canvas'), _rbx=_rb.getContext('2d');
  function rainbowLetter(time){ _rb.width=W; _rb.height=H; _rbx.clearRect(0,0,W,H);
    _rbx.drawImage(letterCv,0,0); _rbx.globalCompositeOperation='source-in';
    const grad=_rbx.createLinearGradient(0,H,W,0), off=(time*0.12)%1;
    for(let i=0;i<=8;i++){ const h=(((i/8)+off)%1)*360; grad.addColorStop(i/8, 'hsl('+h+',88%,58%)'); }
    _rbx.fillStyle=grad; _rbx.fillRect(0,0,W,H); _rbx.globalCompositeOperation='source-over'; return _rb; }

  // ---- render one frame into g at size w×h ----
  function render(g,w,h,time){
    g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.filter='none';
    g.fillStyle=P.bg; g.fillRect(0,0,w,h);
    const drift=P.mv, sp=time;
    // 1) glow layers (bottom → top), each a blurred tinted letter that slowly drifts
    for(let i=0;i<P.glows.length;i++){ const L=P.glows[i];
      const dx=Math.sin(sp*0.6+i*1.7)*drift*36*RS, dy=Math.cos(sp*0.5+i*2.3)*drift*30*RS;
      g.save(); g.globalAlpha=L.opacity; g.filter='blur('+(L.blur*RS)+'px)';
      g.drawImage(L.rainbow ? rainbowLetter(time) : tinted(L.color), dx, dy); g.restore(); }
    if(!LDATA) return;
    // 2) a FEW LARGE circles that trace the letter (≤ Count), placed by farthest-point sampling so
    //    they spread evenly across the strokes, then fused as METABALLS where neighbours touch.
    const R=(34+(P.size/100)*200)*RS;             // big circle radius
    const jit=P.jitter/100, waveA=P.wave/100, blurFrac=P.blur/100;
    // candidate points = covered cells on a coarse grid, spaced ~ the circle radius
    const step=Math.max(6, R*0.5), cands=[];
    for(let y=step*0.5;y<h;y+=step) for(let x=step*0.5;x<w;x+=step){ if(covA(x,y,w)>0.5) cands.push([x,y]); }
    if(!cands.length) return;
    // min-distance ("beads on the stroke") sampling — neighbours sit ~1.4·R apart so they OVERLAP
    // into smooth necks, deterministically shuffled (Reseed reshuffles), capped at Count.
    const d2fn=(a,b)=>{ const dx=a[0]-b[0],dy=a[1]-b[1]; return dx*dx+dy*dy; };
    const rng=rngFrom(((P.seed||1)*2654435761)>>>0), Dmin=R*1.7, Dmin2=Dmin*Dmin;
    const order=cands.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){ const j=(rng()*(i+1))|0; const t=order[i]; order[i]=order[j]; order[j]=t; }
    const chosen=[];
    for(const idx of order){ if(chosen.length>=P.count) break; const c=cands[idx];
      let ok=true; for(let q=0;q<chosen.length;q++){ if(d2fn(c,chosen[q])<Dmin2){ ok=false; break; } }
      if(ok) chosen.push(c); }
    // draw the solid circles into dotCv; stash the out-of-focus ones for a soft pass on top
    if(dotCv.width!==w||dotCv.height!==h){ dotCv.width=w; dotCv.height=h; }
    dctx.setTransform(1,0,0,1,0,0); dctx.filter='none'; dctx.globalCompositeOperation='source-over';
    dctx.clearRect(0,0,w,h); dctx.fillStyle=P.dotCol;
    const soft=[];
    for(let n=0;n<chosen.length;n++){ const x=chosen[n][0], y=chosen[n][1];
      let r=R*(1+(hash(n,7,P.seed)-0.5)*jit*1.1);
      if(waveA>0) r*=1+waveA*0.45*Math.sin(n*1.9 - time*2.2);      // gentle breathing = motion
      if(r<1) continue;
      if(blurFrac>0 && hash(n,3,P.seed+7)<blurFrac){ soft.push([x,y,r]); continue; }
      dctx.beginPath(); dctx.arc(x,y,r,0,TAU); dctx.fill();
    }
    // metaball union: blur the solid field then hard-threshold the alpha → smooth necks where circles meet
    const conn=P.con*R*0.9;                        // connection reach; 0 = distinct circles
    if(d2.width!==w||d2.height!==h){ d2.width=w; d2.height=h; }
    d2ctx.setTransform(1,0,0,1,0,0); d2ctx.globalCompositeOperation='source-over'; d2ctx.clearRect(0,0,w,h);
    d2ctx.filter = conn>0.5 ? 'blur('+conn.toFixed(1)+'px)' : 'none'; d2ctx.drawImage(dotCv,0,0); d2ctx.filter='none';
    const im=d2ctx.getImageData(0,0,w,h), D=im.data, dc=hex(P.dotCol), T=128;
    for(let k=0;k<D.length;k+=4){ if(D[k+3]>=T){ D[k]=dc[0]; D[k+1]=dc[1]; D[k+2]=dc[2]; D[k+3]=255; } else D[k+3]=0; }
    d2ctx.putImageData(im,0,0);
    g.drawImage(d2,0,0);                            // solid, hard-edged, connected — over the glow
    // 3) the out-of-focus circles — soft pucks in the dot colour, on top
    if(soft.length){ g.save(); g.fillStyle=P.dotCol;
      for(const s of soft){ g.filter='blur('+(s[2]*0.5).toFixed(1)+'px)'; g.beginPath(); g.arc(s[0],s[1],s[2],0,TAU); g.fill(); }
      g.restore(); g.filter='none'; }
  }

  // ---- size / fit ----
  function aspectWH(){ const p=(P.aspect||'1080/1080').split(/[/:x]/).map(Number),a=p[0]||1,b=p[1]||1,long=1400;
    return a>=b?[long,Math.round(long*b/a)]:[Math.round(long*a/b),long]; }
  function fit(){ [W,H]=aspectWH(); art.width=W; art.height=H;
    const box=$('wrap').getBoundingClientRect(), s=Math.min(box.width/W,box.height/H);
    art.style.width=(W*s)+'px'; art.style.height=(H*s)+'px';
    const dr=$('dimReadout'); if(dr){ const p=(P.aspect||'').split(/[/:x]/).map(Number); dr.textContent=(p[0]||W)+' × '+(p[1]||H); }
    buildLetter(); }

  function tick(){ const now=performance.now(), dt=Math.min(0.05,(now-t0)/1000); t0=now;
    if(P.play) clock+=dt*P.spd; render(ctx,W,H,clock); requestAnimationFrame(tick); }

  // ---- controls ----
  let _rq=false; function draw(){ if(!P.play) render(ctx,W,H,clock); }
  function scheduleDraw(){ if(_rq||P.play) return; _rq=true; requestAnimationFrame(()=>{ _rq=false; render(ctx,W,H,clock); }); }
  function bind(id,rid,fn,fmt){ const el=$(id),o=$(rid); if(!el) return;
    el.addEventListener('input',()=>{ fn(parseFloat(el.value)); if(o)o.textContent=fmt?fmt(el.value):el.value; scheduleDraw(); }); }
  $('letterIn').addEventListener('input',e=>{ P.letter=e.target.value||'C'; buildLetter(); scheduleDraw(); });
  bind('lsz','lszR',v=>P.lsz=v/100,v=>(v/100).toFixed(2));
  $('lsz').addEventListener('input',()=>{ buildLetter(); });   // letter size needs a letter rebuild
  bind('count','countR',v=>P.count=v,v=>(v|0));
  bind('size','sizeR',v=>P.size=v,v=>(v|0));
  bind('jitter','jitterR',v=>P.jitter=v,v=>(v|0));
  bind('con','conR',v=>P.con=v/100,v=>(v/100).toFixed(2));
  bind('blur','blurR',v=>P.blur=v,v=>(v|0));
  bind('wave','waveR',v=>P.wave=v,v=>(v|0));
  bind('mv','mvR',v=>P.mv=v/100,v=>(v/100).toFixed(2));
  bind('spd','spdR',v=>P.spd=v/10,v=>(v/10).toFixed(1));
  $('dotCol').addEventListener('input',e=>{ P.dotCol=e.target.value; scheduleDraw(); });
  $('bg').addEventListener('input',e=>{ P.bg=e.target.value; scheduleDraw(); });
  $('aspect').addEventListener('change',e=>{ P.aspect=e.target.value; fit(); scheduleDraw(); });
  function setPlay(){ $('playBtn').textContent=P.play?'Pause':'Play'; $('playBtn').setAttribute('aria-pressed',String(P.play)); }
  $('playBtn').addEventListener('click',()=>{ P.play=!P.play; setPlay(); });
  $('reseedBtn').addEventListener('click',()=>{ P.seed=(P.seed*1103515245+12345)&0x7fffffff; scheduleDraw(); });

  // glow-layer list (add / remove / recolour / reblur)
  function renderGlows(){ const host=$('glowList'); host.innerHTML='';
    P.glows.forEach((L,i)=>{ const row=document.createElement('div'); row.className='glow-row';
      row.innerHTML='<div class="top"><input type="color" value="'+L.color+'"'+(L.rainbow?' disabled':'')+'>'+
        '<button class="btn rb" style="flex:1" aria-pressed="'+(L.rainbow?'true':'false')+'">Rainbow</button>'+
        '<button class="btn x" title="Remove">×</button></div>'+
        '<div class="knob"><label>Blur <b>'+(L.blur|0)+'</b></label><input class="bl" type="range" min="2" max="140" value="'+L.blur+'"></div>'+
        '<div class="knob"><label>Opacity <b>'+L.opacity.toFixed(2)+'</b></label><input class="op" type="range" min="0" max="100" value="'+Math.round(L.opacity*100)+'"></div>';
      row.querySelector('.rb').addEventListener('click',e=>{ L.rainbow=!L.rainbow; renderGlows(); scheduleDraw(); });
      row.querySelector('input[type=color]').addEventListener('input',e=>{ L.color=e.target.value; scheduleDraw(); });
      const bl=row.querySelector('.bl'); bl.addEventListener('input',e=>{ L.blur=+e.target.value; bl.previousElementSibling.querySelector('b').textContent=(L.blur|0); scheduleDraw(); });
      const op=row.querySelector('.op'); op.addEventListener('input',e=>{ L.opacity=+e.target.value/100; op.previousElementSibling.querySelector('b').textContent=L.opacity.toFixed(2); scheduleDraw(); });
      row.querySelector('.x').addEventListener('click',()=>{ P.glows.splice(i,1); renderGlows(); scheduleDraw(); });
      host.appendChild(row); }); }
  $('addGlow').addEventListener('click',()=>{ P.glows.push({color:'#7a2bd6', blur:44, opacity:0.55}); renderGlows(); scheduleDraw(); });

  // ---- export: re-render the exact frame at any resolution (everything scales by RS) ----
  function renderExport(px){
    const [aw,ah]=aspectWH(), long=Math.max(aw,ah), ew=Math.round(px*aw/long), eh=Math.round(px*ah/long);
    const off=document.createElement('canvas'); off.width=ew; off.height=eh;
    const sW=W,sH=H,sRS=RS; W=ew; H=eh; RS=Math.max(1,px/long);
    buildLetter(); render(off.getContext('2d'), ew, eh, clock);
    W=sW; H=sH; RS=sRS; buildLetter();   // restore display state
    return off;
  }
  Opal.mountOutput(art, 'mitsuo', { render: renderExport });
  (function(){ const s=document.querySelector('.opal-ex-scale'); if(!s) return;
    const hi=Math.min(parseInt(s.max)||8192, 2600); s.value=String(hi); s.dataset.touched='1'; s.dispatchEvent(new Event('input',{bubbles:true})); })();

  // ---- record ----
  let rec=null, chunks=[], rt=0, tk=0;
  $('recBtn').addEventListener('click',()=>{ if(rec){ rec.stop(); return; }
    if(!P.play){ P.play=true; setPlay(); }
    const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
    rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime}:undefined); chunks=[];
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    rec.onstop=()=>{ clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false');
      const bl=new Blob(chunks,{type:chunks[0]?.type||'video/webm'}); const a=document.createElement('a'); a.download='mitsuo.'+(bl.type.indexOf('mp4')>=0?'mp4':'webm'); a.href=URL.createObjectURL(bl); a.click(); rec=null; };
    rec.start(); rt=Date.now(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true');
    tk=setInterval(()=>{ const s=Math.floor((Date.now()-rt)/1000); $('recDot').querySelector('b').textContent=(s/60|0)+':'+String(s%60).padStart(2,'0'); },250); });

  addEventListener('resize',()=>{ const box=$('wrap').getBoundingClientRect(),s=Math.min(box.width/W,box.height/H); art.style.width=(W*s)+'px'; art.style.height=(H*s)+'px'; });

  // ---- boot ----
  renderGlows(); setPlay(); fit(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
