<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Pure Land — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css?v=3" />
<style>
  :root{ --rail:300px; --top:120px; }
  @media (max-width:560px){ :root{ --top:112px; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100vh; height:100dvh; overflow:hidden; background:var(--paper); font-family:var(--font, 'IBM Plex Sans', system-ui, sans-serif); }
  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6; overflow-y:auto; }
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; background:var(--mat);
    display:flex; align-items:center; justify-content:center; padding:22px; }
  #art{ max-width:100%; max-height:100%; display:block; box-shadow:none; }
  #recDot{ position:fixed; top:calc(var(--top) + 14px); right:24px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; font-size:11px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:var(--rec); }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rowhint{ font-size:12px; line-height:1.5; color:var(--mute); margin:0; }
</style>
  <link rel="stylesheet" href="/lab/shared/OPALAB.css?v=3" />
</head>
<body>
  <script src="/lab/shared/opal.js"></script>
  <script>Opal.mountTopbar({ name:'Pure Land', desc:'Volumetric motion gradients, shaped by a form',
    about:'A gradient field obeys a form. A signed-distance shape — circle, ring, square, capsule, triangle, arch — carries a soft, volumetric, oil-slick gradient: Bloom (a luminous iridescent orb masked inside), Rim (a dispersed gradient light along the edge), Sweep (a rotating iridescent fill), or Echo (concentric shells receding into a tunnel). An IQ cosine palette gives the oil-on-water iridescence; chromatic dispersion splits it; a domain-warp breathes it. Drift the hue, warp, disperse, and set it in motion. WebGL, so it stays smooth and deep. Export a still, or record the drift.' });</script>
  <div id="sizeDock">
    <span id="dimReadout">1080 × 1920</span>
    <select id="aspect" title="Canvas size">
      <option value="1080/1920" selected>Story · 9:16</option>
      <option value="1280/1600">Portrait · 4:5</option>
      <option value="1400/1400">Square · 1:1</option>
      <option value="1600/900">Landscape · 16:9</option>
    </select>
  </div>
  <div id="recDot"><i></i><b>0:00</b></div>

  <div id="dock">
    <div class="group">
      <div class="group__t">Form</div>
      <select class="opal-input" id="shape">
        <option value="0" selected>Circle</option>
        <option value="1">Ring</option>
        <option value="2">Square</option>
        <option value="3">Capsule</option>
        <option value="4">Triangle</option>
        <option value="5">Arch</option>
      </select>
      <div class="duo">
        <div class="knob"><label>Scale <b id="scaleR">0.60</b></label><input id="scale" type="range" min="15" max="120" value="60"></div>
        <div class="knob"><label>Rotate <b id="rotR">0</b></label><input id="rot" type="range" min="0" max="360" value="0"></div>
      </div>
    </div>

    <div class="group">
      <div class="group__t">Mode</div>
      <select class="opal-input" id="mode">
        <option value="0" selected>Bloom · luminous orb inside</option>
        <option value="1">Rim · dispersed edge light</option>
        <option value="2">Sweep · rotating fill</option>
        <option value="3">Echo · receding shells</option>
      </select>
      <div class="duo">
        <div class="knob"><label>Reach <b id="reachR">70</b></label><input id="reach" type="range" min="12" max="180" value="70"></div>
        <div class="knob"><label>Bands <b id="bandsR">3.0</b></label><input id="bands" type="range" min="5" max="120" value="30"></div>
      </div>
      <div class="knob"><label>Edge <b id="edgeR">30</b></label><input id="edge" type="range" min="0" max="100" value="30"></div>
    </div>

    <div class="group">
      <div class="group__t">Colour</div>
      <select class="opal-input" id="palette">
        <option value="iris" selected>Iridescent (oil-slick)</option>
        <option value="aurora">Aurora</option>
        <option value="ember">Ember</option>
        <option value="ice">Ice</option>
        <option value="dusk">Dusk</option>
        <option value="gold">Gold</option>
      </select>
      <div class="duo">
        <div class="knob"><label>Hue <b id="hueR">0</b></label><input id="hue" type="range" min="-180" max="180" value="0"></div>
        <div class="knob"><label>Dispersion <b id="dispR">18</b></label><input id="disp" type="range" min="0" max="80" value="18"></div>
      </div>
      <div class="duo">
        <div class="knob"><label>Bright <b id="brightR">1.00</b></label><input id="bright" type="range" min="40" max="180" value="100"></div>
        <div class="knob"><label>Warp <b id="warpR">22</b></label><input id="warp" type="range" min="0" max="100" value="22"></div>
      </div>
      <div class="crow"><label>Ground</label><input type="color" class="sw" id="ground" value="#080810"></div>
    </div>

    <div class="group">
      <div class="group__t">Motion</div>
      <div class="grid2"><button class="btn" id="reroll">Re-seed</button><button class="btn" id="playBtn" aria-pressed="true">Pause</button></div>
      <div class="duo">
        <div class="knob"><label>Flow <b id="flowR">50</b></label><input id="flow" type="range" min="0" max="150" value="50"></div>
        <div class="knob"><label>Pulse <b id="pulseR">35</b></label><input id="pulse" type="range" min="0" max="120" value="35"></div>
      </div>
      <div class="duo">
        <div class="knob"><label>Speed <b id="spdR">1.0</b></label><input id="spd" type="range" min="0" max="40" value="10"></div>
        <div class="knob"><label>Grain <b id="grainR">10</b></label><input id="grain" type="range" min="0" max="70" value="10"></div>
      </div>
    </div>
  </div>

  <div id="wrap"><canvas id="art" width="1080" height="1920"></canvas></div>

  <div class="group out" id="output" data-export-custom>
    <div class="group__t">Output</div>
    <div class="grid2"><button class="btn" id="recBtn">Record</button><button class="btn" id="saveBtn">Save</button></div>
  </div>

  <script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes; uniform float uT;
uniform float uShape, uMode, uScale, uRot, uReach, uBands, uHue, uDisp, uBright, uWarp, uFlow, uPulse, uGrain, uSeed, uEdge;
uniform vec3 uGround, uPA, uPB, uPC, uPD;
const float TAU=6.2831853;

float hash21(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  float a=hash21(i), b=hash21(i+vec2(1,0)), c=hash21(i+vec2(0,1)), d=hash21(i+vec2(1,1));
  return mix(mix(a,b,f.x), mix(c,d,f.x), f.y); }
float fbm(vec2 p){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vnoise(p); p*=2.03; a*=.5; } return s; }

vec3 pal(float t){ return uPA + uPB*cos(TAU*(uPC*t + uPD + uHue)); }

mat2 rot(float a){ float c=cos(a),s=sin(a); return mat2(c,-s,s,c); }
float sdCircle(vec2 p,float r){ return length(p)-r; }
float sdBox(vec2 p,vec2 b){ vec2 d=abs(p)-b; return length(max(d,0.))+min(max(d.x,d.y),0.); }
float sdRoundBox(vec2 p,vec2 b,float r){ vec2 d=abs(p)-b+r; return length(max(d,0.))+min(max(d.x,d.y),0.)-r; }
float sdTri(vec2 p,float r){ const float k=1.7320508; p.x=abs(p.x)-r; p.y=p.y+r/k;
  if(p.x+k*p.y>0.) p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.; p.x-=clamp(p.x,-2.*r,0.); return -length(p)*sign(p.y); }

float sdf(vec2 p){
  p=rot(uRot)*p;
  float sh=uShape;
  if(sh<0.5) return sdCircle(p, uScale);
  else if(sh<1.5) return abs(sdCircle(p, uScale)) - uScale*0.19;               // ring
  else if(sh<2.5) return sdBox(p, vec2(uScale*0.9));
  else if(sh<3.5) return sdRoundBox(p, vec2(uScale*0.55, uScale), uScale*0.55); // capsule
  else if(sh<4.5) return sdTri(p*1.05, uScale*0.9);
  else { float c=sdCircle(p,uScale); float cut=p.y - uScale*0.02; return max(c, -cut); } // arch (top half-ish)
}

vec3 disperse(float t, float amt){ // sample palette per channel for chromatic split
  return vec3( pal(t-amt).r, pal(t).g, pal(t+amt).b );
}

void main(){
  vec2 uv=(gl_FragCoord.xy - 0.5*uRes)/min(uRes.x,uRes.y);
  float ph = uT*uFlow*0.04 + uSeed;
  float pulse = 1. + uPulse*0.14*sin(uT*0.8);
  float reach = uReach*0.008*pulse;
  float disp = uDisp*0.01;

  // domain warp — breathes the field organically
  vec2 w = uv;
  if(uWarp>0.001){ float a=uWarp*0.003;
    w += a*vec2(fbm(uv*2.4 + vec2(0., uT*0.15)), fbm(uv*2.4 + vec2(5.2,-uT*0.13))); }

  float d = sdf(w);
  float ew = mix(0.05, 0.0012, uEdge);   // mask half-width: soft → hard
  vec3 col = uGround;
  // a soft ground glow of colour
  col = mix(col, pal(0.08 - ph)*0.22, smoothstep(1.15, 0.0, length(uv))*0.5);

  float m = uMode;
  if(m<0.5){                    // BLOOM
    float r = length(w)/max(reach,1e-3);
    float env = exp(-r*r*1.15);                         // brightness envelope
    vec3 c = disperse(r*(uBands*0.06) - ph, disp);      // iridescent rings
    c += pal(0.85-ph)*exp(-r*r*3.5)*0.85;               // luminous colour core (not pure white)
    float mask = smoothstep(ew, -ew, d);            // inside the form (soft)
    col = mix(col, c*env*uBright, clamp(mask,0.,1.));
    float glow = exp(-max(d,0.)*9.0)*env;               // spill just past the edge
    col += pal(0.55-ph)*glow*0.5*uBright;
  } else if(m<1.5){             // RIM — dispersed edge light
    float band = exp(-abs(d)/max(uReach*0.0016,1e-4));                 // tight iridescent edge
    float ang = atan(w.y,w.x)/TAU + 0.5;
    vec3 c = disperse(ang*(uBands*0.05+0.6) + ph, disp*1.6);
    col = mix(col, c*uBright, clamp(band,0.,1.2));
    col += disperse(ang*1.5+ph, disp)*exp(-abs(d)/max(uReach*0.006,1e-3))*0.30*uBright;   // soft outward bleed
  } else if(m<2.5){            // SWEEP — rotating iridescent fill
    float inside = smoothstep(ew, -ew, d);
    float ang = atan(w.y,w.x)/TAU + 0.5;
    float rr = length(w)/max(uScale,1e-3);
    vec3 c = disperse(ang + rr*0.4 + ph, disp);
    c *= mix(0.7,1.25, exp(-rr*rr*0.8));                 // luminous centre
    col = mix(col, c*uBright, inside);
  } else {                     // ECHO — concentric shells receding
    float sp = 1.0/(uBands*0.06+1.0);
    float dd = d - uT*uFlow*0.02;
    float shell = abs(fract(dd/sp)-0.5)*2.0;             // 0 at shell line
    float line = smoothstep(0.28, 0.0, shell);
    vec3 c = disperse(dd*3.0 + ph, disp);
    float fade = exp(-max(-d,0.)*1.4);                   // dim toward the far centre
    col = mix(col, c*uBright, line*fade);
    col += c*exp(-abs(shell-0.0)*3.0)*0.06*uBright*fade; // soft glow between
  }

  // crisp iridescent outline — the defined edge; strength & sharpness rise with Edge
  if(uEdge>0.02){ float lw=mix(0.006,0.0015,uEdge); float o=smoothstep(lw,0.0,abs(d));
    vec3 ec=disperse(atan(w.y,w.x)/TAU+0.5 + ph*1.2, disp*1.4)*uBright;
    col=mix(col, ec, o*uEdge); }
  // filmic-ish tone map — bright rolls into colour, never clips to a flat white
  col = vec3(1.0) - exp(-max(col,0.0)*1.35);
  // fine grain
  col += (hash21(gl_FragCoord.xy + uT*60.0) - 0.5) * (uGrain*0.055);
  col = clamp(col, 0.0, 1.0);
  gl_FragColor = vec4(col, 1.0);
}
  </script>

  <script>
  (function(){
    const art=document.getElementById('art');
    const gl=art.getContext('webgl',{preserveDrawingBuffer:true, antialias:true, premultipliedAlpha:false});
    const $=id=>document.getElementById(id);
    if(!gl){ const c=art.getContext('2d'); c.fillStyle='#111'; c.fillRect(0,0,art.width,art.height); c.fillStyle='#fff'; c.font='24px sans-serif'; c.fillText('WebGL unavailable',40,60); return; }

    const P={ aspect:'1080/1920', seed:3, shape:0, scale:0.60, rot:0, mode:0, reach:70, bands:30,
      palette:'iris', hue:0, disp:18, bright:1.0, warp:22, ground:'#080810',
      flow:50, pulse:35, spd:1.0, grain:10, edge:30, play:true };

    // IQ cosine palette coefficients per preset: {A,B,C,D}
    const PALS={
      iris:  {A:[0.5,0.5,0.5], B:[0.5,0.5,0.5], C:[1,1,1],    D:[0.0,0.33,0.67]},
      aurora:{A:[0.32,0.5,0.45],B:[0.35,0.35,0.3],C:[1,1,1],  D:[0.55,0.62,0.78]},
      ember: {A:[0.6,0.35,0.28],B:[0.45,0.35,0.3],C:[1,1,0.9],D:[0.0,0.12,0.2]},
      ice:   {A:[0.42,0.55,0.62],B:[0.35,0.35,0.3],C:[1,1,1], D:[0.62,0.68,0.75]},
      dusk:  {A:[0.5,0.4,0.55], B:[0.45,0.35,0.4],C:[1,1,1],  D:[0.35,0.5,0.68]},
      gold:  {A:[0.6,0.45,0.28],B:[0.4,0.35,0.25],C:[1,1,0.8],D:[0.08,0.14,0.22]},
    };
    const HEX=h=>{ const n=parseInt(h.slice(1),16); return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]; };

    // ---- compile ----
    function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s)); return s; }
    const vs=sh(gl.VERTEX_SHADER, 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }');
    const fs=sh(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent);
    const prog=gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) console.warn(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
    const ploc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(ploc); gl.vertexAttribPointer(ploc,2,gl.FLOAT,false,0,0);
    const U={}; ['uRes','uT','uShape','uMode','uScale','uRot','uReach','uBands','uHue','uDisp','uBright','uWarp','uFlow','uPulse','uGrain','uSeed','uEdge','uGround','uPA','uPB','uPC','uPD'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

    let W=1080,H=1920,clock=0;
    function draw(w,h,tm){
      const pl=PALS[P.palette]||PALS.iris;
      gl.viewport(0,0,w,h);
      gl.uniform2f(U.uRes,w,h); gl.uniform1f(U.uT,tm);
      gl.uniform1f(U.uShape,P.shape); gl.uniform1f(U.uMode,P.mode);
      gl.uniform1f(U.uScale,P.scale); gl.uniform1f(U.uRot,P.rot*Math.PI/180);
      gl.uniform1f(U.uReach,P.reach); gl.uniform1f(U.uBands,P.bands);
      gl.uniform1f(U.uHue,P.hue/360); gl.uniform1f(U.uDisp,P.disp); gl.uniform1f(U.uBright,P.bright);
      gl.uniform1f(U.uWarp,P.warp); gl.uniform1f(U.uFlow,P.flow); gl.uniform1f(U.uPulse,P.pulse);
      gl.uniform1f(U.uGrain,P.grain/100); gl.uniform1f(U.uSeed,P.seed*0.137); gl.uniform1f(U.uEdge,P.edge/100);
      gl.uniform3fv(U.uGround,HEX(P.ground));
      gl.uniform3fv(U.uPA,pl.A); gl.uniform3fv(U.uPB,pl.B); gl.uniform3fv(U.uPC,pl.C); gl.uniform3fv(U.uPD,pl.D);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    function drawNow(){ draw(W,H,clock); }

    function aspectWH(){ const p=(P.aspect||'1080/1920').split(/[/:x]/).map(Number), a=p[0]||9, b=p[1]||16, long=1600;
      return a>=b ? [long, Math.round(long*b/a)] : [Math.round(long*a/b), long]; }
    function fit(){ [W,H]=aspectWH(); art.width=W; art.height=H; drawNow(); }
    let t0=performance.now();
    function frame(now){ const dt=Math.min(0.05,(now-t0)/1000); t0=now; if(P.play){ clock += dt*(P.spd/10); drawNow(); } requestAnimationFrame(frame); }
    requestAnimationFrame(frame);

    // ---- wire ----
    function bind(id, rid, set, fmt){ const r=$(id), v=$(rid); if(!r) return;
      r.oninput=()=>{ set(+r.value); if(v) v.textContent=fmt?fmt(+r.value):r.value; if(!P.play) drawNow(); }; }
    bind('scale','scaleR',v=>P.scale=v/100, v=>(v/100).toFixed(2));
    bind('rot','rotR',v=>P.rot=v);
    bind('reach','reachR',v=>P.reach=v);
    bind('bands','bandsR',v=>P.bands=v, v=>(v/10).toFixed(1));
    bind('edge','edgeR',v=>P.edge=v);
    bind('hue','hueR',v=>P.hue=v);
    bind('disp','dispR',v=>P.disp=v);
    bind('bright','brightR',v=>P.bright=v/100, v=>(v/100).toFixed(2));
    bind('warp','warpR',v=>P.warp=v);
    bind('flow','flowR',v=>P.flow=v);
    bind('pulse','pulseR',v=>P.pulse=v);
    bind('spd','spdR',v=>P.spd=v, v=>(v/10).toFixed(1));
    bind('grain','grainR',v=>P.grain=v);
    $('shape').addEventListener('change',e=>{ P.shape=+e.target.value; drawNow(); });
    $('mode').addEventListener('change',e=>{ P.mode=+e.target.value; drawNow(); });
    $('palette').addEventListener('change',e=>{ P.palette=e.target.value; drawNow(); });
    $('ground').addEventListener('input',e=>{ P.ground=e.target.value; if(!P.play) drawNow(); });
    $('aspect').addEventListener('change',e=>{ P.aspect=e.target.value; fit(); });
    $('reroll').addEventListener('click',()=>{ P.seed=1+Math.floor(Math.random()*9999); P.hue=(Math.random()*360-180)|0; $('hue').value=P.hue; $('hueR').textContent=P.hue; drawNow(); });
    $('playBtn').addEventListener('click',()=>{ P.play=!P.play; $('playBtn').setAttribute('aria-pressed',String(P.play)); $('playBtn').textContent=P.play?'Pause':'Play'; if(!P.play) drawNow(); });

    function forceStory(){ const sel=$('aspect'); if(!sel) return; const opt=[...sel.options].find(o=>/9\s*[:\/x]\s*16|story|1080\s*[\/x]\s*1920/i.test(o.value+' '+o.textContent));
      if(opt && sel.value!==opt.value){ sel.value=opt.value; P.aspect=opt.value; fit();
        sel.dispatchEvent(new Event('change', {bubbles:true})); } }   // opal.js writes the readout
    setTimeout(forceStory,260); setTimeout(forceStory,700);

    // ---- output ----
    Opal.mountOutput(art,'pure-land',{ render:(long)=>{ const [aw,ah]=aspectWH(), s=long/Math.max(aw,ah);
      const tw=Math.round(aw*s), th=Math.round(ah*s), ow=art.width, oh=art.height;
      art.width=tw; art.height=th; draw(tw,th,clock);
      const c=document.createElement('canvas'); c.width=tw; c.height=th; c.getContext('2d').drawImage(art,0,0);
      art.width=ow; art.height=oh; draw(ow,oh,clock); return c; } });
    let rec=null, chunks=[], rt=0, tk=0;
    $('recBtn').addEventListener('click',()=>{ if(rec){ rec.stop(); return; }
      if(!P.play){ P.play=true; $('playBtn').setAttribute('aria-pressed','true'); $('playBtn').textContent='Pause'; }
      const mime=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
      rec=new MediaRecorder(art.captureStream(30), mime?{mimeType:mime,videoBitsPerSecond:24000000}:undefined); chunks=[];
      rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
      rec.onstop=()=>{ const ext=mime.indexOf('mp4')>=0?'mp4':'webm'; const blob=new Blob(chunks,{type:mime||'video/webm'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pure-land.'+ext; a.click();
        clearInterval(tk); $('recDot').classList.remove('on'); $('recBtn').textContent='Record'; rec=null; };
      rec.start(); $('recDot').classList.add('on'); $('recBtn').textContent='Stop';
      rt=Date.now(); tk=setInterval(()=>{ const el=Math.floor((Date.now()-rt)/1000);
        $('recDot').querySelector('b').textContent=(el/60|0)+':'+String(el%60).padStart(2,'0'); },250); });

    fit();
  })();
  </script>
</body>
</html>
