<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Scanner — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  /* Pattern shares the family chrome with the other Lab tools. */

  /* Tape shares Angel's chrome so the two read as one family: same tokens, same rail,
     same knobs. What differs is everything below the chrome. */
  :root{ --ink:#141414; --hair:rgba(0,0,0,.26); --mute:rgba(0,0,0,.66); --paper:#ffffff;
    --panel:rgba(252,252,253,.72); --edge:rgba(0,0,0,.14); --cell:rgba(255,255,255,.75);
    --track:rgba(0,0,0,.3); --liton:#6f9bff; --top:82px; --rail:290px; }
  body.dark{ --ink:#f2f4f8; --hair:rgba(255,255,255,.26); --mute:rgba(255,255,255,.72); --paper:#07080f;
    --panel:rgba(14,15,22,.72); --edge:rgba(255,255,255,.16); --cell:rgba(255,255,255,.07);
    --track:rgba(255,255,255,.3); --liton:#8ab0ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif,"Helvetica Neue",Inter,Arial,sans-serif; overflow:hidden; }
  /* A canvas is a replaced element and won't stretch to an inset box, so it lives inside a
     wrapper that does — the wrapper's rect is the single source of truth for canvas size. */
  #stagewrap{ position:fixed; top:var(--top); left:0; right:0; bottom:0; }
  #stage{ display:block; width:100%; height:100%; touch-action:none; }

  /* opal.css hard-codes a white topbar and leaves .opal-subhead__name to inherit its colour.
     In dark mode that inherits near-white ink onto a white bar and the tool name disappears —
     so the shared chrome gets carried into the theme too. The brand link sets its colour
     inline via mountTopbar, hence !important. */
  body.dark .opal-topbar, body.dark .opal-subhead{ background:#0b0c14; border-bottom-color:rgba(255,255,255,.1); }
  body.dark .opal-brand{ color:var(--ink) !important; }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-brand .opal-product,
  body.dark .opal-subhead__desc,
  body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }
  body.dark .opal-brand .opal-divider{ background:rgba(255,255,255,.2); }

  /* Full-screen: canvas only. Everything chrome-like steps out of the way. */
  body.fs .rail, body.fs #bar, body.fs .opal-topbar, body.fs .opal-subhead{ display:none !important; }
  body.fs #stagewrap{ top:0; left:0; }
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; opacity:0; transition:opacity .25s ease; }
  body.fs #exitFs{ display:flex; }
  body.fs.hint #exitFs{ opacity:1; }

  @media (max-width:560px){ :root{ --top:74px; } }

  #status{ position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    font-size:10px; letter-spacing:.08em; color:var(--mute); display:none; }

  /* one hairline control strip — everything else is off until asked for */
  #bar{ position:fixed; top:calc(var(--top) + 12px); right:14px; z-index:10; display:flex; gap:8px; }
  .icon{ appearance:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--hair);
    background:var(--panel); color:var(--ink); cursor:pointer; backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:.04em; padding:0; }
  .icon svg{ display:block; }
  .icon[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  /* Sits BELOW the icon row, not beside it — the row grows as controls are added and a
     fixed right offset kept colliding with it. Stays put in full screen so a recording
     always shows its own timer. */
  #recDot{ position:fixed; top:calc(var(--top) + 58px); right:14px; z-index:11;
    display:none; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    font-size:10px; letter-spacing:.12em; color:#ff4d5e;
    background:var(--panel); border:1px solid var(--hair);
    -webkit-backdrop-filter:blur(20px) saturate(180%); backdrop-filter:blur(20px) saturate(180%); }
  #recDot.on{ display:flex; }
  /* Count-in. Big enough that you are in no doubt what is about to happen. */

  #recDot i{ width:7px;height:7px;border-radius:50%;background:#ff4d5e; animation:blink 1s infinite; flex:none; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  body.fs #recDot{ top:14px; }
  @keyframes blink{ 50%{opacity:.2;} }

  /* Two rails: the lane you're editing on the left, everything global on the right, canvas
     between them. Frosted — the fill stays translucent or backdrop-filter has nothing to
     work with. */

  .rail{ position:fixed; top:var(--top); bottom:0; width:var(--rail); z-index:6;
    padding:4px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:var(--panel);
    -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
    display:flex; flex-direction:column; transition:transform .28s ease; }
  .rail-l{ left:0; border-right:1px solid var(--edge); }
  .rail-r{ right:0; border-left:1px solid var(--edge); }
  .row{ display:flex; flex-direction:column; align-items:stretch; gap:13px;
    padding:14px 0; border-bottom:1px solid var(--edge); }
  .row:last-of-type{ border-bottom:0; }
  /* Section heads fold their section away. Nine sections in two rails is a lot to scroll
     past when you only want two of them. */
  .rowhead{ text-transform:uppercase; letter-spacing:.16em; font-size:9px; color:var(--ink);
    font-weight:600; opacity:.9; padding-bottom:2px;
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    width:100%; background:none; border:0; font-family:inherit; text-align:left; }
  .rowhead:hover{ opacity:1; }
  .rowhint{ margin:0 0 2px; font-size:9.5px; line-height:1.5; color:var(--mute); letter-spacing:.01em; }
  .rowhead::before{ content:''; width:0; height:0; flex:none;
    border-left:4px solid currentColor; border-top:3.5px solid transparent; border-bottom:3.5px solid transparent;
    transform:rotate(90deg); transition:transform .18s ease; opacity:.65; }
  .row.folded .rowhead::before{ transform:rotate(0deg); }
  .row.folded > *:not(.rowhead){ display:none; }
  .row.folded{ padding-bottom:10px; }
  .grp{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .rail input[type=range]{ width:100%; }
  .rail select{ width:100%; }
  .rail .seg{ width:100%; }
  .rail .seg button{ flex:1; text-align:center; padding:7px 4px; }
  .duo{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .quad{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .quad .grp > label{ font-size:8px; letter-spacing:.08em; }
  /* The canvas is the instrument. Rails stay out of the way until summoned, at every width —
     nothing between you and the piece unless you ask for it. */
  .rail{ width:290px; box-shadow:0 0 60px -20px rgba(0,0,0,.45); }
  .rail-l{ transform:translateX(-100%); }
  .rail-r{ transform:translateX(100%); }
  .rail.open{ transform:none; }

  /* Chrome fades out while you listen and comes back on movement. */
  #bar{ transition:opacity .5s ease; }
  body.idle #bar{ opacity:0; pointer-events:none; }
  body.panels #bar{ opacity:1; pointer-events:auto; }

  /* Mood — the one control that stays reachable. */

  .grp > label{ text-transform:uppercase; letter-spacing:.13em; font-size:9px; line-height:1.25;
    color:var(--mute); white-space:nowrap; }
  .rail .grp > label{ white-space:normal; }
  .grp > label b{ font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .seg{ display:flex; border:1px solid var(--hair); border-radius:2px; overflow:hidden; }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--ink);
    font:inherit; font-size:11px; padding:7px 10px; cursor:pointer; border-right:1px solid var(--hair); white-space:nowrap; }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ color:var(--paper); background:var(--ink); }
  .seg.lanes button[aria-pressed="true"]{ color:var(--ink); background:transparent; box-shadow:inset 0 -2px 0 currentColor; }
  .seg.lanes button{ font-weight:600; display:flex; align-items:center; justify-content:center; gap:6px; }
  /* Tooltips. A native title= arrives late and lands wherever the OS puts it; these follow
     the control they describe and get out of the way on click. */
  .tip{ position:fixed; z-index:60; display:none; max-width:246px; padding:8px 10px; border-radius:7px;
    background:var(--panel); border:1px solid var(--hair); color:var(--ink);
    -webkit-backdrop-filter:blur(24px) saturate(180%); backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.5);
    font-size:10.5px; line-height:1.55; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }
  /* The LFO's lane pills are on/off switches, not a "which one am I editing" tab. An
     underline is what the lane tabs use for that other meaning, so these fill instead. */

  select{ appearance:none; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 24px 7px 10px; border-radius:2px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  /* Knobs. The real <input type=range> stays in the DOM driving all the existing wiring —
     it's just visually replaced, so listeners and readouts are untouched. */
  .knob{ position:relative; width:46px; height:46px; flex:none; touch-action:none; cursor:ns-resize; }
  .knob input[type=range]{ position:absolute; inset:0; width:100%; height:100%;
    opacity:0; margin:0; pointer-events:none; }
  .knob svg{ display:block; width:46px; height:46px; overflow:visible; }
  .knob .k-tr{ fill:none; stroke:var(--track); stroke-width:3; stroke-linecap:round; }
  .knob .k-vl{ fill:none; stroke:var(--ink); stroke-width:3; stroke-linecap:round;
    transition:stroke-dasharray .04s linear; }
  .knob .k-hub{ fill:var(--cell); stroke:var(--hair); stroke-width:1; }
  .knob .k-pt{ stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
  .knob:focus-visible{ outline:none; }
  .knob:focus-visible .k-hub{ stroke:var(--ink); }
  .knob.drag .k-vl{ stroke-width:3.6; }
  .knobrow{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .kcell{ display:flex; flex-direction:column; align-items:center; gap:5px; width:46px; }
  .kcell .klab{ text-transform:uppercase; letter-spacing:.1em; font-size:9px; line-height:1.15;
    color:var(--mute); text-align:center; white-space:nowrap; }
  .kcell .kval{ font-size:9px; font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; line-height:1; }
  .btn{ appearance:none; background:var(--cell); border:1px solid var(--hair);
    color:var(--ink); font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 12px; cursor:pointer; border-radius:2px; }
  .btn[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }
  input[type=text]{ width:100%; background:var(--cell); border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 9px; border-radius:2px; }
  input[type=text]::placeholder{ color:var(--mute); }

  /* step editor — a row of cells for the active lane; click one to set its note */

  #veil{ position:fixed; inset:0; z-index:30; background:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer; text-align:center; padding:24px; }
  #veil h1{ font-weight:300; font-size:15px; letter-spacing:.4em; text-transform:uppercase; margin:0; }
  #veil p{ max-width:38ch; font-size:12px; line-height:1.8; color:var(--mute); margin:0; }
  #veil .orb{ width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(90,140,255,.85), rgba(150,60,255,.5) 45%, transparent 72%);
    filter:blur(3px); animation:pulse 5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(.9); opacity:.7; } 50%{ transform:scale(1.08); opacity:1; } }
  @media (max-width:560px){ input[type=range]{ width:82px; } }

  /* Scanner — its own bits */
  #stage{ background:transparent; touch-action:none; cursor:grab; } #stage:active{ cursor:grabbing; }
  #hint{ position:fixed; left:16px; bottom:14px; z-index:5; pointer-events:none; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.05em; color:var(--mute); }
  #hint b{ color:var(--ink); font-weight:600; } body.fs #hint{ display:none; }
  #drop{ position:fixed; inset:var(--top) 0 0 0; z-index:4; display:flex; align-items:center; justify-content:center; pointer-events:none; text-align:center; }
  #drop.hide{ display:none; } #drop p{ margin:0; font-size:12px; line-height:1.8; letter-spacing:.06em; color:var(--mute); }
  body.drag-over #stagewrap::after{ content:''; position:fixed; inset:calc(var(--top) + 14px) 14px 14px 14px; z-index:8; border:1px dashed var(--edge); border-radius:12px; pointer-events:none; }
  select.sel{ width:100%; background:var(--cell); border:1px solid var(--hair); color:var(--ink); font:inherit; font-size:11px; padding:7px 9px; border-radius:2px; }
  .cin{ display:flex; align-items:center; gap:8px; } .cin input[type=color]{ width:30px; height:26px; border:1px solid var(--hair); background:none; border-radius:4px; padding:0; cursor:pointer; }
  .cin label{ font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--mute); } .swatches{ display:flex; gap:8px; } .swatches .cin{ flex:1; }
  .rowhint{ opacity:.74; }
</style>

</head>
<body>

<div id="stagewrap"><canvas id="stage"></canvas></div>
<div id="drop"><p>Add an image, then drag it while the bar scans</p></div>
<div id="hint"></div>
<div id="recDot"><i></i><b>REC</b></div>
<div id="bar">
  <button class="icon" id="themeBtn" title="Light / dark">&#9681;</button>
  <button class="icon" id="playBtn" title="Play / pause &#183; space" aria-pressed="true"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><rect x="2.6" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/><rect x="6.9" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/></svg></button>
  <button class="icon" id="fsBtn" title="Full screen">&#9974;</button>
  <button class="icon" id="toggle" aria-pressed="false" title="Controls">&#183;&#183;&#183;</button>
</div>
<button class="icon" id="exitFs" title="Exit (Esc)">&#10005;</button>
<input id="file" type="file" accept="image/*" hidden />
<div id="rail" class="rail rail-l"></div>
<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Scanner', desc:'A photocopier bed that scans your motion', version:'v1', about:'A scan bar sweeps across the canvas capturing one line at a time. Drag your image around while it scans and your motion smears into the output — like moving a photo on a flatbed. Rendered through a threshold + ordered-dither xerox look. Export a still or record the pass.' });</script>
<script>
'use strict';
(function(){
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hexRgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const stage=document.getElementById('stage'), sctx=stage.getContext('2d');
const comp=document.createElement('canvas'), cctx=comp.getContext('2d');

// ordered 8×8 Bayer, 0..63
const BAYER=[0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
  3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];

const P={
  aspect:'4:5', longEdge:1200,
  scanSpeed:4, scanDir:'down', playMode:'once',
  scale:1.0, rotation:0,
  threshold:128, dither:'bayer', contrast:1.35, grain:0.18, invert:0,
  ink:'#141410', bg:'#f4f2e8', showBar:1, transparent:0, play:true,
};
let img=null, subX=0, subY=0;
let raw=null, bed=null, bedCtx=null, scanY=0, t0=performance.now(), drag=null, done=false;
let compRect={ox:0,oy:0,sc:1};

function aspectWH(){ const [a,b]=P.aspect.split(':').map(Number), L=P.longEdge; return a>=b?[L,Math.round(L*b/a)]:[Math.round(L*a/b),L]; }
function CW(){ return aspectWH()[0]; } function CH(){ return aspectWH()[1]; }
function resize(){ const d=Math.min(devicePixelRatio||1,2); stage.width=(innerWidth*d)|0; stage.height=(innerHeight*d)|0; }
addEventListener('resize',resize);

function ensureBuffers(){ const W=CW(),H=CH(); if(comp.width!==W||comp.height!==H){ comp.width=W; comp.height=H; raw=null; }
  if(!raw){ raw=new Uint8ClampedArray(W*H); raw.fill(255); bed=document.createElement('canvas'); bed.width=W; bed.height=H; bedCtx=bed.getContext('2d',{willReadFrequently:true}); scanY=0; if(subX===0){ subX=W/2; subY=H/2; } } }
function resetScan(){ ensureBuffers(); raw.fill(255); scanY = P.scanDir==='up' ? comp.height : 0; done=false; }

// default subject so it works before an upload
function makeDefaultSubject(){ const c=document.createElement('canvas'); c.width=560; c.height=560; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,560,560); x.fillStyle='#111'; x.textAlign='center'; x.textBaseline='middle';
  x.font='bold 150px ui-sans-serif,Arial'; x.fillText('SCAN',280,250); x.font='26px ui-monospace,monospace'; x.fillText('drag me while it scans',280,360);
  const im=new Image(); im.onload=()=>{ img=im; }; im.src=c.toDataURL(); }

function loadURL(src){ const im=new Image(); im.onload=()=>{ img=im; const W=CW(),H=CH(); subX=W/2; subY=H/2; document.getElementById('drop').classList.add('hide'); resetScan(); }; im.src=src; }
function loadFile(f){ if(!f||!/^image\//.test(f.type)) return; const r=new FileReader(); r.onload=e=>loadURL(e.target.result); r.readAsDataURL(f); }
window.scanLoad=loadURL;

function renderBed(){ const W=comp.width,H=comp.height; bedCtx.setTransform(1,0,0,1,0,0); bedCtx.fillStyle='#ffffff'; bedCtx.fillRect(0,0,W,H);
  if(img){ bedCtx.save(); bedCtx.translate(subX,subY); bedCtx.rotate(P.rotation*Math.PI/180); bedCtx.scale(P.scale,P.scale); bedCtx.drawImage(img,-img.width/2,-img.height/2); bedCtx.restore(); } }
function captureStrip(y0,y1){ const W=comp.width,H=comp.height; y0=clamp(y0|0,0,H); y1=clamp(y1|0,0,H); if(y1<=y0) return;
  const id=bedCtx.getImageData(0,y0,W,y1-y0).data, con=P.contrast, gr=P.grain*120;
  for(let y=y0;y<y1;y++){ const row=(y-y0)*W, rr=y*W;
    for(let x=0;x<W;x++){ const o=(row+x)*4; const lum=0.2126*id[o]+0.7152*id[o+1]+0.0722*id[o+2];
      let v=(lum-128)*con+128 + (Math.random()*2-1)*gr; raw[rr+x]=clamp(v,0,255); } } }

function step(){ ensureBuffers(); if(!img) return; renderBed();
  const H=comp.height, sp=Math.max(0.12, P.scanSpeed*0.35), loop=P.playMode==='repeat';
  if(P.scanDir==='down'){ let prev=scanY, ny=scanY+sp;
    if(ny>=H){ captureStrip(prev,H); if(loop){ ny-=H; captureStrip(0,ny); scanY=ny; } else { scanY=H; done=true; } }
    else { captureStrip(prev,ny); scanY=ny; } }
  else { let prev=scanY, ny=scanY-sp;
    if(ny<=0){ captureStrip(0,prev); if(loop){ ny+=H; captureStrip(ny,H); scanY=ny; } else { scanY=0; done=true; } }
    else { captureStrip(ny,prev); scanY=ny; } } }

let disp=null;
function display(){ const W=comp.width,H=comp.height; if(!disp||disp.width!==W){ disp=cctx.createImageData(W,H); }
  const d=disp.data, ink=hexRgb(P.ink), pap=hexRgb(P.bg), th=P.threshold, inv=P.invert, useB=P.dither==='bayer';
  for(let y=0;y<H;y++){ const yb=(y&7)*8, rr=y*W;
    for(let x=0;x<W;x++){ const v=raw[rr+x]; let t=th; if(useB) t=th+(BAYER[yb+(x&7)]-31.5)*3.6;
      let black = v<t; if(inv) black=!black; const o=(rr+x)*4, c=black?ink:pap; d[o]=c[0]; d[o+1]=c[1]; d[o+2]=c[2]; d[o+3]=255; } }
  cctx.putImageData(disp,0,0);
  if(P.showBar && img && !done){ cctx.fillStyle='rgba(255,64,64,0.55)'; cctx.fillRect(0,scanY-1,W,2); } }

function blit(){ const sw=stage.width,sh=stage.height; sctx.setTransform(1,0,0,1,0,0);
  const paper=getComputedStyle(document.body).getPropertyValue('--paper').trim()||'#111'; sctx.fillStyle=paper; sctx.fillRect(0,0,sw,sh); if(!comp.width) return;
  const sc=Math.min(sw/comp.width,sh/comp.height)*0.94, dw=comp.width*sc, dh=comp.height*sc, ox=(sw-dw)/2, oy=(sh-dh)/2;
  sctx.drawImage(comp,ox,oy,dw,dh); sctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--edge').trim(); sctx.lineWidth=1; sctx.strokeRect(ox+.5,oy+.5,dw-1,dh-1); compRect={ox,oy,sc}; }

let fps=0,fa=0,fn=0;
function tick(){ const now=performance.now(),dt=Math.min(0.05,(now-t0)/1000); t0=now;
  if(P.play && !done) step(); ensureBuffers(); display(); blit();
  fa+=dt; fn++; if(fa>=0.5){ fps=fn/fa; fa=0; fn=0; const h=document.getElementById('hint'); if(h) h.innerHTML= img?`scan y=<b>${scanY|0}</b> &#183; <b>${fps.toFixed(0)}</b> fps &#183; ${comp.width}&#215;${comp.height}`:''; }
  requestAnimationFrame(tick); }

// ---------------- pointer: drag the subject ----------------
function toComp(e){ const r=stage.getBoundingClientRect(), x=(e.clientX-r.left)*stage.width/r.width, y=(e.clientY-r.top)*stage.height/r.height; return [(x-compRect.ox)/compRect.sc,(y-compRect.oy)/compRect.sc]; }
stage.addEventListener('pointerdown',e=>{ const [x,y]=toComp(e); drag={x,y}; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove',e=>{ if(!drag)return; const [x,y]=toComp(e); subX+=x-drag.x; subY+=y-drag.y; drag={x,y}; });
addEventListener('pointerup',()=>{ drag=null; }); addEventListener('pointercancel',()=>{ drag=null; });
addEventListener('dragover',e=>{ e.preventDefault(); document.body.classList.add('drag-over'); });
addEventListener('dragleave',e=>{ if(e.relatedTarget===null) document.body.classList.remove('drag-over'); });
addEventListener('drop',e=>{ e.preventDefault(); document.body.classList.remove('drag-over'); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });

// ---------------- panel ----------------
function el(t,c,h){ const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
let refs=[];
function buildPanel(){
  const host=document.getElementById('rail'); host.innerHTML=''; refs=[];
  const grp=(title,hint)=>{ const g=el('div','row'); const h=el('button','rowhead',title); h.type='button'; h.setAttribute('aria-expanded','true'); g.appendChild(h); if(hint)g.appendChild(el('p','rowhint',hint)); host.appendChild(g); return g; };
  const duo=g=>{ const d=el('div','duo'); g.appendChild(d); return d; };
  const slider=(g,key,label,min,max,step,fmt,cb)=>{ const gr=el('div','grp'); const v=el('b',null,(fmt?fmt(P[key]):P[key])); const lab=el('label',null,label+' '); lab.appendChild(v);
    const r=el('input'); r.type='range'; r.min=min; r.max=max; r.step=step; r.value=P[key];
    r.oninput=()=>{ P[key]=(String(step).indexOf('.')>=0)?parseFloat(r.value):parseInt(r.value); v.textContent=fmt?fmt(P[key]):P[key]; if(cb)cb(); };
    gr.appendChild(lab); gr.appendChild(r); g.appendChild(gr); refs.push({key,r,v,fmt}); return gr; };
  const seg=(g,key,label,opts,cb)=>{ const gr=el('div','grp'); if(label)gr.appendChild(el('label',null,label)); const s=el('div','seg');
    opts.forEach(o=>{ const b=el('button',null,o.t); b.setAttribute('aria-pressed',String(P[key]==o.v)); b.onclick=()=>{ P[key]=o.v; [...s.children].forEach(c=>c.setAttribute('aria-pressed',String(c===b))); if(cb)cb(); }; s.appendChild(b); }); gr.appendChild(s); g.appendChild(gr); refs.push({key,seg:s,opts,kind:'seg'}); return gr; };
  const select=(g,key,label,opts,cb)=>{ const gr=el('div','grp'); if(label)gr.appendChild(el('label',null,label)); const s=el('select','sel'); opts.forEach(o=>{ const op=el('option',null,o.t); op.value=o.v; s.appendChild(op); }); s.value=P[key]; s.onchange=()=>{ P[key]=s.value; if(cb)cb(); }; gr.appendChild(s); g.appendChild(gr); refs.push({key,sel:s,kind:'sel'}); return gr; };
  const color=(key,label)=>{ const cin=el('div','cin'); const inp=el('input'); inp.type='color'; inp.value=P[key]; inp.oninput=()=>{ P[key]=inp.value; }; cin.appendChild(inp); cin.appendChild(el('label',null,label)); refs.push({key,inp,kind:'color'}); return cin; };
  const button=(g,label,fn,id)=>{ const b=el('button','btn',label); b.style.width='100%'; if(id)b.id=id; b.onclick=fn; g.appendChild(b); return b; };

  const gI=grp('Image','Add a picture, then drag it around the canvas while the bar scans — your motion smears into the scan.');
  button(gI,'Add image',()=>document.getElementById('file').click());
  const g1=duo(gI); slider(g1,'scale','Scale',0.1,4,0.02,v=>(+v).toFixed(2)); slider(g1,'rotation','Rotate',-180,180,1,v=>(v|0)+'°');

  const gS=grp('Scan','The bed sweeps across the canvas capturing each line as it passes.');
  slider(gS,'scanSpeed','Speed',1,30,1,v=>v|0);
  seg(gS,'scanDir','Direction',[{t:'Down',v:'down'},{t:'Up',v:'up'}],resetScan);
  seg(gS,'playMode','When it finishes',[{t:'Stop',v:'once'},{t:'Repeat',v:'repeat'}],()=>{ if(P.playMode==='repeat') done=false; });
  seg(gS,'showBar','Show bar',[{t:'On',v:1},{t:'Off',v:0}]);
  button(gS,'Scan again',resetScan);

  const gL=grp('Xerox','Threshold + ordered dither — the photocopier look.');
  slider(gL,'threshold','Threshold',20,235,1,v=>v|0);
  const l1=duo(gL); slider(l1,'contrast','Contrast',0.5,3,0.02,v=>(+v).toFixed(2)); slider(l1,'grain','Grain',0,0.6,0.01,v=>(+v).toFixed(2));
  seg(gL,'dither','Dither',[{t:'Bayer',v:'bayer'},{t:'Hard',v:'none'}]);
  seg(gL,'invert','Invert',[{t:'Off',v:0},{t:'On',v:1}]);
  const sr=el('div','swatches'); sr.appendChild(color('ink','Toner')); sr.appendChild(color('bg','Paper')); gL.appendChild(sr);

  const gC=grp('Canvas','Output size.');
  select(gC,'aspect','Aspect',[{t:'Portrait 4:5',v:'4:5'},{t:'Story 9:16',v:'9:16'},{t:'Square 1:1',v:'1:1'},{t:'Landscape 16:9',v:'16:9'}],()=>{ raw=null; resetScan(); });
  slider(gC,'longEdge','Long edge',720,1600,20,v=>v+' px',()=>{ raw=null; resetScan(); });

  const gE=grp('Export','A still, or record the scanning.');
  const eb=el('div',null,''); eb.style.cssText='display:flex;gap:6px'; const bp=el('button','btn','PNG'); bp.style.flex='1'; bp.onclick=savePNG; const br=el('button','btn','Record'); br.style.flex='1'; br.id='recBtn'; br.onclick=toggleRec; eb.appendChild(bp); eb.appendChild(br); gE.appendChild(eb);

  document.querySelectorAll('.rail input[type=range]').forEach(makeKnob);
  setupFolds(); setupTooltips();
}

// ---------------- shared shell scaffolding ----------------
function makeKnob(inp){ if(inp.dataset.knob) return; inp.dataset.knob='1'; const w=document.createElement('div'); w.className='knob'; w.tabIndex=0; w.setAttribute('role','slider');
  inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
  w.insertAdjacentHTML('beforeend','<svg viewBox="0 0 44 44" width="42" height="42" aria-hidden="true"><path class="k-tr" d="M9 35 A18 18 0 1 1 35 35"/><path class="k-vl" d="M9 35 A18 18 0 1 1 35 35"/><circle class="k-hub" cx="22" cy="22" r="9"/><line class="k-pt" x1="22" y1="22" x2="22" y2="14"/></svg>');
  const k={el:w,inp}; inp.repaintKnob=()=>paintKnob(k); const set=v=>{ inp.value=String(v); inp.dispatchEvent(new Event('input',{bubbles:true})); paintKnob(k); };
  let dy=0,dv=0; w.addEventListener('pointerdown',e=>{ e.preventDefault(); w.setPointerCapture(e.pointerId); w.classList.add('drag'); dy=e.clientY; dv=+inp.value; });
  w.addEventListener('pointermove',e=>{ if(!w.classList.contains('drag'))return; const span=(+inp.max)-(+inp.min),st=+inp.step||1; set(clamp(Math.round((dv+(dy-e.clientY)/150*span)/st)*st,+inp.min,+inp.max)); });
  const up=()=>w.classList.remove('drag'); w.addEventListener('pointerup',up); w.addEventListener('pointercancel',up);
  w.addEventListener('keydown',e=>{ const st=+inp.step||1; if(e.key==='ArrowUp'||e.key==='ArrowRight'){ e.preventDefault(); set(clamp(+inp.value+st,+inp.min,+inp.max)); } if(e.key==='ArrowDown'||e.key==='ArrowLeft'){ e.preventDefault(); set(clamp(+inp.value-st,+inp.min,+inp.max)); } }); paintKnob(k); }
function paintKnob(k){ const inp=k.inp,mn=+inp.min,mx=+inp.max,v=+inp.value,f=(v-mn)/(mx-mn||1); const path=k.el.querySelector('.k-vl'),len=path.getTotalLength();
  path.style.strokeDasharray=len; path.style.strokeDashoffset=len*(1-f); const a=(-135+270*f)*Math.PI/180,pt=k.el.querySelector('.k-pt'); pt.setAttribute('x2',(22+Math.sin(a)*8).toFixed(2)); pt.setAttribute('y2',(22-Math.cos(a)*8).toFixed(2)); }
function setupFolds(){ const KEY='scan-folded'; const saved=new Set((()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}})());
  document.querySelectorAll('.rail .rowhead').forEach(h=>{ const row=h.closest('.row'); const name=h.textContent.trim();
    if(saved.has(name)){ row.classList.add('folded'); h.setAttribute('aria-expanded','false'); }
    h.addEventListener('click',()=>{ const f=row.classList.toggle('folded'); h.setAttribute('aria-expanded',String(!f));
      const cur=new Set((()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}})()); f?cur.add(name):cur.delete(name); try{localStorage.setItem(KEY,JSON.stringify([...cur]))}catch(e){} }); }); }
let tipEl=null,tipT=null,tipFor=null;
function setupTooltips(){ addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor)return; clearTimeout(tipT); if(!h){hideTip();return;} tipFor=h; tipT=setTimeout(()=>showTip(h),240); }); addEventListener('pointerdown',hideTip); addEventListener('scroll',hideTip,true); }
function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
function showTip(host){ const text=host.getAttribute('data-tip'); if(!text)return; if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
  tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0'; const r=host.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
  let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8,r.bottom+8); tipEl.style.left=Math.max(8,Math.min(r.left,innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
function setPlayIcon(){ const b=document.getElementById('playBtn'); if(!b)return; b.setAttribute('aria-pressed',String(P.play));
  b.innerHTML=P.play?'<svg viewBox="0 0 12 12" width="11" height="11"><rect x="2.6" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/><rect x="6.9" y="1.8" width="2.5" height="8.4" rx="1.1" fill="currentColor"/></svg>':'<svg viewBox="0 0 12 12" width="11" height="11"><path d="M3 1.8 L10 6 L3 10.2 Z" fill="currentColor"/></svg>'; }
function setFs(on){ document.body.classList.toggle('fs',on); if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{}); else if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{}); }
function wireBar(){ document.getElementById('playBtn').onclick=()=>{ P.play=!P.play; setPlayIcon(); };
  document.getElementById('themeBtn').onclick=()=>{ document.body.classList.toggle('dark'); };
  document.getElementById('fsBtn').onclick=()=>setFs(!document.body.classList.contains('fs'));
  document.getElementById('exitFs').onclick=()=>setFs(false);
  document.getElementById('toggle').onclick=()=>{ const r=document.getElementById('rail'); const open=!r.classList.contains('open'); r.classList.toggle('open',open); document.body.classList.toggle('panels',open); document.getElementById('toggle').setAttribute('aria-pressed',String(open)); };
  document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&document.body.classList.contains('fs')) setFs(false); }); setPlayIcon(); }

// ---------------- export ----------------
function savePNG(){ const a=document.createElement('a'); comp.toBlob(b=>{ a.href=URL.createObjectURL(b); a.download='scanner_'+comp.width+'x'+comp.height+'.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); },'image/png'); }
let rec=null, recChunks=[], countIv=null;
function pickMime(){ return ['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)); }
function setRecBtn(on){ const b=document.getElementById('recBtn'); if(!b)return; b.textContent=on?'Stop':'Record'; b.style.borderColor=on?'#ff4d5e':''; b.style.color=on?'#ff4d5e':''; }
function toggleRec(){ if(rec){ rec.stop(); return; } if(countIv){ clearInterval(countIv); countIv=null; document.getElementById('recDot').classList.remove('on'); setRecBtn(false); return; }
  const dot=document.getElementById('recDot'), b=dot.querySelector('b'); dot.classList.add('on'); setRecBtn(true); let c=3; b.textContent=c;
  countIv=setInterval(()=>{ c--; if(c>0){ b.textContent=c; } else { clearInterval(countIv); countIv=null; beginRec(); } },1000); }
function beginRec(){ const mime=pickMime(); if(!mime)return; const FPS=60, stream=comp.captureStream(FPS);
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.min(60000000,Math.max(24000000,Math.round(comp.width*comp.height*FPS*0.25)))}); recChunks=[];
  rec.ondataavailable=e=>{ if(e.data.size) recChunks.push(e.data); };
  rec.onstop=()=>{ const blob=new Blob(recChunks,{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='scanner_'+comp.width+'x'+comp.height+'.'+(mime.indexOf('mp4')>=0?'mp4':'webm'); a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); rec=null; document.getElementById('recDot').classList.remove('on'); setRecBtn(false); };
  rec.start(); document.getElementById('recDot').querySelector('b').textContent='REC'; }

// ---------------- boot ----------------
document.getElementById('file').addEventListener('change',e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
document.body.classList.add('dark'); resize(); ensureBuffers(); makeDefaultSubject(); buildPanel(); wireBar(); requestAnimationFrame(tick);
addEventListener('keydown',e=>{ if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return; if(e.key===' '){ e.preventDefault(); P.play=!P.play; setPlayIcon(); } if(e.key==='s'||e.key==='S'){ savePNG(); } });
})();

</script>
</body>
