<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Fence — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; } }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overscroll-behavior:none; }
  body.dark .opal-topbar, body.dark .opal-subhead{ background:#0b0c14; border-bottom-color:rgba(255,255,255,.1); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }

  #wrap{ position:fixed; top:var(--top); left:0; right:var(--rail); bottom:0; display:flex; align-items:center; justify-content:center; padding:24px; }
  #art{ background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.5); max-width:100%; max-height:100%; display:block; touch-action:none; cursor:crosshair; }
  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% - var(--rail))/2); transform:translateX(-50%); font-size:13px; color:var(--dim);
    background:rgba(11,12,20,.7); padding:6px 14px; border-radius:999px; pointer-events:none; transition:opacity .3s; z-index:7; }

  /* right-side control rail — matches the other tools' shells */
  #dock{ position:fixed; top:var(--top); right:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(15,16,24,.92); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-left:1px solid var(--line); display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:flex-start; }
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center;
    padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.11); }
  .btn[aria-pressed="true"]{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); font-weight:600; }
  .chip{ font-size:11px; letter-spacing:.04em; padding:7px 10px; }
  .sep{ width:1px; align-self:stretch; background:var(--line); margin:2px 4px; }
  #sliders{ display:flex; flex-direction:column; gap:14px; width:100%; }
  #sliders.locked{ opacity:.35; pointer-events:none; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-moz-range-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--ink); }
  /* hover tooltips on the controls — matches the other tools */
  .tip{ position:fixed; z-index:60; display:none; max-width:230px; padding:9px 11px; border-radius:8px;
    background:rgba(18,20,28,.97); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none;
    pointer-events:none; opacity:0; transition:opacity .14s ease; }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">
  <div id="wrap"><canvas id="art"></canvas></div>
  <input id="photoFile" type="file" accept="image/*" hidden />
  <div id="hint">Draw your lines — or add a photo for Fence to trace</div>

  <div id="dock">
    <div id="sliders">
      <div class="knob" data-tip="How many inky chains trail along each line you drew. More chains build up denser, richer line work."><label>Chains <b id="densityR">39</b></label><input id="density" type="range" min="1" max="40" value="39" /></div>
      <div class="knob" data-tip="The length of each chain's tail — short flicks on the left, long sweeping ribbons on the right."><label>Trail length <b id="lengthR">89</b></label><input id="length" type="range" min="5" max="100" value="89" /></div>
      <div class="knob" data-tip="How far the chains stray from your line. Low hugs your stroke; high sends them looping and wandering off it."><label>Wander <b id="flowR">100</b></label><input id="flow" type="range" min="0" max="100" value="100" /></div>
      <div class="knob" data-tip="Adds a circular swirl to each chain's motion, coiling the lines as they travel."><label>Swirl <b id="spiralR">100</b></label><input id="spiral" type="range" min="0" max="100" value="100" /></div>
      <div class="knob" data-tip="Thickness of the ink — thin and delicate on the left, thick and heavy on the right."><label>Brush size <b id="weightR">20</b></label><input id="weight" type="range" min="5" max="100" value="20" /></div>
      <div class="knob" data-tip="How much ink each pass lays down. Higher builds up darker and faster."><label>Ink <b id="inkR">86</b></label><input id="ink" type="range" min="5" max="100" value="86" /></div>
      <div class="knob" data-tip="How long one full pass along your line takes, in seconds. Higher is slower and more meditative."><label>Time <b id="timeR">20s</b></label><input id="time" type="range" min="2" max="180" value="20" /></div>
      <div class="knob" data-tip="Blends the ink from plain black toward shifting colour."><label>Colour <b id="colorR">0</b></label><input id="color" type="range" min="0" max="100" value="0" /></div>
    </div>
    <div class="row" style="flex-direction:column; align-items:stretch;" data-tip="Type words and the chains draw them out as letterforms — the text pours itself down the canvas.">
      <input id="textIn" type="text" placeholder="Type words to pour…" autocomplete="off"
        style="width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--ink); font:inherit; font-size:12px; letter-spacing:.02em; padding:9px 10px; border-radius:2px; box-sizing:border-box;" />
      <button class="btn" id="textBtn">Pour text</button>
    </div>
    <div class="row">
      <button class="btn primary" id="doneBtn">Done — bend it</button>
      <button class="btn chip" id="editBtn" style="display:none">Edit lines</button>
      <div class="sep"></div>
      <button class="btn chip" id="photoBtn">Photo</button>
      <button class="btn chip" id="undoBtn">Undo</button>
      <button class="btn chip" id="clearBtn">Clear</button>
      <button class="btn chip" id="restartBtn" style="display:none">Redraw</button>
      <select id="aspect" class="btn chip" title="Canvas size">
        <option value="1080/1350">Portrait 4:5</option>
        <option value="1080/1920">Story 9:16</option>
        <option value="1/1">Square 1:1</option>
        <option value="1920/1080">Landscape 16:9</option>
      </select>
      <button class="btn chip" id="recBtn" aria-pressed="false">Record</button>
      <button class="btn chip" id="saveBtn">Save</button>
    </div>
  </div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name:'Fence', desc:'Draw the line, then bend it',
  about:"Draw your own strokes, then hit Done: each one becomes the path a trailing chain travels, swinging soft ink behind it and building into flowing, spiralling line work. The knobs bend your lines rather than re-rolling them. Record the drawing-in or save a frame.",
  version:'v2' });</script>

<script>
(() => {
  const cv=document.getElementById('art'); let ctx=cv.getContext('2d');
  const $=id=>document.getElementById(id);
  let ASPECT=1080/1350;
  let W=0,H=0,dpr=1, mode='draw';
  let strokes=[], cur=null, walkers=[], raf=0, F=0, lastTs=0, aT=0, gT=0, traceRef=null;
  const P={ density:39, length:89, flow:100, spiral:100, weight:20, ink:86, time:20, color:0 };

  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function makeNoise(seed){ const rand=mulberry32(seed);
    const p=new Uint8Array(256); for(let i=0;i<256;i++)p[i]=i;
    for(let i=255;i>0;i--){ const j=(rand()*(i+1))|0, t=p[i]; p[i]=p[j]; p[j]=t; }
    const perm=new Uint8Array(512); for(let i=0;i<512;i++)perm[i]=p[i&255];
    const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+(b-a)*t;
    const grad=(h,x,y)=>((h&1)?x:-x)+((h&2)?y:-y);
    return (x,y)=>{ const X=Math.floor(x)&255,Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y);
      const u=fade(x),v=fade(y);
      const aa=perm[perm[X]+Y],ab=perm[perm[X]+Y+1],ba=perm[perm[X+1]+Y],bb=perm[perm[X+1]+Y+1];
      return lerp(lerp(grad(aa,x,y),grad(ba,x-1,y),u), lerp(grad(ab,x,y-1),grad(bb,x-1,y-1),u), v); }; }
  const noise=makeNoise(1337);

  function fit(){ const availH=innerHeight-168, availW=innerWidth-28;
    let h=Math.min(availH,1650), w=h*ASPECT; if(w>availW){ w=availW; h=w/ASPECT; }
    dpr=Math.min(devicePixelRatio||1,2); W=Math.round(w); H=Math.round(h);
    cv.style.width=W+'px'; cv.style.height=H+'px'; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); }

  function pos(e){ const r=cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height }; }

  // smooth + resample a raw stroke into an even polyline (0..1 space)
  function prep(stroke){ if(stroke.length<2) return stroke.slice();
    const sm=[]; for(let i=0;i<stroke.length;i++){ const a=stroke[Math.max(0,i-1)], b=stroke[i], c=stroke[Math.min(stroke.length-1,i+1)];
      sm.push({x:(a.x+2*b.x+c.x)/4, y:(a.y+2*b.y+c.y)/4}); }
    let len=0; for(let i=1;i<sm.length;i++) len+=Math.hypot(sm[i].x-sm[i-1].x, sm[i].y-sm[i-1].y);
    const step=Math.max(0.006, len/Math.max(20,len/0.008)); const out=[sm[0]]; let acc=0,i=1,prev=sm[0];
    while(i<sm.length){ const d=Math.hypot(sm[i].x-prev.x, sm[i].y-prev.y);
      if(acc+d>=step){ const t=(step-acc)/d; prev={x:prev.x+(sm[i].x-prev.x)*t, y:prev.y+(sm[i].y-prev.y)*t}; out.push(prev); acc=0; }
      else { acc+=d; prev=sm[i]; i++; } }
    if(out.length<2) out.push(sm[sm.length-1]); return out; }

  function strokePoint(path,t){ const n=path.length; if(n<2) return {x:path[0].x, y:path[0].y};
    const f=((t%1)+1)%1*(n-1), i=Math.floor(f), fr=f-i, a=path[i], b=path[Math.min(n-1,i+1)];
    return {x:a.x+(b.x-a.x)*fr, y:a.y+(b.y-a.y)*fr}; }

  const HUES=['#e0483c','#e6902a','#e8c020','#4f9d69','#2f7fd0','#6a4fb0','#c0468f'];
  function hueFor(t){ return HUES[Math.floor(((t%1)+1)%1*HUES.length)%HUES.length]; }
  function rgba(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+Math.min(1,a).toFixed(3)+')'; }

  const STAGGER=0.5;   // how much of a pass the pour-in spreads across (top stroke first, last stroke +STAGGER)
  function walkersFor(path, si, startAt){ const scale=Math.min(W,H); const rand=mulberry32((si*131+7)>>>0); const out=[];
    for(let e=0;e<P.density;e++){
      const nodeCount=6+Math.round((P.length/100)*38);
      const lenJit=0.7+rand()*0.6, nodeLen=(0.005+(P.length/100)*0.012)*scale*lenJit;
      const h=strokePoint(path, 0); const nodes=[];
      for(let i=0;i<nodeCount;i++) nodes.push({x:h.x*W, y:h.y*H+i*nodeLen});
      out.push({ path, si, t:0, startAt:startAt||0, phase:rand()*1000,
        speedMul:0.6+rand()*0.9, lenJit, spiralRand:rand(),   // dynamics read live so knobs never reset the run
        nodeCount, nodeLen, nodes, last:nodes.map(n=>({x:n.x,y:n.y})),
        brushW:0.4+rand()*1.2, ink:0.5+rand()*0.6, hue:rand(), spin:rand()<0.5?1:-1,
        wander:0.4+rand()*1.0 }); }
    return out; }
  function buildWalkers(){ walkers=[];
    const prepped=strokes.map(s=>prep(s.map(p=>({x:p.x,y:p.y}))));
    // reading order per stroke — top-to-bottom, then left-to-right — so the drawing pours in, in sequence
    const ord=prepped.map(path=>{ let sx=0,sy=0; for(const p of path){ sx+=p.x; sy+=p.y; } const n=path.length||1; return (sy/n)*0.82+(sx/n)*0.18; });
    const mn=Math.min(...ord), mx=Math.max(...ord), rng=(mx-mn)||1;
    prepped.forEach((path,si)=>{ walkersFor(path, si, ((ord[si]-mn)/rng)*STAGGER).forEach(w=>walkers.push(w)); }); }

  function drawRaw(s){ if(s.length<2){ if(s.length){ ctx.beginPath(); ctx.arc(s[0].x*W,s[0].y*H,1.6,0,6.28); ctx.fillStyle='#141414'; ctx.fill(); } return; }
    ctx.beginPath(); ctx.moveTo(s[0].x*W,s[0].y*H); for(let i=1;i<s.length;i++) ctx.lineTo(s[i].x*W,s[i].y*H); ctx.stroke(); }
  function renderDraw(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); drawRef(0.36); ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.strokeStyle='rgba(20,20,26,.85)'; ctx.lineWidth=1.6; for(const s of strokes) drawRaw(s); if(cur) drawRaw(cur); }

  function drawRef(a){ if(!traceRef) return; ctx.save(); ctx.globalAlpha=a; ctx.drawImage(traceRef,0,0,W,H); ctx.restore(); }
  function startSim(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H); aT=0; gT=0; buildWalkers(); cancelAnimationFrame(raf); step(); }
  function step(ts){ raf=requestAnimationFrame(step); F++;
    const dt=(lastTs&&ts)?Math.min(0.05,(ts-lastTs)/1000):0.016; if(ts) lastTs=ts;
    aT += dt/Math.max(0.5,P.time);   // shared motion clock — advances ~1 per pass, so Time slows the whole thing
    gT += dt;                         // real-time grow-in clock (~2.5s to full, independent of Time)
    // grow-in: the piece starts concentrated at the centre and expands out to full size
    let gu=gT/2.5; gu=gu<0?0:gu>1?1:gu; const grow=0.06+0.94*(gu*gu*(3-2*gu)); const gcx=W/2, gcy=H/2;
    const flow=P.flow/100, spiral=P.spiral/100, colAmt=P.color/100, scale=Math.min(W,H);
    const ink=0.015+(P.ink/100)*0.13, wBase=0.3+(P.weight/100)*3.0;
    for(const w of walkers){
      if(aT < w.startAt) continue;   // pour-in stagger: this stroke hasn't begun yet
      // head drifts in 2D via noise, centred on a slowly-advancing point of the drawn stroke —
      // the chain then swings behind it into curves (cheyuwu's wandering head, pinned to your line)
      w.t+=(dt/Math.max(0.5,P.time))*w.speedMul; const base=strokePoint(w.path,w.t);   // one pass ≈ P.time seconds
      const rad=(0.004+flow*0.16)*scale*w.wander;
      const nx=noise(w.phase + aT*4*(0.5+w.wander), 0.5), ny=noise(w.phase+70 + aT*4*(0.5+w.wander), 9.1);
      let hx=base.x*W + nx*rad, hy=base.y*H + ny*rad;
      if(w.spiralRand < spiral*0.5 && spiral>0.02){ const r=spiral*0.05*scale, a=aT*7*w.spin+w.phase; hx+=Math.cos(a)*r; hy+=Math.sin(a)*r; }
      hx=gcx+(hx-gcx)*grow; hy=gcy+(hy-gcy)*grow;   // expand from the centre as it grows in
      w.last=w.nodes.map(n=>({x:n.x,y:n.y}));
      w.nodes[0].x=hx; w.nodes[0].y=hy;
      for(let i=1;i<w.nodes.length;i++){ const p=w.nodes[i-1], n=w.nodes[i];
        let dx=n.x-p.x, dy=n.y-p.y; const d=Math.hypot(dx,dy)||1; n.x=p.x+dx/d*w.nodeLen*grow; n.y=p.y+dy/d*w.nodeLen*grow; }
      // blend smoothly from black ink toward the chain's colour as Colour rises (not an on/off jump)
      const cn=parseInt(hueFor(w.hue+colAmt*0.5).slice(1),16);
      const cr=Math.round((cn>>16&255)*colAmt + 12*(1-colAmt)), cg=Math.round((cn>>8&255)*colAmt + 12*(1-colAmt)), cb=Math.round((cn&255)*colAmt + 16*(1-colAmt));
      ctx.fillStyle = 'rgba('+cr+','+cg+','+cb+','+(ink*w.ink*(1+0.3*colAmt)).toFixed(3)+')';
      for(let i=0;i<w.nodes.length;i++){ const a=w.last[i], b=w.nodes[i];
        for(let o=0;o<5;o++){ const px=a.x+(b.x-a.x)*o/5, py=a.y+(b.y-a.y)*o/5;
          ctx.beginPath(); ctx.arc(px+(Math.random()-0.5)*wBase, py+(Math.random()-0.5)*wBase, Math.random()*wBase*w.brushW, 0, 6.2832); ctx.fill(); } }
    }
  }

  // Keep each stroke stocked with P.density chains, adding/removing live (never clears the canvas)
  function syncDensity(){ const by={}; walkers.forEach(w=>{ (by[w.si]=by[w.si]||[]).push(w); });
    strokes.forEach((s,si)=>{ const have=by[si]||[];
      if(have.length>P.density){ const rm=new Set(have.slice(P.density)); walkers=walkers.filter(w=>!rm.has(w)); }
      else if(have.length<P.density){ walkersFor(prep(s.map(p=>({x:p.x,y:p.y}))), si).slice(have.length).forEach(w=>walkers.push(w)); } }); }
  Object.keys(P).forEach(k=>{ const inp=$(k), out=$(k+'R'); if(!inp) return;
    inp.addEventListener('input', ()=>{ P[k]=+inp.value; out.textContent=inp.value+(k==='time'?'s':'');
      if(mode!=='modify') return;
      // Flow, Spiral, Weight, Ink, Speed, Colour are all read live in step() — they never reset.
      if(k==='density') syncDensity();
      else if(k==='length'){ const scale=Math.min(W,H); walkers.forEach(w=>{ w.nodeLen=(0.005+(P.length/100)*0.012)*scale*w.lenJit; }); }
    }); });

  // Draw in EITHER mode. In modify, new strokes spawn live chains into the running animation
  // (and the recording) without clearing what's there — keep drawing while it moves.
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); cur=[pos(e)]; });
  cv.addEventListener('pointermove', e=>{ if(!cur) return; e.preventDefault(); const p=pos(e);
    const last=cur[cur.length-1]; if(Math.hypot(p.x-last.x,p.y-last.y)>0.0015){ cur.push(p);
      if(mode==='draw') renderDraw();
      else { ctx.strokeStyle='rgba(120,122,132,.55)'; ctx.lineWidth=1; ctx.lineCap='round'; ctx.beginPath();
        ctx.moveTo(last.x*W,last.y*H); ctx.lineTo(p.x*W,p.y*H); ctx.stroke(); } } });
  cv.addEventListener('pointerup', ()=>{ if(!cur) return;
    if(cur.length>1){ strokes.push(cur);
      if(mode==='modify') walkersFor(prep(cur.map(p=>({x:p.x,y:p.y}))), strokes.length-1).forEach(w=>walkers.push(w)); }
    const wasDraw=mode==='draw'; cur=null; if(wasDraw) renderDraw(); });

  function toDraw(){ mode='draw'; cancelAnimationFrame(raf);
    $('doneBtn').style.display=''; $('editBtn').style.display='none'; $('restartBtn').style.display='none';
    $('hint').textContent='Draw your lines — as many as you like'; $('hint').style.opacity=1; renderDraw(); }
  function toModify(){ if(!strokes.length){ $('hint').textContent='Draw a line first'; $('hint').style.opacity=1; return; }
    mode='modify'; $('sliders').classList.remove('locked'); $('doneBtn').style.display='none';
    $('editBtn').style.display=''; $('restartBtn').style.display='';
    $('hint').textContent='Now it moves — keep drawing to add more, live'; $('hint').style.opacity=1;
    setTimeout(()=>{ if(mode==='modify') $('hint').style.opacity=0; }, 3800); startSim(); }
  $('aspect').addEventListener('change', e=>{ const [a,b]=e.target.value.split('/').map(Number); ASPECT=a/b; fit();
    if(mode==='modify') startSim(); else renderDraw(); });

  /* ---- add a photo as a tracing guide: it sits faintly on the canvas so you draw your own
         strokes over it. Only your strokes drive the chains; the photo stays as a soft backdrop
         once it animates, and your raw guide-lines are dropped. ---- */
  $('photoBtn').addEventListener('click', ()=> $('photoFile').click());
  $('photoFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const url=URL.createObjectURL(f);
    const im=new Image(); im.onload=()=>{ ASPECT=im.width/im.height; traceRef=im; fit();
      if(mode!=='draw') toDraw(); else renderDraw();
      $('hint').textContent='Trace over the photo, then hit “Done — bend it”'; $('hint').style.opacity=1; };
    im.src=url; e.target.value=''; });

  /* ---- typography: render typed words, trace their letterforms into vector paths, and let the
         chains draw the text itself, pouring down the canvas ---- */
  function traceContours(img, w, h){
    const d=img.data, lum=new Float32Array(w*h);
    for(let i=0;i<w*h;i++) lum[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    const at=(xx,yy)=>lum[Math.min(h-1,Math.max(0,yy))*w+Math.min(w-1,Math.max(0,xx))];
    const gx=new Float32Array(w*h), gy=new Float32Array(w*h), mag=new Float32Array(w*h); let mx=1e-3;
    for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){
      const a=(at(xx+1,yy-1)+2*at(xx+1,yy)+at(xx+1,yy+1))-(at(xx-1,yy-1)+2*at(xx-1,yy)+at(xx-1,yy+1));
      const b=(at(xx-1,yy+1)+2*at(xx,yy+1)+at(xx+1,yy+1))-(at(xx-1,yy-1)+2*at(xx,yy-1)+at(xx+1,yy-1));
      const i=yy*w+xx; gx[i]=a; gy[i]=b; mag[i]=Math.hypot(a,b); if(mag[i]>mx) mx=mag[i]; }
    const T=mx*0.24, visited=new Uint8Array(w*h), out=[];
    function walk(sx,sy,dir){ const pts=[{x:sx,y:sy}]; let px=sx,py=sy;
      let i0=(py|0)*w+(px|0), tx=-gy[i0]*dir, ty=gx[i0]*dir; { const m=Math.hypot(tx,ty)||1; tx/=m; ty/=m; }
      for(let s=0;s<500;s++){ px+=tx*1.15; py+=ty*1.15; const ix=px|0, iy=py|0;
        if(ix<1||iy<1||ix>=w-1||iy>=h-1) break; const i=iy*w+ix; if(mag[i]<T) break;
        visited[i]=1; visited[i+1]=1; visited[i-1]=1; visited[i+w]=1; visited[i-w]=1;
        pts.push({x:px,y:py}); let nx=-gy[i], ny=gx[i]; const m=Math.hypot(nx,ny)||1; nx/=m; ny/=m;
        if(nx*tx+ny*ty<0){ nx=-nx; ny=-ny; } tx=nx; ty=ny; } return pts; }
    const seeds=[]; for(let i=0;i<w*h;i++) if(mag[i]>T) seeds.push(i);
    seeds.sort((a,b)=>mag[b]-mag[a]);
    for(const seed of seeds){ if(out.length>=500) break; if(visited[seed]) continue;
      const sx=seed%w, sy=(seed/w)|0; const fwd=walk(sx,sy,1), bwd=walk(sx,sy,-1); bwd.reverse();
      const path=bwd.concat(fwd.slice(1));
      if(path.length>=5) out.push(path.map(p=>({x:p.x/w, y:p.y/h}))); }
    return out;
  }
  function textToStrokes(str){
    str=(str||'').trim(); if(!str) return [];
    const W0=640, H0=Math.max(160,Math.round(W0/ASPECT));
    const c=document.createElement('canvas'); c.width=W0; c.height=H0; const x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,W0,H0); x.fillStyle='#000'; x.textBaseline='alphabetic';
    const words=str.split(/\s+/);
    // pick a font size that lets the words stack and pour down the canvas
    let fs=Math.round(H0*0.2/Math.max(1,Math.sqrt(words.length))); fs=Math.max(28,Math.min(fs, Math.round(H0*0.26)));
    const font=w=>('800 '+w+'px Georgia, "Times New Roman", serif');
    x.font=font(fs);
    const maxW=W0*0.9, lines=[]; let line='';
    for(const w of words){ const test=line?line+' '+w:w; if(x.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; }
    if(line) lines.push(line);
    const lineH=fs*1.12, totalH=lines.length*lineH; let y=(H0-totalH)/2 + fs;
    for(const ln of lines){ const w=x.measureText(ln).width; x.fillText(ln, (W0-Math.min(w,maxW))/2, y); y+=lineH; }
    return traceContours(x.getImageData(0,0,W0,H0), W0, H0);
  }
  function pourText(){ const s=textToStrokes($('textIn').value); if(!s.length){ $('hint').textContent='Type some words first'; $('hint').style.opacity=1; return; }
    strokes=s; cur=null; traceRef=null; toModify(); }
  $('textBtn').addEventListener('click', pourText);
  $('textIn').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); pourText(); } });

  $('doneBtn').addEventListener('click', toModify);
  $('editBtn').addEventListener('click', toDraw);
  $('restartBtn').addEventListener('click', ()=>{ if(mode==='modify') startSim(); });
  $('undoBtn').addEventListener('click', ()=>{ strokes.pop(); if(mode==='modify') startSim(); else renderDraw(); });
  $('clearBtn').addEventListener('click', ()=>{ strokes=[]; cur=null; traceRef=null; toDraw(); });

  let rec=null, chunks=[];
  $('recBtn').addEventListener('click', ()=>{ if(rec && rec.state==='recording'){ rec.stop(); return; }
    const stream=cv.captureStream(30);
    const mime=['video/mp4;codecs=avc1.640029','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'video/webm';
    const ext=mime.indexOf('mp4')>=0?'mp4':'webm';
    rec=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:12000000}); chunks=[];
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{ const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='fence.'+ext; a.click(); $('recBtn').textContent='Record'; $('recBtn').setAttribute('aria-pressed','false'); };
    rec.start(); $('recBtn').textContent='Stop'; $('recBtn').setAttribute('aria-pressed','true'); });

  $('saveBtn').addEventListener('click', ()=>{ const a=document.createElement('a'); a.download='fence.png'; a.href=cv.toDataURL('image/png'); a.click(); });

  fit(); renderDraw(); window.__fenceReady=true;
  addEventListener('resize', ()=>{ const wasMod=mode==='modify'; fit(); if(wasMod) startSim(); else renderDraw(); });

  /* hover tooltips on any [data-tip] control — same behaviour as the other tools */
  let tipEl=null, tipT=null, tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return;
    if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0';
    const r=host.getBoundingClientRect(), t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8, r.bottom+8);
    tipEl.style.left=Math.max(8,Math.min(r.left, innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover', e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return;
    clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown', hideTip); addEventListener('scroll', hideTip, true);
})();
</script>
