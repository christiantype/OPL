<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lab/shared/gate.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Aura Maxing — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<style>
  /* Shared Lab shell — the Attractor standard: fixed left #dock, inset #wrap canvas,
     top-right #sizeDock, .group/.knob controls. Aura's own art styles sit below. */
  :root{ --ink:#f2f3f7; --dim:rgba(255,255,255,.55); --line:rgba(255,255,255,.14); --rail:300px; --top:82px; }
  @media (max-width:560px){ :root{ --top:74px; --rail:260px; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; background:#0b0c14; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; overflow:hidden; overscroll-behavior:none; }
  body.dark .opal-topbar{ background:transparent; border:none; color:var(--ink); }
  body.dark .opal-subhead__name{ color:var(--ink); }
  body.dark .opal-subhead__desc, body.dark .opal-subhead__ver{ color:rgba(255,255,255,.52); }
  body.dark .opal-brand{ color:var(--ink) !important; }
  body.dark .opal-brand .opal-product{ color:rgba(255,255,255,.5); }
  body.dark .opal-brand .opal-divider{ background:rgba(255,255,255,.2); }

  /* A canvas is a replaced element and won't stretch to an inset box, so it lives inside a
     wrapper that does — the wrapper's rect is the single source of truth for canvas size. */
  #wrap{ position:fixed; top:var(--top); left:var(--rail); right:0; bottom:0; overflow:hidden; background:#050609; }
  #stage{ display:block; width:100%; height:100%; touch-action:none; }

  #hint{ position:fixed; top:calc(var(--top) + 14px); left:calc((100% + var(--rail))/2); transform:translateX(-50%);
    font-size:13px; color:var(--dim); background:rgba(11,12,20,.7); padding:6px 14px; border-radius:999px;
    pointer-events:none; z-index:7; white-space:nowrap; }
  #status{ position:fixed; bottom:14px; left:calc(var(--rail) + 20px); z-index:8; pointer-events:none;
    font-size:11px; letter-spacing:.04em; color:var(--dim); display:none; }

  /* canvas-size dock — pinned top-right on every tool */
  #sizeDock{ position:fixed; top:calc(var(--top) + 12px); right:20px; z-index:8; }
  #sizeDock select{ background:rgba(15,16,24,.92); color:var(--ink); border:1px solid var(--line); border-radius:2px;
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; cursor:pointer;
    -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }

  #recDot{ position:fixed; top:calc(var(--top) + 14px); left:calc(var(--rail) + 24px); z-index:11; display:none; align-items:center; gap:7px;
    padding:6px 12px; border-radius:999px; font-size:10px; letter-spacing:.12em; color:#ff5468;
    background:rgba(15,16,24,.92); border:1px solid var(--line); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px; height:7px; border-radius:50%; background:#ff5468; animation:recblink 1s infinite; }
  #recDot b{ font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.06em; }
  @keyframes recblink{ 50%{ opacity:.25; } }

  #dock{ position:fixed; top:var(--top); left:0; bottom:0; width:var(--rail); z-index:6;
    padding:18px 16px 24px; overflow-y:auto; overflow-x:hidden;
    background:rgba(15,16,24,.92); -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    border-right:1px solid var(--line); display:flex; flex-direction:column; gap:0; }
  .knob{ display:flex; flex-direction:column; gap:2px; }
  .knob label{ display:flex; justify-content:space-between; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--dim); }
  .knob b{ color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:20px; background:transparent; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-moz-range-track{ height:2px; background:var(--line); border-radius:2px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; margin-top:-6px; border-radius:50%; background:var(--ink); }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border:0; border-radius:50%; background:var(--ink); }
  .btn{ appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; padding:8px 12px; border-radius:2px; cursor:pointer; transition:.15s; white-space:nowrap; }
  .btn:hover{ background:rgba(255,255,255,.11); }
  .btn[aria-pressed="true"], .btn.primary{ background:var(--ink); color:#0b0c14; border-color:var(--ink); }
  .group{ display:flex; flex-direction:column; gap:9px; }
  .group + .group{ margin-top:15px; padding-top:15px; border-top:1px solid var(--line); }
  .group__t{ font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--dim); font-weight:600; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .grid2 .btn, .btn.full{ width:100%; }
  .crow{ display:flex; align-items:center; justify-content:space-between; }
  .crow label{ font-size:12px; color:var(--ink); }
  .crow input[type=color]{ width:44px; height:24px; border:1px solid var(--line); border-radius:4px; background:none; padding:0; cursor:pointer; }
  .crow input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  .crow input[type=color]::-webkit-color-swatch{ border:none; border-radius:2px; }
  .capline{ font-size:11px; color:var(--dim); letter-spacing:.02em; }
  /* segmented multi-choice — the tool's own three/four-way pickers */
  .seg{ display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; }
  .seg button{ appearance:none; border:0; border-right:1px solid var(--line); background:transparent; color:var(--ink);
    font:inherit; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:7px 6px; cursor:pointer; white-space:nowrap; flex:1; text-align:center; }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ background:var(--ink); color:#0b0c14; }
  .tip{ position:fixed; z-index:60; display:none; max-width:230px; padding:9px 11px; border-radius:8px;
    background:rgba(18,20,28,.97); border:1px solid var(--line); color:var(--ink);
    -webkit-backdrop-filter:blur(20px) saturate(160%); backdrop-filter:blur(20px) saturate(160%);
    box-shadow:0 16px 40px -20px rgba(0,0,0,.6);
    font-size:11px; line-height:1.5; letter-spacing:.005em; text-transform:none; pointer-events:none; opacity:0; transition:opacity .14s ease; }

  /* full screen — canvas only */
  #exitFs{ position:fixed; top:14px; right:14px; z-index:12; display:none; width:34px; height:34px; border-radius:50%;
    border:1px solid var(--line); background:rgba(15,16,24,.92); color:var(--ink); cursor:pointer;
    align-items:center; justify-content:center; font-size:12px; line-height:1; padding:0;
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  body.fs #exitFs{ display:flex; }
  body.fs #dock, body.fs #sizeDock, body.fs #hint, body.fs #recDot{ display:none !important; }
  body.fs #wrap{ top:0; left:0; }
  body.fs .opal-topbar, body.fs .opal-subhead{ display:none !important; }
</style>
<link rel="stylesheet" href="/lab/shared/tool.css" />
</head>
<body class="dark">

<div id="wrap"><canvas id="stage"></canvas></div>
<div id="status"></div>
<div id="hint"></div>
<div id="recDot"><i></i><b>0:00</b></div>
<button id="exitFs" aria-label="exit full screen" title="Exit (Esc)">&#10005;</button>

<div id="sizeDock">
  <select id="aspect" title="Canvas size">
    <option value="1080x1350">Portrait &#183; 4:5</option>
    <option value="1080x1920">Story &#183; 9:16</option>
    <option value="1080x1080">Square &#183; 1:1</option>
    <option value="1920x1080">Landscape &#183; 16:9</option>
  </select>
</div>

<div id="dock">

  <!-- primary actions -->
  <div class="group">
    <button class="btn primary full" id="playBtn" aria-pressed="true">Pause</button>
    <button class="btn full" id="loadBtn" data-tip="Loads an image to mask. You can also drop one anywhere on the page — it never leaves your browser.">Load image</button>
    <input id="fileInp" type="file" accept="image/*" hidden />
  </div>

  <!-- subject -->
  <div class="group">
    <div class="group__t">Subject</div>
    <div class="knob" data-tip="How the subject is cut out. Luma drops the darks or lights — good for a plain background. Edge keeps only the contours. Feather is a soft oval. Auto is a soft centred subject."><label>Mask</label>
      <div class="seg" id="maskSeg">
        <button data-m="luma" aria-pressed="true">Luma</button>
        <button data-m="edge" aria-pressed="false">Edge</button>
        <button data-m="feather" aria-pressed="false">Feather</button>
        <button data-m="auto" aria-pressed="false">Auto</button>
      </div>
    </div>
    <div class="knob" data-tip="Where the cut falls between what is kept and what is hidden."><label>Threshold <b id="threshR">55</b></label><input id="thresh" type="range" min="0" max="100" value="55" /></div>
    <div class="knob" data-tip="How soft the edge of the cut is."><label>Softness <b id="featR">40</b></label><input id="feat" type="range" min="0" max="100" value="40" /></div>
    <div class="knob" data-tip="Swaps what the mask keeps and what it hides."><label>Invert</label>
      <div class="seg" id="invSeg"><button data-i="0" aria-pressed="true">Keep</button><button data-i="1" aria-pressed="false">Flip</button></div>
    </div>
  </div>

  <!-- gradient -->
  <div class="group">
    <div class="group__t">Gradient</div>
    <div class="knob" data-tip="Linear sweeps in a straight line; Conic spins around the centre; Radial pulses out from the middle."><label>Type</label>
      <div class="seg" id="gtypeSeg">
        <button data-g="linear" aria-pressed="true">Linear</button>
        <button data-g="conic" aria-pressed="false">Conic</button>
        <button data-g="radial" aria-pressed="false">Radial</button>
      </div>
    </div>
    <div class="crow" data-tip="First gradient colour."><label>Colour 1</label><input type="color" id="c1" value="#ff2d95" /></div>
    <div class="crow" data-tip="Second gradient colour."><label>Colour 2</label><input type="color" id="c2" value="#3f9bff" /></div>
    <div class="crow" data-tip="Third gradient colour."><label>Colour 3</label><input type="color" id="c3" value="#ffd23f" /></div>
    <div class="knob" data-tip="Starting angle of the gradient."><label>Angle <b id="gangR">30</b></label><input id="gang" type="range" min="0" max="360" value="30" /></div>
    <div class="knob" data-tip="How fast the gradient flows. Zero holds it still."><label>Flow <b id="gspdR">40</b></label><input id="gspd" type="range" min="0" max="100" value="40" /></div>
  </div>

  <!-- aura -->
  <div class="group">
    <div class="group__t">Aura</div>
    <div class="knob" data-tip="How much the gradient fills the subject — from the untouched photo up to a full colour silhouette."><label>Fill <b id="fillR">55</b></label><input id="fill" type="range" min="0" max="100" value="55" /></div>
    <div class="knob" data-tip="The size and strength of the coloured glow radiating around the subject."><label>Glow <b id="glowR">60</b></label><input id="glow" type="range" min="0" max="100" value="60" /></div>
    <div class="crow" data-tip="Colour of the ground behind everything."><label>Ground</label><input type="color" id="bg" value="#0a0b10" /></div>
  </div>

  <!-- export -->
  <div class="group">
    <div class="group__t">Export</div>
    <div class="knob" data-tip="Pixels across the long edge of the saved PNG. The line beneath is the print size at 300 DPI."><label>Pixels <b id="resR">3200</b></label><input id="res" type="range" min="1024" max="8192" step="256" value="3200" /><div class="capline"><b id="resIn" style="font-weight:400;opacity:.75"></b></div></div>
    <div class="grid2">
      <button class="btn" id="pngBtn" data-tip="Saves the current frame as a high-resolution PNG.">PNG</button>
      <button class="btn" id="vidBtn" data-tip="Records the flow as a video (MP4 where supported).">Record</button>
    </div>
  </div>

  <!-- view -->
  <div class="group">
    <div class="group__t">View</div>
    <div class="grid2">
      <button class="btn" id="themeBtn" data-tip="Switches the interface and canvas between light and dark.">Theme</button>
      <button class="btn" id="fsBtn" data-tip="Fills the screen with the canvas only. Press Esc to exit.">Full screen</button>
    </div>
  </div>

</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name: 'Aura Maxing', desc: 'Masked subject · gradient aura', version: 'v1', about: 'Add an image, mask out the subject, and pour an animated gradient through it — filling the silhouette and radiating a coloured glow around it. Choose the mask, the colours, the flow. Export a still or a video.' });</script>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const smooth=(a,b,x)=>{ const t=clamp((x-a)/((b-a)||1e-6),0,1); return t*t*(3-2*t); };
  const TAU=Math.PI*2; let THEME='dark';
  const state={ mask:'luma', thresh:55, feat:40, invert:0, gtype:'linear', c1:'#ff2d95', c2:'#3f9bff', c3:'#ffd23f',
    gang:30, gspd:40, fill:55, glow:60, bg:'#0a0b10', size:'1080x1350', res:3200, playing:true };
  const CW=()=>+state.size.split('x')[0], CH=()=>+state.size.split('x')[1];

  let img=null, baked=null, bw=0, bh=0;   // baked = image with subject alpha
  function addImage(file){ const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{ URL.revokeObjectURL(url); img=im; bake(); markDirty(); setStatus(file.name+' loaded'); setTimeout(()=>setStatus(''),1400); };
    im.onerror=()=>{ setStatus('could not read that image'); setTimeout(()=>setStatus(''),2400); }; im.src=url; }

  function bake(){ if(!img) return; const long=Math.max(img.naturalWidth,img.naturalHeight), k=Math.min(1,1800/long);
    const w=Math.max(1,Math.round(img.naturalWidth*k)), h=Math.max(1,Math.round(img.naturalHeight*k));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
    const M=state.mask;
    if(M==='feather'||M==='auto'){ const rad=(M==='auto'?0.92:0.5+state.thresh/100*0.8), feat=clamp(state.feat/100,0.02,1);
      x.globalCompositeOperation='destination-in'; x.save(); x.translate(w/2,h/2); x.scale(w/2,h/2);
      const inner=Math.max(0,rad*(1-feat)), grd=x.createRadialGradient(0,0,inner,0,0,rad);
      if(state.invert){ grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(1,'rgba(0,0,0,1)'); }
      else { grd.addColorStop(0,'rgba(0,0,0,1)'); grd.addColorStop(1,'rgba(0,0,0,0)'); }
      x.fillStyle=grd; x.fillRect(-1.4,-1.4,2.8,2.8); x.restore(); x.globalCompositeOperation='source-over'; }
    else { const id=x.getImageData(0,0,w,h), d=id.data, th=state.thresh/100, fe=clamp(state.feat/100,0.02,1)*0.7;
      if(M==='luma'){ for(let i=0;i<d.length;i+=4){ const l=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255; let a=smooth(th-fe,th+fe,l); if(state.invert) a=1-a; d[i+3]=Math.round(d[i+3]*a); } }
      else { const L=new Float32Array(w*h); for(let p=0,q=0;p<d.length;p+=4,q++) L[q]=(d[p]*0.299+d[p+1]*0.587+d[p+2]*0.114)/255;
        for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=y*w+xx, xa=xx>0?xx-1:xx,xb=xx<w-1?xx+1:xx,ya=y>0?y-1:y,yb=y<h-1?y+1:y;
          const gx=L[y*w+xb]-L[y*w+xa], gy=L[yb*w+xx]-L[ya*w+xx]; let mag=Math.min(1,Math.hypot(gx,gy)*4.5); let a=smooth(th-fe,th+fe,mag); if(state.invert) a=1-a; d[i*4+3]=Math.round(d[i*4+3]*a); } }
      x.putImageData(id,0,0); }
    baked=c; bw=w; bh=h; }

  // gradient fill into a rect [0,0,W,H]
  function gradFill(g,W,H,t){ const cols=[state.c1,state.c2,state.c3];
    const ph=(state.gspd/100)*t*0.35, ang=(state.gang/360+ph)*TAU;
    if(state.gtype==='conic'){ const gr=g.createConicGradient(ang, W/2, H/2);
      for(let i=0;i<=6;i++){ gr.addColorStop(i/6, cols[i%3]); } g.fillStyle=gr; g.fillRect(0,0,W,H); return; }
    if(state.gtype==='radial'){ const puls=0.5+0.5*Math.sin(ph*TAU), R=Math.hypot(W,H)*0.5*(0.7+0.5*puls);
      const gr=g.createRadialGradient(W/2,H/2,R*0.05,W/2,H/2,R);
      gr.addColorStop(0,cols[0]); gr.addColorStop(0.5,cols[1]); gr.addColorStop(1,cols[2]); g.fillStyle=gr; g.fillRect(0,0,W,H); return; }
    const dx=Math.cos(ang), dy=Math.sin(ang), L=(Math.abs(dx)*W+Math.abs(dy)*H);
    const x0=W/2-dx*L/2, y0=H/2-dy*L/2, x1=W/2+dx*L/2, y1=H/2+dy*L/2; const gr=g.createLinearGradient(x0,y0,x1,y1);
    const off=(ph%1+1)%1; for(let i=0;i<=4;i++){ let s=(i/4 - off); s=(s%1+1)%1; }
    gr.addColorStop(0,cols[0]); gr.addColorStop(0.5,cols[1]); gr.addColorStop(1,cols[2]); g.fillStyle=gr; g.fillRect(0,0,W,H); }

  const tmp=document.createElement('canvas'), tmx=tmp.getContext('2d');
  const aur=document.createElement('canvas'), aux=aur.getContext('2d');
  function renderComp(g,W,H,t){
    g.globalAlpha=1; g.globalCompositeOperation='source-over'; g.filter='none';
    g.fillStyle=state.bg; g.fillRect(0,0,W,H);
    if(!baked) return;
    const fit=Math.min(W,H)*0.82/Math.max(bw,bh), dw=bw*fit, dh=bh*fit, dx=(W-dw)/2, dy=(H-dh)/2;
    if(tmp.width!==W||tmp.height!==H){ tmp.width=W; tmp.height=H; } if(aur.width!==W||aur.height!==H){ aur.width=W; aur.height=H; }
    // subject silhouette placed in a full-frame buffer
    tmx.setTransform(1,0,0,1,0,0); tmx.clearRect(0,0,W,H); tmx.drawImage(baked,dx,dy,dw,dh);
    // aura: gradient shaped by the silhouette, blurred + scaled, glowing behind the subject
    const glow=state.glow/100;
    if(glow>0.01){ aux.setTransform(1,0,0,1,0,0); aux.clearRect(0,0,W,H); gradFill(aux,W,H,t);
      aux.globalCompositeOperation='destination-in'; aux.drawImage(tmp,0,0); aux.globalCompositeOperation='source-over';
      const blur=Math.max(1,glow*Math.min(W,H)*0.06), sc=1+glow*0.16;
      g.save(); g.globalCompositeOperation = THEME==='dark'?'lighter':'source-over'; g.globalAlpha=clamp(0.35+glow*0.75,0,1);
      g.filter=`blur(${blur}px)`; g.translate(W/2,H/2); g.scale(sc,sc); g.translate(-W/2,-H/2); g.drawImage(aur,0,0); g.restore(); g.filter='none'; }
    // subject
    g.drawImage(tmp,0,0);
    // gradient fill mixed into the subject
    const fill=state.fill/100;
    if(fill>0.01){ aux.setTransform(1,0,0,1,0,0); aux.clearRect(0,0,W,H); gradFill(aux,W,H,t);
      aux.globalCompositeOperation='destination-in'; aux.drawImage(tmp,0,0); aux.globalCompositeOperation='source-over';
      g.save(); g.globalAlpha=fill; g.drawImage(aur,0,0); g.restore(); }
  }
  const cv=$('stage'), ctx=cv.getContext('2d'), wrap=$('wrap');
  let W=0,H=0,DPR=1;
  function resize(){ const r=wrap.getBoundingClientRect(); DPR=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); markDirty(); }
  addEventListener('resize',resize);
  function render(g,cw,ch,t,forExport){ g.setTransform(1,0,0,1,0,0);
    if(forExport){ renderComp(g,cw,ch,t); return; }
    const fit=Math.min(cw/CW(),ch/CH()), w=Math.round(CW()*fit), h=Math.round(CH()*fit), ox=Math.round((cw-w)/2), oy=Math.round((ch-h)/2);
    g.fillStyle=THEME==='dark'?'#050609':'#c7cad0'; g.fillRect(0,0,cw,ch);
    g.save(); g.translate(ox,oy); renderComp(g,w,h,t); g.restore(); }
  let clock=0,last=null,dirty=true; const markDirty=()=>dirty=true;
  function tick(ts){ if(last==null)last=ts; const dt=(ts-last)/1000; last=ts; if(state.playing) clock+=dt; if(state.playing||dirty){ render(ctx,cv.width,cv.height,clock); dirty=false; } requestAnimationFrame(tick); }

  // exports
  const dl=(blob,name)=>{ const u=URL.createObjectURL(blob),a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); };
  function exportDims(){ const long=Math.max(CW(),CH()), s=state.res/long; return [Math.round(CW()*s),Math.round(CH()*s)]; }
  function exportPNG(){ if(!baked){ setStatus('add an image first'); setTimeout(()=>setStatus(''),1600); return; } const [w,h]=exportDims(); setStatus(`rendering ${w}×${h}…`);
    setTimeout(()=>{ const c=document.createElement('canvas'); c.width=w; c.height=h; renderComp(c.getContext('2d'),w,h,clock);
      c.toBlob(b=>{ dl(b,`aura-${w}x${h}-${Date.now()}.png`); setStatus(`saved ${w}×${h}`); setTimeout(()=>setStatus(''),2000); },'image/png'); },30); }
  function pickMime(){ const t=['video/mp4;codecs=avc1.640028','video/mp4','video/webm;codecs=vp9','video/webm']; for(const m of t) if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m)) return m; return ''; }
  let recording=false;
  function exportVid(){ if(recording||!baked) return; let recTimer=0; const long=Math.max(CW(),CH()), s=Math.min(1440,long)/long, w=Math.round(CW()*s), h=Math.round(CH()*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); const mime=pickMime(); if(!mime){ setStatus('recording not supported here'); setTimeout(()=>setStatus(''),2600); return; }
    const rec=new MediaRecorder(c.captureStream(60),{mimeType:mime,videoBitsPerSecond:Math.min(60000000,Math.max(24000000,Math.round(c.width*c.height*60*0.25)))}), chunks=[]; rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
    rec.onstop=()=>{ const ext=mime.includes('mp4')?'mp4':'webm'; dl(new Blob(chunks,{type:mime}),`aura-${Date.now()}.${ext}`); recording=false; clearInterval(recTimer); $('recDot').classList.remove('on'); setStatus('saved '+ext.toUpperCase()); setTimeout(()=>setStatus(''),2200); };
    recording=true; $('recDot').classList.add('on'); $('recDot').querySelector('b').textContent='0:00'; const rt0=performance.now();
    recTimer=setInterval(()=>{ const sec=Math.floor((performance.now()-rt0)/1000); $('recDot').querySelector('b').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); },250);
    const DUR=7000, t0=performance.now(); (function rf(now){ const el=now-t0; renderComp(g,w,h,el/1000); if(el<DUR) requestAnimationFrame(rf); else rec.stop(); })(t0); rec.start(); setStatus('recording…'); }

  // UI
  function setStatus(t){ const s=$('status'); s.textContent=t; s.style.display=t?'block':'none'; }
  function bindSeg(id,key,dk,after){ document.querySelectorAll(`#${id} button`).forEach(b=>b.addEventListener('click',()=>{ state[key]=b.dataset[dk]; document.querySelectorAll(`#${id} button`).forEach(x=>x.setAttribute('aria-pressed',String(x===b))); if(after)after(); markDirty(); })); }
  const bind=(id,key,fn)=>{ const e=$(id); e.addEventListener('input',ev=>{ state[key]=+ev.target.value; const r=$(id+'R'); if(r)r.textContent=ev.target.value; if(fn)fn(); markDirty(); }); };
  function wire(){
    bindSeg('maskSeg','mask','m',bake); bindSeg('invSeg','invert','i',bake); bindSeg('gtypeSeg','gtype','g');
    $('aspect').addEventListener('change',e=>{ state.size=e.target.value; syncRes(); syncHint(); markDirty(); });
    bind('thresh','thresh',bake); bind('feat','feat',bake); bind('gang','gang'); bind('gspd','gspd'); bind('fill','fill'); bind('glow','glow');
    $('res').addEventListener('input',e=>{ state.res=+e.target.value; $('resR').textContent=e.target.value; syncRes(); });
    ['c1','c2','c3','bg'].forEach(id=>$(id).addEventListener('input',e=>{ state[id]=e.target.value; markDirty(); }));
    $('loadBtn').addEventListener('click',()=>$('fileInp').click());
    $('fileInp').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) addImage(f); e.target.value=''; });
    $('pngBtn').addEventListener('click',exportPNG); $('vidBtn').addEventListener('click',exportVid);
    $('playBtn').addEventListener('click',()=>{ state.playing=!state.playing; last=null; $('playBtn').setAttribute('aria-pressed',String(state.playing)); $('playBtn').textContent=state.playing?'Pause':'Play'; });
    $('themeBtn').addEventListener('click',()=>{ THEME=THEME==='dark'?'light':'dark'; document.body.classList.toggle('dark',THEME==='dark'); $('themeBtn').setAttribute('aria-pressed',String(THEME==='dark'));
      if(THEME==='light'&&state.bg==='#0a0b10'){ state.bg='#eef0f4'; $('bg').value=state.bg; } else if(THEME==='dark'&&state.bg==='#eef0f4'){ state.bg='#0a0b10'; $('bg').value=state.bg; } markDirty(); });
    $('fsBtn').addEventListener('click',()=>setFs(!document.body.classList.contains('fs'))); $('exitFs').addEventListener('click',()=>setFs(false));
    ['dragover','drop'].forEach(ev=>addEventListener(ev,e=>e.preventDefault()));
    addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f&&/^image\//.test(f.type)) addImage(f); });
    addEventListener('keydown',e=>{ if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
      if(e.key===' '){ e.preventDefault(); $('playBtn').click(); } if(e.key==='Escape'&&document.body.classList.contains('fs')){ setFs(false); return; } if(e.key==='f'||e.key==='F') setFs(!document.body.classList.contains('fs')); });
    document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });
  }
  function syncRes(){ const [ew,eh]=exportDims(); const el=$('resIn'); if(el) el.textContent=`${(ew/300).toFixed(1)}×${(eh/300).toFixed(1)}in @300`; }
  function syncHint(){ $('hint').textContent=`aura maxing · ${state.mask} mask · png ${exportDims().join('×')}`; }
  function setFs(on){ document.body.classList.toggle('fs',on); if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{}); else if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); requestAnimationFrame(resize); }

  let tipEl=null,tipT=null,tipFor=null;
  function hideTip(){ clearTimeout(tipT); tipFor=null; if(tipEl){ tipEl.style.opacity='0'; tipEl.style.display='none'; } }
  function showTip(host){ const text=host.getAttribute('data-tip'); if(!text) return; if(!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl); }
    tipEl.textContent=text; tipEl.style.display='block'; tipEl.style.opacity='0'; const r=host.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
    let top=r.top-t.height-8; if(top<8) top=Math.min(innerHeight-t.height-8,r.bottom+8); tipEl.style.left=Math.max(8,Math.min(r.left,innerWidth-t.width-8))+'px'; tipEl.style.top=top+'px'; tipEl.style.opacity='1'; }
  addEventListener('pointerover',e=>{ const h=e.target.closest&&e.target.closest('[data-tip]'); if(h===tipFor) return; clearTimeout(tipT); if(!h){ hideTip(); return; } tipFor=h; tipT=setTimeout(()=>showTip(h),240); });
  addEventListener('pointerdown',hideTip); addEventListener('scroll',hideTip,true);

  wire(); resize(); document.body.classList.add('dark');
  syncRes(); syncHint();
  requestAnimationFrame(tick);
  window.aura={ state, render:renderComp, exportDims, addImageFile:addImage, get ready(){return !!baked;} };
})();
</script>
</body>
