<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Angel — OP/AL</title>
<link rel="stylesheet" href="/lab/shared/opal.css" />
<script src="/assets/js/Tone.js"></script>
<style>
  /* Angel runs light: paper ground, ink marks. The canvas composites with multiply
     rather than the usual additive glow — see BLEND in the script. */
  :root{ --ink:#1a1a1a; --hair:rgba(0,0,0,.14); --mute:rgba(0,0,0,.45); --paper:#ffffff; --top:100px; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family: ui-sans-serif,"Helvetica Neue",Inter,Arial,sans-serif; overflow:hidden; }
  /* sits below the OP/AL topbar + subhead rather than over them */
  #stage{ position:fixed; top:var(--top); left:0; right:0; bottom:0; touch-action:none; display:block; }
  @media (max-width:560px){ :root{ --top:92px; } }

  #status{ position:fixed; bottom:14px; left:16px; z-index:5; pointer-events:none;
    font-size:10px; letter-spacing:.08em; color:var(--mute); display:none; }

  /* one hairline control strip — everything else is off until asked for */
  #bar{ position:fixed; top:calc(var(--top) + 12px); right:14px; z-index:9; display:flex; gap:8px; }
  .icon{ appearance:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--hair);
    background:rgba(255,255,255,.86); color:var(--ink); cursor:pointer; backdrop-filter:blur(8px);
    display:flex; align-items:center; justify-content:center; font-size:11px; letter-spacing:.04em; padding:0; }
  .icon[aria-pressed="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }
  #recDot{ position:fixed; top:calc(var(--top) + 18px); right:96px; z-index:9; font-size:10px;
    letter-spacing:.12em; color:#c8102e; display:none; align-items:center; gap:6px; }
  #recDot.on{ display:flex; }
  #recDot i{ width:7px;height:7px;border-radius:50%;background:#c8102e; animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:.2;} }

  /* Frosted glass: the fill has to stay genuinely translucent or backdrop-filter has
     nothing to show through — at .95 the blur was invisible and it just read as a slab. */
  #dock{ position:fixed; left:0; right:0; bottom:0; z-index:6; transition:transform .28s ease, opacity .28s;
    padding:18px 20px calc(18px + env(safe-area-inset-bottom));
    background:rgba(252,252,253,.62);
    -webkit-backdrop-filter:blur(30px) saturate(180%); backdrop-filter:blur(30px) saturate(180%);
    border-top:1px solid rgba(0,0,0,.08); box-shadow:0 -12px 40px -24px rgba(0,0,0,.35);
    display:flex; flex-direction:column; gap:0; max-height:68vh; overflow-y:auto; overflow-x:hidden; }
  #dock.hidden{ transform:translateY(105%); opacity:0; pointer-events:none; }
  .row{ display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 22px;
    padding:14px 0; border-bottom:1px solid rgba(0,0,0,.07); }
  .row:first-child{ padding-top:0; }
  .row:last-of-type{ border-bottom:0; padding-bottom:2px; }
  .grp{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .grp > label{ text-transform:uppercase; letter-spacing:.13em; font-size:9px; line-height:1;
    color:var(--mute); white-space:nowrap; }
  .grp > label b{ font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .seg{ display:flex; border:1px solid var(--hair); border-radius:2px; overflow:hidden; }
  .seg button{ appearance:none; border:0; background:transparent; color:var(--ink);
    font:inherit; font-size:11px; padding:7px 10px; cursor:pointer; border-right:1px solid var(--hair); white-space:nowrap; }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-pressed="true"]{ color:#fff; background:var(--ink); }
  .seg.lanes button[aria-pressed="true"]{ color:var(--ink); background:transparent; box-shadow:inset 0 -2px 0 currentColor; }
  .seg.lanes button{ font-weight:600; }
  select{ appearance:none; background:#fff; border:1px solid var(--hair); color:var(--ink);
    font:inherit; font-size:11px; padding:7px 24px 7px 10px; border-radius:2px; cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  /* opal.css gives ranges a 22px pill track — override the pseudo-elements themselves,
     not just the input, or the pill wins and the control looks like a lozenge. */
  input[type=range]{ -webkit-appearance:none; appearance:none; width:104px; height:14px;
    background:transparent; outline:none; margin:0; cursor:pointer; }
  input[type=range]::-webkit-slider-runnable-track{ height:2px; border-radius:2px; background:rgba(0,0,0,.2); border:0; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:11px; margin-top:-4.5px;
    border-radius:50%; background:var(--ink); border:0; box-shadow:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb:hover{ background:#000; }
  input[type=range]::-moz-range-track{ height:2px; border-radius:2px; background:rgba(0,0,0,.2); border:0; }
  input[type=range]::-moz-range-thumb{ width:11px; height:11px; border-radius:50%;
    border:0; background:var(--ink); box-shadow:none; }
  .btn{ appearance:none; background:#fff; border:1px solid var(--hair);
    color:var(--ink); font:inherit; font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    padding:8px 12px; cursor:pointer; border-radius:2px; }
  .btn[aria-pressed="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn:disabled{ opacity:.35; cursor:not-allowed; }

  /* step editor — a row of cells for the active lane; click one to set its note */
  #stepRow{ display:flex; flex-wrap:wrap; gap:3px; }
  #stepRow button{ appearance:none; min-width:27px; height:27px; padding:0 5px; cursor:pointer;
    border:1px solid var(--hair); background:rgba(255,255,255,.7); color:rgba(0,0,0,.32);
    border-radius:2px; font:inherit; font-size:9px; letter-spacing:.02em; font-variant-numeric:tabular-nums;
    transition:background .12s ease, color .12s ease, border-color .12s ease; }
  #stepRow button:hover{ border-color:rgba(0,0,0,.32); }
  #stepRow button.on{ background:var(--ink); color:#fff; border-color:var(--ink); }
  #stepRow button.sel{ box-shadow:0 0 0 2px rgba(0,0,0,.9), 0 0 0 3px #fff; }
  #noteEd{ display:flex; gap:6px; align-items:center; }
  #noteEd.off{ opacity:.3; pointer-events:none; }

  #veil{ position:fixed; inset:0; z-index:20; background:var(--paper); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; cursor:pointer; text-align:center; padding:24px; }
  #veil h1{ font-weight:300; font-size:15px; letter-spacing:.4em; text-transform:uppercase; margin:0; }
  #veil p{ max-width:38ch; font-size:12px; line-height:1.8; color:var(--mute); margin:0; }
  #veil .orb{ width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, rgba(90,140,255,.85), rgba(150,60,255,.5) 45%, transparent 72%);
    filter:blur(3px); animation:pulse 5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(.9); opacity:.7; } 50%{ transform:scale(1.08); opacity:1; } }
  @media (max-width:560px){ input[type=range]{ width:82px; } }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<div id="status"></div>
<div id="recDot"><i></i>REC</div>
<div id="bar">
  <button class="icon" id="toggle" aria-label="controls" aria-pressed="false">···</button>
</div>

<div id="dock" class="hidden">
  <!-- lane -->
  <div class="row">
    <div class="grp"><label>Lane</label><div class="seg lanes" id="laneSeg"></div></div>
    <div class="grp"><label>Instrument</label>
      <select id="instrSel">
        <option value="piano">Grand Piano</option>
        <option value="bloom">Bloom</option>
        <option value="glass">Glass</option>
        <option value="pluck">Pluck</option>
        <option value="bell">Bell</option>
        <option value="mallet">Mallet</option>
      </select>
    </div>
    <div class="grp"><label>Steps <b id="stepsR">8</b></label><input id="steps" type="range" min="2" max="24" value="16" /></div>
    <div class="grp"><label>Speed <b id="lspeedR">1.00×</b></label><input id="lspeed" type="range" min="20" max="250" value="100" /></div>
    <div class="grp"><label>Lane filter <b id="lcutR">open</b></label><input id="lcut" type="range" min="0" max="100" value="100" /></div>
    <div class="grp"><label>Lane level <b id="lvolR">80</b></label><input id="lvol" type="range" min="0" max="100" value="80" /></div>
  </div>

  <!-- per-step notes -->
  <div class="row">
    <div class="grp" style="flex-basis:100%">
      <label>Steps · click a cell, then set its note</label>
      <div id="stepRow"></div>
    </div>
    <div class="grp"><label>Note</label>
      <div id="noteEd" class="off">
        <select id="noteSel">
          <option value="auto">Auto (scale)</option>
          <option value="0">C</option><option value="1">C♯</option><option value="2">D</option><option value="3">D♯</option>
          <option value="4">E</option><option value="5">F</option><option value="6">F♯</option><option value="7">G</option>
          <option value="8">G♯</option><option value="9">A</option><option value="10">A♯</option><option value="11">B</option>
        </select>
        <select id="octSel">
          <option value="2">2</option><option value="3">3</option><option value="4" selected>4</option>
          <option value="5">5</option><option value="6">6</option>
        </select>
        <button class="btn" id="stepOff">Clear step</button>
      </div>
    </div>
  </div>

  <!-- global -->
  <div class="row">
    <div class="grp"><label>Palette</label>
      <div class="seg" id="palSeg">
        <button data-p="AURORA" aria-pressed="true">Aurora</button>
        <button data-p="EMBER" aria-pressed="false">Ember</button>
        <button data-p="OCEAN" aria-pressed="false">Ocean</button>
        <button data-p="PRISM" aria-pressed="false">Prism</button>
      </div>
    </div>
    <div class="grp"><label>Scale</label>
      <div class="seg" id="scaleSeg">
        <button data-s="Pentatonic" aria-pressed="true">Penta</button>
        <button data-s="MinorPenta" aria-pressed="false">Minor</button>
        <button data-s="Dorian" aria-pressed="false">Dorian</button>
        <button data-s="Lydian" aria-pressed="false">Lydian</button>
      </div>
    </div>
    <div class="grp"><label>Tempo <b id="tempoR">42</b></label><input id="tempo" type="range" min="6" max="100" value="42" /></div>
    <div class="grp"><label>Pitch <b id="pitchR">C3</b></label><input id="pitch" type="range" min="36" max="60" value="48" /></div>
    <div class="grp"><label>Trails <b id="trailsR">12</b></label><input id="trails" type="range" min="3" max="55" value="12" /></div>
    <div class="grp"><label>Master filter <b id="cutR">—</b></label><input id="cutoff" type="range" min="0" max="100" value="55" /></div>
    <div class="grp"><label>Reverb <b id="revR">50</b></label><input id="revWet" type="range" min="0" max="100" value="50" /></div>
    <div class="grp"><label>Delay tail <b id="delR">46</b></label><input id="delFb" type="range" min="0" max="85" value="46" /></div>
  </div>

  <!-- export -->
  <div class="row">
    <div class="grp"><label>Size</label>
      <div class="seg" id="sizeSeg">
        <button data-z="RL" aria-pressed="true">Reel 9:16</button>
        <button data-z="PT" aria-pressed="false">Post 4:5</button>
        <button data-z="SQ" aria-pressed="false">Square</button>
      </div>
    </div>
    <div class="grp"><label>Export</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" id="snapBtn">PNG</button>
        <button class="btn" id="recBtn">Video</button>
        <button class="btn" id="audBtn">Audio</button>
      </div>
    </div>
    <div class="grp"><label>Field</label>
      <div style="display:flex; gap:8px;"><button class="btn" id="clearOrbs">Clear orbs</button><button class="btn" id="clearSteps">Clear steps</button></div>
    </div>
  </div>
</div>

<div id="veil">
  <div class="orb"></div>
  <h1>Angel</h1>
  <p>Four rings, each its own instrument, step-count and speed. Tap a ring to place steps; each ring turns at its own pace and plays what it passes. Tap the open field to add drifting orbs. Tap to begin.</p>
</div>

<script src="/lab/shared/opal.js"></script>
<script>Opal.mountTopbar({ name: 'Angel', desc: 'Playable colour & sound field', version: 'v1' });</script>

<script>
(() => {
  const _warn=console.warn.bind(console);
  console.warn=(...a)=>{ if(typeof a[0]==='string' && a[0].indexOf('Max polyphony')!==-1) return; _warn(...a); };

  const cv=document.getElementById('stage'), ctx=cv.getContext('2d');
  // Light ground. The glow engine was written additive (`lighter`) for a dark field, which
  // is a no-op on white — so ink composites with `multiply` and every colour's lightness is
  // mirrored, giving the same build-up behaviour with dark marks on paper.
  const PAPER='#ffffff', BLEND='multiply';
  const IL=l=>Math.max(6,Math.min(94,100-l));           // mirror lightness for the light theme
  let W=0,H=0,DPR=1;
  function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
    // A canvas is a replaced element: position:fixed with left/right:0 does NOT stretch it,
    // it keeps its intrinsic 300x150. The CSS size has to be set explicitly.
    const top=cv.getBoundingClientRect().top;
    W=Math.max(1,Math.round(innerWidth)); H=Math.max(1,Math.round(innerHeight-top));
    cv.style.width=W+'px'; cv.style.height=H+'px';
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  addEventListener('resize',resize); resize();
  // offscreen for the soft-trail feedback pass (named tfb — `fb` is taken inside shatter())
  const tfb=document.createElement('canvas'), tfbx=tfb.getContext('2d');

  const PALETTES={ AURORA:[155,185,265,300], EMBER:[8,28,45,330], OCEAN:[185,205,225,255], PRISM:[0,55,150,285] };
  const SCALES={ Pentatonic:[0,2,4,7,9], MinorPenta:[0,3,5,7,10], Dorian:[0,2,3,5,7,9,10], Lydian:[0,2,4,6,7,9,11] };
  const INSTR_NAMES={ piano:'Grand Piano', bloom:'Bloom', glass:'Glass', pluck:'Pluck', bell:'Bell', mallet:'Mallet' };
  const SIZES={ RL:[1080,1920], PT:[1080,1350], SQ:[1080,1080] };

  // four lanes (rings). each: instrument, steps, speed multiplier, octave, pattern, own playhead.
  // pattern cells: null = off, 'auto' = pitch from the scale, <number> = that exact MIDI note.
  // cut/vol are per-lane and feed each lane's own filter+gain before the master chain.
  const lanes=[
    { instr:'bloom', steps:8,  speed:0.6, oct:-1, pattern:[], ang:-Math.PI/2, lastStep:-1, cut:100, vol:80 },
    { instr:'glass', steps:16, speed:1.0, oct:0,  pattern:[], ang:-Math.PI/2, lastStep:-1, cut:100, vol:80 },
    { instr:'pluck', steps:12, speed:1.4, oct:0,  pattern:[], ang:-Math.PI/2, lastStep:-1, cut:100, vol:80 },
    { instr:'bell',  steps:16, speed:0.8, oct:1,  pattern:[], ang:-Math.PI/2, lastStep:-1, cut:100, vol:80 },
  ];
  lanes.forEach(l=>l.pattern=Array(l.steps).fill(null));
  let editLane=0, selStep=-1;

  const state={ palette:'AURORA', scale:'Pentatonic', root:48, tempo:0.5, trail:0.12, soft:0.34, delayFb:0.46,
    exportSize:'RL', ready:false, recording:false, recAudio:false };
  let drift=0, pianoReady=false;

  const hsla=(h,s,l,a)=>`hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
  const midiToNote=m=>Tone.Frequency(m,'midi').toNote();
  const hueOf=i=>PALETTES[state.palette][i%PALETTES[state.palette].length];
  function quantPos(pos){ const st=SCALES[state.scale],span=12,base=state.root-12; let d=Math.floor((1-pos)*span);
    d=Math.max(0,Math.min(span-1,d)); const o=Math.floor(d/st.length),i=d%st.length; return Math.max(24,Math.min(96,base+o*12+st[i])); }
  function stepMidi(li,k){ const cell=lanes[li].pattern[k];
    if(typeof cell==='number') return Math.max(21,Math.min(108,cell));   // note pinned on this step
    const st=SCALES[state.scale], total=st.length*2, deg=Math.round(k/lanes[li].steps*total);
    const o=Math.floor(deg/st.length), i=deg%st.length; return Math.max(24,Math.min(96, state.root+lanes[li].oct*12+o*12+st[i])); }
  const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const midiLabel=m=>NOTE_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);

  // ---------- audio ----------
  let audio=null; const logCut=v=>120*Math.pow(14000/120,v/100);
  const PIANO_URLS={ "A0":"A0.mp3","C1":"C1.mp3","D#1":"Ds1.mp3","F#1":"Fs1.mp3","A1":"A1.mp3","C2":"C2.mp3","D#2":"Ds2.mp3","F#2":"Fs2.mp3",
    "A2":"A2.mp3","C3":"C3.mp3","D#3":"Ds3.mp3","F#3":"Fs3.mp3","A3":"A3.mp3","C4":"C4.mp3","D#4":"Ds4.mp3","F#4":"Fs4.mp3",
    "A4":"A4.mp3","C5":"C5.mp3","D#5":"Ds5.mp3","F#5":"Fs5.mp3","A5":"A5.mp3","C6":"C6.mp3" };
  let pianoBuffers=null;
  /* One voice, built fresh onto a given destination. Per-lane filtering needs per-lane
     instruments — a shared synth has one output and can't be filtered two ways at once.
     The piano is the costly case, so its 22 buffers are decoded once and every Sampler
     after the first is constructed from those same AudioBuffers. */
  function makeInstr(name,dest){
    let n;
    if(name==='bloom'){ n=new Tone.PolySynth(Tone.Synth); n.maxPolyphony=32;
      n.set({oscillator:{type:'triangle'},envelope:{attack:.4,decay:.4,sustain:.4,release:3.0}}); }
    else if(name==='glass'){ n=new Tone.PolySynth(Tone.AMSynth); n.maxPolyphony=28;
      n.set({harmonicity:2.5,oscillator:{type:'sine'},envelope:{attack:.02,decay:.6,sustain:.2,release:2.4}}); }
    else if(name==='bell'){ n=new Tone.PolySynth(Tone.FMSynth); n.maxPolyphony=28;
      n.set({harmonicity:3.01,modulationIndex:6,oscillator:{type:'sine'},envelope:{attack:.005,decay:1.4,sustain:0,release:1.8},
        modulation:{type:'sine'},modulationEnvelope:{attack:.01,decay:.4,sustain:0,release:.4}}); }
    else if(name==='mallet'){ n=new Tone.PolySynth(Tone.FMSynth); n.maxPolyphony=24;
      n.set({harmonicity:1,modulationIndex:2.2,oscillator:{type:'sine'},envelope:{attack:.001,decay:.5,sustain:0,release:.7},
        modulation:{type:'sine'},modulationEnvelope:{attack:.001,decay:.2,sustain:0,release:.2}}); }
    else if(name==='pluck'){ n=new Tone.PluckSynth({attackNoise:1.2,dampening:2400,resonance:.94}); }
    else { // piano
      if(pianoBuffers){ n=new Tone.Sampler({ urls:pianoBuffers, release:1.2 }); pianoReady=true; }
      else { n=new Tone.Sampler({ baseUrl:'/assets/audio/salamander/', urls:PIANO_URLS, release:1.2,
        onload:()=>{ pianoReady=true; pianoBuffers=pianoBuffers||n._buffers&&n._buffers._buffers; setStatus(''); } });
        setStatus('loading grand piano…'); }
    }
    return n.connect(dest);
  }
  function laneVoice(i){ const L=lanes[i];
    if(L._voiceName!==L.instr){ if(L._voice){ try{L._voice.dispose();}catch(e){} }
      L._voice=makeInstr(L.instr,L.chan.filter); L._voiceName=L.instr; }
    return L._voice; }
  function buildAudio(){
    const limiter=new Tone.Limiter(-2).toDestination();
    const vol=new Tone.Volume(-9).connect(limiter);
    const reverb=new Tone.Reverb({decay:8,preDelay:.02,wet:.5}).connect(vol);
    const delay=new Tone.FeedbackDelay({delayTime:'4n.',feedback:state.delayFb,wet:.3}).connect(reverb);
    // master filter — the global one, after every lane has had its own say
    const filter=new Tone.Filter({type:'lowpass',frequency:logCut(55),Q:1.2}).connect(delay);
    // per-lane channel: its own lowpass and level, feeding the master
    lanes.forEach(L=>{ const g=new Tone.Gain(L.vol/100).connect(filter);
      const f=new Tone.Filter({type:'lowpass',frequency:logCut(L.cut),Q:.7}).connect(g);
      L.chan={filter:f,gain:g}; L._voice=null; L._voiceName=null; });
    lanes.forEach((L,i)=>laneVoice(i));
    // orbs keep a shared set straight into the master — they aren't lane-bound
    const orbSet={}; ORB_INSTR.forEach(nm=>{ orbSet[nm]=makeInstr(nm,filter); });
    audio={filter,delay,reverb,orbSet};
  }
  const durFor={ piano:1.6, bloom:2.4, glass:2.2, bell:1.6, mallet:.8 };
  function fire(node,instr,midi,vel){ if(!node) return;
    if(instr==='piano' && !pianoReady) return; const note=midiToNote(midi);
    try{ if(instr==='pluck') node.triggerAttack(note); else node.triggerAttackRelease(note, durFor[instr]||1.8, undefined, vel); }catch(e){} }
  function triggerLane(i,midi,vel){ if(!audio) return; fire(laneVoice(i),lanes[i].instr,midi,vel); }
  function trigger(instr,midi,vel){ if(!audio) return; fire(audio.orbSet[instr],instr,midi,vel); }
  const usesPiano=()=>lanes.some(l=>l.instr==='piano');
  function setStatus(t){ const s=document.getElementById('status'); s.textContent=t; s.style.display=t?'block':'none'; }

  // ---------- geometry ----------
  const center=()=>({cx:W/2, cy:H/2, maxR:Math.min(W,H)*0.42});
  const ringRadius=i=>center().maxR*(0.30+i*0.155);
  const stepAngle=(k,steps)=>-Math.PI/2 + k/steps*Math.PI*2;

  // ---------- orbs + shards ----------
  const orbs=[], shards=[], rings=[], MAXO=14, BASE=64; let orbCount=0;
  const ORB_INSTR=['bloom','glass','pluck','bell','mallet'];
  function addOrb(x,y){ if(orbs.length>=MAXO) orbs.shift();
    const r=14+Math.random()*26,a=Math.random()*6.283,s=.5+Math.random()*.7, vi=orbCount++%ORB_INSTR.length;
    orbs.push({x,y,r,voice:ORB_INSTR[vi],dx:Math.cos(a)*s,dy:Math.sin(a)*s,baseHue:hueOf(vi)+(Math.random()*20-10),last:0,pulse:1}); }
  function shatter(b,nx,ny){ rings.push({x:b.x,y:b.y,r:2,life:1,hue:b.baseHue,w:2}); const fb=state.delayFb; if(fb<0.05) return;
    const taps=Math.max(1,Math.min(12,Math.ceil(Math.log(0.08)/Math.log(fb)))), dMs=(audio?audio.delay.delayTime.value:0.4)*1000, now=performance.now();
    for(let i=1;i<=taps;i++){ const ang=Math.atan2(ny,nx)+(Math.random()-.5)*1.4, sp=(30+Math.random()*34)/(i*.7);
      shards.push({x:b.x,y:b.y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,size:b.r*Math.pow(0.72,i),hue:b.baseHue,
        appearsAt:now+(i-1)*dMs,life:0,maxLife:dMs*2.4,alpha0:Math.min(.9,Math.pow(Math.max(fb,.4),i-1))}); } }
  function hitWall(b,side,now){ if(now-b.last<90) return; b.last=now; b.pulse=1;
    const pos=side==='x'?b.y/H:b.x/W; trigger(b.voice,quantPos(pos),.35+Math.random()*.3);
    let nx=0,ny=0; if(side==='x') nx=b.x<W/2?1:-1; else ny=b.y<H/2?1:-1; nx+=(Math.random()-.5)*.8; ny+=(Math.random()-.5)*.8; shatter(b,nx,ny); }

  // ---------- per-lane playheads ----------
  function advance(dt){ if(state.tempo<=0.001) return;
    for(let i=0;i<lanes.length;i++){ const L=lanes[i]; L.ang=(L.ang+state.tempo*L.speed*dt)%(Math.PI*2);
      const norm=((L.ang+Math.PI/2)%(Math.PI*2)+(Math.PI*2))%(Math.PI*2);
      const cur=Math.floor(norm/(Math.PI*2)*L.steps)%L.steps;
      if(cur!==L.lastStep){ L.lastStep=cur; if(L.pattern[cur]!=null){ triggerLane(i, stepMidi(i,cur), .5);
        const r=ringRadius(i), a=stepAngle(cur,L.steps), {cx,cy}=center();
        rings.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,r:6,life:1,hue:hueOf(i),w:1.6}); L.nodePulse=L.nodePulse||{}; L.nodePulse[cur]=1; } } } }

  // ---------- draw ----------
  let lastT=performance.now();
  function draw(t){ const dt=Math.min(.05,(t-lastT)/1000), now=t; lastT=t; drift+=dt*7;
    ctx.globalCompositeOperation='source-over';
    // Soft trails: diffuse the previous frame through a half-res blurred feedback pass before
    // washing it back toward paper. A plain alpha wash alone leaves hard vector edges —
    // this bleeds them outward so the trail reads as pigment rather than geometry.
    if(state.soft>0.001 && W>1 && H>1){
      const sw=Math.max(1,W>>1), sh=Math.max(1,H>>1);
      if(tfb.width!==sw||tfb.height!==sh){ tfb.width=sw; tfb.height=sh; }
      tfbx.setTransform(1,0,0,1,0,0); tfbx.globalAlpha=1; tfbx.filter='none';
      tfbx.clearRect(0,0,sw,sh); tfbx.drawImage(cv,0,0,sw,sh);
      ctx.save(); ctx.globalAlpha=state.soft; ctx.filter=`blur(${(1.1+state.soft*2.2).toFixed(2)}px)`;
      ctx.drawImage(tfb,0,0,W,H); ctx.restore(); ctx.filter='none'; ctx.globalAlpha=1;
    }
    ctx.fillStyle=hsla(drift*0.6,18,IL(5),state.trail); ctx.fillRect(0,0,W,H);

    for(const b of orbs){ b.x+=b.dx*BASE*dt; b.y+=b.dy*BASE*dt;
      if(b.x-b.r<0){b.x=b.r;b.dx=Math.abs(b.dx);hitWall(b,'x',t);} else if(b.x+b.r>W){b.x=W-b.r;b.dx=-Math.abs(b.dx);hitWall(b,'x',t);}
      if(b.y-b.r<0){b.y=b.r;b.dy=Math.abs(b.dy);hitWall(b,'y',t);} else if(b.y+b.r>H){b.y=H-b.r;b.dy=-Math.abs(b.dy);hitWall(b,'y',t);} }
    advance(dt);

    ctx.globalCompositeOperation=BLEND;
    const {cx,cy}=center();

    for(let i=0;i<lanes.length;i++){ const L=lanes[i], R=ringRadius(i), hue=hueOf(i), sel=(i===editLane);
      ctx.strokeStyle=hsla(hue,70,IL(55),sel?.22:.12); ctx.lineWidth=sel?1.6:1; ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.stroke();
      for(let k=0;k<L.steps;k++){ if(L.pattern[k]!=null) continue; const a=stepAngle(k,L.steps);
        ctx.fillStyle=hsla(hue,60,IL(60),.18); ctx.beginPath(); ctx.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,2,0,6.283); ctx.fill(); }
      const active=[]; for(let k=0;k<L.steps;k++) if(L.pattern[k]) active.push(k);
      if(active.length>1){ ctx.strokeStyle=hsla(hue+drift,80,IL(62),.28); ctx.lineWidth=1.2; ctx.beginPath();
        active.forEach((k,idx)=>{ const a=stepAngle(k,L.steps),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R; idx?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke(); }
      for(const k of active){ const a=stepAngle(k,L.steps),x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
        let pl=L.nodePulse&&L.nodePulse[k]?L.nodePulse[k]:0; if(pl>.01){ L.nodePulse[k]*=.9; } const sz=(6+pl*16)*1.6;
        const g=ctx.createRadialGradient(x,y,0,x,y,sz); g.addColorStop(0,hsla(hue+drift,95,IL(72),.95)); g.addColorStop(.5,hsla(hue+drift,90,IL(58),.5)); g.addColorStop(1,hsla(hue+drift,90,IL(50),0));
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,sz,0,6.283); ctx.fill(); }
      // this lane's own playhead + thin hand
      const px=cx+Math.cos(L.ang)*R, py=cy+Math.sin(L.ang)*R;
      if(state.tempo>0.001){ const lg=ctx.createLinearGradient(cx,cy,px,py);
        lg.addColorStop(0,hsla(hue+drift,70,IL(68),.10)); lg.addColorStop(1,hsla(hue+drift,80,IL(66),.32));
        ctx.strokeStyle=lg; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke(); }
      const pg=ctx.createRadialGradient(px,py,0,px,py,10); pg.addColorStop(0,hsla(drift,60,IL(92),.85)); pg.addColorStop(1,hsla(hue,70,IL(70),0));
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(px,py,10,0,6.283); ctx.fill(); }

    const hb=ctx.createRadialGradient(cx,cy,0,cx,cy,46); hb.addColorStop(0,hsla(drift,80,IL(78),.20)); hb.addColorStop(1,hsla(drift,80,IL(60),0));
    ctx.fillStyle=hb; ctx.beginPath(); ctx.arc(cx,cy,46,0,6.283); ctx.fill();

    for(let i=shards.length-1;i>=0;i--){ const s=shards[i]; if(now<s.appearsAt) continue; s.life+=dt*1000; const tf=s.life/s.maxLife;
      if(tf>=1){ shards.splice(i,1); continue; } s.x+=s.vx*dt; s.y+=s.vy*dt; s.vx*=.965; s.vy*=.965;
      const a=s.alpha0*(1-tf), sz=s.size*(1-.2*tf)*1.6, g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,sz);
      g.addColorStop(0,hsla(s.hue,90,IL(68),a)); g.addColorStop(.5,hsla(s.hue,90,IL(55),a*.4)); g.addColorStop(1,hsla(s.hue,90,IL(50),0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(s.x,s.y,sz,0,6.283); ctx.fill(); }

    for(const b of orbs){ if(b.pulse>.01) b.pulse*=.9; const R=b.r*(1.7+b.pulse*.9);
      const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,R);
      g.addColorStop(0,hsla(b.baseHue+drift,95,IL(72),.95)); g.addColorStop(.35,hsla(b.baseHue+drift,90,IL(58),.55)); g.addColorStop(1,hsla(b.baseHue+drift,90,IL(50),0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,R,0,6.283); ctx.fill();
      ctx.fillStyle=hsla(b.baseHue+drift,60,IL(92),.9); ctx.beginPath(); ctx.arc(b.x,b.y,b.r*.28,0,6.283); ctx.fill(); }

    for(let i=rings.length-1;i>=0;i--){ const g=rings[i]; g.r+=120*dt; g.life-=dt*1.3;
      if(g.life<=0){rings.splice(i,1);continue;} ctx.strokeStyle=hsla(g.hue+drift,90,IL(70),Math.max(0,g.life)*.7); ctx.lineWidth=g.w;
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,6.283); ctx.stroke(); }

    if(state.recording && recCtx){ const [w,h]=SIZES[state.exportSize]; coverDraw(recCtx,w,h); }  // runs until you stop it
    requestAnimationFrame(draw); }

  // ---------- export ----------
  let recCanvas=null, recCtx=null, mrec=null, chunks=[], recStart=0;
  function coverDraw(dctx,dw,dh){ const s=Math.max(dw/cv.width,dh/cv.height), sw=cv.width*s, sh=cv.height*s;
    dctx.fillStyle=PAPER; dctx.fillRect(0,0,dw,dh); dctx.drawImage(cv,(dw-sw)/2,(dh-sh)/2,sw,sh); }
  function dl(blob,name){ const u=URL.createObjectURL(blob), a=document.createElement('a'); a.href=u; a.download=name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500); }
  function snapshot(){ const [w,h]=SIZES[state.exportSize], c=document.createElement('canvas'); c.width=w; c.height=h;
    coverDraw(c.getContext('2d'),w,h); c.toBlob(b=>dl(b,`angel-${Date.now()}.png`),'image/png'); }

  /* Container support varies by browser: Safari gives MP4/H.264, Chrome and Firefox
     generally only WebM. Pick MP4 when it's genuinely supported and fall back rather
     than handing back a file whose extension lies about its contents. */
  function pickMime(kind){
    const want = kind==='video'
      ? ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm']
      : ['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'];
    for(const m of want){ try{ if(MediaRecorder.isTypeSupported(m)) return m; }catch(e){} }
    return '';
  }
  const extFor=m=> m.indexOf('mp4')>=0 ? (m.indexOf('audio')>=0?'m4a':'mp4') : (m.indexOf('audio')>=0?'weba':'webm');

  function startRec(){ try{ const [w,h]=SIZES[state.exportSize];
    recCanvas=document.createElement('canvas'); recCanvas.width=w; recCanvas.height=h; recCtx=recCanvas.getContext('2d');
    const stream=recCanvas.captureStream(30);
    // fold the live audio in so the video carries its own soundtrack
    try{ if(audio){ const dest=Tone.getContext().rawContext.createMediaStreamDestination();
      Tone.getDestination().connect(dest); dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t)); } }catch(e){}
    const mime=pickMime('video'); if(!mime) throw new Error('no encoder');
    chunks=[]; mrec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:10000000});
    mrec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    mrec.onstop=()=>{ dl(new Blob(chunks,{type:mime}),`angel-${Date.now()}.${extFor(mime)}`); };
    mrec.start(); state.recording=true; recStart=performance.now();
    $('recDot').classList.add('on'); $('recBtn').setAttribute('aria-pressed',true); $('recBtn').textContent='Stop';
  }catch(e){ alert('Video recording is not available in this browser — PNG still works.'); } }
  function stopRec(){ if(mrec && mrec.state!=='inactive') mrec.stop(); state.recording=false; recCanvas=null; recCtx=null;
    $('recDot').classList.remove('on'); const b=$('recBtn'); b.setAttribute('aria-pressed',false); b.textContent='Video'; }

  /* Audio-only capture off the master bus. */
  let arec=null, achunks=[];
  function startAud(){ try{ if(!audio) return;
    const dest=Tone.getContext().rawContext.createMediaStreamDestination();
    Tone.getDestination().connect(dest);
    const mime=pickMime('audio'); if(!mime) throw new Error('no encoder');
    achunks=[]; arec=new MediaRecorder(dest.stream,{mimeType:mime,audioBitsPerSecond:192000});
    arec.ondataavailable=e=>{ if(e.data.size) achunks.push(e.data); };
    arec.onstop=()=>{ dl(new Blob(achunks,{type:mime}),`angel-${Date.now()}.${extFor(mime)}`); };
    arec.start(); state.recAudio=true;
    $('audBtn').setAttribute('aria-pressed',true); $('audBtn').textContent='Stop audio';
  }catch(e){ alert('Audio recording is not available in this browser.'); } }
  function stopAud(){ if(arec && arec.state!=='inactive') arec.stop(); state.recAudio=false;
    $('audBtn').setAttribute('aria-pressed',false); $('audBtn').textContent='Audio'; }

  // ---------- interaction ----------
  function pt(e){ const rc=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e; return {x:s.clientX-rc.left,y:s.clientY-rc.top}; }
  cv.addEventListener('pointerdown',(e)=>{ if(!state.ready) return; const p=pt(e), {cx,cy,maxR}=center(); const d=Math.hypot(p.x-cx,p.y-cy);
    const band=maxR*0.075; let best=-1,bestDiff=1e9;
    for(let i=0;i<lanes.length;i++){ const diff=Math.abs(d-ringRadius(i)); if(diff<band && diff<bestDiff){ best=i; bestDiff=diff; } }
    if(best>=0){ let ang=Math.atan2(p.y-cy,p.x-cx); const st=lanes[best].steps;
      const k=((Math.round((ang+Math.PI/2)/(Math.PI*2)*st))%st+st)%st;
      lanes[best].pattern[k]= lanes[best].pattern[k]==null ? 'auto' : null; selStep=k; refreshSteps();
      if(best!==editLane){ editLane=best; syncLane(); refreshLaneSeg(); } return; }
    for(let i=orbs.length-1;i>=0;i--){ const b=orbs[i]; if(Math.hypot(b.x-p.x,b.y-p.y)<b.r+8){ orbs.splice(i,1); return; } }
    if(d>ringRadius(lanes.length-1)+band){ addOrb(p.x,p.y); } });

  function seg(id,key,attr,after){ document.getElementById(id).addEventListener('click',(e)=>{ const b=e.target.closest('button'); if(!b) return;
    state[key]=b.dataset[attr]; [...b.parentNode.children].forEach(c=>c.setAttribute('aria-pressed',c===b)); after&&after(); }); }
  seg('palSeg','palette','p',()=>{ refreshLaneSeg(); }); seg('scaleSeg','scale','s'); seg('sizeSeg','exportSize','z');
  const $=id=>document.getElementById(id);
  $('tempo').addEventListener('input',e=>{ state.tempo=(+e.target.value/100)*1.4; $('tempoR').textContent=e.target.value; });
  $('pitch').addEventListener('input',e=>{ state.root=+e.target.value; $('pitchR').textContent=midiLabel(state.root); });
  $('trails').addEventListener('input',e=>{ state.trail=+e.target.value/100; state.soft=Math.max(.12,Math.min(.6,.5-state.trail*.7)); $('trailsR').textContent=e.target.value; });
  $('cutoff').addEventListener('input',e=>{ const v=+e.target.value; $('cutR').textContent=Math.round(logCut(v))+'Hz';
    if(audio) audio.filter.frequency.rampTo(logCut(v),.05); });
  $('revWet').addEventListener('input',e=>{ $('revR').textContent=e.target.value; if(audio) audio.reverb.wet.value=+e.target.value/100; });
  $('delFb').addEventListener('input',e=>{ $('delR').textContent=e.target.value; state.delayFb=+e.target.value/100; if(audio) audio.delay.feedback.value=state.delayFb; });
  $('clearOrbs').addEventListener('click',()=>{ orbs.length=0; shards.length=0; });
  $('clearSteps').addEventListener('click',()=>{ lanes.forEach(l=>l.pattern.fill(null)); selStep=-1; refreshSteps(); });
  $('snapBtn').addEventListener('click',snapshot);
  $('recBtn').addEventListener('click',()=>{ state.recording?stopRec():startRec(); });
  $('audBtn').addEventListener('click',()=>{ state.recAudio?stopAud():startAud(); });
  if(!(typeof MediaRecorder!=='undefined' && HTMLCanvasElement.prototype.captureStream)){
    ['recBtn','audBtn'].forEach(id=>{ const b=$(id); b.disabled=true; b.title='Recording is not available in this browser'; }); }
  $('toggle').addEventListener('click',()=>{ const h=$('dock').classList.toggle('hidden'); $('toggle').setAttribute('aria-pressed',String(!h)); });

  // per-lane controls
  $('instrSel').addEventListener('change',e=>{ lanes[editLane].instr=e.target.value;
    if(audio) laneVoice(editLane);                       // swap this lane's voice on its own channel
    if(usesPiano() && !pianoReady) setStatus('loading grand piano…'); });
  $('steps').addEventListener('input',e=>{ const n=+e.target.value; $('stepsR').textContent=n; const L=lanes[editLane];
    const old=L.pattern; const p=Array(n).fill(null); for(let k=0;k<Math.min(n,old.length);k++) p[k]=old[k]; L.pattern=p; L.steps=n;
    if(L.lastStep>=n) L.lastStep=-1; if(selStep>=n) selStep=-1; refreshSteps(); });
  $('lspeed').addEventListener('input',e=>{ const v=+e.target.value/100; lanes[editLane].speed=v; $('lspeedR').textContent=v.toFixed(2)+'×'; });
  $('lcut').addEventListener('input',e=>{ const v=+e.target.value; const L=lanes[editLane]; L.cut=v;
    $('lcutR').textContent=v>=100?'open':Math.round(logCut(v))+'Hz';
    if(L.chan) L.chan.filter.frequency.rampTo(logCut(v),.05); });
  $('lvol').addEventListener('input',e=>{ const v=+e.target.value; const L=lanes[editLane]; L.vol=v;
    $('lvolR').textContent=v; if(L.chan) L.chan.gain.gain.rampTo(v/100,.05); });

  /* ---- step editor: pick a cell, then pin a note to it ---- */
  function refreshSteps(){ const el=$('stepRow'); if(!el) return; const L=lanes[editLane];
    el.innerHTML='';
    for(let k=0;k<L.steps;k++){ const cell=L.pattern[k], b=document.createElement('button');
      b.textContent = cell==null ? (k+1) : (typeof cell==='number' ? midiLabel(cell) : '•');
      b.title = cell==null?'empty':(typeof cell==='number'?'pinned note':'scale note');
      if(cell!=null) b.classList.add('on');
      if(k===selStep) b.classList.add('sel');
      b.addEventListener('click',()=>{ selStep=(selStep===k?-1:k); syncNoteEd(); refreshSteps(); });
      el.appendChild(b); } }
  function syncNoteEd(){ const ed=$('noteEd'); const L=lanes[editLane];
    if(selStep<0){ ed.classList.add('off'); return; }
    ed.classList.remove('off');
    const cell=L.pattern[selStep];
    if(typeof cell==='number'){ $('noteSel').value=String(((cell%12)+12)%12); $('octSel').value=String(Math.floor(cell/12)-1); }
    else $('noteSel').value='auto'; }
  function applyNote(){ if(selStep<0) return; const L=lanes[editLane], v=$('noteSel').value;
    if(v==='auto') L.pattern[selStep]='auto';
    else L.pattern[selStep]=(+$('octSel').value+1)*12 + (+v);
    refreshSteps(); }
  $('noteSel').addEventListener('change',applyNote);
  $('octSel').addEventListener('change',applyNote);
  $('stepOff').addEventListener('click',()=>{ if(selStep<0) return; lanes[editLane].pattern[selStep]=null; refreshSteps(); });

  function syncLane(){ const L=lanes[editLane]; $('instrSel').value=L.instr; $('steps').value=L.steps; $('stepsR').textContent=L.steps;
    $('lspeed').value=Math.round(L.speed*100); $('lspeedR').textContent=L.speed.toFixed(2)+'×';
    $('lcut').value=L.cut; $('lcutR').textContent=L.cut>=100?'open':Math.round(logCut(L.cut))+'Hz';
    $('lvol').value=L.vol; $('lvolR').textContent=L.vol;
    selStep=-1; syncNoteEd(); refreshSteps(); }

  function refreshLaneSeg(){ const el=$('laneSeg'); el.innerHTML=''; lanes.forEach((L,i)=>{ const b=document.createElement('button');
    b.textContent=i+1; b.style.color=hsla(hueOf(i),80,IL(62),1); b.setAttribute('aria-pressed', i===editLane);
    b.addEventListener('click',()=>{ editLane=i; syncLane(); refreshLaneSeg(); }); el.appendChild(b); }); }
  refreshLaneSeg(); syncLane();
  $('pitchR').textContent=midiLabel(state.root);
  $('cutR').textContent=Math.round(logCut(+$('cutoff').value))+'Hz';

  const veil=document.getElementById('veil');
  veil.addEventListener('click',async()=>{ await Tone.start(); buildAudio(); state.ready=true; veil.style.display='none';
    [0,4].forEach(k=>lanes[0].pattern[k]='auto'); [0,4,8,12].forEach(k=>lanes[1].pattern[k]='auto');
    [0,3,6,9].forEach(k=>lanes[2].pattern[k]='auto'); [2,10].forEach(k=>lanes[3].pattern[k]='auto'); refreshSteps();
  },{once:true});
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
